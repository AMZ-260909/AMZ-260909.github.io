<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>story</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="starfield"></div>

  <main class="story-center">
    <h1 class="glow-title story-title">U N T I T L E D</h1>
    <nav class="chapter-directory" id="chapterDirectory" aria-label="Chapter directory"></nav>
    <a class="page-home" href="index.html">home</a>
  </main>

  <script>
    const totalChapters = 343;
    const directory = document.getElementById("chapterDirectory");

    for (let i = 1; i <= totalChapters; i++) {
      const link = document.createElement("a");
      const n = String(i).padStart(3, "0");
      link.href = `novel-a/chapter-${n}.html`;
      link.textContent = i;
      directory.appendChild(link);
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
