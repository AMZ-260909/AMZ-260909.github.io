    <script type="text/plain" id="chapter-text">
这个游戏并不复杂，几轮下来又有四个女孩加入。万灵在热闹中不由得想起Vane Family的姐妹和其他一起玩耍过的朋友，很有些伤感。

再次休息时，她看到MiMi还是一个人，便趁无人注意时走过去截住女孩的球。

“你走开。我不喜欢和你一起玩。”

“我也不喜欢人们spilling drinks on me.我们……”万灵想一时想不起那个关于平等的华语词汇，“我们一样了。”

“No we’re not even.我比你不喜欢我更不喜欢你。”

万灵仔细思考才反应过来MiMi是在用绕口令嘲讽自己的华语。真是幼稚得有点好笑。

“Good thing you don’t have to like someone to play ball with them. You in?”

“……随便吧。你想玩就玩。”莫名妙撇撇嘴，露出不耐烦的表情。

“Totally fine. Enjoy your afternoon!”万灵报复地笑笑，转身回去继续和从琮她们一起玩。

一直到下课，她都很自在；变成万灵的感觉第一次这样好。她在这节课学到一种不错的自由：随时加入人群，也可以随时退出，比一直被围绕或者一直一个人都舒适得多。

活动课后女孩习惯回宿舍冲澡，所以走进社会课教室时有点迟，讲师几乎紧接在她身后走进门来。

这位讲师打扮得很正式，利落的西装和方头皮鞋看着就很不好惹。她走到教室中央后没有说话，先缓缓环顾每个学生，似乎在寻找玩终端的人。

女孩们都抬起头后，她开口道，“我是成方圆，你们这三年的社会课讲师。我希望你们每个人都已经按时完成预习任务。现在，没有完成的同学请自觉举手。”

鸦雀无声中，大约五分之一的女生相继举起手。

“举手的人起立，站到我的左手边。无论是哪个班的同学，都站到一起去。”

万灵看到从琮也在举手人群之列，正垂头丧气地走到指定位置。她又扫一眼MiMi，后者倒是没举手，并岿然不动。

“剩下的人里有三个不自觉的同学。你们起立，站到我右手边去。非要我一个一个念名字吗？站出来！”

一个女生站起来了。然后是下一个，可怜的女孩已经开始抹眼泪。最后，所有人一起盯着莫名妙。莫名妙脸色惨淡，咬紧嘴唇，梗直脖子坐着，与成方圆固执地对视。

教室里一瞬间落针可闻。

万灵起身，平和地走到讲师右边。她没有看任何人，而是微微侧着脸将目光放在教室的墙壁上。

“现在人齐了。”成方圆露出一抹令人不安的笑，“坐着的41位同学，你们坐到一起去。两位助教来帮忙组织一下。对，这样就可以，谢谢。现在，站在我左边的人是轻犯，右边的人是重犯。我们今天上课的内容就是讨论如何处置她们。我给你们20分钟自由讨论时间，讨论结束后你们派一个代表告诉我处置方案。如果有多个方案，就按得票顺序说。听明白了吗？听明白就开始。不要举手，我不回答任何问题，你们自己讨论。”

女孩们面露惊骇，半晌才开始结结巴巴地讨论。

“我们真的要处置她们吗？我们就把她们放走，怎么样？”云共影被从琮求救的眼神盯得有点尴尬。

“我没意见。”

“但是老师会不会不同意啊？她只让我们说方案，又没说就会执行我们的方案。”

“如果我们处置得太轻，会不会她还要一起罚我们？”

“要不我们就让她们在规定时间内把预习作业补交上去？本来就该做作业啊。”

“我同意这个。”

“可是这样不算惩罚吧，我们本来也都做了作业。”

“也没说是要惩罚啊，处置不一定是惩罚。”

“哎，也是，我不管了，你们讨论吧，我就投票。”

“谁来记方案啊？”

“现在有什么方案？”

“直接放走，补交作业。”

“再加一个吧，就罚她们做5个蹲起，怎么样？”

“轻犯和重犯都做5个吗？”

“要不轻犯补作业，重犯做蹲起。”

“不用吧，她们不都是因为没写作业吗，为什么要分开处置？”

“因为重犯不自觉，她们说谎。”

“也不要紧吧，算了，5个蹲起也不重。”

“但是那个谁明明做了预习，我们要不要单独列出来……”

“不讲不讲，你也想断手指吗？”

莫名妙本来低着头坐在一边，但她渐渐发现自己宁可不坐在这里。最后她实在无法忍耐，干脆站起身，朝重犯区走去。

成方圆叫住她，“这位同学，你在做什么？”

“我没预习，我是重犯。”莫名妙很想嬉皮笑脸地说这句话，但现在笑不出来。她只能忍住让自己不要像另一个重犯一样那么丢人地当众大哭。

“好，你过去吧。”

莫名妙使劲眨眼想把泪水按回眼睛里，一边对万灵说，“你回去。你做作业了。”

“I lied. That puts me on this side. You don’t have to be over here just because of me. I’m not here because of you either.”

莫名妙不知道为什么这一刻的感觉如此糟糕。她原本已经学会享受别人的排斥，她喜欢这样的自己。她不想变成好孩子——好孩子应该是莫寻秋或者风和光那样的。她更想当一个与众不同的坏孩子。

但不该是这一种坏。

她不知道区别在哪里，只是久违地感觉耻辱，为自己的一切言行举止而羞愧。她忘记要控制眼泪这回事。她完全忘了所有事，哭着向教室门外跑去。

禹惜时连忙追出去。

女孩们窃窃私语着，不知如何是好地看着讲师。

“提醒一下，你们还有十五分钟讨论时间。”

“啊，我们还要继续讨论吗？”

“为什么不？小姐们，这是社会课，你们在社会里经常会遇到意料之外的事情，难道每次都停下来看我？我脸上有你们所有人的人生答案？”

十五分钟后。

莫名妙在此期间已被助教请回教室，也已停止哭泣，又恢复成视死如归的神情，一言不发站在重犯区。

“成老师，我们讨论出的方案，有五个……”

成方圆听完代表汇报后点点头，“现在所有的学生都坐回去。来，到现在为止，我们一共上了四十分钟课。你们喜欢这四十分钟里发生的事吗？喜欢的人举起左手，不喜欢的举起右手。”

这个问题容易得多，56个女孩都举起右手。

“现在你们进入学域，在今天的课程讨论里发布一条回复，写清楚你们不喜欢的原因。你们有半个小时来作答，至少要回复300字。本次讨论视为随堂测验，闭卷，禁止讨论。”

随着她话音落下，每个学生都发现教室变得只有自己和两位助教；讲师和其他同学都消失不见。

“随堂测验就是这样，大家不必紧张，开始答题吧。”骆助教柔声道。

测验倒计时结束后，果然大家又重新可看到彼此。成方圆让助教把学生们重新安排回日常的两块半圆分布，站在教室中间讲起课来。

“社会就是人和人在一起。政治就是人们在一起提出方案，做出决策。权力就是处置他人的能力。来，你说，这堂课上谁拥有权力？不用站起来，坐着就行。”

一脸惊恐地起身的从琮又一脸惊恐地坐下，“是老师您。”

“我。还有呢？”

“还有完成作业的人。”

“那么，我凭什么有权力指挥你们做这做那？你们为什么要服从我？你来回答。”

“不是。”莫名妙昂首道，“只是因为你是老师。我不想听，但是我……但是我打不过你们。”

“好，我的权力来源之一是规则给我的身份。我是学宫聘请的讲师，在一定范围内，我拥有这个身份赋予的权力。确实，如果你能打得过所有人，你就能推翻这一切，暴力也是权力的来源之一。那么，还有呢？你来回答。”

云共影思考片刻，“我觉得您比我们懂得多，所以觉得您做事总有您的道理。”

“是的，在这门课上，我确实比你们懂得多。我的专业、经验、知识都造成了我们之间的信息差。方方面面的不平衡都可以是权力的来源。还有吗，你，对，就是你。”

喻西子，重犯之一，满脸泪痕，怯怯地只是不停摇头。

“想想你会愿意听谁的话？任何人都行。”

“我妈妈。”女孩的嗫嚅又带了哭腔。

“对，你妈妈。这个回答涵盖了两个来源：在许多文化中，我们都要听父母的话。文化习俗是权力的来源之一。而你爱你妈妈，这种感情本身也给了她影响你的力量。还有最后一个，你，你来说说今天为什么要撒谎？”

“因为……”万灵略一停顿，“Because I felt like I needed to step up. I wanted to change what was happening and I was willing to accept the consequences. I don’t think I did anything wrong.”

“你呢，你后来为什么要承认？”

莫名妙这次回避了目光接触。“因为我心里很难受。”

“好，记住，权力有时也来源于我们的责任感、道德判断，还有对自己是谁的认知。”成方圆意有所指道，“这一种我们永远无法逃开，因为它来源于我们自己。”

Imperare sibi maximum imperium est.
