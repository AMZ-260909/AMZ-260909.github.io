    <script type="text/plain" id="chapter-text">
感恩节傍晚，Gian和Leora进屋时不像Juno那天如客人般隆重，而是穿过侧院，在走廊的更衣室里略加梳洗，走到正厅时已换好常服、面貌整洁。
      
Juno刚和姐妹们一起布置好晚宴餐桌，现在三人都坐在厅里的壁炉前闲聊。她一直时不时瞟一眼正门，然而Gian悄无声息地绕到女孩们身后。
      
“Excuse me. I didn't mean to startle you. Juno，我是Gian。关于你母亲的去世我很遗憾。希望在今后的生活中，你可以过得开心。”
      
和父亲的见面比Juno想象得要随意许多，显然是对方有意为之。
      
Gian Vane是一名四十岁出头的混血男性，有些依稀的华国特征，但绝不会被认为是亚裔。他随即热情地赞美Juno这半个多月在学校和生活中的表现，措辞与校长、老师、庄园员工等并没什么本质上的区别。
      
Juno在三言两语间领悟如何与父亲相处：把他当成Ruby之外的另一位经理。
      
之后她的目光移向Leora。
      
鼎鼎大名的Leora。
      
Leora正站在厅中央，微微偏着头、静静听Soleil叽叽咕咕，眉梢、眼尾、唇角处处都都噙着一点笑，但笑得不像Georgina那般舒闲或Soleil那般烂漫，似乎透着些揶揄的意味；也许是因为她长相姿态里的清傲。
      
Juno疑心这两人在谈论自己，走过去时不自觉武装起敌意。
      
“Wow, there you are. Let me see. You two actually look really different standing together. Juno’s like ice, and Leora’s like snow—”
      
“You’re Olaf.” Leora打断道。于是她们两个大笑起来。
      
“Juno would never be that mean!” Soleil给Leora差评后向Gian跑去索要礼物。
      
“She hasn’t run out of patience with you yet.” Leora回敬妹妹，然后终于把脸转向Juno。
      
两个女孩身高相同，骨架肌肉搭建得极其相似。但如Soleil所说，细看还是有些差别；主要在于眼睛：Leora的眼睛与Juno完全不同，但对Juno来说同样熟悉。
      
“You have our mother’s eyes.”
      
“Interesting.” Leora的笑容依旧矜持，“I never met her.”
      
Juno心底浮起一丝讥诮，对这个妹妹迅速失去兴趣。她看起来就像我，但是更软弱。
      
“Juno，Leora！” Soleil又跑回来，亲热地一手挽起一个姐姐往餐厅走，“What do you say we try something new tonight?”
       
“Stay up playing Among Us again?” Leora收回对Juno的注意力，“Good thing I slept twelve hours on the plane.”
      
“No! I saw this witch game on TikTak. It looks amazing. You have to play with me.”
      
“Do we have a choice?” Leora对Juno笑道，“Lucky you didn’t get here until November. I have to flee the house every Halloween.”
      
“I knew you and Dad planned this!”
      
接下来的感恩节晚宴淹没在Soleil和Leora的唇枪舌剑中。Gian和Georgina显然已习以为常。
      
Gian对另两名女儿讲述起Chiloe的当地传说，比如鸡蛋可能孵化出名为Basilisco Chilote的蛇身鸡头食人怪物等等；Georgina神情柔静，间或点头微笑；Juno思考要不要学习姐姐这样既不热心又不失礼的神情，但最后决定按自己的方式来。
      
她一言不发地专注食物，吃饱后就坦言要离席。另三个女孩却也随之纷纷放下餐具，都宣称急着去玩游戏。
      
“Mind if I join you?”
      
“Dad, it’s girls night.”
      
“All right. Girls’ night. Fine. Have fun. No caffeine, and go to bed on time. Understood?”
      
地下室一直是女孩们秘密聚会的场所。今天那里摆置数十面深宝石色的半透明三角形隔断板，分割出许多小更衣室，每间都有不同主题的女巫衣裙和配饰；放映机向墙壁泼洒着流转变幻的珠光霓虹；背景音乐是……
      
“Witch house isn’t my fav—”
      
“Oh, here we go.” Soleil飞快截断，“Fine, DJ Snob, you pick.”
      
Leora决定把音乐调成Jean-Michel Jarre的Oxygène，然后也穿上派对服饰，四个小女巫就聚到房间中心的水晶吧台桌前。
      
“Okay, so we take turns going into the secret tent to make our potion cards. We each make three cards. On each card, we put a secret on one side and a lie on the other, like, ‘I’ve snuck into Dad’s studio’ and ‘I’ve never been in Dad’s studio.’ Then we seal each card in an envelope and bring the three envelopes back out.”

“So this is a blackmail game? Then what?”
      
“Then we put all the envelopes in a box, shake them up, and everyone picks two. We’ll make a potion based on what’s written inside and tell a story about what it does. At the end, we destroy all the cards together. No evidence, no blackmail.”
      
“Sounds fun.” Georgina在Leora张口前捧场地称赞道，“I’ll go first. Let’s do it by age.”
      
Georgina走进角落的秘密帐篷后，Leora感慨，“Geo is too perfect. I can’t imagine what kind of secrets she could have.”
      
“let’s put in something actually secret. We won’t know whose is whose anyway.”
      
“Fine by me. I have plenty that’ll keep you awake for the rest of your life.”
      
“Speaking of staying awake, isn’t it almost nine? Coffee time!” Soleil跳下高脚椅，去snack bar找零食和饮料。
      
余下的双胞胎对视一眼，都有些不自在。
      
“So...are you into this kind of music?” Leora礼貌道。
      
Juno置若罔闻，慢条斯理地站起身，“Do you want anything to drink?”
      
“I’m good.”
      
看到Leora有点生硬的表情，Juno淡淡地笑了笑。
      
和Soleil一起端着托盘回来时，Georgina已完成配方，于是Juno放下手里的桃子青柠咖啡走进帐篷，见圆几上放着一沓空白卡纸、纯黑信封和成套的回墨字母印章。她印好自己的秘密装入信封，回到吧台时见两个妹妹正热火朝天地讨论磨砂膏和护肤霜。
      
Leora离开后，Soleil忙不迭地问Juno，“So, is she anything like you pictured?”
      
“I never really pictured her at all.” Juno轻描淡写，“Did you just ask her the same thing?”
      
“You always know everything.” Soleil一边喝巧克力affogatos一边大笑，“She said you didn’t seem very interested in music. And I told her, ‘Not everyone’s obsessed with music as you, Mom, and Dad are’ Right? Oh, Geo, you really don’t drink caffeine?”
      
“I’m not tired.” Georgina捧着姜黄拿铁坐回Juno另一侧，“Ruby only told us your name and showed us a few pictures. I was wondering what you used to do in your free time.”
      
“Really? I wasn’t really listening. I figured you’d be here anyway. And literally you wouldn’t be into the same stuff we are, like gymnastics or riding. People don’t really do those things where you’re from, right?”
      
“Not very popular.” Juno颔首，“What did you think I’d like?”
      
“Manga, maybe? K-pop dance? Talk shows? But I’m probably wrong. You never talk about that kind of stuff...”
      
“I collect and mount insects.”
      
一直到Leora回来，Soleil还在追问细节，Juno每多说一句话她就惊叹一声。Leora向Georgina问到这两人在聊什么之后也有点意外，不过她不愿探寻Juno的过去，于是催促妹妹快进帐篷，“And don’t waste a card on something no one cares about. Naming your breakfast omelet Eggard is not a secret.”
      
“Looks like you just revealed her deepest secret.” Georgina看到Soleil气鼓鼓离开便打趣。
      
“Uh-oh. Should I start worrying she’s going to murder me?”
      
“What if she actually does?”
      
Leora没想到Juno也会开玩笑。确实，Juno看起来一点都不像在开玩笑，大概这就是deadpan式喜剧。
      
“Then I’ll haunt her every night until she admits we finally get along. But as the doomsday baby, she probably won’t even be scared. Anyway, what are you guys getting her next month?”
      
生日礼物话题延续到Soleil回归。女孩捧着一只拆成两个半圆的球形塑料盒，里面已有三枚黑信封。“Come on. Put all recipes in here.”
      
十二封信装好后，女巫们相互抛掷、旋转圆球确保信封混匀，直到Soleil热得摘下尖顶帽；然后她们把秘密倒出来，四人各拿两个。
      
Juno率先发现数目有误，“Who put in an extra one?”
      
“No way. No one even opened the box.”
      
但信封千真万确已经变成13只。
      
There is an Impostor among us.
