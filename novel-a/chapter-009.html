Audra大声数了两遍信封后开始害怕，“Leo, are you messing with me?”

“You closed the box and opened it again, right? I feel like you’re the one messing with us.”Leora将怀疑抛回给妹妹，“I’m gonna go grab something to drink.”

“Do you guys think it was her?”Audra在Leora离开后低声道，“I swear she would do something like this.”

Georgina摇头，“I saw she only put three letters in there.”

“Then what is going on? I’m seriously not messing around. Maybe we should just shred all of them. This is kinda freaking me out.”

“Let’s open them and see what the extra one says.”

“No, Juno. That literally sounds like the beginning of a horror movie. We’re gonna get cursed or something.”

“Aud, weren’t you the one saying you wanted something new and exciting?”Leora捧着滚烫的London fog回来，“What’s more exciting than opening a letter from an uninvited guest?”

“It has to be you messing with me.”Audra狐疑不决，最后还是被胆怯战胜，“I’m going back to my room. This isn’t funny at all. You actually scared me.”

Georgina陪着不敢独自回房的妹妹离开。Leora见Juno没有要走的意思，便好奇道，“Juno, are you trying to freak her out?”

Juno露出被冒犯的冰冷表情。

“Sorry. I didn’t really think it was you. Let’s open them and see. Maybe it’s still that little demon’s prank. The extra one could be full of bad things about me because she knows I’d want to open them. Maybe she’s about to jump out any second just to see my face.”

虽然不同意Leora的猜测，但Juno同意一起拆信封。很快13只卡片被摆到桌上，双胞胎各自一张张翻看正反面：

[I do not belong to this world | I belong to this world]

[I crave danger | I crave safety]

[I’ve always been brave.| I was a coward]

[I am haunted | I have never seen a ghost]

[I wish I’d been born as someone else | I wish you had never been born]

[I enjoy my life | I am weary of my life]

[I am made of secrets | I have no secrets]

[I love my family | I hate my family]

[I am human | I am not human]

[I am not fully myself | I am whole]

[It’s just a game | It’s not just a game]

[I believe you all love me | I am no one’s favorite]

[I am 101 years old | I am 10 years old]

Juno自然认识自己的三张卡片，但她没有表现出来；Leora也没有。

姐妹两人对视良久，Leora忽然发现自己对危险的渴望并没那么强烈。

“So you and Aud planned this whole thing just to scare me, didn’t you? You had everyone write down some crazy stuff, then set this up so you could snoop through my secrets?”

Juno盯着Leora，思索对方是在用诘问掩饰恐惧还是倒打一耙，因为她也正在怀疑两个妹妹串通起来打算用这些秘密羞辱自己；一个迟来的下马威。妹妹做出莫名其妙的坏事并不奇怪。

“Not very sigma.”最后Leora移开目光，愤怒地甩下这句话扬长而去。

这不太像表演。Juno思忖，如果这里真的有一位不请自来的幽灵女巫，那么哪封信是她所留？但若单就语义而言，除她自己的卡外不止一张都明显有些怪异。

也许除了我和Leora的卡片，其他信封里的内容已都被幽灵更换。Juno一边推测，一边慢悠悠将散落的秘密整理好并逐张放入碎纸机。

她一开始以为多出来的那张卡片是与自己每夜梦中相对的那名鬼魂在传递信息，但现在认为并非如此。如果女鬼有能力与自己交流，不需要等到今天，也不需要选择这样的场合；或者，至少自己单独留下后总会再给些线索。

“Juno?”

女孩被门口的呼唤声惊了一下。原来是三位姐妹去而复返。

Audra已将森林女巫的衣裙换掉，“Geo and me got worried about you guys, so came back to check. Then we ran into Leo, she said you were in here by yourself. Are you okay? I wasn’t messing with you. None of us were.”

“Neither was I.”Juno平静地走到门口与姐妹们会合，“I already shredded all the letters.”

“Do you think our witch coven summoned something evil?”Leora慢慢吹着雾气袅袅的奶茶，“Juno and I saw some really creepy stuff on those cards. One of them said something about being haunted, and then there was—”

“Stop. I don’t wanna hear any more of it.”Audra捂住耳朵，“Let’s go tell Dad.”

Juno不想寻求Gian的庇护，也不想听Gian关于幽灵的童话故事，更不想被问关于幽灵的问题；但Audra露出一副谁不去就是心虚的表情，因此姐妹四人还是一同走进父亲的书房。

男人慈爱地听完小女儿的叙述，并没说她们是在拿自己寻开心，配合地问道，“And then what happened? Did you see what the extra one said?”

“We couldn’t tell which one was the extra one, so we just put all of them through the shredder.”Georgina担负起长姊的责任，向Gian汇报此事，并没有提起任何一位妹妹的名字。

“You did the right thing. The cards are gone now, so they can’t hurt anyone. You’re safe here, girls. Life is a lot like jazz, sometimes things happen that you never saw coming. Why not just treat this as a weird little secret you sisters share? Don’t scare yourselves, and don’t scare each other. I promise, you’re all going to be okay. Now go get some rest. It’s bedtime. And nobody’s been sneaking coffee drinks, right?”

至少没人承认。

Juno认为父亲什么都没说。她迅速扫视其他三人，见Georgina一如既往地平和，大概像Gian一样认为这件事不过是个无伤大雅的恶作剧；Leora看起来比刚刚安心些许，但仍唇角绷紧不知在想什么；Audra则明显重新高兴起来，走出书房时已低声讨论接下来要不要一起在二楼的playroom继续串珠或者玩PlateUp。

双胞胎不约而同地表示要回屋换掉女巫装扮并洗漱。

Leora穿回常服后发现自己的手机落在地下室，便匆匆去拿。她轻捷地走下楼梯，接近熟悉的音乐，很快在snack bar找到刚刚制作奶茶时忘在一边的手机。打算回楼上时，女孩看到水晶吧台桌上的半球盒里放着两封孤零零的黑信封，不禁疑惑Juno为什么单独留下它们。

不，这两个信封的火漆印章还完整，不是我和她刚刚拆掉的那些。

难道Juno单独留下并制造两封新的秘密信件？还是她把某些旧卡片重新封装到新信封？她想一会儿偷偷过来拿走？或者专门留在这里吓唬人？总之，原来这一切都是她在捣鬼。我倒要看看这人想做什么。

尽管考虑到里面一定没装着什么好东西，Leora还是迅速拆开信封，并阅读两张新卡片：

[I killed her | I am not the killer]

[I lost to her | I lost her]

女孩读后悚然四顾。

地下室的色彩、音符、光影都变幻莫测地闪烁着，难以察觉是否有另一个人或神秘幽灵隐藏在这里。

“Juno, I know you’re there. I’m taking these to Dad unless you tell me why you did this.”

她等了几息，见没有回音，就捏紧两个新秘密和手机匆匆离开。快步跑上楼梯时，Leora不禁产生一个可怕的猜想。

毕竟她所知道的与Juno有关的女性里去世的只有一位；Ruby说May是意外食物中毒去世的。但也许……也许……

Leora仔细回想Juno今晚对自己说过的话，数起来只有三句：评论自己的眼睛像母亲，问自己要吃什么零食，以及“如果她真的谋杀你呢？”

每一句咀嚼起来都似乎别有深意；但说出来只会被爸爸和Geo认为是在开玩笑，Aud绝对没听完就要宣布是我自己又做了新卡片来吓她（也许我该这么做），Juno更不可能承认，反而会因为吓到我而得意吧？

无论她有没有做什么骇人听闻的事，我能感觉到她一点都不喜欢我。但她不喜欢我也不代表她杀死我们的母亲或者打算杀死更多人，也许只是恶作剧，或者庄园闹鬼；总之，爸爸保证过我们在家里很安全，至少这句话应该是真的吧？

说实话她对Gian的保证不是很有信心，但思来想去只能把秘密暂时放进卧室的抽屉静观其变。

Leora洗漱好赶到playroom时，妹妹抱怨她来得太慢，“We already picked the theme for today’s charms.”

“I had to use the bathroom.”Leora目光在三人脸上略一流连，并没发现任何人有异样神情，“Please don’t tell me it’s flowers or butterflies.”

“Nope. It’s guardians! Juno came up with it. I think it’s perfect for what’s going on right now. We need to make something that can protect us.”

接下来的时间消磨得澄谧惬意。女孩们灵巧的手指挑拣着各色大小珠子、玛瑙、玉髓、碧玺、虎眼石、柘榴石、孔雀石、橄榄石等，用粗细不同的丝线将它们编缀成首饰，一面聊着各自零零碎碎的生活琐事。

帘外的星夜像黑莓酱融入牛奶般丝丝缕缕变淡，拂晓时，四人已都不知不觉睡去：Georgina戴着五芒星形棱堡纹样的盾牌扳指，肩头一左一右偎着Audra和Leora，前者佩着花楸十字权杖吊坠，后者攥紧火焰圣心胸针，对面是手持宝剑发簪的Juno。

临近中午，Gian轻轻敲着房门将女儿们唤醒，“Did my little princesses party all night again?”

这一幕看起来竟很有温情。

在Vane Family的生活大抵如此。

With a faery, hand in hand.
