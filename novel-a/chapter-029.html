    <script type="text/plain" id="chapter-text">
宁涉雪离开后又玩了许多其他游戏，恰好在藏钩处遇到表姐；风和光方才丢完圈就去四处寻找相熟的同学，游戏之余从众人手里死皮赖脸地刮抢三五，没两个小时就攒下100多枚雨滴，密密麻麻地在胸口钉成蘑菇图案，心情也舒展许多。

“雪儿，你攒了多少？哇，48个，那我们加起来有150多了哦，走吧，我们去看看阿秋那边有多少。”

万秋还在射覆处。莲棚下是一方五平米许的水池，池上有一面不透光横帘，帘上标出齐齐整整36号格子，水池里则漂着36朵不同的花。每次金鱼主持都会先用一根长杆搅得花朵们在池里快速移动，再在将停未停时盖下帘子，然后说一句谜底是某种花的题目。

玩家可在某个格子上押1到20雨滴的赌注，赌谜底花在那个格子里，之后金鱼移开横帘看结果，玩家猜对则拿回双倍赌注；若谜底花在相邻格则不输不赢；其余情况则输掉全部赌注。这里也禁用灵网，但会发一本36种花的图鉴，可随时翻看。

由于花朵很多，难以记住每朵花的位置，且帘子放下后它们还会随机挪动些许，因而有些运气成分，再加上题目难度不一，所以几乎没什么人留在这里，只有万秋已玩了一个多小时。

女孩已将面纱撩起反垂在身后，露出沉静容颜；见Helena两人走来便请在搅水的金鱼主持暂停片刻。

风和光见朋友身上仍然洁白，只有手里攥着一小把雨滴，就不好意思问对方赢了多少。

“你们两位要玩吗？这是图鉴。”金鱼递给两个新蘑菇小册子。

“我就不了，好不容易辛辛苦苦赚到的，不敢玩会赔本的游戏。”风和光笑道，“雪儿，你玩吗？”

宁涉雪摇头，不想和万秋同台竞技。

于是金鱼继续游戏。拉起横帘后，她宣布这次的谜面是“鲜艳妩媚，风流袅娜”。

风和光虽然不下注，但也好奇，在手册里翻来翻去却也找不到这几个字。宁涉雪则觉得这句话大概有典故，但不知道出处，更不知道指的是哪朵花；再看万秋，已把20个筹码都放在第30格。

金鱼揭开横帘，30格下果然有一朵花，是黄瓣红心的芙蓉葵。

“好厉害，又猜对了！”金鱼夸奖的语气有些干涩，“同学，你还要玩吗？和你朋友去玩点别的怎么样？你们可以去试试番摊，那里运气好可以一次赚一百滴。”

“番摊啊，我刚刚和原子去过，但我只玩两把押大小的就不敢再玩了，有点太刺激，我看到很多人都一把就全输光。我们可以找找大家能一起玩的游戏……”

“那就去后面那个最大的摊子，虽然挂牌是对弈，但不只是棋类，三个人再加一位庄家应该能组不少种玩法，虽然每局时间久一些，不过比这种简单规则的更有趣。”

见风和光向自己望来，万秋对金鱼道，“好的，请把水滴都给我朋友。谢谢。”

金鱼一笑，抬手微扬，334枚雨滴如一尾梦幻中的彩光长虹绕着风和光旋转几圈后落下，将她的蘑菇图案顷刻间放大一倍有余。

风和光一时沉醉，好几秒才反应过来，脸颊已欣喜得通红，“阿秋，你……我也没说一定要这么多……”

女孩之前的委屈一扫而空。也许阿秋只是像她之前说的那样在尝试合魂，所以有一点点行为异常；至少对我来说，她最重要的部分并没有变。

对弈棚内是一桌桌全息游戏台，当三人围坐在一张桌下后，剩余座位上霎时浮现一抹虚影，“三位同学你们好，我是灵网助手九枢。现在有两个选项：等其他同学凑够更多人，还是直接开始四人游戏？”

宁涉雪新奇打量着曾在终端里和自己对话过的助手，“你，也是教职工？” 

“不是，我只是这个摊位的助手。负责老师接入了灵网服务，所以我能在这里帮大家组局、当庄家。严格来说，我算是……外包人员？”

 “你们真的有求必应吗，那会不会很忙。”风和光还没用过灵网助手，也觉得新奇。

“忙不过来倒不会——我现在同时在许多地方帮忙，但对我来说感觉像是在做同一件事。不过，我的时间是无限的，这里的桌子却是有限的，你们打算玩什么？如果还没想好，我可以根据你们的喜好推荐几个。有想要的游戏类型吗？策略、推理、还是轻松一点的？”

“你们两个选吧，只要别像刚刚那个那样难就好。”风和光兴奋地打开终端拍照功能，“可以合照吗？我想发道友圈。”

“当然可以，但我得提前说明——我的外观是临时生成的，其他桌的同学们见到的九枢可能长得完全不一样。这张合照算是今天你们的专属版本吧。”

风和光开始拍照、修图，九枢在一旁帮她想道友圈文案。另一边万秋只说“你选”就低头去看终端，因此宁涉雪拿到决定权，并打算设法为难万秋——她现在已明白流水令司令的心态——于是筛掉所有知识、记忆、运气类。

“诶，同尘！”风和光忽然瞥到又有一人单独走进莲棚，便热心邀请，“我们还没开始，你想一起吗？”

“你们选的这个游戏支持3到13人。”九枢检查道，“可以直接加入，或者你们想换个别的也行。”

“我都可以。”金同尘摸索着在助手旁边的椅子上坐下，“你们打算玩什么？”

“好，那我来说‘噩梦画廊’的规则：我们分三组，你们两两一组，我单独。你们同组两人会拿到一张同样的画，不同组的两张画具有一定相似性。我没有参考画。然后你们每人得到6张不同内容的手牌，都与参考画有关，我的每张牌则由我即时生成。之后每轮所有人30秒依次出一张牌，然后是2分钟投票时间，票必须投给别人。

“投到队友扣3分，投到对组人不扣分也不得分，投到我可以得1分。你们被队友投一次扣3分，被对组人投扣2分，被我投扣1分。我被投一次扣1分。每轮公示投票结果，但不公布分数。最后得票最多的人的队友额外扣6分。如果最后我总分最低，你们每人得28雨滴，否则每人给我7滴。明白了吗？还是需要我再解释一遍？”

“让我算一下，我们三个加起来可以得80多个诶，现在离777还差291滴……玩三轮就能攒够！”

“但84x3是252，还差39枚。”金同尘好意提醒。

“你蹭我们的桌子，每次赢了给我10滴，剩下9滴我们三个再去套一次圈就好。”

“原来你是守株待兔，专门等着诓我？”金同尘失笑，“比庄家抽得还多。”

“哎呀，我真的很想要SSS奖嘛，而且你这样每次还可以赢18滴，也不算亏。”

“你们没有考虑过会输？”九枢闪烁着银色字符的眼珠望向风和光。

“不可能输。”风和光成竹在胸，“不管什么画什么牌的，我们只要齐心协力一起投庄家就稳赢！”

“理论上确实如此。前提是——你们知道谁是庄家。但我现在会为大家分组并重新排列座位……”

四人眼前一闪，都进入如同随堂测验般的独立空间，只能看到面前的屏幕；屏幕上代表5个玩家的小方块围着圆桌随机变换，幻影中根本无法分辨方块初始位置。

分好座位后，宁涉雪看到屏幕闪出一行提示：

【已分组，正在抽取参考画作】

【以下是你的参考画作与6张手牌】

她看到图片时才知道为什么这个游戏叫“噩梦画廊”。参考画作是一个倒吊着的、脖子与手臂差不多长且扭曲成怪异角度的惨白女人，而6张手牌分别是：

1黑暗里一张五官倒置的苍白面孔；

2血色背景中的无数吊索；

3嘴角撕裂到极长的小丑；

4双眼冒出长长黑发的惨叫人脸；

5倒吊在红彤彤烤箱内的烤鸭；

6白雾中四条腿极长的黑狗，瞳孔是纯金色。

宁涉雪好不容易才将目光从这些图片上拔出来。她认为目前最重要的是，如九枢所说，玩家们根本不知道谁是庄家，也不知道谁是队友，更不知道该出哪张牌。

千万别让我第一个出牌。女孩默默祈祷。

好消息是当前出牌的红箭头标在她左边的方块上。坏消息是下一位出牌的黄箭头标在她的方块上。

她打起精神，等待30秒后，看到第一张公示牌出现，该玩家方块里便随之标上“1”。

之后就轮到她。

1号玩家第一轮打出的牌是一只耳朵长到离谱的黑兔，红莹莹的双眼诡异地向屏幕外盯来。宁涉雪努力在它的注视下思考，20秒后选定手牌6，又在最后1秒钟改成手牌2。

之后她右边的3号玩家在30秒后公示一张白布餐桌上密密麻麻的细长白烛。4号玩家的牌是树枝上倒吊着的细长白影。5号是一双看起来非常普通的手。

【第一轮出牌完毕，请在30秒内投票】

宁涉雪对着这5张牌苦思冥想。

最格格不入的当然是5号玩家。这双手一点都不恐怖；但九枢在看到前面四张牌后会生成这个也太离谱，这不明摆着是卧底吗？

其次3号玩家也很可疑，虽然蜡烛是细长的，但整体含义很模糊。把自己安排在中间然后出一张保守牌确实是庄家的好策略。

4号的牌蹊跷之处在于，细长可能来自牌1，倒吊来自自己的绞索，白影来自牌3，有点缝合感。 

最后1号虽然也有“细长”这个元素，但可以和神秘生物、比例异常、黑色毛发、眼睛、红光之类很多常见的恐怖元素对上。虽然九枢不大可能给自己排第1号纯盲猜，可如果她就是故意利用这种心理呢？

时间有限，宁涉雪最后犹豫着投给最保守的3号。

【投票结果公示：1号、4号投2号。2号投3号；3号、5号投4号】

竟然有人投我。宁涉雪紧张起来。但1号肯定不是我的队友吧……我真不该选那个图的。下次我得打一张更符合参考图的牌。

第二轮开始，1号选手的图是纯白长颈瓶上放着一颗玻璃珠。宁涉雪选择公示牌5。3号打出一张有四只全黑眼瞳的惨白怪脸。4号是一只湖面上的白天鹅。5号是一对长梗白花。

1号和4号都很像我的队友，但为什么刚刚上次她们要投我？宁涉雪摸不着头脑，不知道谁才是真队友，只能赌九枢不会把自己放第一个，于是投给4。

【投票结果公示：1号、2号、3号、5号投4号；4号投2号】

现在的局势很明确，4号被集火。宁涉雪想不通另外三人为什么认为4号有问题，但不跟投也不知道投谁，于是最后一轮打出牌6且继续投给4号。

其他几人的牌是：1号：一簇扭曲交织的藤蔓；3号：无数细长白影；4号：一条缠绕打结的白蛇；5号：倒放的水杯。

【投票结果公示：1号、2号、3号、5号投票4号；4号投票2号】

九枢撤去屏障后调出两组的参考图和分组结果，原来3号和5号的参考图是一个双臂长至脚踝且被倒吊的惨白女人。

“第一轮你们的票是散的，说明那时候还没有定论。但是第二轮就同时投了我。我认为出这张牌的逻辑没有问题。所以我想问——你们看到我这张白天鹅的时候，脑子里各自是在想什么？”

“我……我根据第一轮图片知道1号和4号肯定有一个人是在装我的队友，就随便投了一个。”宁涉雪如实回答。

风和光则笑道，“我其实不知道谁是你，所以第一轮就投错了，然后第二轮是跟着阿秋投的，她第一轮投你我就也投你。”

“那么又有一个新问题，风和光同学。你们在独立空间里，无法交流，也不知道彼此的编号，投票记录只公示号码，不公示身份。你是怎么知道3号是万秋同学的？”

女孩眼珠灵俏地转了转，“如果你额外给我10雨滴……”

“我是外包人员，不能影响对弈的公平性。”

“好了好了，告诉你也没什么。我和阿秋是朋友嘛，第一轮看到那张图就知道是她。她肯定也知道我是谁，对吧？我出牌的时候就知道她能认出我。”

万秋点头。

“万秋同学，你能认出1号是因为你们是朋友，那么为什么会排除2号和5号呢？你和她们都是好朋友？”

“不是。”

见她无意说出更多，九枢也不再追问，又请金同尘讲讲自己的思路。

“我猜你只会给自己安排到后三位，比起4号嘛，3号的牌和前两张都没什么关系，不像是你会出的。之后我也选了最不符合气氛的一张牌公示。”金同尘娓娓道，“万同学或许和我想得一样。”

万秋未置可否。

There are only two ways to live your life. One is as though nothing is a miracle. The other is as though everything is a miracle.
