    <script type="text/plain" id="chapter-text">
“生日快乐。”

“谢谢。”

“雪儿，你今天过生日吗？”和宁涉雪一起走出心法课教室的伏遥听到两人对话，“怎么没有邀请我？小凤凰说她今晚不能和我们出去是因为这个？”

“呃，我……”

“她只和她表姐简单庆祝下。”金同尘解围道，“小凤凰下周要办圣诞舞会，连着办两次派对有点忙不过来，因为装饰公寓也需要时间。她们就只是在坊市一起吃个蛋糕，是吧？”

好像不是，但好像也不能说不是？宁涉雪一时不太理解，迟疑地点点头，不想多说话。

“原来是家庭聚会，真羡慕你们这些姐妹一起来的，可惜我在尘世只有一个远房族妹，比我小两岁，就算之后也来九州，也不会再想起我了。不过，说不定我也忘记过其他人。”

“Chelsea，如果你有一个你自己不记得的姐姐，你会怎么想？”

“我不记得，就，没什么想法。”

“如果是我一定会很好奇。”伏遥接过话，“我会很想知道她的事，比如她父母是谁，之前我们相处怎么样，还有她为什么要去九州……”

“万一你们之前相处得不好，所以她才来九州？”

“我没有那么魔丸吧？”伏遥笑出声，“如果她真的那么讨厌我，可能不会来和我相认。”

“如果你真的遇到这种事，我想一定是对方的问题。”

“那无所谓啦，反正我不记得，就重新认识吧。”

之后两个人又聊向其他事，走在中间的宁涉雪一直右耳进右耳出，默默思考上周日残留至今的神魂学难点；她喜欢这样混在人群中走路，显得比较普通，尤其喜欢其他人愉快对话但不要打扰自己。

普普通通的九小时后，宁涉雪先回公寓换下校服，然后来到坊市的“曰目囙回”。这是一家专卖蛋糕的小楼，看得出店主很喜欢Mondrian，处处是彩色抽象几何色块元素。

她拉开预订好的包厢门，花香混合奶油与蜂蜜的甜味、艳丽暗沉的方块彩光、轻盈清透的音乐迎面而来。风和光、原与辉、季如意、万秋和金同尘都已坐在里面：前两人正兴高采烈地边说边比划着什么，金同尘和季如意坐在两侧饶有兴趣地听着；万秋低着头，显然是在看终端，似乎觉得其他人很吵闹所以表情有点不快。

“她来了！”季如意最先瞥到门缝后的寿星。

随即经典的旋律叮叮当当盖过暖场曲，宁涉雪羞涩地踩着大家合唱的生日歌蹭进房间，关好门后还紧紧握着门把手，一时忘记应该坐到沙发上去。

风和光看出表妹的局促，就拿起小皇冠走过去给女孩戴好，“12岁生日快乐！”

原与辉已迫不及待地挥手让她走到沙发后看礼物盒，“快拆，我也想看她们送了你什么！”

宁涉雪不记得上次为生日而惊喜是哪一年，但望着大大小小包着晶亮玻璃纸和幻彩丝带的礼物时，童年的快乐顷刻间复苏，“哇，这个，盒子好大……”

“这个是我送的。”季如意愉快认领，“要不要先照一下再拆？”

“好，一起照吗？”

“等下，我刚刚让阿秋去推生日蛋糕过来，我们等她一起吧。”

“可以先猜猜里面是什么！”

“好主意欸，等拆开之后再猜猜是谁送的！”

宁涉雪兴致勃勃地大猜特猜一番后，万秋推着已插好仿真数字蜡烛的生日蛋糕回来，引起女孩们的欢呼；合照之后，她们先拆开最大的盒子，见季如意送的果然是毛绒玩偶——像一匹小马那么大的淡蓝天角兽。

“这个cutie mark是我绣的，不知道和你想的一样不一样……”

原与辉伺机点了首Make a Wish激情演唱，盖过季如意介绍礼物的声音，好在宁涉雪并不特别在意图案设计理念；这只雪花翅膀的蝴蝶虽然和她的想象有点小出入，但也银闪闪很好看，于是她诚恳地向朋友道谢。

第二大的盒子里是一支精美的蒸汽朋克风格Winchester Model 1873，让女孩心潮澎湃并因此轻易猜出是表姐的心意；然后是My Melody主题音箱，一定来自金同尘，前几天她特意问自己最喜欢Sanrio里哪个角色。

最后两样是LEGO #76427 Buckbeak和ATÉ的最新款手镯；宁涉雪不太敢相信这只镶着密密麻麻珠宝、花哨得有些刺眼的手镯是送给自己的，望着原与辉和万秋思考再三后，认为前者更不可能去首饰店选礼物，至于后者，大概，随便从坊市买了点什么。

“哇，好厉害啊雪儿，全猜对了！”风和光热烈鼓掌，“来吧，快来许愿！”

宁涉雪的愿望自然是能成功完成妈妈的计划。

切分蛋糕后，季如意和原与辉开始唱歌，很快风和光也被迫拿起话筒，随之又拉万秋与表妹一起加入。高高低低的笑声如蛋糕渣般洒落在包厢的每一处，时而动听时而不那么动听的歌声像冰淇淋里的果酱一样搅拌进旋律里；某一刻起鼓点变得鲜明，欢快的节奏将女孩们从沙发抛向空地，踩着音符跳起舞来，直到精疲力竭又纷纷倒回去喝着饮料休息。

原与辉问宁涉雪能不能把乐高拆开现在就拼，宁涉雪也想玩，两个人便调亮灯光坐在地毯上开始制造神奇动物；风和光与季如意讨论起下周舞会的妆容，分享着终端屏幕一起找灵感；此时音乐不再是重点，于是金同尘将controller暂时交给九枢，坐去万秋的沙发对面搭话。

“你觉得今天的音乐怎么样？”

也许这句话牵动起一丝对Vane Family的怀恋，万秋没有回绝聊天，“很流畅。”

“你唱歌很好听，我记得中秋时你还唱了昆腔，也和小月亮一样从小学过吗？”

提起中秋，万秋倒想起一事，“你说过觉得Helena唱得不错。中秋前你们一起练习过一阵，有新发现吗？”

“……和我之前以为得不完全一样，不过我觉得也很好。”

虽然灵网助手没有捕捉到对方表情里有嘲笑之类，但金同尘还是察觉到这一瞬女孩的情绪松动，忍不住有些惊讶，“我以为你不会开玩笑。你看起来总是不想说太多话……”

“九枢应该更用心地帮你看。”

金同尘被这个一箭双雕的笑话逗乐，并认为这是进一步试探的最好时机，“她只是缺乏一些训练，如果我和她在尘世就是朋友，她一定比现在唱得好得多。”

“不一定。”

“小凤凰从小就这么害怕音乐吗？”

“有点。”

“不过她总是那么忙，又要照顾她外婆，又要帮她妈妈做事，大概也没时间和朋友花费精力在这些地方。”

“嗯。”

“当然这对你来说好像是好事，所以你们关系才能这么好。”

她料想万秋会质疑或恼怒，但据说对方依然面无表情，“也许。”

女孩的不同寻常让金同尘心生疑虑，好在她已经拿到所需的全部信息，“只是开个玩笑，我不太擅长这个，希望你别觉得冒犯。”

预言家近乎怜悯地微微摇头，转而问她是否想喝点什么。

“谢谢，我确实想点杯奶茶，你要一起吗？”

半个多小时后，Buckbeak宣告完工，风和光、金同尘和季如意互相商量着做好今天的作业，万秋则依旧在学习Foundations of Soul-Field Topology要求的数学知识（这是她最近课后一直在做的事）。六人又一起合唱几首诸如Under Our Spell之类的温馨歌曲，然后互相道别。

万秋与风和光帮宁涉雪将礼物抱去住处；返回公寓的路上，她们偶然对视一霎，不约而同地发现对方在回想另一个从没有在这一天庆祝过生日的女孩。

“我觉得她会喜欢那个礼物的。”风和光感伤道，“不过雪儿好像不是很喜欢。她们不太一样，是吧？”

也不是那么不一样。但万秋知道朋友对妹妹向来有些偏见，因此只嗯了一声。

风和光摸不准朋友目前对家人的心态，所以没有大肆重提旧事；对她来说，想到莫名妙也许已遗忘一切，童年过往就像缩回指甲的猫爪，不再钩得人痛苦难安，甚至偶尔还会冒出自己已经原谅的错觉。

比如此时此刻。

And in that moment, though you didn't know it; your defenses set up walls you built to last.
