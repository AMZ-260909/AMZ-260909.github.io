      <nav class="reader-controls">

    <script type="text/plain" id="chapter-text">
周六早晨吐纳课后，丁区168个新生、12名助教都聚在联谊准备区。从导航上看，这里是学区最中央的位置。和其他地方不同，这片区域没铺草坪，裸露出不太平整的土地。

虽然周末依旧要上课似乎颇不近人情，但她们前几天的课程内容都不难，加之这门课又很有几分神秘色彩，因此并没有抱怨的声音；倒是助教们的神情都略有些肃穆。

九点半整，潮湿的泥土与苔藓气蔓延开来，随即一道青影乍现——

“三青！”

三只脚的美丽鸟儿站在……站在一只同样凭空出现的大龟背上。这龟约一米长，背甲漆黑润亮，每块盾片中心都呈黄褐色，前肢上密覆着尖锐的硬鳞，布满坑洼的头颅中嵌着一双目光锐利的眼睛。

“小家伙们，一别数日，你们在这里可好？”三青的声音依旧慈爱。

它问完就没有再说下去，似乎真的在等学生们回答。于是有些或高或低的声音说”好”、”很好”；也有些说”一般”“还可以”；还有摇头的，或者没说话但用表情回答的。

“有好，有不好，处处都是这样……好与不好，你们都已来了，就在这里生活吧。以后每周六日，我都会在这里送大家进入联谊区。不只是我，还有坤女。”

孩子们就好奇地望向那只大龟。

“学宫里的植物都不是真的，也没有动物。你们可曾想过为什么？”坤女的音色颇为苍老。

什么？学宫的草地不是真的？

新生们面露茫然。她们自然观察到这里没动物，坊市只卖鲜花而没有盆栽；可尘世的校园里也没有太多动物，尘世的宿舍也不许养花——难道这背后有什么原因？

“你们初来乍到，还没想过这些也实属平常。何况，听三青说，如今尘世中人们早已不再日日与走兽草木为邻……九州原本和数千年前的尘世一样，只是后来变了许多……”

她的话不很好懂，似乎也并没期待谁回应。停顿片刻，三青开口接下去：

“你们或许在新生指南上已经看到，九州本是两千多年前破界仙尊飞升时留给后人的一件仙器，坤女便是这仙器的器灵；就如我、如三枢一般。那时，修士们刚从尘世迁进九州，看到这里已有无数飞禽走兽、奇花异草，有尘世里有的，也有尘世里没见过的。

“一些年后，九州出现了妖族修士。其实，尘世也有这样的情况，就像人族修士们分散在凡人里，妖族修士们也分散在野物里。但九州不同于尘世，九州没有凡人。或者说，九州本没有人类。人类们都是我引进来，然后在九州上住下。人修、妖修混居在九州时，人修们取妖的筋骨炼器，妖修们吃人的血肉为乐。当然，不少人族也做妖族常做的事，不少妖族也做人族常做的事。这些在当时都是天经地义的……

“后来，无论人修还是妖修，都越来越不愿意被当作资源。你们想想，你们的老师、朋友、手足、挚爱，某一天变成别的修士鼎中的一粒丹丸……”

听到这里，从琮看了一眼云共影，云共影也看过来；两人不约而同地想，幸好生得晚，不然以我表姐妹的资质，多半是一起进鼎。

“于是，大约三百年前，人修与妖修商量分开居住，人居东四州，妖居西四州，中州作为中立区，但妖修要求把一切未开智的禽兽草木也带走，因为那是它们的同族；人修却不同意，认为九州本是破界仙尊所留下的，理应是人修资产，拿出一半给妖修们独立居住已是让步，妖修不该得陇望蜀。诸如此类，很多事谈不拢……用了多少年还是谈不拢……”

三青望向天穹，似乎陷入深深的回忆中。

女孩们年纪虽小，却也都猜得出后面的事；尘世虽没有妖修，但亦从未停过战火。

“谈不拢，就只能打。你不杀她，她就要杀你；你杀了她，还是会被另一个修士杀。就这么打了八十多年，那些年里我带进来十几万个小人孩儿，大都被杀啦。她们拿着我的羽毛时，不少都问过我九州是什么样子，我说那里在打仗，很危险，但她们还是要来。因为九州不用缠脚，不用种地，肚子也不会饿……而且尘世那时也打仗，英人打进来，长毛打进来，这也运动，那又起义……在九州，她们还有上战场的机会，好过坐在地上等死……唉……”

“打完仗，人修和妖修就谈拢了，一起去坤女面前划定疆界。妖修如今住在西四州，它们有自己的社会。但是……”

“三青。讲得够多了……”坤女缓缓道，“在这门课，你们将会去一个不仅仅有人的地方。我和三青不会插手你们在那里的行为，学宫也不会。不过，那里的妖族也都是孩子，如果它们对你们做什么，只要不危及生命，我们也不会管。”

“莫要吓这些孩儿们，没有那么吓人；联谊规则只有一条，把手里的钱币尽快花光——你们手里的都是联谊币，不影响九州经济。终端的权限会受到一定限制，不过你们能克服的……”三青振翅飞起，盘旋间降下一阵青雨似的羽毛，遮去女孩们的视线。“玩得开心，两小时后见……”

万灵睁眼时身处一片旷野。

远处独伫雪白高峰，近些竖着浓绿的森林，身旁是齐膝高的草甸，草叶挂着明盎盎的露水；耳边依稀可听到她自小就听惯的潮汐声，想来远处有海。

再看自己，身上仍穿着校服，手中多出只小布袋，里面装满金灿灿的方孔圆钱，数量约莫百枚——初始钱币额数正是100。终端也在，但只有★能点开，其他应用都灰了；★还多了一页，页面顶部一行字写着【每节课后刷新】；下面是两个榜单，一个是十校区总榜、一个是丁火校区分榜，目前都还未写排名。

这些钱应该怎么花？

万灵在尘世时学过花钱：她们姐妹每人每年都有20万美元的额度，每个季度都有一次信托会议，顾问每次会先简报下上季度的情况，再介绍六个项目，然后她们三人（后来变成四人）一起讨论，决定这季度投什么。她投过东欧孤儿院的音乐启蒙、深海珊瑚礁修复、难民儿童心理创伤语言治疗计划等。但是，这里全然不同。

万灵思索着，尝试用手碰碰周围的野草，礼貌道：”你们要钱吗？”

野草在风中摇曳。

我真是有些傻。万灵一笑，把钱袋捏好，决定循着海浪声走去。

她走了大约一小时，最后绕过无数横倒的粗长枯木站在海浪前。冷戚戚的阳光下，碎银般的水沫萦绕着礁石飞舞，惨白泡沫一层层冲刷在黑黢黢的沙滩上，煞是好看。万灵一时忘了课程，随便坐在某根横木上望着大海出神。天地之间仿佛只剩茫茫苍苍的波涛，连她自己也变得透明。

不知多久后，海风里飘来一阵嘈杂的尖叫和兽吼声，女孩才回过神，忙跳下地往那边跑去。

虽然三青和坤女承诺不会有生命危险，但听到呼救总应该去看的。万灵赶到时发现五六只狼围着两个不认识的丁区同届正一步步缩小圈子；女孩们在尖叫，狼也时不时叫几声。

万灵没有多想，举起钱袋使劲摇晃，让金币撞击声引开狼群的注意力。狼们果然朝她这边看来；她转身就跑，随即肩膀重重往下一沉，浓烈而潮热的腥膻气喷在她耳边，带着急促的喘息。

甚至还没来得及变成丹丸。

To love another person is to see the face of God.
