两杯三叶草蜜酸奶、一块巧克力杏仁Dacquoise、切成四瓣的新鲜无花果、一壶炭焙乌龙。

风和光喜滋滋宣布大家都同意改变计划。

“不过，那你明天穿什么？我们几个本来商量是穿蘑菇主题，你觉得怎么样？毕竟明天说会下一整天雨，我们要都穿短裙雨靴然后戴不同的伞帽，特别好玩的，对吧？现在还早，我们可以去坊市逛逛，或者用成衣打印机也行，我前几天刚买来一台……”

“你穿什么？”

“我的是自己设计的，在宿舍挂着呢，我拿过来？我也正想穿上让你看看，但你不要笑我；算了，你笑吧，本来就是很好笑的。”

万秋把酸奶喝到剩三分之一时，风和光从更衣间走出来，全身都是鲜嫩的明黄色：丝绒连衣短裙、短雨靴、边缘不规则翻卷的绒面毡帽，帽型确实很像鸡油菌的伞帽。

万秋细细端详，总体来说这个造型非常滑稽，但配合Helena又很可爱。

“很好看。”

“从头到脚同一色的衣服对你来说都很好看，是吧？”风和光打趣道。

“不一定。”

“所以你穿什么？要不我帮你选吧？”

于是次日天光乍亮时，万秋被朋友装扮一新领出门去。她穿着白色西装连衣短裙，同色长雨靴，戴一顶褐色压花皮革无檐钟形帽，帽缘垂下一顶A字型蓬开的网眼白纱，长至膝盖。

“Helena.”万秋希望朋友适可而止。

“但是哈哈哈哈哈哈哈哈哈阿秋你好像真的竹荪啊！”

[image:assets/illustrations/chapter-028-mushroom.png]

万秋放弃改变朋友的行为，把思绪移去预言确实可以改变这件事上。这说明她看到的只是事态最可能的走向而不是注定的结果，也就是说，很可能是假信息……

不知不觉她已被一群音色各异的笑声包围，原来风和光牵着她来到宿舍区外的草坪，大约40多个不同班级的女孩都聚在这里。由于今天无需佩戴名牌，她们又都打扮怪异，万秋一眼看去只能认出几个最眼熟的面孔：季如意是皱桃菇，原与辉是红星头菌，尚弦月是松茸，望少微是紫蜡蘑，宁涉雪扮银耳，穿着蓬蓬叠叠的白裙，缀满波浪边的纱帽包裹脸部，只露出一对眼睛。

小雨极细密，更像是湿雾，不影响室外活动。女孩们相互点评造型、自拍合拍，嬉闹许久。万秋并没拒绝来合照的同学，从前当然——不，从前她根本不会参与这种活动。但她下一步想试试诅咒是否会影响人际关系，因此勉力配合。

众人快中午时才终于抵达节庆广场。广场今天的主题自然是“雨水”：草地上搭建许多临时棚架，形状都是莲叶，远远望去高低错落煞是好看，宛如放大版的莲塘；助教们和学宫的其他文职、后勤等员工都穿着彩艳艳的鱼尾裙，在莲叶棚下穿梭。

每个棚架都是一个游戏摊位，规则各异，从投壶、双陆到猜谜、抓子等不一而足。奖励点叫“雨滴”，是镭射幻彩水滴形状的小图钉，集齐若干可兑换奖品。

奖品兑换区布置得最为亮丽，是一朵数百把竹骨纸伞扎成的巨大莲花，最外层瓣是不同水墨画的伞面，越靠近莲心的伞工艺越精致，有描金银线的、镂空雕花的、绣珠镶玉的……所需兑换点自也不同。

蘑菇女孩们叽叽喳喳地散入各莲叶下。

宁涉雪依然跟在风和光旁边，听后者议论莲心的伞会是什么样。

“SSS奖品竟然要777个雨滴呢，看那些牌子上一个游戏才给两三个，怎么攒得够呀？给的多些的游戏又难，还耗时间。学宫真小气……”

“小凤凰嘀咕什么？”许无忧正好负责奖品兑换，走来轻拍风和光的伞帽，“兑换处又不管雨滴是多少人赢来的，你朋友多，找六七个人一起凑凑，很快就可以凑够的。”

“那我怎么好意思，就一把伞，又没法分。许老师，你最好了，给我看看图片也行，我就想知道是什么样的SSS奖品嘛。”

“哎呀，别缠我，攒够点数我就给你取下来，好啦，这会儿装可怜也没有用，快去玩吧。”

风和光见没得商量，只好把许无忧放走。

宁涉雪最近已学到不少普通人的行为准则，这时便安慰道，“表姐，我们两个，说不定可以攒够。”

“好啊，阿秋你呢，不帮帮我嘛？”

万秋正在整理高维灵粒概率叠加等搜索词查到的论文结果，一时没有接话。

风和光用手指隔着面纱在对方颊上一点即离，万秋才抬起眼，冷冷地盯过来。

宁涉雪几乎以为此人要对表姐大发脾气；在表姐所有朋友里，这个女生格外不同。她话很少，从不和大家一起行动，只偶尔和表姐发消息或交谈，并即使在交谈中也很冷淡。

刚腹诽完，宁涉雪惊觉自己竟会用这些话形容另一个人。偏偏万秋今天也穿白裙并挡着脸部，而她们又曾在同一间教室外同病相怜……

“我要那个SSS奖，阿秋，你也帮我攒雨滴。好不容易出来玩，别一直看终端了嘛，你玩点那种难的游戏，攒得快，我去那边套圈。”

“嗯。”万秋平静地转身离开。

风和光也挪动脚步，却有些闷闷不乐。朋友自从昨天起就怪怪的：主动问起活动、同意来参加、任自己打扮、和别人合照、被碰到脸也不生气……真的很反常。她不想越界问东问西，但又无法不委屈：我还做得不够吗，为什么阿秋总是把心事瞒着我？

“该你了，小凤凰！”季如意笑着推她。

“哦，看我的！”风和光忙堆起笑来，又转头向自己旁边刚扔完圈的宁涉雪道，“雪儿，你去做点别的任务吧，这里人太多，轮到一次要好久。”

宁涉雪领命而去，边走边前后张望着哪个莲棚人比较少，没留神被地上的什么绊得一个趔趄。

有人扳住她的肩膀，尝试阻止她摔倒；但抓得不是很牢，以至于她从对方手里滑脱，那只手便又抓住帽子将她向上拽。宁涉雪站稳后，原本应与裙领相衔的帽缘已被拽到颧骨处，于是惊慌地拉下帽子，才重新恢复视野。

万秋皱眉盯着她，使宁涉雪的一叠谢谢卡在喉咙里。她惊恐万分，不知道对方会问出什么令人难堪的问题，于是脸先火辣辣地烧起来。

“你今天为什么不戴眼镜？”

“啊？啊，呃，我……我帽子包住耳朵，所以。”

宁涉雪不确定万秋有没有听懂自己语无伦次的回答，总之对方一点头就转身离开。

她也许根本没看到我的脸。宁涉雪安慰自己，但仔细回忆又认为万秋不可能没看到；甚至她明明看得很专注，流露出看到她脸后的人通常会流露出的那种排斥神情。

“所以，你有看到吗？”宁涉雪忍不住追上去小声问道。

“没有。”

“不，你一定看到了。我看见你在看。我知道你在看。”

万秋面纱后传来一记轻笑。不过宁涉雪怀疑是听错了，毕竟帽子有点遮挡耳朵。

“你知道我看到了，那你为什么还问？”万秋加快脚步往前走去。

宁涉雪也不知道自己为什么追问，她思考到的几个理由都不好，于是跟着对方走了一会儿，直到终于想出满意答复。但万秋已在某摊位前停下脚步，并先对宁涉雪道，“把你手里的雨滴给我。” 

女孩闻言一怔，细看这间棚下的招牌，是“流水令”；不知是不是因为规则繁琐，即使赢一次有10枚雨滴也无人问津……哦，原来每次玩之前要先交3枚抽签费。

“我只有4滴，不够两个人的。”

“你去其他地方玩。” 万秋理所当然道。

宁涉雪想了想，决定支付雨滴，毕竟刚刚对方好心让自己免于跌倒，然后从头读起流水令的规则：

【玩家从签筒抽一支签，上面是2~7字的一句上联，玩家必须在三分钟之内给出下联，要求文字对仗工整但内容毫不相干；之后司令会在这副下联中任选一字作为令字，玩家需说出七句带令字的诗句，且令字必须在第一、二直到第七字。游戏失败不退还抽签费】

此时万秋已抽出一根木签：【悔尝忘忧草】。

她思考几秒道，“怕得破伤风。”

司令笑道，“对得很有意思，那我选个难些的令字吧——怕。”

这个确实很难，如果选风就简单得多。宁涉雪牵挂自己代付的雨滴，有些不平地瞪着司令。

但万秋似乎不觉得难，“莫道娇红怕风雨。怕风惟怯夜。生怕林间一夜风。少年不怕风尘恶。冲雨冲风不怕寒。世路风波如梦怕。风雨怕不休。”

司令夸奖一番竹荪同学的才思敏捷，返回20雨滴，然后请她去别的摊位逛逛，“我这里费脑子，你想要更多雨滴不如去射覆，那里是下注的，赢得快。”

万秋还给宁涉雪3枚雨滴，“你在这里玩吧。”

“我可能玩不来。”宁涉雪诚实道，才想起自己为什么要跟着万秋，“你根本不想知道我的回答，为什么你还要问我？”

“我问你什么？”

“你刚刚问我‘那你为什么还问’。”

“那你为什么还问？”

这次宁涉雪确定看到万秋露出一个稍纵即逝的浅笑。她震惊地发现对方在戏耍自己。她好像应该生气的，事故之后她对别人的嘲弄一向敏感。但万秋的行为似乎又与那些人不同。不过她无暇分辨，狠狠地跺一下脚转头离开。

她应该找片水洼跺脚。万秋默默想，看来尽管会说出一样的话，有些方面还是妹妹更聪明。

You shoot a fellow down. You'd treat if met where any bar is, or help to half-a-crown.
