    <script type="text/plain" id="chapter-text">
万灵第一学年的活动课选修小提琴，这门课与她同活动室的只有丁巳班尹荣泉，两个女孩很快相熟，时常在假日同去坊市消闲，芒种这天也是如此。

“我看到我们班同学说学域刚刚有更新中秋晚会的细则，所有人都要参加欸。”尹荣泉读着终端上的讯息，“每个班出一个节目，形式不限，但必须全班同学共同参与。”

“中秋节在很长时间之后，对吧？”万灵正细细观赏今天市集上的霓旌、干旄、彩幢、珠幡……很为这些亮丽别致的祭旗着迷。

“是还有三个多月，但现在就要开始准备起来啵，不然到时候怎么赶得赢？我班里正在收集方案，估计要投票到这个月月底才能定下来表演什么。你们班群里有人讲这个么？”

万灵将目光从一面绣着云芝瑞草的大红缎旃上挪开，查看班级群的未读，“是的，我的同学们也正在讨论这件事。我的舍友告诉同学们我能够写话剧，但是，”她顺手回复从琮，“‘我不会写话剧。我只写过音乐剧。’”

【对对就是那个，怎么样？我可以唱】

【演戏确实很有意思！】

【一定要会唱歌吗？】

【如果大家全部同意，我很乐意写。@云共影，这里不需要每一个人都会唱歌。】

“三个月怎么写得来哎？” 尹荣泉惊讶地挑起眉毛。

“I started working on a new one pretty soon after I got here. 我已经完成过大部分歌曲，so maybe just need to touch up the lines a bit?”

“你还真是有点未卜先知哦？”

“事实上，它原来是一个故事关于蚂蚁偷盗gummies。但是，我想，我可以turn it into a story about七仙女帮助嫦娥。她们偷盗长生药，从西王母。”

“七仙女和嫦娥盗药有什么关系么？我记得那个仙丹是西王母要赐给后羿的。”

“Well, remember what we learned in culture class? The Seven Fairies are all sweet and caring, and they’re totally willing to break Heaven’s rules to help mortals. So if they heard what Chang’e was going through, they’d wanna help her get the immortality elixir before it got handed over to Hou Yi. Tell me that wouldn’t make an awesome story!”

“听起来是不错。”尹荣泉违心道，“但嫦娥……没有卖身葬父那么惨吧？”

“She must’ve been, like, really excited about the idea of visiting Heaven. You know, kinda like how Cinderella wanted to go to the royal ball, so her fairy godmother helped her out. 也许是蟠桃宴。我确定天界有许多很有吸引力的宴会。”

灰姑娘？蟠桃会？这又是什么和什么啊？尹荣泉面露难色，觉得随便改造这些经典传说十分不妥，但她知道万灵对华国文化了解甚少，因此不知怎么解释这种不妥。

算了，少管闲事。她想，这是她们班的节目。我还是想一下我们班表演什么节目好……

万灵确实不觉得这么改有任何不妥。她正在思考这部剧被MiMi看到会得到什么反馈。其实她的创作灵感正来源于和MiMi的经历：一名充满好奇心的蚂蚁女孩想尝尝商铺里的小熊软糖是什么味道，为此她的飞蚁朋友们一起大胆地在软糖售罄前合力偷出一块，吃完后蚂蚁女孩便长出翅膀，成为一名快乐的属于天空的孩子。

她从2月中旬开始动笔，并一直期待女主角主动来找自己。但当她们真的第一次约会，事情就变得糟糕起来；或者说，是从MiMi确认圣诞合照里的人是Juno之后就糟糕起来。

那时女孩一副倍受刺激魂飞天外的模样。万灵尝试沟通失败后想过联系助教或医务室，但踌躇再三还是按MiMi本人的意愿没有汇报。毕竟终端会记录学生们的生命体征，如果有危险，助教会发现的；也许她只是需要平静心情。总之，万灵不希望MiMi被送去类似精神病院或者特殊需求儿童教育机构，也不想向更多人解释对方是怎么在自己公寓变成这样的。

无非是因为Juno。就像我不喜欢和Juno有关的人一样，MiMi也不喜欢。显然她和我有一样的怀疑，甚至她看起来不仅仅是单纯怀疑——她一开始不知道我的母亲已经去世，知道之后一定是联想到了什么。天啊，这种事对于MiMi来说确实太沉重，她只是个想到爸爸妈妈就会大哭的小女孩，就像喻西子一样。

万灵也为这种事感到厌恶和羞愧，同时又感到苦涩：如果你喜欢的漂亮女孩害怕一个杀人凶手，你偏偏是凶手的双胞妹妹，那你还能做什么来挽回你在她心里的形象呢？

直到她们进入MiMi的宿舍，万灵才又获得一些希望。她一向尊重他人隐私，可就像在泳池边无意看到Juno手机里的照片那样，这次她不可避免地看到MiMi房屋墙壁上有许多自己专辑的封面与宣传海报。

那些来自尘世的海报有新有旧，有的也许曾被揉成一团，有的显然曾被撕成碎片，大部分上面都用各色水笔一遍遍横七竖八地写着“LEORA”。

“Wow, nice collection! Wanna pick one for me to sign?”

MiMi没有回答，在回到熟悉环境后就立刻倒在地毯上昏睡。

万灵将女孩安置好后离开，思忖良久，认为需要努力让人们想到自己时先想到作品而不是长相。

她看起来很喜欢我的音乐。她只是被吓坏了，我应该给她一点时间，并且继续写一些新曲子，等她发现我和Juno完完全全是不同的人，也许会回心转意的。她会再来找我，但愿吧。

虽然她是个有点危险、处处特别、情感过分充沛、需要被耐心管教的朋友，但那不正是我想要的吗？

在她能控制自己时，她愿意听从我的话，也对我很感兴趣。而无论在尘世还是在九州，我从没有见过这么狂热的粉丝。我从不是任何人的最爱——我已厌倦那样的生活。

丁丑班的大部分学生都没有过表演音乐剧的经历，所以很快同意这个方案。在万灵将改好的剧本大纲发布后，确实遭遇一些阻力，但并不是来自神话改编，而是大家不满结局是开放式。

“你得让她们在一起。”助教好心地帮万灵总结同学们的意见，“不然她们会选一个新编剧。”

编剧屈服于民主后，大家转而开始关注谁演嫦娥和七仙女，计划着所有人报名后各录一段目标角色试镜，再投票选出最终卡司。万灵自此开始忙碌，人缘和华语都突飞猛进，因此将关于MiMi的思绪先如那两封神秘信件般锁在抽屉里。

MiMi那边的好消息是没有被开除，甚至也没有再闹出要记过的大事；不大好的消息是她总是刻意躲着万灵，即使一同上课时也不理不睬。7月的第一天，万灵在活动中心遇到她，想走过去聊聊，女孩却像受惊的蝴蝶一样飞快跑进活动室去。

那是一间琴房，大概是自由练习日，里面只有两个学生。万灵没有走进去追问；她依旧不想得到会折损自尊的答案，所以只是倚在门边观赏片刻女孩生涩的指法，并轻而易举认出那首曲子是The Velveteen Cat的# 4 Does it hurt，于是旋律与歌词一同在她心底响起：

CAT (spoken) 

What is REAL? Does it mean having things that buzz inside you and a stick-out handle?


SKIN HORSE (sung)

I’ll tell you true

Real isn’t how you’re made

Not born that way

It's a thing that happens to us

When a child loves you

For longer than you'd ever know

Not a plaything

But a close friend they can trust

True love is so rare it sounds like a spell

Yet thanks to the One who made the world

Where wonders still dwell:


CAT (sung)

So will she cast a spell on me?

And tell me, does it hurt? 

All at once like being wound up 

Or bit by bit?

I don’t know if I want this kind of magic

Wish I could become Real

Without the price of it


SKIN HORSE (sung)

I’ll tell you true

Sometimes we feel great pain

But all the same

You won’t mind it when you’re Real

It grows in you

Not those who must be kept with care

When magic’s due

You’ll lose all aesthetic appeal

Most of your fur will be loved away

Yet you can never be ugly

Not to those who stay


CAT (sung)

So will she cast a spell on me?

And tell me, are you real?

Pardon this intrusive question

It’s just that I’m new

You look like someone who has been deeply loved

What does that feel like?

Do you like being you?

万灵听到这里时离开，也许是因为不知道如何回答这个问题。我希望我成为真实的，但我不确定是否会享受被改变的过程。当我只是编写这些台词时，我不需要担心它们降临在我身上……可是我现在已经来到一个魔法和奇迹存在的世界。

Of what use was it to be loved and lose one's beauty and become Real if it all ended like this?
