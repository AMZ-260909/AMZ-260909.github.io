    <script type="text/plain" id="chapter-text">
中秋前夕，万秋告诉朋友今晚想独自在校区里走走。

风和光完全理解，并询问是否要带点祭祀用品，“学宫不允许明火，但有仿真蜡烛。不过，我妈妈一定会为莫阿姨祷告的，你大妈妈她们应该也会操办那些传统仪式，所以……”

“不用。”万秋意会朋友的安慰；她本来也不打算做任何祭奠。

两年足以让任何凡人魂魄消散。母亲已不存于世间任何地方。

在草地上闲庭信步许久，女孩驻足望向天幕。沧凉凉的白月很圆，看着比十五并不缺什么。

不知杀人凶手是否也在仰望这轮圆月。

如果她已经忘记我，时间会怎样弥合那天的事？她会认为自己要杀的就是母亲吗？

不，她不会忘记。她在九州，在庚金之外的某个学区。

万秋心底自然而然涌现出答案。在这大半年中，预知力已不知不觉融合到她的每一寸思绪中，类似直觉。除此之外，她在放松时偶尔会看到某段未发生的事的幻影，虽然内容并不可控，但还是有些规律，因为幻影中出现最多的是Helena，也有几回其他同学，甚至还有一次是Geo和Soleil。从幻影中可以看到她们依旧生活在Vane Family，Geo依旧完美无瑕，Soleil依旧是父亲最疼爱的小女儿。

与预知力不同，诅咒尚未给她带来许多困扰。万秋的吐纳一直顺利，修为提升迅速，各项课程进展如常；好朋友忠诚如故，甚至在适量参与集体活动后，她与一些同学也有了少许交情；另外她自认为精神状态颇佳，从未想要伤害自己或任何人。

只要遵守简单的规则，诅咒似乎就会像识海中的怪物一般沉眠。也许是因为我才踏道不到一年；也许诅咒会在某个时刻让情况急转而下；也许本来就有很多卜修没有那么严重的诅咒反应，因此也未被觉察身份。

无论如何，至少万秋每次用直觉排查后都发现上报学宫是坏结局，与神秘女鬼交涉是坏结局，只有尝试自行解决诅咒会是好结局。虽然预知并不一定百分百准确，但既然与她本来的想法不谋而合，她似乎没有理由把命运交到其他人手里。

而且，今晚将会发生一件不同寻常的事，对解决诅咒很有帮助——万秋在几小时前就隐有预料，于是有些不安却又振奋。我不害怕任何事，她默默想道，自从两年前的这一天，我已发誓以后永远选择勇敢。

神思恍惚间，她听到夜色中流淌出哭声，抽抽嗒嗒地不停，像蜿蜒的溪水横陈在草丛里。

刹那莫寻秋几乎以为自己从一个漫长的梦中醒来，母亲还在客厅追剧，妹妹在一墙之隔大哭，没有Greenwich的一切，也没有九州；或者反过来，她久违地睡着，进入一方时间被月光抹平的梦境。

无论是哪种，女孩放轻脚步、循着声音走过去，停在草丛里的身影旁边。

“妙妙。”莫寻秋听到自己在说话，“起来。我们回家去。”

然后她意识到这些只是幻影。

幻影消散，空余一片望不到头的草地。甚至草地也是假的。

但哭声似乎是真的。

自然不可能是莫名妙。万秋想，但她还是跑过去，然后看到宁涉雪侧着蜷缩在月光下呜呜地哭。

“你在干什么？”

发现宁涉雪没反应后，万秋想起Helena说过对方有听力障碍，于是踢了踢女孩的小腿。

哭声停止；女孩像濒死的鱼一样吓得弹跳起身，发出短促的尖叫。

“你在干什么？”万秋提高音量重复。

宁涉雪意识到来人是谁后惊魂初定，飞快抹脸并戴好口罩，“我没事。有点，想我妈妈。”

哦，是那个和Helena的外婆类似的痴呆舅妈。

万秋有些嫌恶，“抱歉打扰你的思乡之情。你继续吧。”

“没有，我已经不哭了。”宁涉雪狼狈地用衣角擦拭眼镜；她想显得像没有哭过一样；但哭过的眼睛总是相似的：红肿、浸湿、明亮，带着一些不知所谓的倔强，比平时张牙舞爪的样子看起来可怜得多。

“你想你妈妈？我听你表姐提过她。”

宁涉雪警惕地沉默片刻才点头。她不知道万秋说这个做什么。表姐会向万秋怎么描述自己家的情况？会是一贯活泼温柔的语气，还是像她对自己提起Juno时那样有点惆怅地抿着唇？

她7月初偶然在与风和光的聊天中惊闻原来万秋就是Juno。

高高在上、遥不可及的Juno。

尘世时表姐几乎每次和自己独处时都将Juno挂在嘴边：“我那个去了美国的朋友”“她爸爸是古董乐器收藏家，家族特别特别有钱”“她是天才，好像天生就预安装很多技能”“个子高高的，特别特别特别好看呢”“虽然看起来有点不好相处，但其实很可爱”“我们一出生就是好朋友”“可惜她不会再回扈城，等我们长大，可能没法再关系那样好了吧”……

那时宁涉雪听力远不如现在，也没认真听，更不会回复什么，未来也似乎不会有转机，大概因为这些，表姐总是随意对她倾吐心事。

宁涉雪那时对Juno没有任何好感，并希望世界上最好不要真的存在Juno，因为这个人听起来比自己像主角得多。

而知道万秋就是Juno后，女孩先觉得理所应当，随后油然而生羡慕；可细细想来，却又改变看法：

尘世的钱带不到九州。成绩也不是学宫最看重的标准。她确实个子挺高，但根本称不上特别特别特别好看。表姐总是这样把别人往好里形容，在看到自己小时候照片时还惊呼“你怎么长得像国际巨星”，实在夸张。

所以万秋也不怎么完美；最重要的是，她没有肩负神圣使命。

即使如此，宁涉雪自此对万秋的每句话都耿耿于怀，尽管这两个多月万秋从没主动和她说过话。

“我也听表姐提过你妈妈。你妈妈已经去世。你当时还在我爸爸的医院住了很久。”

万秋登时微皱起眉，目光寒利利刺在宁涉雪脸上。

宁涉雪感觉不得不解释，“是后来，我表姐说的，你不信，去问她。现在，我还帮她讲数学题，因为，她那时缺课很久，一直跟不上。”

解释虽然有些混乱但依然起效，万秋脸色重新缓和，甚至带了一丝笑意，“你还能给你表姐讲题？”

“我听力不好，不是，智力不好。”宁涉雪昂首道，“不要以为，只有你聪明。”

她想象中万秋会被冒犯，但后者似乎只觉得好笑。那种居高临下、盛气凌人的眼神让宁涉雪很不舒服，因此决定转身离开。

原本她只是想找个偏僻的角落发泄情绪，因为在学宫待得越久，她越觉得妈妈的计划有些不可思议：她要自学好多东西，要保证许多细节不出错，要随时准备成为邪修。还有5个月她就要正式开始行动，但她全没把握。

在女孩即将重新走入夜色时，万秋的话拉住她。

“你的意思是，你也很聪明？那我们打个赌，如果你赢了，我会帮你做一件任何你指定的事。如果你输了，你什么都不需要做。”

“你在骗我？”

“可以让你表姐作证。”

“不用。”宁涉雪想，如果万秋骗自己，那这件事会让自己好受些，因为说话不算话很差劲；而如果万秋是认真的，那自己输了无事发生，赢了的话……确实她可以使用对方做点什么。

一个只有好结局、更好的结局和最好的结局的赌约。

“我们赌什么？”

“你最擅长什么？”

宁涉雪飞快思考着，她目前所有科目里最擅长数学和灵理学，但是万秋这两门课也不差。吐纳绝对不行，万秋的修为比她高。其他课程……不，不能在课程里选。要选一些她真正擅长的；或者说，万秋不擅长的。一些只有自己知道的，万秋不知道的事。如果自己提出一个稳赢不输的项目，岂不已证明自己的聪明？

“我，赌你不知道我妈妈长什么样子。”

宁涉雪说完也觉得自己有点无赖，正想再换一个，但万秋若有所思地扫她一眼，然后分享终端屏幕，开始用画图app描绘一张女人的脸。

宁涉雪好奇心起，莫非万秋有读心术，能从自己脑海里看到妈妈的长相？

万秋画得很快，几乎不假思索。十几分钟后，一张人物素描出现在她们面前：女人眉目含笑，神情中有种直率的狡黠，又有些娇憨的不谙世事。

“你画得真好。”宁涉雪由衷道，随即便更高兴起来，“可是，我妈妈，和这个不像。你输了。”

万秋冷冷看着她，仿佛认定她在说谎。

“我有妈妈的照片，你不信，可以去我公寓看，真的不像，她年轻时和我爸爸的结婚照，我也有，也不像。”

两人去宁涉雪住处验证赌约胜负，果然即使是万秋也得承认画像和照片里那个相貌平平的女人毫不相干。

然而万秋却还不肯服输，依旧盯得宁涉雪坐立难安。

“你把眼镜和口罩取下来。”

“不要。为什么？你看到过。”

“你这么在意长相？”

“我从来不在乎。”

宁涉雪确实不在乎。不止是她，事故后任何人都不再在乎她的长相细节。人类的大脑总是喜欢捷径。她脸上有疤，所以人们轻率地描述她为“那个被烧伤的女孩”；她听力不好，所以人们习惯认为她一切能力都低于常人。

“你不能证明这是你妈妈。她和——”

“你耍赖，这明明是我妈妈！”

万秋不屑于继续逼迫。“你想好让我做什么再联系我。我不耍赖。”

对方的认输让宁涉雪略微平复愤怒，又追问道，“那，你为什么画那个？”

“我以为你们长得一样。”

万秋简单解释后就径自离开；宁涉雪的心随之不再提着，收拾好相册就放松地坐在地毯上。

真是惊心动魄的一局。女孩一边回味胜利，一边思考万秋最后的解释。这句话听起来有点怪，虽然妈妈和自己确实长得完全不像，但难道画里的人是像我吗？万秋大概不是因为善良才那么说的。或许是在讽刺。她输了，所以攻击我的长相，以为我会被伤害，但我其实根本无所谓，反正她输了。

宁涉雪快乐地想，原来高高在上的Juno实则不堪一击。

The empty vessel makes the greatest sound.
