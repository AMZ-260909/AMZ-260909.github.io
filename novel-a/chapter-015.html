    <script type="text/plain" id="chapter-text">
“我是2024届庚子班的学术助教，郑自馨。前五天，叶老师已经带你们熟悉住宿区、教学场地、节庆广场、坊市和各项校园服务机构，接下来我会为大家讲解学宫的教学体制。

“学宫不仅是每位新修士进入九州的过渡点，也是踏道的起点。在尘世时，你们各有来路，但现在你们都站在这同一个起点。学宫要求穿着统一校服，是提醒你们这里没有从前的家世，也没有从前的恩怨。你们的未来，只取决于你们今后的选择。好的选择，最后带来好的人生，可能是飞升，也可能是在九州度过有意义的几百年；坏的选择，会造成很多悲剧。我衷心希望这个班的诸位同学都做出更多好选择。

“首先，学宫没有长假期，但会有很多活动假日，课程不会很紧张，考试也不难；只要你们稍微付出一点努力，就不需要为成绩发愁。这里前七年所有人的课程都一样，等八年级和九年级才会分去你们感兴趣的行业实习，十年级则是一整年的毕业设计和考核年。当然，现在你们不用为毕业担心，把下周的每一节课上好就行。

“不同届的学生学到的内容可能会有一点点不同，因为我们的教材一直在与时俱进。但大致还是一样的，因为学宫课程基本都属于基础通识教育，已经经过上百年检验，只是教学方法可能有些变化。学宫鼓励学生之间交流学习内容，也可以和老师们讨论。但是很多资历较深的老师不喜欢学生使用灵网辅助完成作业，这点你们要注意看每门课的教学大纲，不同老师的态度可能很不一样。

“在课业之外，你们最需要学习的是处理与同学、与老师之间的关系。九州目前人族修士大约八万，并不很多，同一届的同学们毕业后很可能会继续打交道。学生之间的暴力斗殴是绝对禁止的。如果有矛盾，可以私下里商量，也可以找老师或者同学调解，但不可以蓄意伤害他人。我知道你们很多人都没仔细看学生手册，但至少这点你们要牢牢记住。

“最后，我要特别提醒一点：你们无法联系尘世的任何人，也无法得知尘世的任何消息。我知道有些同学在做决定时没有完全想清楚，现在感到难过、后悔、想回家，都是正常的；可以来找我谈谈，也可以找叶老师，我们随时都欢迎大家的倾诉。但请不要想着私自离开学宫！这类尝试非常危险，很容易造成不幸。九州不是一个律法严苛的地方，只有蓄意谋害他人且造成极严重后果，以及返回尘世两条会构成死刑，虽然你们目前没有能力做到这些，也还不到承担刑事责任的年龄，但我必须把这个丑话说在前面……”

宁涉雪一边听助教训话，一边弯起四只手指，用指甲一下下戳划着掌心，缓解心里涌上来的恐惧。

叶老师在她刚到学宫的第一天就带她去医务室做测试并配上新助听器，如今她虽然还是只能通过右耳听，但清晰程度和音量都很好，久违地让她能以那些听人的效率接受声音信息。

当时医务室还发给她一罐凝胶，说只要薄薄涂抹一层就可以让瘢痕慢慢变成正常皮肤组织；但她涂抹几小时后，身上、脸上相继发起红疹。校医检查后判定她对九州几种基础药物成分过敏，建议她继续采用物理遮盖。

所以她依然需要口罩和茶色平光镜，需要可以遮住脖颈和额头的长发；好在学宫校服是纯灰长袖长裤。

宁涉雪不爱引人注目，偏偏这里不是尘世，所有人里只她戴口罩。不止一个同学友善地问她怎么回事，她只能含糊地说是过敏。她不想撒谎，但如果说实话，对方可能会追问，因此，她别无选择。

总是别无选择。

或者，只有坏选择、更坏的选择和最坏的选择。

坏选择：成功帮助妈妈，但违反九州最基础的禁令，被判死刑。

更坏的选择：没有成功就被发现，并被处死。

最坏的选择：因为害怕就放弃计划。

妈妈现在会在做什么呢？会不会已经忘了自己？如果自己成功返回，但妈妈已经忘记自己……

也还好。

事实上妈妈大部分时间都不记得她。

自从女孩懂事起，妈妈就总呆呆地躺在床上或者坐在床上（取决于护工的摆放），眼睛半闭着，从不说话。她小时候因此不喜欢妈妈，更喜欢爸爸；爸爸工作虽忙，但会抽时间和她视频，每次还会问妈妈好不好。

爸爸有空和她在一起时甚至更温柔。他给她讲她出生那天下着多大的雪，讲雪花是从天而降的精灵，讲美丽善良的白雪公主，讲这个名字是妈妈早早给她起好的：希望她以后面对什么样的路都能坚强勇敢地走过去。

刚开始她的路或许是平坦的：爸爸有钱又有爱，她想要什么就有什么，家里的保姆和护工永远笑脸相迎。妈妈虽呆滞，但爸爸说这是因为妈妈病了，等妈妈病好后就会和爸爸一样宠爱她。

可火灾后，她的路开始飘雪，大雪渐渐掩盖并冻结所有温暖片段。

烧伤留下的瘢痕牵动她的肌肉和骨骼，将五官揪扯歪斜，身体也因此不如别人灵便。单侧失聪不至于去读特殊教育学校，医生也认为在普通学校读书更有利于心理发展，但一束束含义各异的目光、一张张在她靠近时就停止议论转而微笑的面孔、一场场双方都需要再三重复话语才能进行的交谈……都让她根本无法融入正常人群。

她知道爸爸是为自己好，但还是记恨爸爸的决定。而且，爸爸也渐渐变了。虽然还是对她关怀备至，但宠爱逐渐变成同情。同情是一种提醒，提醒她如今就像妈妈一样令人绝望。

于是宁涉雪开始亲近妈妈。

无论别人特别好还是特别坏地对待她，她都会感觉痛苦，而妈妈恰好对她一点都不特别。妈妈的怀抱像红木衣柜一样，无知无觉地拥着她长大。

但她也因此越长越像妈妈，迟钝、缄闭、对万事万物漠不关心。

好在即使是布满深雪的路，偶尔也会有奇迹。

2022年9月10日是周六，也是中秋节。她那时已单独和妈妈一起住，也拒绝爸爸和她们一起过节。爸爸托人送来许多礼物，但她懒得拆开。新系列芭比娃娃、带着彩色翅膀的纱裙、限量版玩偶、水晶鞋……她早就不想再扮演那些幸福的公主。

保姆也不会殷勤地为她拆礼物。现在阿姨们总是爱答不理地坐在房间玩手机，甚至随意外出很久不回来。宁涉雪想过向爸爸告状，但不知为什么，每次都没有说出口。

很多时候她不知道自己或者别人为什么要那么做。人并不能总是控制自己做什么。这一点在妈妈身上体现得尤其明显。

但那天傍晚，亮澄澄的夕阳斜洒在客厅，为空调房带来一缕热意，宁涉雪正坐在地毯上拼乐高；屋里只有她和妈妈——然后她忽然听到谁在说话。

她一开始以为是窗外或者门外的声音，或者护工刚刚喂饭时把手机落在妈妈房间里？她站起身，艰难寻找着声音来源，紧张地辨认含义。

随即女人推开终年紧闭的房门走出来。

那片蜜糖般的暖光刺得妈妈眯起眼。但她还是看到宁涉雪，并笑了笑。

她皮肤干枯、五官淡薄，可闪亮的眼睛和舒展的笑容还是让宁涉雪觉得很美。

妈妈的声音也不好听，但温柔得像阳光下的浮尘，轻飘飘、暖洋洋的。

“你今年多大？”

宁涉雪张开嘴，却不知道怎么说话。她经常害怕自己说话别人听不懂，尤其是说重要的话时。她最后比划了一个“十”的手势。

“十年……”女人长长地叹息一声，低声喃喃，“幸好才十年。”

宁涉雪没有听到她在说什么，只能走近请求她再说一次。

“原来你会说话。”女人欣慰地望着她，“妈妈病得很重。你知道什么是生病吗？”

“我知道，他们说妈妈得了抑郁症。”

“不，他们都错了，妈妈不是抑郁症，所以他们一直治不好妈妈。好孩子，你是妈妈唯一的希望，你记住，妈妈的病要这样才能治好……”

Sweet Hope, ethereal balm upon me shed.
