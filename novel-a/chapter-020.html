    <script type="text/plain" id="chapter-text">
课后午休时，宁涉雪随着季如意等新朋友一起去逛坊市；风和光却说自己和其他班几人有约，因而独自离开。

匆匆从传送阵回到宿舍区，万秋已在宿舍等她。

朋友刚刚并没说是什么事。风和光小心观察对方脸色，也看不出什么端倪。

“你记得日出后的祝词吗？”

“我……”风和光本想说不记得，但稍一回忆竟发现云霞媚那些艰涩拗口的字句深深印在记忆中。“我记得。你想再吐纳一会儿？但是终端上有监测……”

万秋将扳指脱在一边，取出清心宁神液开始涂抹。不知是不是这瓶药的作用，她后半节课吐纳一直无碍；但也可能是女人未再出声扰乱的缘故。

“我现在念吗？”

万秋点头，“如果我入定，你一刻钟后把我叫醒。”

风和光的祝词念完一遍后并没起效。但朋友没有让她停下，她就一遍遍重复念诵。大概十分钟后，万秋的呼吸节奏明显变得悠长深沉，于是她开始计时。

识海中，日光下，万秋对身形模糊的女人缓缓道，“告诉我诅咒的事，不然我现在就举手。”

女人不答。

“我知道你能听见。”

“你就这么肯定云霞媚会对付我吗？我不记得她这样热心……”女人幽幽叹气，“她当年没有帮我，现在也不会帮你。何况即使她想帮你解决诅咒也无能为力，除了我之外……”

“如果你再不说真话，我只能——”

“那我只能鱼死网破，让你变成白痴。”女人打断道，“聪明的小姑娘，你见过白痴吗？想想看……”

万秋下意识地想起风和光的外婆，又开始想吐，好在清心宁神液大大减缓她的不适。

这人一定在虚张声势。女孩思考，对方如果真的有能力施加这种伤害，为什么刚开始还要假装失忆？她连我在不在上课都不知道。她只是害怕我将她交给学宫。

“你说我做不到？哈，我只是想和你做个交易才不动手。”

“我也不相信诅咒是真的。”

“好啊，那你且安心修炼，小姑娘，我等你哭着来求我……”

女人狂笑几声后就归于静默，任万秋恐吓引诱都置若罔闻。

风和光唤醒她时目光忧愁，万秋猜想自己的脸色一定很难看。

“阿秋，你想去医——”

“不用。活动课我已经请假。你去上课吧。”

朋友离开后，万秋重新戴上终端，开始搜索神魂诅咒相关的信息。

根据金枢提供的资料，神魂诅咒在传说中的记载五花八门，但有效信息很少，学界对此完全没有任何可靠结论，正规检测手段也极其粗糙。

毕竟要不违反九州的安全协议而深入研究神魂术法几乎不可能，违反安全协议则会被视为邪修；一旦成为邪修，获得研究资源就十分不易，没有投资方敢于支持这些轻视社会契约的修士。另一方面，聪明人都擅长做好选择，更愿意投身热门又安全的领域（如加快境界突破、延长同境界内预期寿命等），不会碰冷门且有争议的课题，因此神魂学总体来说发展缓慢。

以至于万秋很难靠现有信息判断女人是否在危言耸听。

不过她说诅咒很快就会发作，那至少这件事可以核查真假。

除此之外，万秋依旧倾向于女人并不能真的伤害到自己；多半也不会因她的修为增长而获得力量，否则一开始没必要接话，大可等到自己威胁再开口。

这个女人第一次出现在梦里是2022年中秋之后。女孩依稀记得自己濒死时脑中响起的笑声，确信和今天早晨听到的一般无二。她不知道在自己中毒昏睡期间发生了什么，考虑到女人必然是精通神魂术法的邪修，她也不想浪费时间猜测对方是如何进入她的识海。

但母亲之死会和她有关吗？难道不是莫名妙……

万秋关闭终端，停止联想，将注意力放到目前的决策上。

她决定不向学宫报告，先看看诅咒的情况再做打算；目前除Helena外并没人关注到她的异常，所以只需处理一下Helena。

活动课后是生理课。风和光走进教室时，见好朋友的嘴唇已不再苍白，正在认真地写明天的预习作业，看起来一切如常。但风和光依然认为朋友这回遇到的麻烦不小——她不需要什么证据，她能看得出；因此她谨慎地没有过去打扰，而是在课程开始后发送一条消息：

【阿秋，你今晚要约吐纳指导嘛？我看到一个教练最多可以负责两名学生，我们一起怎么样】

【不用。】

风和光记得万秋习惯设置免打扰，没想到上课时还秒回，便不好意思再发消息。她担忧地想着，如果朋友因为某些原因无法修炼，或者，也许更糟的情况，那我该怎么办？当阿秋不再高高在上，我还需要这样的朋友吗？

直到生理课结束，风和光依旧没有下定决心，只是推掉原本晚上的社交安排早早回到公寓，打算继续观察朋友的状态。当她把切好的小金桔放进冰糖洋甘菊茶里一起煮时，万秋走到厨房门口，显然有话要说。

于是风和光先开口，“你要……再试试吐纳吗？”

“我的识海里觉醒了自己的前世残魂。”万秋平静道，“我之前食物中毒后就能在梦里看到她，但今天吐纳时才能和她交流。她向我说了许多事，包括我从前留下的洞府，以及陨落的原因。”

饶是风和光已预设不少种可能，此刻也不自觉微张着嘴忘记合拢。

“我查过死后与转世的研究，学界目前说法不一。她对我没什么威胁，但和她交谈让我有些头晕。今天早晨许无忧和我去医务室做了检测，校医看不出她的存在。不过，我想过几天我就会适应这种交流。以后我应该会去前世的洞府拿到我留下的那些东西，相应地，也会让之前的仇人付出代价。那个人现在还活在九州，很有名气。所以这会是很危险的计划，如果暴露一定会引起学界的注意。我必须尽可能小心。你如果不想参与——”

“阿秋！”风和光凛然道，“我们是最好的朋友，我当然要参与！”

“但是——”

“我知道，但正是因为有危险，我才不能让你一个人去做。阿秋，我们从小一起长大，一直都是你保护我、照顾我，现在，虽然我可能帮不上太多忙，但……但你知道的，你让我做什么，我就愿意做什么。”

万秋静静看着朋友的眼眸一点点因泪水而变得晶莹。

风和光不会让眼泪流出眼眶，她知道万秋讨厌过分煽情，“不过，如果你觉得还是一个人做事更好，我也不会缠着你。我可以去交新朋友，你不用担心，我绝对不会把你的事告诉别人。等你什么时候需要……”

“我会告诉你的，如果有你能做的事。”万秋淡淡道。

风和光欣喜地关掉火，将煮好的茶与两盘香草云朵戚风蛋糕、一小碗白玉樱桃、两杯柚子青梅雪葩端出厨房；看来忠诚依然是最有效的手段，如果不够有效，那就是我表现得不够忠诚。

万秋怡然地坐在圆几边等待宵夜。

有的危险会令人想要退缩，有的危险会令人渴望前进，其中的分别她一向把握得很清楚。为了在朋友面前保持自己的威信，她需要一些谎言。

È molto più sicuro essere temuto che amato, quando si abbia a mancare dell’uno de’ dua.
