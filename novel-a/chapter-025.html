第一节联谊课，万灵花掉0个金币就因遭遇死亡风险被三青强制传送出联谊区。

女孩午休时间独自躺在草坪上回忆自己的经历，认为失败之处在于没有积极参与联谊，且不自量力地和狼赛跑。但她不觉得这次经历是完全失败的，至少被送出联谊区前的近两小时里都过得很开心。

整理挫败情绪后，万灵调出屏幕查看★里的榜单。

总榜第一是庚区，钱币已花52枚；随后是丙区29枚，癸区26枚，丁区排在第四，21枚。

再看分榜，丁未班第一，13枚。丁丑班位于六个班中的倒数第二，钱币已花1枚。虽然丁卯与丁巳也是1枚，但榜单下的解释说，同样的数额，花出去的时间更早，排名会更靠前。

万灵对榜单结果感到好笑，也稍微有些恼火。庚区那些学生不太像纯靠运气；看来联谊确实存在规则，并且没那么难找到。

然后她点开app右下角的红点，发现系统提示获得新道具——是一张地图，备注写着【勇者心之所向 行者路之所归】以及【道具信息不可与他人分享】。

这种道具是要遭遇死亡才会获得吗？万灵不确定自己的行为是否可被评价为勇敢，但得到反馈让她心情变好。

道具地图是一幅手绘地貌素描，没有任何文字、数字或线条标注。右下方是大片蔚蓝，海岸线长且蜿蜒，她不知道自己刚刚在哪里；中部靠左是白色的高瘦三角，应该是雪山；除此之外几乎都是深浅不一的绿色区域，大概是森林与草地；再放大些可以看到其间散落着一些晶蓝湖泊。

虽然好像没什么用，但确实是一张精致的纪念品。

欣喜之余，万灵不得不出发去上活动课。这天的课是丁丑与丁酉一起，丁酉班目前联谊成绩是2枚；也许可以问问幸运儿如何花出钱币。

活动课老师看起来没有想要传授任何人战胜野狼的体术，依旧让女孩们玩球。老师一离开，两个班的人就聚在一起讨论起联谊课。

“你们班谁花出去钱了？”

“我花出去1枚。”

“我也花了1枚。你们班是谁花出去的？”

“是我。”丁丑班唯一成绩贡献者竟是喻西子。

女孩们都有些出乎意料，“你怎么花出去的？”

“我进联谊区后是在树林里，然后我也不知道怎么办，就走了一会儿……”喻西子嗲声嗲气地讲道，“然后我累了，就坐在地上把钱拿出来数着玩。玩了一会儿，树上突然飞下来好多鸟……”

“什么鸟啊？是不是大~老~鹰呀？”从琮模仿喻西子的口音。

“不是，不是老鹰。是蓝色的羽毛的小鸟，头是黑的，叫起来声音很大。它们一直盯着我叫，我很害怕，但是也不敢打它们。我当时坐在一棵树下面，背后是树，前面都是鸟，我也不会爬树……”

“我会爬树。”

“没人问你。所以它们抢了你的钱？”

“我……我不知道它们干嘛要围着我，就问它们是不是要钱，我可以都给它们。它们还是叫，然后我就扔出去一个钱，它们就抢起来，然后很快都飞走了。”

“你要是扔出去100个钱，我们班就第一了！”

“不是，没那么容易。” 

“你怎么花出去的？”

“我初始位置在雪山脚下，然后听到那种叽叽的叫声，很像吹哨子，我就走过去看，发现一块大石头上站着一个特别大特别胖的有点像黄老鼠的东西，但是肯定不是老鼠，没有耳朵……”

“怎么可能没有耳朵？”

“让我问问金枢这是什么！噢，它说是土拨鼠！”

“土拨鼠有耳朵啊！”

“哎呀，我不知道，可能有耳朵吧，我没凑近看。”郑亭亭摇手，“我就看它在那站着，盯着我叫，还挺可爱的，我身上又没吃的，就想会不会它是一个妖修，我给它钱它可以自己买吃的……”

“妖修们的坊市要钱吗？”

“不知道啊，你问问金枢。”

“它说不能向学宫学生透露妖族信息，因为那个反作弊机制。”

“最后我抓了一把钱放在那个石头上，它过来扒拉半天，不知道为什么只拿走1个就爬到石头后面不见了。我又在那里站着等，以为它还会回来，结果我站了一个多小时，什么也没等到，就又在周围走了走，但是也没遇上其他动物。”

“要是遇上一群，说不定每只会拿一个？”

“也不是，我就遇上一群，直接把整个袋子给它们了，结果最后还是只花出去1个。”施泽开始叙述自己的经历，“我也出现在雪山旁边，一个山洞前面，山洞里很黑，我全靠终端屏幕照亮，然后里面有一群黄毛小老鼠，都往我这边爬得很快，有点瘆人，我就跑到山洞外面，它们也叽叽喳喳地跟出来，我发现它们手里都拿着小树枝还有草什么的，还有也拿着钱的。我看到之后觉得肯定是妖修学生，赶紧蹲下和它们说话……”

“它们会说话？”

“它们应该是在互相说话，但是我听不懂，咱们这个翻译器还是不够好，不翻译老鼠话。我就把钱袋放在地上，它们有一个过去看了，但是没拿钱，只是一直叫。我干脆也趴在地上，学它们那个吱吱叫……”

“它们听懂了吗？”

“没有！怎么可能？我和它们对叫一会儿，一个老鼠突然蹿过来把我头上的发卡拽住，我站起来甩它，但卡子还是被它抢走了！我就拿那些钱扔着打它们，它们就跑了。最后我还得自己把钱捡起来，发现只有99个。该死的老鼠，我头发给拽掉好几根。”

“你这个听起来是真的妖修。我怀疑我看到的只是一只普通土拨鼠。”郑亭亭感慨。

“你们为什么都没花钱，是没遇上动物吗？”喻西子疑惑道。

“我遇到了啊，我遇到熊，幸好没觉得疼就出来了。”

“我遇到一大群羊，直接被撞飞。”

“我被鹿撞飞。”

“我除了蚂蚁什么都没遇到，蚂蚁咬我胳膊，但是三青没把我传出来，我还得自己去医务室拿药。”

“咱们今天下午要想个办法。”云共影打断众人的抱怨，“可以先问问丁未班的人，她们不是分榜第一嘛。”

“我已经问了丁未的朋友，”施泽耸肩，“她们班有一个人也是稀里糊涂花出去1个，剩下12个不知道是谁花的。”

“不知道是什么意思？又没有个人榜，瞒着干什么？”

“我朋友说她们觉得是那个谁花的，但是没有人问她，你要去问吗？就是记了两次过那个。”

“两次？”

“前天灵理课的事，当时我们班和她们班一起上的，灵理老师从窗外飞进来给我们每人发了一颗夜明珠……”

“我们班发的是一套玉连环。”

“要是玉连环就好了，她不知道为什么把珠子塞到她们班一个女生嘴里，然后那女生被送去医务室了，后面都没再回课堂。”

“我天，只记个过？”

“好像助教在给上面的部门写报告，说不定会劝退，不过九州这里退学能退到哪也不知道。”

“可能会送去特殊教育中心，以前尘世时我小学班里有个自闭症的，后来就送去儿童精神卫生中心了。”

“我们下午到底怎么办？你们觉得【强圉千钧】的学姐会帮我们吗？”

“说了灵网有反作弊机制……”

“见到大动物就快跑，见到小动物就撒币？”

“要不要我们都戴点发卡？课间可以去坊市买点亮晶晶的东西，好像动物都喜欢那些。”

“不如现在就去呗，课间时间太短。”从琮摩拳擦掌，“反正老师也不在，我去问问助教能不能解散。”

Money and time are the heaviest burdens of life.
