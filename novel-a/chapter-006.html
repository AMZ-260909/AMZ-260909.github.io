宁蓁离开后，风和光知道莫寻秋已经没了玩耍的心情，便收拾起桌游用具。      

“阿秋，你别生气啦，我妈一直偏心莫名妙，看她突然不见难免多问两句。她平时是不这么多话的，你也知道，她一般不会烦你。”       

莫寻秋嗯了一声，“莫名妙被一个制片人收养，说为了拍大制作。”      

风和光手一顿，旋即笑道，“什么？没听说过拍电影还要收养演员的，听着不好笑吗？”      

两个女孩对视一眼，彼此都读懂那种微妙的意味。

风和光开始格格笑个不停，害羞但又溢出快意。莫寻秋没有笑；她突然想到一件毫不相干的事——她不讨厌好朋友笑，大约因为她总是知道对方为什么笑；如果我能知道妹妹为什么笑，我还会恨她吗？      

也许还是会。毕竟她不止一次试图杀掉我，而且每次都差点成功。      

在得知仇人的遭遇后，风和光一扫愁闷，开始转播八卦，“阿秋，我好像知道我舅舅当年为什么要和我们断绝关系，原来都是因为我舅妈。昨晚我在我外婆病房里躺着，我舅舅和我妈以为我睡着就说了好多话……原来我舅妈生我表妹后不知道出了什么意外，反正整个人愣愣的好几年，估计和我外婆差不多，我妈说这都是报应。我舅舅这人也好神，一开始为了我舅妈和我们断绝关系，现在和我舅妈分居又来找我们，真怕过一阵他又把我们赶走……”

“你可以来找我。我不会被赶走。”      

风和光莞尔，“那我妈怎么办？”      

“她自己没有朋友吗？”      

“我妈说打算去我舅舅公司上班嘛，应该会给自己找点退路……”      

此时又有人走进病房，风和光连忙打住话头。原来是宁臻说Gian那边的人已与他联系云云；莫寻秋父亲的身份让宁臻对这位病人的态度大为转变，甚至有些客气得过分。

他还带来一个消息，说莫眉的姐姐和弟弟明天会来扈城一趟，“他们问起我你父亲的情况，我暂时说不知道，你到时候和他们聊吧。”

风和光在舅舅离开后感慨道，“莫阿姨竟然从来没提过他们，是吧？大概不像你爸那么值得一提。”

莫寻秋认为朋友对他人的推测向来准确，果然这次也不例外。莫盈与莫朔姐弟对待扈城的一切都疏远且局促，谈起莫眉时往往顾左右而言他，在得知这位外甥女今后将由生父负责后明显长舒一口气，当日就改票离开扈城，除莫眉的骨灰外什么都没带走。

相较之下，Gian的团队热情并专业许多。那天宁臻亲自领着七八个衣冠楚楚、大多不是亚裔面孔的女人走进病房，两个女孩原本正坐在沙发上一起看Everything Everywhere All at Once，见此情景都很快明白过来。

风和光不由自主想站起身，但朋友还捏着她的手腕；不过很快，莫寻秋已松开手并走向人群。      

这群人除却专门为此事而来的律师和法务外，还有两个生活助理、一位私人医生以及一名富有经验的儿童看护，这四人更专注于莫寻秋本身。

她们向她展示许多Gian和Leora，以及Georgina和Audra的照片与视频；并收集新家庭成员对房间布置、食物口味等各方面的偏好，承诺会陪伴女孩从莫寻秋一点点变成Juno Vane。      

而风和光在不久后发现莫名妙也变成了MiMi Mariner，“阿秋，你看这个。”

Juno接过朋友的手机，见妹妹在视频中激动公布自己将作为主角之一参演影片V3NUS的消息，后面是媒体号主对MiMiMeow的身份介绍：原来她是John Mariner最小的女儿。而John Mariner，即影片的出品方，则是一位著名的加拿大籍华裔导演，全球累计票房达数亿美元之多。

“看起来她很适应新工作。”风和光适时地补充一些朋友爱听的话，“希望新的最小的女儿别出现得太快。”

“嗯。”莫寻秋扫一眼就关掉屏幕，“我们现在去公寓。”

“现在？你也和我一起去吗？我去和Amy讲下。”

莫眉案在十月的最后一个周一按扩大自杀结了。莫眉的父母早已签字表示不要遗产，而Gian转告Juno一应财物都由她全权决定。女孩本打算把自己房间里的东西都留给朋友，其他则让律师去和莫盈与莫朔交涉。

但她现在改变主意。毕竟凶手还活着，她需要证物来提醒妹妹整件事从哪里开始。

公寓里的桂花甜味悉数散尽，由于被彻底搜查过，各处都显得陌生。莫寻秋走进莫名妙的房间带走一件睡衣；那件曾是她的衣服已被宁蓁洗净烘干后叠得整整齐齐，虽然风格与妹妹花里胡哨的睡裙迥然不同，但一并挂在衣柜里竟并不违和。      

风和光则在朋友的房间饶有兴趣地看这看那，就像她每次来这里一样，“阿秋，这些你真的都不带走吗？”      

莫寻秋应了一声。她相信风和光能把承载两人记忆的物品重新变得整洁熟悉。等待朋友收拾东西时，女孩走到房间被扯开的羊绒长帘旁默默望着窗玻璃上的倒影，思考莫眉是否还站在窗外。

“这阵医院人太多，我都没法和你好好说话，虽然她们给我们很多自由空间，但是，感觉怪怪的。我感觉那个心理学家好像觉得你……你觉得她会和你爸爸说吗？虽然她说不会，但是我觉得她会。”

“Gian不会在乎。”莫寻秋知道，如果在乎，父亲会亲自过来。但他甚至没和她单独通话过。

“哦对，我舅舅不是一直没带我去见我舅妈或者我表妹吗，但我之前问他我表妹在哪里上学他说是在长虹，和我们一届。我最近和朋友们打听了一下，我那个表妹，宁涉雪，真的好奇怪，她从一年级就戴着口罩，那时候还是2019年9月呢，好像听力和说话也有点问题。学习还行，但是人很内向。怎么样？我妈昨天听我说完后好像终于完全原谅我舅舅，好好笑啊我妈。”

“嗯。”

“你有没有问Georgina和Audra的妈妈是谁？她是怎么去世的？她们都和你是同一年生的，对吧？你爸爸真是——”一向很擅长说话的风和光也有点不知道该怎么形容。她从小就羡慕朋友的家境，又有点庆幸自己不是莫眉的女儿，如今Gian同样让她羡慕又庆幸。“感觉他和我舅舅差不多，都很神经。”

“嗯。”      

察觉莫寻秋在走神，风和光走过去与她站在一起，“阿秋，你在看什么？”      

“你认为世界上有鬼魂吗？” 

“说不定有吧。好像很多人会梦到死去的亲人。你梦到过莫阿姨吗？我看到网上很多人都说过这种。”      

莫寻秋那一瞬间几乎想说出自己的秘密。她在这次大难不死后出现一件后遗症；她没告诉医生，因为不太相信对方，即使她感激他们。她也尚未告诉朋友，倒不是因为不信任，毕竟关于Gian的事她从没瞒过风和光，但这件事与Gian的事不同，与之类比的是被母亲打骂、差点被妹妹杀死和那个未命名文件夹，她会倾向于保密。

忠诚是一种需要精心修剪信息来栽培的植物。

所以最终莫寻秋只是摇摇头，“我不相信鬼魂。”

从身旁女孩担忧的眼神中，她认为对方已经看出什么端倪，只是并未说破。不过莫寻秋很认可这一点：朋友永远把忠诚放在好奇之上。

而风和光的想法则是：在莫寻秋面前，忠诚总是比其他任何手段更有效。

这对默契的朋友很快就要分离。

两天后的11月4日傍晚，Juno从扈东机场私人航站楼起飞，预计11月4日深夜到达Westchester。

“等明年暑假我就去看你！”

“你不如现在就一起去。”

“其实我想。”风和光破涕为笑，“也许等你春假我就可以请假去找你。而且我打算去美国读高中。或者初中就去，但不知道我妈会不会同意。哎，不过不管怎么样，我们……我们……你说我们还会一直这么好吗？”

“会的。”

风和光想再得到些保证，但助理在休息室门外提醒她们注意时间；于是两人匆匆又重复几遍最后一回合对话，然后Juno起身向停机坪走去。

What is a ghost? One who has faded into impalpability through death, through absence, through change of manners.
