    <script type="text/plain" id="chapter-text">
“她死了。”莫寻秋抢先道。
      
风和光没有否认。默然中，宁蓁和医生一起走进房间。
      
宁蓁在接到莫寻秋苏醒的消息前一直坐在母亲床边。虽然护理人员们把母亲照顾得极好，并不需要她的存在，但她感觉无其他处可去；对于哥哥的出现和莫眉的死亡，女儿远比她适应更快。这个结论让她宽慰但孤独。
      
她脑海里循环慢放9月9日下午擦肩而过的两秒；之后第二天是中秋，她拒绝宁臻一起过节的提议，而是打算和女儿一起做点传统菜肴庆祝，毕竟母亲得到妥善治疗总归是件好事。整个白天过得飞快，她时不时走神，被过去和未来反复拉扯。傍晚，风和光突然说有一本很重要的习题册被莫寻秋误装带走，她得去拿回来，顺便可以给朋友送点节礼。
      
当时宁蓁神思不属，觉得出去透透气也好，就随女儿一起去到莫家。她们先敲门，但很久都没人应声。风和光向她要门禁卡；宁蓁觉得这样闯入雇主公寓不太好，但女儿一反常态地坚决。
      
妥协后，两人一开门就闻到屋里充斥着刺鼻的酸味，而从拖鞋的状态可以判断莫眉此时在家；宁蓁尝试解释道歉，俱无任何回应。
      
莫眉的房门留着一线。莫寻秋的房间照常锁紧。莫名妙的房间空荡荡一览无余。
      
风和光喊着“莫阿姨”，一边往莫眉的房间走去，在门口时开始尖叫。
      
宁蓁不想过多地回忆门后的画面。她们报警，然后一起用椅子砸开莫寻秋的房门，打宁臻电话送昏迷的女孩去医院。后来的几天，她机械地回答许多问题，并尽可能缩减关于三个孩子的部分；她早在7年前就决定最大程度保持沉默，如今依然坚持自己的选择。
      
莫名妙的去向没有被提起。宁蓁对此不做任何假设；她精神状态极差，无力好奇。
      
而莫寻秋现在看到她却只是照常淡淡地一瞥就收回目光，并无哀戚神色。
      
这孩子一定还不知道她妈妈的事。宁蓁从不觉得自己有资格同情莫寻秋，但很多事都迅速不知不觉地改变。
      
医生确认病人状态稳定。医生离开。病房剩余三人一站一坐一躺。
      
“你妈妈……”宁蓁艰涩地开口，“莫小姐她……”
      
风和光柔和截断道，“妈，阿秋刚醒来，她好累的，我陪着她就好。你这几天为了莫阿姨的事忙里忙外，也去歇歇吧。如果需要找医生，我会按呼叫铃。莫阿姨的情况我和她讲。”
      
于是很快病房又只剩两个女孩。
      
莫寻秋问风和光自己的手机在哪里；风和光从一旁自己的书包里掏出一个银鼠灰毛毡内胆包，里面是莫寻秋的笔记本电脑、手机和iPad，手机电量是89%。
      
“时间紧迫，我没来得及多装你的东西。我妈不知道，别人也不知道。”
      
莫寻秋才确定自己并不在另外的世界。好朋友还是时时忠于自己。
      
“你舅舅是怎么回事？”她一边检查邮件一边问。
      
风和光早编好一套应付的话，“天晓得，哎，他上周五晚上突然跑来我家找我妈，吓得我和我妈一跳。我妈从没和我提过他，不知道从哪里找到我们的。不过他挺有钱。我妈告诉我，她认回我舅舅是为了照顾我外婆，还有为了我读书上学。谁知道呢，这几天她总和我舅舅吵架。真是乱得一塌糊涂。你要是再不醒来，我……唉。”
      
莫寻秋不置可否地听着。
      
看朋友没接话，风和光又继续道，“不过幸好我舅舅有钱，他现在对我们还很好。不然那天我真不知道怎么办。你一整天没回我消息，我去你们家看到莫阿姨在床上，吐了好多，可能是食物中毒，我妈赶紧报警……现在调查结果还没出来，但是医生说你送来的时候血里好几种药物含量都超标，什么艾司唑仑、舍曲林、曲唑酮……当时到底怎么回事啊？你为什么吃那么多药？”
      
“我没吃药。那天下午我和她一起吃了她煮的东西，然后我去睡觉，直到今天才醒。”
      
“天哪，莫阿姨……莫阿姨为什么要这样？她又喝醉吗？现在那边还没下结论，我觉得明天应该会有人来问你问题。他们也问我蛮多问题，不过我基本都说不懂。学校里的人都以为咱们密接然后被隔离了。以后你会去和你大妈妈住吗？其实我希望你……说起来，那个谁呢？我们去的时候没看到她。”
      
“她早就被送走了。”莫寻秋最不愿谈莫名妙的事，幸好眼下确实有比莫名妙更重要的事。“Gian回复了我的邮件。他说会让人来接我。”
      
风和光一时没反应过来，随后难以置信地凑头过去看那封邮件。莫寻秋把手机递给她。
      
“哦，你是说你那个在美国的爸爸，莫阿姨和你说的那个。我们还一起搜过他，是吧。他——他知道——他知道这些事吗？你之前说，你不想提前和他联系，我记得。”
      
“我不想。”莫寻秋肯定道；但是她不想自己成为下一个交易品。不过，她不会这么说。“我认为他应该知道这些事。”
      
“是啊，莫阿姨这样大的事，他应该要知道……”风和光声音飘忽，“他有别的孩子，是吧？我们讨论过的那个……Leora？我后来发现她之前有一篇ig post提到过sisters，所以他至少还有另外两个女儿，可能你爸爸又结过婚。我不确定，这种事很难说，他那边的家庭好像很复杂。你觉得你去那边更好吗？你真的想去吗？”
      
“我不在乎那些。”莫寻秋低下头回复邮件。
      
风和光识趣地没再追问，起身说去看看妈妈在做什么。她轻手轻脚地离开，把病房门关好，然后满心难过地跑进洗手间低低哭起来。
      
比起同龄的孩子，她已经有很多高超的技巧去达到自己的目的，比如伪装失手割伤自己、藏匿证物或者恰到好处地扮演各种角色；但依然有许多时候，她真诚地感到绝望。
      
十几分钟后，风和光出现在外婆的病房。她眼睛还很潮湿，但已习惯地微笑回答母亲的问题。宁蓁问了几句莫寻秋的状况，又问起莫名妙。
      
“阿秋说她被送走了，早就走了。”风和光蜷到沙发上，“妈妈，莫阿姨有没有和你说过阿秋的爸爸的事呀？”
      
这个问题她问过一次，并没期待会有不同的答案，只是女孩现在很想与妈妈说点什么。她之前听莫寻秋描述大洋彼岸的Vane Family一直以为是莫眉编的故事；但既然朋友深信不疑，她就不会拆穿。谁知偏偏是真的。
      
“我没见过她们的爸爸，莫小姐也不和我说这些。”
      
风和光并不在意妈妈的反应，声音越来越轻，“如果她没有爸爸就好了，我们可以收养她。我本来以为舅舅找到我们，莫阿姨又不在了，很多事会变得不一样。但其实什么都没变……我还是我，她还是她……”
      
“小凤凰？”宁蓁扭头，却看到风和光闭紧眼睛似已入梦。这几天孩子担心朋友的事，吃睡都不上心，今晚总算可以好好补觉。
      
帮女儿盖上毛毯，宁蓁又忍不住琢磨莫名妙的事；其实她十年前第一次上门就觉得莫家姐妹不是双胞胎。
      
莫寻秋的生日是11月5日。但莫名妙平安夜时身上还黄黄的，脐带结都没掉。除此之外，莫眉真情实感地抱怨过数次女儿因早产在监护室住了一个多月；莫寻秋那时孱弱瘦小，但黄疸已褪，符合这个说法，所以莫名妙自然另有来历。
      
宁臻开完会来探望母亲时，见外甥女蜷在沙发上熟睡，妹妹坐在扶手上垂头沉思，很像从前母亲与妹妹在家时的样子。这对疏远十年的兄妹这几日因处理莫眉的后事而亲近许多，宁蓁没有立刻离开，而是低声问道，“你这么晚还不回家？”
      
“我和她已经分居一年，现在几点回去都一样。”
      
宁蓁有些意外，“当时那个孩子……”
      
“是个女儿。和她住在一起。”
      
“她知道你把妈接到这里来吗？”
      
男人叹气，“她目前的情况，知不知道这些都一样……”
      
一番彻夜长谈后，宁蓁因郁结多年的心事了却而一觉沉沉睡到中午。她打算再去看看莫寻秋，却在电梯里遇到哥哥；后者面貌疲惫，眼神复杂，见到她就说莫寻秋的父亲联系了自己。
      
一番交谈后，宁蓁震惊，又想大约莫寻秋早已知道这些，难怪女孩从来都倨傲寡言。可她还是很难想象，莫眉怎么会与那种人扯上关系？
      
兄妹二人进病房时，精神尚可的病人正与风和光玩桌游，密密麻麻的棋子卡牌铺满小桌板，对来人视若无睹。
      
风和光则扬起笑，“妈，舅舅，你们来看阿秋？”
      
宁臻对外甥女微笑着点点头，又向莫寻秋道，“莫同学，你父亲那边和我联系过了，他说律师团队很快就会到扈城。”
      
“嗯。”
      
“我看医生说你恢复得很快，这两天在这里住得还习惯？”
      
“嗯。”
      
宁臻刚刚从妹妹那里知道莫寻秋话少，但没料到是如此惜字如金。他自己的女儿也不爱说话，但莫寻秋的沉默并无怯缩之意，而是旨在暗示对话者知难而退。
      
于是宁臻简单与这位贵客寒暄两句就草草离开。宁蓁还站在风和光身后，手搭在女儿肩膀上，似乎有个支点才可放心地去看莫寻秋。
      
“阿秋，你知道妙妙被谁收养了吗？”
      
“不知道。”
      
“啊，那也是的，你还小嘛，收养手续肯定是莫小姐办理。我只是想，你会不会有见过那家人。或者听你妈妈，要不妙妙她自己提起过？”
      
莫寻秋反而问道，“宁阿姨，你见过她的亲生父母吗？”
      
宁蓁不防女孩揭穿莫名妙的身世，“我没见过，你们两个不是双胞胎吗？妙妙是莫小姐收养的？”
      
“嗯。”
      
“妙妙是什么时候搬走的呢？”
      
“不清楚。”
      
“妈，阿秋又不是妙妙的经纪人，你问这些做什么？人家莫名妙是大明星，你还怕以后看不到她吗？她肯定很快就会更新社交媒体的。”
      
宁蓁也就顺着女儿递的台阶不再多问，讪讪一笑离开。她手机早晨收到信息，说警方和社工下午会来询问莫寻秋的情况；由于莫寻秋暂无法定监护人，宁蓁作为与她关系最亲近的成年人要陪同询问流程。
      
但她认为明天人们不会问出什么新消息，最后的结论想来会是莫眉患精神疾病已久，且一贯滥用药物，中秋时打算自杀，并试图带着女儿一起。
      
这个结论和那名飞扬跋扈、纸醉金迷的女人可以说毫不相干；莫眉有段时间确实吃过精神类药物，但那是她们刚认识不久的事，而自从莫名妙带来泼天流量，此人就开始重新热爱生活。
      
不过，宁蓁转念又想起十年前三个女孩轮流在自己怀里吃奶的场景。
      
如果一场谋杀案有凶手，最好的情况是凶手已经死去。她应该放弃思考，保持乐观——
      
莫眉一定是自杀。
      
'Tis folly to be wise.
