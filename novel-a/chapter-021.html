    <script type="text/plain" id="chapter-text">
周三早晨，结束吐纳的万灵起身向文化课教室走去。

进入九州这些天里，刚开始有几个热情的同学邀请她一起行动，但后来几天就不再有人主动向她搭话。

对Leora Vane而言，不被他人围绕的感觉很新鲜。

后来她尝试在活动课课间主动对某个女孩说话，对方简单应答后就转去和朋友们玩耍，把她放在一边；自然课上的双人小组活动没有人争着要与她同组；在生理课上她举起手想回答问题，老师却选择另一个和她同时举起手的同学……这都很新鲜。

昨晚她突发奇想在放学后去校区里信步闲逛，不知走了多远后发现一片沉眠在茵草中的湖泊。那时天色昏昏，坐在湖边恰好看得到一点孤星低垂在天边。偶尔有女孩们嘻嘻哈哈的喧哗远远地被风送来，又紧接着被风卷去。万事万物只是路过，连草与湖的喁喁也不专说给她听。

新鲜感自此开始变得有点复杂。

尤其是她的独来独往并非完全出于自愿。必须使用翻译器和大部分同学交流是主要原因；翻译器可以让她跟上课程进度，但无法抹平闲聊中的文化背景差异。所以，今天的文化课可能也是个很大的挑战。

偏偏周三她们是和丁未班一起上课。刚刚心法课万灵就看到对面人群里的MiMi。女孩课间一直在玩终端，全然没有和任何人交流的打算；文化课前也是如此，连讲师走进教室都不抬头。

“丁丑班和丁未班的同学们，你们好。我是谈素，这学年的文化课我会和大家一起度过。你们应该已经上过心法、生理、活动、自然这几门课，但文化课与它们都不太一样。因为这是一门非常灵活的课，是在我们所有人的参与下自然生长的。噢，我知道教学大纲里面规定得很详细，对吧？”

谈素做了一个夸张的飞踹动作，“那从现在开始把大纲踢出去！”

女孩们都被逗笑了。有几个人开始鼓掌喝彩；两位助教显然都不是第一次与谈素合作，不仅没有惊讶，还带头打起响指来。

“谁能规定文化是什么样子？文化是什么学科？Cicero说它是cultivation of the soul，Pufendorf说它是all the ways in which human beings overcome their original barbarism and, through artifice, become fully human。这么说来，作为修士，文化应该归类去神魂法术。但这是开玩笑，文化不是任何术法，相反，任何术法都属于文化。不仅如此，一切知识、信仰、艺术、道德、法律、习俗和任何非自然所有的事物，都是文化。文化是你们穿在身上的衣服，是你们烹饪出的食物，我们从别人那里学来，我们又把它流传下去，因此我们本就是文化的一部分，文化是坐在这里的每一个人。

“这堂课剩下的两个多小时交给你们，现在我随机点一个人来回答一道选择题：你是更愿意长出一双可以飞去任何地方的翅膀，还是更愿意长出一双不会迷路的脚？没有对错，但必须给出能说服我的理由。然后我会继续点下一个。

“你们要尊重正在答题的同学，仔细地听每个人在说什么。这很重要。非常非常重要——如果你们不想挂科的话。”

谈素露出意味深长的笑，微微冲着惊讶的女孩们点头，“对，这门课是有可能挂科的。教学大纲说不会，但它已经被踢走，所以救不了你们。抱歉。现在让我看看名单……好名字，就你吧，莫名妙。”

丁未班的大部分同学都交换着等看热闹的兴奋眼神。

虽然来九州还不到十天，但莫名妙已经惹恼超过二十人。

她们的助教禹惜时有点紧张地直了直身体，随时打算站起来制止某事的发生；虽然她不知道会发生什么事。

前天周一的心法课上，莫名妙突然把身边的同学一个个推搡得退出入定；生理课上她大声问老师一些让对方都无颜复述的问题；活动课上一位早晨被影响吐纳的同学找她理论，被她掰断两根手指，于是莫名妙拿到这届的第一个记过处分。

绝对不会是最后一个。谁都看得出。

莫名妙没有站起来（也许这是一件好事），只坐在原地笑嘻嘻道，“我不记得你问的是什么，你想不想再说一遍？”

谈素没有恼怒，放慢速度又重复了一次问题。

“我不想再多长两只脚，那我就有四只脚了，很奇怪。我选择长翅膀。”

“所以对你来说，多长两只翅膀，比起一共四只脚，更不奇怪？”

莫名妙有点摸不着头脑，就点点头。

“很好，这就是文化影响我们的一个典型例子。一个人，长两只翅膀，这样的形象广泛存在，比如天使，比如精灵。但再长一双脚的人——不是半人马那种四只马脚，是四只人脚——这样的形象我们却见得很少，所以会觉得它更奇怪。莫同学，你以为你在做一个属于自己的判断，但其实是几千年来的人类们共同替你做的判断。文化常常就这样住在我们的直觉里，假装是我们自己发出的声音。好，下一个同学……尤宜夏，你更愿意成为一个身高五米的人，还是一个身高五厘米的人？” 

提问有条不紊地进行着。

终于在第42次看向名单后，谈素喊出“万灵”。

万灵严阵以待。

“如果你现在穿上了一双会让你不停跳舞的红鞋子，你觉得什么东西会让你停下来？”

“我自己。”

“那么，理由？”

“如果我不停跳舞，这不是因为鞋，这是因为我想跳，或者，我不知道如何停下。所以，如果什么东西让我停止，那会是我自己。以后的我自己。”万灵的华语讲得不好，但并不因此露出羞惭之色。

“你说服了我。”谈素微笑着肯定她的回答，但并未过多评论，转而继续提问下一个人；同学们也并没显示出惊讶。人们的注意力很快从她身上移开。万灵第一次课堂发言就这样如孤星一般不留痕迹地飞快划过天幕。

她说不上是不是有点怅然。

午休时，她依然漫无目的地在校区里散步；之后是活动课，和前两天一样，学生两人一组自由组合，练习排球垫球和相互传球。今天的活动老师照例在布置下任务后就离开，说是一会儿回来；但周一周二的那两位老师回来的时候都是来宣布下课。

不得不说活动课是目前为止最自由的一门课。昨天大部分同学都在上课十五分钟后忍不住开始自由组织游戏玩耍起来。助教没有制止；看起来只要没发生什么了不起的事，她们不参与课堂。

万灵看到丁未班的同学都离MiMi远远的；后者正在把排球当足球踢得到处滚，有几次球不可避免地撞到其他学生的脚上，但女孩们都立刻避开，没有发起冲突。莫名妙似乎为此感到无聊，便停下来茫然地扫视四周。

女孩的视线在万灵身上停落又移走，并没有什么反应。

看来她也还记得我不是Juno。万灵想，一边好奇MiMi怎么做到这么快就被班里所有人排斥。思及那杯果汁，似乎也是顺理成章……

“喂，你别过去，她前天活动课弄断了别人的手指。”

万灵感谢从琮的提醒。这位同学和她住一个院子，算是目前与她对话最多的人，勉强算半个朋友。她从善如流地停止向MiMi走去，转而加入从琮和另一个丁丑班的女孩相互传球。

半个多小时后，女孩们相伴着接水喝，一起坐在休息区聊天。原来从琮和云共影在尘世就认识。

“幸亏我们来九州啦，不然这会儿肯定还在上学。”

“我当时想，反正是上学，学魔法肯定比学数学有意思。”

“但是我们也学数学，在这里。”万灵笑了，原来还有不擅长数学的华裔女孩。

“就两节课，比我们原来少多了！而且作业肯定也不多，自然课和生理课还有文化都没布置作业。”

“万灵，你都不会讲华语，为什么当时会选择来九州啊？”云共影向万灵问出新生破冰top 1的问题。

“The bird spoke English and naturally I completely forgot to ask her that.”

“哈哈哈哈哈，其实我也忘了问很多问题，结果来了发现这里没有我想得那么好玩，我以为活动课我们会骑着龙然后……呃……”

“Play catch?”万灵尝试帮她接上想不出的部分。

“不，不，传球没意思！”从琮连连摇头，“说起来，一会儿我们玩点什么？万灵，你之前在美国和朋友们玩什么啊？”

万灵略一思索，发现她从前的游戏几乎都需要专门的场地和器材，“How about... one person passes it to another, with a third person in the middle. If the person in the middle gets the ball, they switch places with whoever threw it. And if the ball hits the ground, whoever touched it last gets a penalty.”

“啊，那要罚什么？”云共影听到一大段翻译有些迷茫。

“什么都可以，到时候再说吧。”从琮已来了兴致，“我先和我姐一组，你在中间。”

In the spring, at the end of the day, you should smell like dirt.
