十几分钟后，从琮和云共影坐到万灵旁边。

“万灵，你今天怎么走得那么早，我们都没来得及和你合照。”

“我就让你戴着兔耳朵来上课嘛，现在不就能和她照了？”

“Hey Doc,”沈飞觞显然是从会场直接赶来，只将紫罗兰纱裙外套了件校服上衣，在云共影身后坐下后便笑嘻嘻地去捏兔药师的耳朵，“your ears are fire.”

“别说了，我现在条件反射就想接台词。”

“你一共就那几句，又不唱歌，有什么紧张的。我基本从头唱到尾，后来还和June又唱了好几遍#5。对了，万灵，你怎么这么早就……”

“Violet，你怎么还在不停说话？不是说震得头晕？”尤宜夏加入她们，同样先问候云共影，“Yo Doc, your ears are fire.”

“刚刚窦老师给我从医务室领了药……”

几名主演聊得其乐融融，直到上课才各自坐好吐纳。MiMi几乎和老师同时走进教室，但并没向丁丑班看一眼。万灵回想起今晚丁未班的节目是走马灯定格默剧，女孩在舞台上看起来也如现在一样恹恹的，俨然一名对剧情毫不关心的群演。

谈素一周前就宽宏大量地通知中秋次日免课，Rose也说今天的活动课改为自由练习；所以结束吐纳后直到下午三点前万灵都没什么事。她决定趁此去找MiMi，便尾随女孩离开心法教室。

Like a desperate weirdo.万灵思考着如何开口才能显得更不像在骚扰对方。我保证这是最后一次。只是问问她这部音乐剧怎么样。避免任何私人问题。

【I wanna talk to my crush without making it awkward. What’s a good opener?】

【Leora，我是灵网助手玉枢。中秋第二天其实是个很好的机会呀，可以这样开场：

“昨天过得怎么样？突然发现好像还没跟你说中秋快乐，虽然已经第二天了！”

这样既应景，又很自然，可以轻松展开聊天。】

“MiMi，早上好，and中秋快乐。昨天过得怎么样？”

莫名妙紧张地停住脚步。

看来这就是我最后的一天。她一定要问那个问题；虽然不知道为什么，但她也许什么都已经知道。我彻底要完了，我会被抓起来送回尘世，或者也许会被关进魔法监狱去。

“Chill, I’m not stalking you. I just wanted to get your take on last night’s show. By the way, did you happen to see our class perform?”

女孩怯怯地点头。

“Oh, awesome! I thought you’d left early. So what did you think of this musical? I wanted to make it more pop, you know, kind of like a concert. Band onstage, no fourth wall, every number its own banger. Kind of like SIX but with fewer beheadings.”

“Why skimp on the beheadings?”

看到MiMi露出笑容，万灵也随之微笑，“我计划过写一个残酷的结局，但是助教和同学们竟然不许。”

“你的华语变好了。”

“我一直在坚持不懈地……和玉枢练习。”

莫名妙为Leora能说出包含成语且顺序正确的话而惊讶，暂且忘却恐慌，“我当时学英语都没这么快。”

“我说得更好，但是不会写，打字一般般。”

“那些华语歌词也是你写的吗？”

“我的朋友Gwenie帮我修改华语部分，在我完成初稿之后。她就是那只兔子。”

“Her ears are fire.”

看来她至少看到#8。万灵计算着，“你最喜欢哪一首歌？Funny thing is, I actually wrote a few songs for you.”

“我最喜欢……呃……第二首，第五首还有最后一首。”

好吧，我早该知道她的华语也不怎么样，毕竟她父亲似乎也不说华语。

万灵决定直白地提醒对方，“Glad you stuck around. How’d you like #4? It’s the same as the musical’s title and we brought it back for a reprise.”

莫名妙重新开始紧张。她本来以为Leora是要兴师问罪，但好像不是；可为什么非要提和药有关的部分呢？

“No worries if it wasn’t your thing. 这是我第一次写用华语的歌词，所以可能听起来不太好。”

我要承认还是不承认？莫名妙难以抉择，最后还是小声道，“不，我没有。”

“你没有觉得它不太好？”

“有点吧，我不知道。你为什么不让Violet和嫦娥被砍头？”

万灵努力跟上MiMi的跳跃思维，“So you’re a big fan of beheadings. Noted. Maybe next time. I mean, they didn’t really do anything that wrong, did they? The pill was her mom’s anyway. People are kinda making a big deal out of nothing.”

“你再用华语说一遍。”莫名妙疑心翻译器有误，或者自己的英文也许没有那么好。

“我认为她们没有做任何重要的错误。那颗仙丹是西王母的。作为西王母的女儿，Violet’s just a bit of a troublemaker.至于嫦娥，她已经被处罚。”

“那为什么你还说计划要给她们一个残酷的结局？”

“我可以说英语吗？”

“随你，”莫名妙急得直跺脚，“你说什么语都行。”

“This might be a bit too personal, though. Wanna find somewhere to sit and talk?”

莫名妙备受折磨地跟随Leora来到坊市，内心焦灼地听Leora点评各家甜品铺在白露时的番薯类小吃，神情麻木地坐在Leora指定的断头台上，满怀伤感地为自己挑选生命中的最后一杯酸V葡萄优优。

“Actually, this musical has a lot to do with my family.”万灵鼓起勇气敞开心扉，“Yeah it was inspired by what happened between you and me, but the way the main characters act around each other always reminds me of... my parents. I told you Jean died when she gave birth to my little sister, right? I don’t have any real memories of her. Everything I know about her life comes from my dad’s stories. One fairy tale after another. And when I compare different versions of those fairy tales, things don’t always add up. Sometimes the characters’ reasons for doing things are kind of vague. So I decided to keep those contradictions in the script, because I wanted to show something real more than I wanted to tell a story that made perfect sense. Honestly, Jean was like Chang’e to me and my sisters. Mysterious and perfect, almost like she was too good to be real. Maybe she was like that to my dad, too. But she had to pay for it in the end, right?”

“你本来想写死她？”

“No, all I said was that she took the pill, rose to the moon, and dissolved into moonlight.”

“那不就是死了？”莫名妙不满意这个结局，“你必须让她们在一起。”

万灵无奈一笑，“That’s what everyone says.”

莫名妙喝了一会儿饮料，见Leora默默不语，便主动道，“你为什么不问？”

“Ask what?”万灵还沉浸在自己的艺术构思中，“You mean why you’ve been avoiding me? You wanna talk about that? I kinda already know why so it’s okay if you don’t wanna say it out loud.”

她果然已经知道。为什么会这样？每次所有人都会知道。妈妈知道，姐姐知道，Leora甚至也知道。难道我周围有很多我看不到的镜头吗？她们为什么总是看我？

“是不是莫寻秋告诉你的？”

万灵其实还没做好准备谈论这件事，“I wouldn’t say she told me, but I think she left me two letters. Wanna see them? I brought them to NLA.”

正相反，莫名妙不想再多忍受一分钟，“我就知道是她说的。我就知道她已经……”

“MiMi, you don’t have to talk about Juno if it makes you uncomfortable.”万灵欣慰自己这次选择小隔间的明智之举，一面从包里掏出湿巾递给这个随时都会大哭的女孩，“Seriously, I don’t like her. And I’m not trying to ask you about her or anything.”

“你不在乎吗？她……她是你姐姐。还有……你妈妈……”

“这里是九州，MiMi，Juno已经忘记我们。我们也可以忘记她。至于我的母亲，那是Juno和她之间的，我不在那里。All I can say is, I feel sorry for her and all.但是现在，it’s just you and me here. Your feelings are all I care about.”

莫名妙听到这些令人心碎的话，难以置信地颤抖起来。Leora不该这样说，她想，如果我忘记她们，我就不再存在，我会连我所有知道的事情也失去了。

自从得知莫眉的死讯，女孩就开始恐惧Leora的眼睛；但愤怒中她惘然抬头，因而与幽灵的目光相触。

于是万灵看到MiMi像活见鬼般尖叫一声拔腿就跑。

【I must’ve messed up somehow. She just ran off crying.】

【Leora，我是灵网助手玉枢。

先别急着责怪自己，好吗？她哭着跑开，确实说明她此刻很难过，但这不一定意味着是你做错了什么。也许你无意间碰到了她不想提起的事，也许她本来就承受着一些你不知道的情绪。

不过，Leora，我想先问你一件事——她跑开之前，你们最后说的那句话是什么？】

【Your feelings are all I care about.】

【Leora，我是灵网助手玉枢。根据我与学宫签订的协议，我不得利用学生对我的信任，诱导其产生不当的情感依赖……】

No, I don't need your love, no, no. Can't let it get the better of us, no, no.
