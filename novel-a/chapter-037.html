    <script type="text/plain" id="chapter-text">
7月1日的活动课后是生理课，几个月来女孩们已经熟悉骨骼与肌肉如何工作，并进入循环系统，于是今天的操作部分是冠状动脉灌注。风和光十分主动地走来与万秋一组，露出一副有所求的热情姿态。

“阿秋……”

“我不演。”万秋无需预知也猜得到朋友后面的话。

“没有说要你演什么呀，只是闲聊几句嘛。你和小月亮今天进展怎么样？”

“已经改好第一曲。”

“你们最后选了哪个版本的曲子？我昨天听她素唱那几个版本还都挺好听的，除了宋调那个有点慢。”

“董谱。”

“噢，那我们要不要请董老师本人来指导？既然是她改编的。虽然我有点怕她，但是反正我不会和你们一起，她也管不到我。”风和光一边低语，一边灵巧地用镊子提起心脏模型主动脉的前端，另一手剪开根部的脉壁。

万秋将止血钳夹好，“你和尚弦月商量。”

“那我今晚问问她吧。不过我估计她会想请她的小唱课老师，如果需要的话。你们具体在做什么呢？”风和光将插管缓缓推入左冠状动脉，“我还以为选好一版曲子就好了，怎么还要改那么久呀？”

“嗯。”万秋将勒在血管外的线结收紧，然后打个反结，发现朋友还在等待自己说细节，便又补道，“要决定每个字的唱法。她之前唱的是昆曲，有的字需要配合她的习惯替换。”

“一个字一个字地改吗，那不知道十二支曲子要改多久。你们优先把【忆萝月】改好怎么样，我可能得练很久，而且我不好意思一开始就和如意她们一起练，我打算先找人教我几周，唱得差不多再给她们听。”风和光将第二根插管送进右冠状动脉，“说实话，我根本就不想演有唱词的角色，但是这个采莲的衣服比较好看，又可以和如意在一起。你觉得我能学会吗？”

确定两条冠状动脉都已结扎，万秋用三通把两根插管接上注射器，慢慢将红色颜料推进血管，“你中秋时唱小声些。”

“笑死，你就不能鼓励一下我嘛？”风和光莞尔，“阿秋，我还以为你变了呢。你还是这样。”

“嗯？”

“就是很可爱啊，哈哈哈哈，我不知道怎么形容，但是我觉得你这样挺好的。我本来以为你现在会说一些更好听的话，因为你不像在尘世那么讨厌和人说话了。不过我也很担心你认识太多新朋友，就不要旧朋友了呢……好了，够了，我觉得。”风和光用止血钳夹住插管开口处；万秋随之卸下注射器。

两个女孩一起端详做好的标本：血红色颜料沿左前降支和回旋支充盈开来，在心肌表面勾勒出细密的树状网络，末梢蔓成绯红的毛细晕染；右冠状动脉一侧也灌注均匀，并无断流或渗漏。

“没有新朋友。”

“什么？好啦，我知道，我其实知道。我……”风和光笑着把台面上的东西分拣着扔到废弃、回收与清洁三个桶去，“你搞得我怪不好意思的。课上说这个做什么。我只是觉得看起来你好像在交新朋友。” 

“没有。”万秋摘下手套，开始点开终端写实验报告。

“既然是朋友，阿秋……”风和光话说出口又有些犹豫，毕竟她从未大胆再三请求对方做不愿做的事，即使是在九州。于是她想了想还是改口道，“你觉得我改去演胡干娘怎么样？她们也都不想演这个。反正也是学一支曲子，虽然是长了点，还是独唱，我怕到时候唱砸。下面那么多老师同学，想一想就好丢人……”

“你不担心我唱砸？”

万秋自然不会唱砸，只是这几个月她对诅咒的观察有些新进展；她发现自己在集体事件中曝光越多就越容易招致意外，即使完全不使用预知也不能避免——这条负面影响似乎并非和预知紧密相连，或者说，更像在针对她而不是她的预知行为，与遗忘只针对预言相关场景并不相同。如果不是出于这样的顾虑，她会一开始就答应，但Helena非常重视这次集体活动，一直积极联络着大家挑选方案、打磨剧本、斟酌台词……

“你一定能做到，你总是什么都能做到。”

“嗯。”

风和光赧颜一笑，“那就谢谢啦，真不好意思，总是麻烦你。我保证会和项璎商量一下，给你把妆画得好看点，不要那么搞笑；你还可以改改念白，反正这段是你演，大家都不会有意见的。”

万秋颔首。Helena实在无需为这种微不足道的请求小心翼翼，她想。不过另一方面，她也享受女孩掺杂着些许敬畏的依赖，所以往往用沉默来保持现状。

下课后，解决一桩心事的风和光兴高采烈地告诉宁涉雪这个好消息，“阿秋已经同意演胡干娘啦，你看，表演真的没那么可怕，你就答应上台吧，不然伏遥还要不停缠着你劝你，你不是嫌烦嘛。”

宁涉雪感到震惊，“她不是，只填词？她会唱？”

“我觉得我的朋友里只有我五音不全。”风和光叹气，“我可能需要单独找个人教我那首曲子，你觉得舒远目和金同尘哪个好？舒舒和我关系更好一点，但同尘不太会嘲笑我，而且她们班节目比较简单所以更有空，舒舒还得练笛子，忙得很。”

同时提起金同尘和音乐，宁涉雪倒是想到一件事，“表姐，你在尘世，是不是有个朋友叫，Juno？”

风和光不由得微笑，又有些害羞，“你还知道Juno？那时候我和你说什么你都不理我，我以为你根本没注意我在说什么。”

“我那时听不太清楚。”宁涉雪不想承认自己在尘世时不太会说话；承认听不清似乎更好，因为自己听力确实有问题。“Juno会弹钢琴吗？”

“不会啊，你怎么突然问这个？”风和光疑惑，“阿秋没有学过乐器。笑死，我好像没告诉过你，因为我不知道你还记得那些话嘛，Juno就是万秋。你竟然不知道嘛，语言课她就是用这个名字。”

“周五，我和你们，不是一天上课。”

“反正你现在知道啦，你一定要帮我保密，不要告诉她啊。不过你怎么突然问起Juno的事？”

宁涉雪由于震惊，已暂时把金同尘的事抛诸脑后；既然Juno不会弹钢琴，看来是自己假设错误。她不想解释前因后果，便道，“我想起一些之前的事。”

“哎呦，你还记得多少？”

“一些。”宁涉雪也有点不好意思，诚实保证道，“我不会告诉万秋。”

“你不知道，她到现在还没有发现那些星星里有字。”

“什么星星？”宁涉雪确实不记得这段，“为什么星星里有字。”

“没什么没什么，是我的秘密。”风和光重新把话题放回中秋晚会，“所以你也上场吧。这次你没借口啦，阿秋也要上场表演。”

“哦，可能，是要去。”

“我告诉伏遥了哦，没关系，只是鼓阵而已，你记住站位和敲几下就行，我还得学唱昆腔呢，也很难。”

“为什么学宫，要求全体参与，好麻烦。”

“许老师和我说的是，中秋毕竟是团圆节嘛，如果大家分散着各自想尘世的事情，可能有的人会越想越难受，聚在一起排节目忙忙闹闹的就会比较好过。”风和光想到两年前莫眉之死，依旧心有余悸；唯独这件事她很难理解朋友的做法。

宁涉雪没有再接话，风和光知道表妹一定在想念舅舅，或者还有舅妈。她倒不奇怪对方选择踏道，如果她有那样的父母且又残疾，她也会想来九州的。舅舅大概现在已经和周阿姨结婚了吧，不知道舅妈会怎么样。

想到尘世，她又无法控制地想到莫名妙；也许那只疯猫正躲在学宫的某个角落……

“雪儿，你说，如果以后你身边有比表姐更亲的亲人，我们还会这样好吗？”

“啊？”宁涉雪宛如冬天在被子里窝着突然被兜头浇下一盆冰水，“我、我妈妈、爸爸都不在这里。”

“不一定是爸爸妈妈，或许还有别的什么亲戚呢？就比如，不是我故意惹你伤心，唉，我舅舅不是带咱们两个和那个周阿姨吃过一次饭么？周阿姨当时已经怀小宝宝啦，万一以后你又有亲妹妹，是不是就会把我丢在一边？或者如果你突然多出一个亲姐姐……”

 “不会，我，不理那些人。”宁涉雪虚惊一场，“我也没办法，多出一个姐姐。”

“你说得对，我有时候真的好幼稚。”风和光笑了笑，拉着宁涉雪的手重新轻快地摇晃起来。秘密总是这样会让人问出一些奇怪的问题，总会让人做出一些奇怪的选择，她想，可如果真相来到，一切会变得更好吗？

Truth, like light, blinds. Falsehood, on the contrary, is a beautiful twilight that enhances every object.
