    <script type="text/plain" id="chapter-text">
三个多月后，一架直升机降落在几座小木屋旁，气流荡出一圈圈苍金色草浪。当风和光摘下耳机跳出机舱时，Vane家的三名女孩已经从屋里走到栈道上，望着她们的私人导游走进停机坪与这位小客人及随行助理寒暄。
      
“风和昂！你好！”Soleil跳起来大喊，像前几天在Ōamaru看到几只小蓝企鹅从度假别墅的木台下钻出来一样兴奋，“You’re finally here!”
      
“Morning! Good to meet you guys.”风和光走近时像并没有刚经历十四小时的旅途一样精神饱满，“Soleil, did you get my gift yet? Do you like it?”
      
“She’s been wearing it everywhere.”Georgina将妹妹因奔跑而甩到背后的橙色望远镜拎到胸前，“Did you have the design engraved by a private studio? I don’t think Swarovski offers that service.”
      
“Yeah. One of my friends’ moms is an artist. She takes commissions sometimes, so I asked her to customize them for you. I came up with the design myself.”
      
“Your design is my favorite part.”
      
“For me, the best part is that you didn’t get one for Leora.”Soleil笑道，“I guess she’s gonna pretend she doesn’t care, but I’m absolutely telling her she didn’t make the cut.”
      
其实是因为望远镜是风和光为这次度假挑选的礼物，Leora此时正在加州搞原创音乐剧的演出，自然不需要这个。但她还是顺着Soleil道，“Exactly. Being in San Jose was a very serious disqualification.”
      
这句话让风和光成为Soleil在Minaret Station最好的朋友。早餐后，四个女孩决定沿着山谷徒步。沐着夏末秋初的凉风，她们一同踏过麦黄与青灰交织的草甸和靛蓝湖泊，在冰川融成的瀑布下的彩虹前拍照，听向导讲解这里的植被与动物。期间休息时，四人就一起用望远镜寻找远处山壁间一闪而过的红鹿；这些红鹿在下午的farm tour被女孩们更近距离地观察，此时正值幼鹿断奶的季节，刚分栏不久的小鹿焦躁地紧贴围栏踱步，关注着任何有可能是妈妈的生物。

“They look so sad,”风和光情不自禁道，“I wish they didn’t have to separate them.”
      
“I want to ride a deer around. Maybe that’ll cheer it up.”
      
“We’re not allowed to pet them here, Soleil.” Georgina温和地打破妹妹的幻想，“And they don’t like being ridden.”
      
“Then can I dress up like a deer and hang out with them?”
      
“They wouldn’t like that either. They have their own world. We don’t belong in it.”
      
听到姐姐的话，Soleil露出难得一见的消沉表情；风和光便安慰道，“Maybe we used to be little deer too. You know, like those stories about reincarnation. Maybe every time we’re born, we get to experience a different world. So if there’s a world we wanna go to, we’ll get the chance someday.”
      
“Helena, you really can’t come home with us? I can swap a musical prodigy for you.”
      
“I wouldn’t mind if Leora’s okay with it.”
      
当夕阳将山谷里的一切都染成亮橙和芋紫时，刚刚结束晚餐的Soleil收到Leora对此议题的回复：
      
【Tell Helena I’m on board with swapping you for her too. I mean, you’re not even a musical prodigy, so her family might get the short end of the deal. But hey, maybe someone out there would want you. Give it a shot. Good luck.】
      
“See? This is why Leora is so annoying.”Soleil将手机展示给风和光，“If I don’t talk to her first, it’s like she doesn’t even exist. But the second I do, it feels like I’m challenging her to a duel.”
      
风和光听到这句评价，忍不住笑着望向对面的朋友；Juno正平静地盯过来，看懂她的眼神后露出非常不赞同的表情。
      
“I wanna go in the hot tub when the stars are out. When does it get dark?”
      
向导认为九点之后才是观赏星空的最佳时间；于是女孩们决定先在壁炉前玩一会儿游戏。她们先尝试UNO，但Juno连赢四把之后Soleil就宣布想玩点别的。
      
Georgina在妹妹提出夜探丛林之类冒险活动前先问风和光道，“Helena, what games do you and your friends usually play?”
      
“Let me think...My friends and I have played this game where one person tells a story‘s ending, and everyone else has to figure out what happened by asking yes or no questions. And there’s usually some kind of twist.”
      
“Sounds kinda hard to follow.”
      
“Why don’t we let Tui tell the story, and we ask the questions?”Juno示意向导过来，后者听完规则后表示很高兴为孩子们编一道具有本地色彩的谜题：
      
“They protected us to kill us. When the protection ended, they killed more.”
      
“That’s such a scary story!”Soleil率先发问，“Did this happen here?”
      
“Yes. Very close to here.”
      
这下女孩们明显变得更加投入。Georgina问道，“Are they human?”
      
“They were.”
      
“Are they ghosts now?”
      
Tui故意压低声音，“By now? Yes.”
      
Soleil像爆米花般蹦到风和光怀里，一边尖叫一边笑；风和光被冲得靠向Juno；后者未曾料想自己的问题引起这样大的反应，但还是宽容地收留朋友和妹妹靠在身前，甚至又问道，“Do they kill us to eat us?”
      
“Not really.”
      
“Juno, no more creepy questions!”Soleil抗议道，“Does ‘us’ mean tourists like us?”
      
“No. But ‘we’ didn’t belong here to begin with.”
      
“Are we human?”
      
“No.”
      
风和光被Georgina的问题启发，“Are we deer?”
      
“Yes.”
      
“Oh, so it’s a story about deer.”Soleil恍然，“So we’re deer being haunted?”
      
“Haunted or hunted? Although with all those dead hunters around, I suppose you could argue for both.”
“But why did the hunters protect us at first? Like evil babysitters.”
“They wanted the deer population to grow, right?”
“Yes.”
“Did they kill the deer to get something from their bodies?”
“Partly.” Tui用手在头顶比出两只鹿角的模样，“Not primarily.”
“Were they raising the deer like livestock?”
“No.”
风和光略一沉思，追问道，“Were they protecting us from other humans?”
“Yes.”
“I get it now.”Soleil信心满满道，“They’re the owners of the deer so they don’t let anyone else hunt them.”
      
“Close. They did decide who was allowed to hunt us, and when. But they didn’t exactly own us.”
      
“When the protection ended, were they still killing us for the same reasons? ”
      
“Some were. But that wasn’t the main reason anymore.”
      
“So they started killing us to protect something else?”
      
Tui微笑着点头，“Looks like you’ve figured out the real story.”
      
“Helena, what did you figure out? Deer don’t hurt other animals, right? They’re so cute.”
      
“Any living creature can cause damage in some way.”
      
Georgina见妹妹依然迷惑，便接着Juno的话解释道，“Once there were too many deer, they started eating too much of the forest. So people stopped protecting the deer and started protecting the forest instead.”
      
“Oh I just remembered. The farmers said the red deer here were originally brought over from Europe. So people brought them for hunting, but when there were too many, they killed them for forests.”Soleil终于明白过来，“That’s so unfair to the deer. They didn’t even do anything wrong.”
      
“Maybe like Juno said, harm can always be caused even when it’s not intentional. But I agree that the deer aren’t to blame. Still, ghosts can’t be held responsible. Lucky ghosts.”向导笑了笑，“Alright, girls, go get ready for the hot tub!”
      
夜间露台气温很低；但进入灼热的浴池后，晚风变得清凉宜人，悠悠吹散冒起的水雾，不至于让远处的山景变得模糊。
      
“Isn’t Juno coming?”Soleil手撑着池沿，时不时起身坐回地板上，毕竟水温实在很热。
      
“Every chalet has a hot tub.”
      
“I know, but I thought she’d come hang out with you too.”
      
“I think she’s had enough socializing for one day. What about Geo?”
      
“When I went to find her, she was already in the water. She didn’t want to move.”Soleil现在很能理解姐姐的想法，重新站起来走到另一间木屋绝对比被鬼魂追杀还可怕。她拿起望远镜眺向山脊上方，如愿看到繁星满空，于是开始督促Helena也一起，“Tui said Venus and Jupiter are in conjunction tonight. Look, they’re so close together! But which one is which?”

“The brighter one is probably Venus, I think. I’m not really sure.”
      
“I know a little about stars. Those three stars should be Orion’s Belt.”说到猎户座，女孩又想起壁炉边的故事，“I don’t like it anymore. It’s not nice to the deer.”
      
风和光不想让话题变得沉重，“Same. I only know a little. I know Venus stands for happiness, and Jupiter for good luck. So if they’re together, maybe it means something nice is about to happen.”
      
“I believe Venus stands for love.”
      
“Then you must be right. Tui said the deer will start dating in a few days. Maybe the stars are bringing them closer together.”
      
“You always make everything sound better, Helena. You should come on every family trip.”
      
“I promise I’ll come study with you in high school. Or maybe middle school? Juno said the paperwork shouldn’t be a problem, and I can find a host family...”
      
“You can stay with us. I’ll talk to my dad. So, are you coming this fall?”
      
“I’ll try. I’ll talk to my mom too. Next fall at the latest. But I can come visit you guys over summer break.”风和光为第一天就成功完成计划而庆幸，一边感谢木星的庇佑，一边舒展身体浮在池水中。
      
Timeo Danaos et dona ferentes.
