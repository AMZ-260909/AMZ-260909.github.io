风和光次日便得知Gian欢迎她来拜访或居住，两天后回到扈城时也收到来自对方family office manager的邮件，其中根据她的情况详细列出多种申请方案的条件、步骤、所需时间及入学后的监护与居住安排等，并表示乐意提供任何方面的协助。

Juno从年初就开始与朋友策划此事，自然早已预料到结果；但她没预料到朋友在华国6日凌晨突然发来一段哭诉语音。

当时是Punakaiki的9点多，Juno放下早餐，走到屋外拨去通话。

“我在洗手间。她已经睡了。不是，昨晚10点多吵起来的，那是你们的半夜，我怕吵到你睡觉就没有告诉你。没有打我，但是她很生气……我真不晓得她发什么疯。我刚到家的时候她很高兴，看照片时还说想下次和我一起去玩，我说她可以去美国读书或者工作她也说要是有机会确实很想去，但我给她讲Audie邀请我去留学，又给她看你爸爸那边发来的邮件，她就突然开始骂我……”

“为什么？”

风和光支吾几句，在朋友的逼问下只好说出推测，“她在怀疑我们做过的那些事。你知道的。她没有证据，所以只能发脾气。”

Juno不知道具体指什么事，是计划让Helena来这边读书？她正要追问，朋友又抽泣道，“算了，没事，我慢慢再和她讲。你们一会要去Abel Tasman吧？我其实不想影响你度假的心情，但是，如果我明年没办法过去……”

“那就不来。”Juno听到屋里妹妹随着早餐结束渐渐变得吵闹，便告诉朋友给自己留言然后挂掉通话。不过她知道Helena大概不会再发相关消息，如果事情没有进展的话。

之后事情不进反退：这年夏天风和光几乎整个暑假都与Juno和Audra一起待在印尼，回来后因此与母亲断断续续多次争执，以莫眉周年忌日那天最为激烈。直到十月初，风和光的外婆去世，为安抚宁蓁的情绪，女孩不得不同意与莫寻秋断交。

时景新的告别仪式十分隆重，骨灰更是在冬至日时入住扈城最昂贵的公墓，其早逝的丈夫也被迁去合葬。风和光这两个多月已对母亲彻底心灰意冷，转而尝试亲近舅舅并集中精力攻略表妹，落葬仪式上自然说了不少让宁臻舒心的话，比如外婆看到舅舅事业有成、表妹成绩优秀便安心离去等等；本就不高兴的宁蓁听后呵斥女儿，被哥哥劝了几句就饭也没吃径自打车离开。

“没关系，我知道妈妈是因为外婆的事难过，”风和光垂泪为母亲辩解，“我本来是想让她别这么难过，但是好像惹她生气了……”

“她从小就这样，不管她，你吃过午饭再回去。”

风和光很清楚外婆是舅舅与妈妈和解的主要原因，如今她需要尽快让这个位置被新人填补。这一年来女孩已经发现宁臻对妻子早无爱意，对女儿倒尚存几分关注，于是在席间和表妹聊起期末——宁涉雪在学习类话题上至少会有一些含糊的回答，比平时的完全自闭稍微好些。

宁臻将外甥女的奉承看在眼里，认为她比宁蓁识时务得多，尤为难得的是确实能哄女儿开口。作为慈爱的父亲，他乐见其成道，“小凤凰，以后常带着你表妹玩。雪儿平时不爱说话，倒是和你挺聊得来。”

“雪儿其实只是不爱聊和学习无关的事。”风和光睁眼说瞎话道，“舅舅工作那么忙还把雪儿培养得成绩这么好，真的好厉害，我以后不会的题总算有人教了，希望她别嫌我烦。”

宁涉雪听不清表姐的妙语连珠，宁臻则听得微微一笑，“是啊，我工作忙，很多时候没法陪家里人，雪儿成绩好是她自己努力，我其实很惭愧。”

“怎么会呢，这才是言传身教嘛，而且我相信雪儿只是嘴上不说，心里一定知道您对她的爱。”

这话倒是很中肯，不算讨好，宁臻认可地点头，“她能这样懂事我就放心了。你们吃完饭想不想去逛商场？我把司机给你们留下。也可以去看电影；我也不知道你们孩子现在流行玩什么，总之你以后多约她出来说说话，省得她整天闷在家里。”

宁涉雪不愿意，但风和光爽快应承下来。于是两人饭后去AMPM购物；风和光逗着表妹看这看那乱买一通，后者则对商品满目琳琅、行人憧憧往来的两个小时甚感茫然，只能像抓着救生圈一样抓住表姐，直到走进已包场的VIP影厅才得以喘息。

见表妹的压力暂时缓解，风和光笑了笑，先温和询问她想吃什么、喝什么，然后在女孩犹豫地点单时飞快浏览目前上映的恐怖惊悚类影片。

她本来打定主意不看莫名妙的任何作品，但此时刷到V3NUS海报上那张被装饰得几乎看不出本来面目的女孩的脸，又突然决定非看这个不可。

平心而论，MiMi的演技不错，吓得宁涉雪全程抓紧救生圈；风和光享受着咸蛋黄华夫饼、芝士玉米粒、海盐焦糖冰淇淋、爆米花雪顶奶昔、表妹的依赖与仇人不知被怎样培训后呈现的精彩表演，觉得放弃母亲是对的，舅舅比母亲好糊弄得多。难怪母亲总是成为被人放弃的那一方。

电影结束后，风和光陪宁涉雪去洗手间，“我是看封面挑的片子，没想到这么漂亮的演员演这么恐怖的东西，真把我吓坏了，我有好几段都不敢睁眼看屏幕呢，雪儿，你胆子好大，竟然从头到尾都没害怕。”

“我，我还好。”

“那就好，不过我现在有点累了，下次我们再出来玩吧？我去你家待会儿怎么样？我怕回去我妈妈还没消气，又要骂我……”

宁涉雪抗拒包括父亲在内的人进入自己和母亲的公寓，所以应该拒绝；但现在她确实想回家，而且不知为什么她觉得表姐在身边好像更安心一些。也许是因为表姐虽然表面活泼，但其实很胆小又不聪明，姑姑又那么凶显得她那么可怜；她哪里都不如我，是没什么危险的。

这对母女住在向荣一品的复式，公寓将近莫宅的三倍大，也远比莫宅豪奢；但维护得不怎么样。风和光听母亲说过舅舅三年前就从这里搬出去，显然后来佣人对一病一残的屋主颇为怠慢：水晶吊灯因积灰而发暗，绿植盆内散着未清理的落叶，甚至露台的玻璃门上有薄薄一层雨痕。

没体验过保姆视角的宁涉雪倒从未发现过这些，回家后就躺在沙发上放松，一边依然有些胆怯地观察表姐；好在表姐没有走动或提问，也坐到沙发上开始说话。具体说话内容宁涉雪已懒得听，风和光似乎也不介意，独自聊了半天又插上耳机继续和别人聊，宁涉雪则早已打开平板看起MLP。

宁涉雪从此继承已逝祖母的位置成为父亲与表姐的固定话题，也同时成为后者最好的朋友之一。

风和光认为表妹作为朋友最大的优点有两处：其一是听力很差并对自己的言行毫无反应，其二是成绩很好所以自己可以声称每晚放学来请教功课。这段时间是她与Juno语音的好机会，因此Juno每天早晨5点起床上线，两小时后结束通话去上学；不上学时她们可以多相处一小时——风和光晚上9点必须回家。

“你们现在都起这么早吗？”风和光一开始有些好奇，“我记得Audie说过她最讨厌早起。”

“Gian和Leora习惯早起。Leora从五点练琴到七点，卧室在我隔壁，很吵。”

“我也真想有隔音好点的房间住，我妈还每天哭我外婆，不晓得什么时候才能正常点，不过我还在努力，也许很快就能住在雪儿这里，这边很安静，我舅妈从来没出过房间，其实我还挺好奇她是什么样子的，我妈说她不好看，可我舅舅的女朋友都很漂亮，不过说起我舅舅真挺奇怪的一人，我感觉他不在乎我表妹，但要说对她不好也不是，比如我说过他这人其实很小气，但给我舅妈和表妹花钱特别大方……”

Juno平静地喝着咖啡听朋友闲话，一边读Theoretical Neuroscience，思考梦中一成不变的陌生鬼魂是否是一种spurious attractor。

她在两个月前终于尝试对家庭医生描述症状，一系列神经与认知检查都正常后被诊断为创伤引起的重复性梦境。但这个结果她并不认同：这个形象与她的所有创伤经历都无关（她甚至不觉得恐怖），而且梦境分毫不差地重复400多天似乎不大可能；因此女孩只好自己继续寻找原因。

C’est par le malentendu universel que tout le monde s’accorde.
