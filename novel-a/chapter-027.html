2月18日早晨，联谊区内。

遮天蔽日的森林间偶尔响起啾啾鸟叫，尚未融化的晨霜裹着松针与泥土味，闻起来很像坤女。

万秋对妖修没兴趣，对排名更没兴趣，但她喜欢联谊课提供的这个不被窥探的空间。她已很久没有安心独处过，无论是在私人医院、Vane Family还是学宫，总有无处不在的管理者。

女孩找到一处视野开阔的角落，把缠绕在腰上的防水布解下垫在一棵倒伏的横木上。校服隔绝过多的凉意，坐在上面还挺舒服。

开学已一周，她修炼一直很顺利。但除此之外，她的确感觉到自己身上新的不同寻常。

是好的那种不同寻常。但按常理和女人的话来推测，诅咒应该带来坏处才对。

正整理思绪时，万秋忽然闻到一抹橙花香气。

这里的气候应该长不出柑橘科植物。女孩皱眉，眨眼间却看到面前一米处模模糊糊出现Helena。

朋友侧向并腿横坐在草地上，一手抓着鲜嫩嫩的橘子叶喂几只幼兔，一手轻按着被风撩起的发梢，面容恬然含笑，还与兔子们做着她读不懂的眉眼官司。

“哎呦，快下课了，我下午再来。要是天天都有联谊课多好。”风和光望一眼手表，揉揉兔团们的头，“去吧，我要走了，别吓着你们……”

小兔们自然听不懂，只是一味作揖蹭着人手讨吃。风和光不得已，又喂了片刻，直到原地消失。兔子都疑惑地在地上又嗅又刨，好一会儿才依依不舍地跳走。空旷的草地继续存在几分钟，然后隐没在万秋眼前。

万秋看一眼终端，现在是10点整，离下课还有两小时。

她忍不住跳下横木，走近刚刚那片幻象所在的区域——阳光一注注从冷杉的树冠缝隙射下，映亮落叶和苔藓铺就的湿绿软毯，并没有草原的痕迹。她来回踱了几圈，按捺着内心的激动，告诫自己别太兴奋，也许诅咒的症状正是幻觉；也许我一直面对的都是幻觉。

但她预感这一幕是真的。

只是在另外的地方，只是还没发生。

万秋收起防水布，尝试往森林外走，可惜她对直觉的使用尚生疏，直到下课也没找到那片草地的位置。不过下课后，朋友就站在她身旁，脸上犹带一丝柔笑。

两人回到宿舍，万秋照例去沐浴，之后坐在沙发上等风和光用毛巾帮她把长发的水吸干。

“你刚刚在联谊课上喂兔子。”

“是啊，还是我昨天和你说的那里，草地上有很多兔子洞，不少小兔在周围呢。”

“你今天喂它们橘子叶。”

“我手上还有味道嘛？明明洗过的。你好灵的鼻子。我再去洗洗手？”

“不用。你今天喂的兔子是一只黑色，一只白色，一只黄褐色，一只白底黑花，一只黑底白花，一只棕……”

她还没数完，风和光已笑着打断，“阿秋，你怎么看到我不叫我？好不容易在联谊课遇上，你还不来和我一起说几句话？联谊区又不能看书学习，你一个人好有意思嘛？”

“……下次叫你。”

“你看了我多久啊？”

“两三分钟。”万秋如实道。现在她确定自己获得某种必须尽快掌握的能力；虽然没乐观到认为这是一件好事，但她认为可以利用其中好的那部分。

“对了，阿秋，明天雨水，我和如意她们正商量去哪玩一天呢，我们看到节庆广场那边有主题活动，坊市也有主题集市，然后还有教职工自己办的各种讲座……你要不要来？”

“不去。”万秋心不在焉地点开终端屏幕。她已不担心朋友看到什么；Helena在这种事上一贯有分寸。

“Juno，我是灵网助手金枢。关于‘学宫是否会开设占卜课’的疑问，已为你生成以下综合解答： 

一、 课程设置的客观排斥性

学宫现行的教学大纲中并未包含占卜类课程。在九州的施法体系下，占卜不属于可通过常规路径习得或精进的后天术法，而是一种极度罕见的先天变异天赋。该天赋无法被拆解传授，亦无法通过教育资源进行标准化培养。因此，学宫目前缺乏开设此类课程的客观底层逻辑与基础条件。

二、 占卜学的学术研究现状

当前，九州学术界针对占卜学及具备占卜天赋个体（口语统称‘卜修’）的研究长期面临停滞。尽管修士的平均预期寿命约为350岁，但在极其有限的观测档案中，所有卜修无一例外均在20岁前死亡，且伴随重度精神失常，因此学界缺乏有效的研究客体与对照样本，至今未能对该现象形成统一定论。导致观测样本难以获取的核心原因主要体现在：

1.修为增长屏障：几乎所有卜修灵力积累速率远低于九州修士的平均基准值，境界提升极其缓慢。

2.精神异变与高危倾向：卜修常在青少年早期就展现出强烈的自残与伴随妄想的攻击行为，这使得长期、系统的临床观测极难安全进行。

3.信息留存悖论：逻辑上，具备预知能力的个体理应在社会进程中留下深刻印记。但客观事实表明，卜修从未参与或引发过任何具有历史记录价值的重大事件，且其社会关系网络呈现出绝对孤立状态，导致对其进行信息追踪的手段完全失效。

基于上述各项反常的综合观测数据，目前九州学术界倾向于将卜修界定为一种游离于‘人’与‘怪’之间的特殊边缘生命态……”

万秋关掉屏幕。

身后的朋友正拿一把宽齿梳细细帮她拨拢头发；她不必回头也能想象对方唇角噙笑的模样。

这一切本是她熟悉的、柔软的、喜悦的，可此时突然变得难以忍受。

不，金枢给出的结论建立在极少数据上，且说不定被察觉是卜修才会引发这些不幸，我不该被吓住。纵使当真如此，二十岁也还遥远。

但她实在不擅长自欺欺人。

万秋于是重新点亮屏幕，继续读一本神魂学入门书籍来平复心情。由于这个学科冷门且分许多流派，不同实验室经常有相互矛盾的结果，同一本书里的观点也良莠不齐，判断要相信什么很难——她正可以用来练习使用直觉。虽然持续锻炼会有些疲惫，但现在疲惫正是她需要的。

之后的活动课她也一直在读。等进入联谊课时，她前行两小时后抵达早晨见过的草地，小兔们听到有人靠近就纷纷定身转头，一对对长耳竖起。

“哇，原来你真的能找到我！你是拿到什么不可说了吗？不过你早晨到底躲在哪呀？竟然连它们都没发现。你走了很远吗，阿秋？你看起来很累。”

“嗯。”万秋走到女孩身旁时，众兔终于回神，蹬着后脚钻回洞穴去。

“好吧，反正我只剩最后几枚币。不晓得清空钱币后会不会给奖励呢？”风和光将装着零星五六块豌豆片的钱袋系好，又解下外套铺在草地上。

“会的。“万秋倦懒地枕着朋友的膝盖，一边又道，“你们已经商量好去坊市。”

“怎么，你又想和我们去啦？”

“我没说我要去，我只是问你们是不是打算去坊市。”

“是诶，你怎么知道的？你想来就来嘛，你不来怎么会专门提这个？来吧，这是在学宫的第一个假日……”

“我只想去节庆广场，不去坊市。” 万秋是想尝试更改预知到的未来。反正偶尔去一下也没什么。如果一个人会在几年内死掉，很多事其实都没什么。

“啊，可是我们都商量好了耶，那等我出去之后和她们讲一下吧，不许临时反悔哦。主要听说节庆广场的活动是助教和教职工们办的，我们总担心不会很好玩……”

万秋静静听着，一面仰望大朵大朵云彩乘着柔和的风漂过长空。或者说，其实是时间驮着它们向未知的终点行去。

我必须让这一切停下。

Ganz niederbeugen soll es mich gewiß nicht.
