    <script type="text/plain" id="chapter-text">
Soleil大声数了两遍信封后开始害怕，“Leora, are you messing with me?”
      
“I kinda feel like you’re the one messing with us. You closed the box and opened it again, right? I’m gonna go grab something to drink.”
      
“Do you guys think it was her? I swear she would do something like this.”
      
“Leora only put three envelopes in there.” Georgina诚实道，“And I didn’t add any either.”
      
“Then what’s going on? I’m seriously not messing around. Maybe we should just shred all of them. This is kinda freaking me out.”
      
“Let’s open them and see what the extra one says.”
      
“No, Juno. That literally sounds like the beginning of a horror movie. We’re gonna get cursed or something.”
      
“Soleil, weren’t you the one said you wanted something new and exciting?” Leora捧着滚烫的London fog回来，“What’s more exciting than opening a letter from an uninvited guest?”
      
“It has to be you messing with me.” Soleil狐疑不决，最后还是被胆怯战胜，“I’m going back to my room. This isn’t funny at all. You actually scared me.”
      
Georgina陪着不敢独自回房的幼妹离开。Leora见Juno没有要走的意思，就好奇道，“Juno, are you trying to freak her out?”
      
Juno露出被冒犯的冰冷表情。
      
“Sorry. I didn’t really think it was you. Let’s open them and see. Maybe it’s still that little demon’s prank. The extra one could say something awful about me because she knows I’d want to open them. Maybe she’s about to jump out any second just to see my face.”
      
虽然不同意Leora关于Soleil的猜测，但Juno也一起拆起信封。很快13只卡片被摆到桌上，双胞胎各自一张张地翻看正反面：
      
[I do not belong to this world | I belong to this world]
      
[I crave danger | I crave safety]
      
[I've always been brave | I was a coward]
      
[I am haunted | I have never seen a ghost]
      
[I am glad I met you all | I wish I had never been born]
      
[I enjoy my life | I’m tired of my life]
      
[I can see your secrets | I cannot see your secrets]
      
[I love my family | I hate my family]
      
[I am human | I am not human]
      
[I am not fully myself | I am whole]
      
[I pity you | I envy you]
      
[I believe you all love me | I am no one's favorite]
      
[I am 101 years old | I am 10 years old]
      
Juno自然认识自己的三张卡片，但她没有表现出来；Leora也没有。
      
姐妹两人对视良久，Leora忽然发现自己对危险的渴望并没那么强烈。
      
“So you and Soleil planned this whole thing just to scare me, didn’t you? You had everyone write down some crazy stuff, then set this up so you could snoop through my secrets?”
      
Juno盯着Leora，思索对方是在用诘问掩饰恐惧，还是倒打一耙；因为她也正在怀疑两个妹妹串通起来打算用这些秘密羞辱自己；一个迟来的下马威。妹妹们做出一些莫名其妙的坏事并不奇怪。
      
“Not very sigma.”最后Leora移开目光，愤怒地甩下这句话扬长而去。
      
这不太像表演。Juno思忖，如果这里真的有一位不请自来的幽灵女巫，那么哪封信是她所留？
      
与好朋友Helena不同，女孩从不把注意力放在人们的秘密上。单就语义而言，其中5张卡片都有些怪异。
      
也许除了我和Leora的卡片，其他信封里的内容也已经被幽灵更换。Juno一边推测，一边慢悠悠将散落的秘密整理好并逐张放入碎纸机。
      
她一开始以为多出来的卡片是鬼魂给自己的暗示，但仔细推敲后认为并非如此。如果梦境中的女鬼有能力与自己交流，不需要等到今天，也不需要选择这样的场合；或者，至少自己单独留下后总会再给些线索。
      
“Juno?”
      
女孩被门口的呼唤声惊了一下。原来是三位姐妹去而复返。
      
“Geo and I got worried about you guys, so we came back to check on you. Then we ran into Leora. She said you were in here by yourself. Are you okay?” Soleil已将女巫红裙换掉，“I wasn’t messing with you. None of us were.”
      
“Neither was I.”Juno平静地走到门口，与女孩们汇合，“I already shredded them all.”
      
“Do you think our witch coven summoned something evil?” Leora吹着雾气袅袅的奶茶，“Juno and I saw some really creepy stuff on those cards. One of them said something about being haunted, and then there was—”
      
“Stop. I don’t wanna hear any more of it.” Soleil捂住耳朵，“Let’s go tell Dad.”
      
Juno不想寻求Gian的庇护，她也不想听Gian关于幽灵的童话故事。但Soleil露出一副谁不去就是心虚的表情，因此姐妹四人还是一同走进父亲的书房。
      
男人慈爱地听完小女儿的叙述，并没说她们是在拿自己寻开心，配合地问道，“And then what happened? Did you see what the extra one said?”
      
“We couldn’t tell which one was the extra one, so we just put all of them through the shredder.” Georgina担负起长姊的责任，向Gian汇报此事，并没有提起任何一位妹妹的名字。
      
“You did the right thing. The cards are gone now, so they can’t hurt anyone. You’re safe here, girls. Life is a lot like jazz, sometimes things happen that you don’t see coming. Why not just treat this as a weird little secret the four of you share? Don’t scare yourselves, and don’t scare each other. I promise, you’re all going to be okay. Now go get some rest. It’s bedtime. And nobody’s been sneaking any caffeine, right?”

至少没人承认。
      
Juno认为父亲什么都没说。
      
她迅速扫视其他三人，见Georgina一如既往温和地微笑，不知是不是像Gian一样认为这件事不过是个无伤大雅的恶作剧，但总之没有流露出任何私人情绪。Leora看起来比刚刚安心些许，但仍然绷紧唇角，不知在想什么。Soleil则明显重新高兴起来，走出书房时已低声讨论接下来要不要一起串珠或者玩PlateUp。
      
Georgina从来纵容妹妹，而双胞胎不约而同地表示要回屋换掉女巫装扮并洗漱。Leora穿回常服后发现自己的手机落在地下室，于是匆匆去拿。
      
她轻捷地走下楼梯，接近熟悉的音乐，很快在snack bar找到刚刚制作奶茶时忘在一边的手机。打算回楼上时，她看到水晶吧台桌上的半球盒里放着两封孤零零的黑信封，不禁疑惑Juno为什么单独留下它们。
      
不，这两个信封的火漆印章还完整，并非刚刚被拆掉的那些。
      
难道Juno单独留下并制造两封新的秘密信件？还是她把某些旧卡片重新封装到新信封？她是想一会儿偷偷过来拿走吗？还是专门留在这里吓人？
      
总之，原来这一切都是她在捣鬼；我倒要看看她想做什么。
      
Leora想到刚刚竟然被孪生姐姐的眼神蒙蔽，很有些恼火，尽管考虑到里面一定没装着什么好东西，但还是迅速拆开信封，并阅读两张新卡片：
      
[I killed her | I am not the killer]
      
[I have no regrets | I really regret it]
      
天哪，为什么她要印出这种东西？
      
Leora悚然四顾，但地下室的色彩、音符、光影都变幻莫测地闪烁着，难以察觉是否有另一个人隐藏在这里。
      
“Juno, come out. I know you’re there. I’m taking these to Dad unless you tell me why you did this.”
      
她等了几息，见没有回音，就捏紧两个新秘密和手机匆匆离开。快步跑上楼梯时，女孩的心底不禁升起一个可怕的猜想；毕竟她所知道的与Juno有关的人里去世的只有一位。
      
Ruby说那个女人是食物中毒去世的。
      
而除却这两张卡片外，Juno今晚只对自己说过两句话。
      
The past is a very determined ghost, haunting every chance it gets.

</script>
