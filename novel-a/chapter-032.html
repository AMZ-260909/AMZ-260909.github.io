      <nav class="reader-controls">

正式比赛开始时天色尚黑，但赛场上灯光明彻。

果然第一阶段并不难，穿着洁白鸢服的学生们纷纷从圆台跳下，在风场中回荡着宛如一场激雪，掠过柳林上空时奋力攀折枝条。柳树是气垫上竖起的一株株风格很儿童画的充气塑料树，树冠上粘着千丝万缕碧琳琳的柔枝，很需要使点劲才能拽下来。

一百多人难免会相互撞在一起，好在晃荡速度并不很快，鸢服又有减震效果；但绳索一旦缠绕摩擦几次很容易就会断开，因此刚开场五六分钟就有不少人尖叫笑骂着坠进气垫去。

风和光这天运气真的很好，几次眼看要和别人缠在一起都侥幸擦身而过。鸢服的头颈设计大大限制她转头张望的能力，因此不确定万秋是否有帮忙。第一阶段持续20分钟后结束，此时绞盘将还在场内的70多名选手拉高一些，她们便无法再触到柳林。

女孩手里一共有9根柳条，不是最多的，但应该也不算少。很快，淘汰者们退场，柳枝在计数后也被收走；软垫上出现一盘盘灯光无法驱散的圆影。是前往起飞线的传送点。

绞盘将绳索垂低，风场又开始运转，选手们随之继续晃摆。绕着圆台一共只有7个传送阵，要准确又快速地降落在其中很不容易。但这是对风和光来说唯一不需要担心的环节，因为朋友一小时前刚告诉过她要做什么。

她默数5秒，然后选择解绳，眼前一闪，再站稳时已站在144米的高台。

天空依旧灰喑喑，淡雾缭绕在台周，下面的景象便不那么清晰得令人眩晕。万秋正站在她身旁，两人几乎同时按下鸢服的充气按钮。由于时间宝贵，她们都没有选择交谈，但风和光从朋友眼神里读出所有需要知道的事。

随即万秋一跃而下。风和光略微助跑几步，心一横也跳下去。

鸢服充气后也没有到可以直接托起身体的程度，因此最开始两三秒女孩们飞速坠落。时间被惊心动魄的失重感拉得极长，风和光挺腰昂头，努力在湍急的气流中维持呼吸。

晨风呼啸灌满双翼，白鸢们终于开始在曙光初露的阴云下滑翔。

原来雨天也会有日出。金亮橙红的光芒从天边绽开，翠莹莹的湖水被染出一弧赤彩；远处有明闪闪的银带，延伸出一列列垂直光束，作为选手们的方向参照。

视野里的白鸢不算远，风和光尽可能按照朋友之前的吩咐复刻对方的动作，幸好做过一个多月的练习，四肢在风里没那么僵硬，操控鸢服也较为熟练。

刚开始万秋在她的右前下方，但随着时间推移，她发现自己下降得稍微慢些，最终朋友先一步沉进湖水，溅起层层琼浪。飞花碎玉中，风和光继续迎向残霞滑翔数米，堪堪擦过终点线才落下。

入水时她竖起双翼，冲击力并不剧烈。鸢服自动脱落只留下里层的泳衣，女孩从护甲里钻出来，顿感轻松不少。踩着微凉的湖水回望高台，风和光估计自己大概滑出四百多米。

此时空中白鸢三五成群，或高或低地翱翔，或远或近地坠落，湖面逐渐热闹起来，时不时有工作人员将不擅游泳的学生捞去岸边。她看了一会儿，万秋便从身旁的湖水里冒出，洁白脸颊上还有头盔压出的红痕。

两人对视一眼，风和光不自觉绽开笑容。她当然想问朋友许多问题，但又不能问，所以热切地期待对方主动说些什么。

“你想去岸上吗？”

“我们就这样待几分钟嘛，我好久不游泳了。”风和光见万秋没有透露的意思，就扯开话题，“你想好活动课选什么了吗？原子要选卡丁车，如意打算选刺绣和瑜伽，雪儿竟然想选射击，真是看不出。我应该也会选一门瑜伽，剩下两分不知道选什么好，有什么可以和你一起玩的呀？不要太激烈那种，但是也别太无聊……”

“台球？”

“台球确实不错，但是要计算很多东西……”

两人拉着手仰浮在湖中有一句没一句地闲聊，长发缠叠着漂在水面。万秋望着雨云吞熄朝霞，一边在脑中整理测试结果。

这次自己无疑成功绕过诅咒达到目的。也许只是不能做得太明显，不能让别人有所怀疑。但想必诅咒的影响不止如此，不过，真的会变成案例里那么严重吗？目前倒没感受到任何未来变得疯狂或自伤的预兆。

这是预知力给出的回应，还是单纯的乐观念头？女孩已逐渐难以区分这两者；越纯熟地掌握天赋，就越深刻地被它迷惑。

总之我绝不会去求那个怪物。但我也不能告诉学宫。如果九州不将卜修完全作为人类看待，被这样划分的群体在历史上遭遇的往往是……

“其实我本来以为你会比我成绩更好，因为你跳得早嘛。”风和光聊着聊着换了话题，打断万秋的思绪，“而且在尘世的时候你总是第一名。当然，我知道你在这里不需要第一，这些对你来说已经什么都不是。不过，我只是担心，如果你总是这样让着我……”

“那就总是这样。”万秋切断女孩的忧虑，略微思索后决定再向不大聪明的朋友解释一句，“我更喜欢你得第一。”

“为什么，不会觉得我很虚荣吗？总有同学觉得我这样很不好，之前我学习一般，只是想当个班委，贝璇珠她们就说我那些女明星什么的。”

“她们没有来九州。”

“要是在这里也有人说我怎么办？”

“你告诉我，我选近身格斗。”

风和光粲然，讲话也重新轻快起来，“好吧，反正说实话对我来说得第一名就是会很开心啊，大家都夸我，都喜欢我，我就感觉挺好的。晏老师不是说几十年才飞升一个修士吗，如果不飞升的话，我总是要死的，死了之后没有人记得，想想就可怜。要是以后我们两个的名字一起写在历史书上多好……”

“如果我没有飞升，也没太大名气呢，就像上一次那样？”

“那不一样的，你现在能有这样的……哎呀，怎么说呢，你这个设定一看就是重生复仇剧本啊！照这种开局，你以后一定可以成为仙尊！我估计我没指望了，但我有时候还会给你想飞升后的道号，这样就等于我也有参与吧？你觉得应该叫万——”

万秋松开朋友的手，双腿一压将身体翻成直立姿势，“有人来了。”

风和光也连忙弹起身，果然很快有教职工游来提醒她们及时上岸。

“两位同学，比赛已经结束，你们可以抱着冲浪板，我拖你们回去。”

“不用不用，我们自己游过去吧。”风和光笑道，“老师，比赛名次出了嘛？奖品是什么呀？”

“你们到岸上沿着指示牌就能去领奖区看公示，大家都有奖品，还有每个人起飞时的录像……”

虽说参赛者都有奖品，但第一名的特等奖格外不同。一等奖（4人）、二等奖（14人）、三等奖（41人）和四等奖（104人）都是碧玉柳叶为主料的各色精致发饰，而特等奖是一枝长约三尺的垂柳枝，婀娜地倚插在状如泡桐花的水晶瓶中，纤丽垂条笼着宛若缥烟的翠叶；此时恰好清明雨落，柳枝感风变色，被轻拂起的几缕柔丝闪烁起星星点点金绿嫩黄。

“是可以将风转换为光的材料，”晏守中打趣，“这下风可以看到了。”

原来阿秋那时说“清明运动会的奖品会更适合你”是这个意思。

风和光恍然看向万秋，后者的终端屏幕正亮着，早有预料般拍下这一瞬。之后朋友们都围过来好奇地观赏这件瓶插柳，又一起换下泳衣去坊市玩耍庆祝，直到午后，女孩才回到宿舍抱着奖品在屋里走来走去，不确定将它摆在哪扇窗前，又苦恼应如何搭配才好，因而请万秋出谋划策。

忙碌一番，风和光感慨自己该学点室内设计，“让我看看，这个课1分，还有瑜伽1分，可我们之前商量的那几项都是2分，一共选4分我会不会上不过来啊？”

“我也只能再选一门1分课。近身格斗是3分。”

风和光又被逗笑一次，“你不选那个不也打得过别人吗，你……你都能……是吧，谁还能打到你？”

万秋略微惊讶Helena还记得这件事。她决定试验对方与他人的不同，于是淡淡道，“就算只有我们，也不要随便提这个。”

搁置这件事一周后，女孩行若无事地问正在摆弄瓶插柳的朋友，“你知道那天为什么要学我飞吗？”

“啊？是因为……”风和光吸取教训，凑近朋友耳畔将声音压得极低，“你知道那样飞我才能得第一吗？”

“……嗯。”

Das Nothwendige nicht bloss ertragen, noch weniger verhehlen – aller Idealismus ist Verlogenheit vor dem Nothwendigen –, sondern es lieben.
