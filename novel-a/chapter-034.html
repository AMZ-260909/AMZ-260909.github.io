    <script type="text/plain" id="chapter-text">
立夏时，女孩们来学宫已满三月，怀恋尘世的孩子们渐渐不怎么哭了，而本就不如何喜欢尘世的孩子们更养成几分老生做派。

“又放假啊，本来还想去找小鼠们玩呢，昨天我要走的时候它们不停地叫。”

“要是早两天多好，像上次谷雨就是周五，能少上一节语言和灵理。”

“但吴老师也没让我们闲着啊，提前布置一个大作业。”

“作业还可以灵活应对嘛，上课又不能逃课。”

“That’s probably the worst part about having no guardian and going to boarding school.”

“好处是成绩单不会让家长看到。”

“你们去不去节庆广场？助教说今天有斗蛋大擂台！”

“去，当然去！”

“一起一起。”

“万灵，你去吗？”

“I’m gonna hit the market first. Might head over to the square later.”

“好，那我们先走啦！”

于是几分钟后，万灵走出传送阵。立夏主题的坊市一片朱红，遥遥望去便觉团团热意扑来。今天来参加活动的品牌不少，但所有非食品类的商铺都每人每店限购一或两件，且任何商品都是装在五色丝线兜着的彩蛋里，要选定才可以砸开。食品类的商铺则都摆满立夏的各样传统食物，如五色豆、乌饭、小笋、青梅等，各色冰饮、凉茶更不必说。

但万灵只是在这方入口处徘徊。十几秒后，一家亭阁的二楼露台传来一声浸着笑的轻唤：

“Leora！”

女孩抬头，但只看到一抹残影；随即MiMi从那家店铺里跳出来。她今天穿件印着卡通猫猫和蛋糕图案的淡粉碎褶边露脐短上衣、石榴红露背低腰背带短裤，一侧的肩带脱垂着；脚上是粉色长毛堆堆袜和厚底圆头白皮鞋，身上一切可以挂饰品的部位都挂着大串小串的彩色塑料，还贴着不少五颜六色的亮片。

即使如此混乱，第一眼望去也只会注意到她漂亮的脸。

“你的outfit很独特。”万灵帮她把那条耷拉在腰侧的背带挂回肩膀上。

MiMi不怎么领情地一撇嘴，抬手似乎想再弄下来，但最后只是正了正繁冗的塑料珠子项链，“我们去喝糖水吧！”

“MiMi，我在这里不是因为糖水或者hang out with you. 你说过你有一些事情很重要的要说。”

“噢，骗你的，我想来想去也不知道怎么才能约你出来。”

万灵反而松一口气，微笑道，“You thought for two months and got this?”

“我没有想那么久，只是突然想来逛街就给你发消息而已。别人都不理我，你知道的。”

“如果你一直说谎，MiMi，”万灵停顿片刻以示对此说法的挑战，“或者做更坏的事，people just won’t wanna have anything to do with you.”

“我最近表现不怎么坏，再坚持两个多星期就可以撤销留校察看了！”

“Maybe set your standards a little higher if you wanna make friends.既然你没有真的重要的事对我说，I’m out.”

“不，我确实有很重要的事要说。真的很重要，是……”

女孩磨蹭着，半天也没说出什么；最后万灵决定不再等下去，“I'll spend today with you, but on my terms. If you’re cool with that, we can go get some dessert right now. If not, ask someone else. And if you say yes and then misbehave, I’ll ignore you like everyone else does, no matter what excuse you come up with. Got it?”

“I don’t have anyone else to ask.”

“I know that was a yes, but if you don’t say it, you’re gonna try to get around it later.”

“我同意我同意！你赢了，好了吧？”

MiMi似乎很生气，但忽然又露出笑容；万灵则依照约定让女孩去买杯想喝的饮料，自己先去一家首饰店选彩蛋。

这家商铺还剩百余枚蛋，吊得高低错落有致，每只蛋壳上印着一扇翅纹，各种蜻蜓、蝴蝶、蝉、蛾……还有许多万灵认不出的，据说砸开之后吊牌会有介绍。她最后选了一只脉络细密、淡得几近透明的金色虫翅，分前后两片，前翅阔大，后翅极小；旋转时隐隐有虹彩流动。

“我也可以选吗？”MiMi捧着一杯盐渍青梅气泡水回来后问。

女孩对规则的尊重让万灵很满意，“Pick one. Then we’ll find a spot and crack it open.”

MiMi把每个蛋都敲敲摸摸，最后取下一枚印着蝴蝶翅膀的：大约是某种灰蝶，茶褐底色的翅膀中央有大片鲜亮夺目的紫蓝鳞粉，随着角度移动还会变幻颜色。之后两人就坐到“七家茶”小楼里，万灵将茉莉、蔷薇、桂蕋、文林果、杏、丁檀、紫苏口味的香汤各取一瓯，又选几样五色豆做的各式小点夹在一只剔红攒盘里端来。

“喂，你有完没完，怎么这么能吃？我要敲蛋。”

“我没有请你等我。Just keep it down.”

女孩就把彩蛋在桌上用力碾几下，壳碎后开出一只半个手掌大的蝴蝶戒面，三对细爪恰好可以扣在终端指环上；万灵取来吊牌看，学名叫arhopala japonica，简介下的fun facts是此蝶幼虫能分泌富含糖分与氨基酸的蜜液，蚂蚁嗜之，因此非但不捕食对方，反而每日护送其往返觅食，与寻常蝴蝶幼虫见蚁则危的命运截然相反。

“好看！我还想敲一个。”MiMi的手向桌上另一枚蛋伸去。

万灵想起那袋小鱼饼干，觉得这只蝴蝶很贴切，就默许地把彩蛋往对面推了推。

这次女孩开出一只指甲盖大的皮肤吸附钉，单只金色薄翼在光线稍暗的地方几不可见。MiMi觉得很好玩，一会儿放在眉边，一会儿放在唇下，“好像冰箱贴啊，不知道是怎么吸在皮肤上的。”

“你可以问灵理学教授。今天教职工们有讲座们。”

“我才不去找她。所以是我的了？”

“Nope.”

“我开的就是我的！”MiMi干脆把它吸在舌尖上，“嘻嘻，这下你不要了吧？”

“Remember what happens when you break your promise, MiMi?”

“我拿这个蝴蝶的和你换好不好？要不我求求你了哼哼哼……”

“如果你申请交换，I should be the one making the deal，因为这是我的东西。You have to agree on it before you take it.”

“你要开什么条件？”

“Hmm. Let me think.”

万灵慢吞吞地端起茶瓯挨个观察着颜色和香气，然后逐一细细品尝；另一边MiMi已笑逐颜开地将吸附钉放到肚脐上，然后从漆盒里拣块绿豆酥吃，咬了一口感觉怪甜的，就又放回原处，跑去拿了只雕成玫瑰的苹果嚼得咔嚓响。

“MiMi, you’ve gotta start changing a little. I need to actually feel like you’re trying to be my friend, not just messing with me all the time.”

“我没有故意捣乱。你在吃东西，我也吃。”

“You can’t put food you’ve already bitten back into a shared container. If you don’t want it anymore, just throw it in the trash can. 这是最简单的规则之一。所有人都会遵守。”

“可是我妈妈就不遵守。”

“Your mother is family. Would she do that in public?”

“Yeah. So why can’t I?”

“Then go ask your dad. He’ll tell you once food’s been bitten into, it’s not clean anymore. There are germs on it. And even aside from that, having someone’s saliva all over it is just gross... MiMi, what is it now?”

万灵震惊地看到MiMi突然开始呕吐然后从椅子上滑下去蹲在地上大哭。她一开始怀疑这是某种夸张的抗议，随即发现好像是真的。

楼里本来还有几个女孩在选香汤，见此情景纷纷离开。

我应该假装没看到她那条消息的。或者我应该在她见面时承认骗人后就走。至少我不应该尝试把她当作正常人对话。万灵后悔地想着，按亮墙壁上的【需要清洁服务】按钮，然后抽出一大把纸巾递到MiMi面前。

“Do you want to call your TA and have her take you to the infirmary? I can wait until she gets here.”

“不用。我没事，不要告诉她们。”MiMi在上气不接下气的哭泣间隙拒绝，接过面巾纸后忙着先擦拭万灵的鞋。万灵今天穿了一双贴花玛丽珍奶白皮鞋，现在左脚的鞋头和外侧都溅上了些许污渍。她看着女孩讨好的动作，尽可能将怒火压下去，保持语气平静：

“Are you really okay? I can tell your TAs you didn’t mean to do it. It won’t affect your probation.”

“我真的没事，我好了。”MiMi用剩下的纸巾胡乱在脸上身上抹了抹，肩膀依旧无法自制地耸动，眼泪从下巴不断地淌滴着。“我要回宿舍。你也回去吧。我不会再给你发消息。”

万灵犹豫片刻，还是动摇了，“Will you be safe on your own? Come stay with me for a while.”

于是一小时后，被清洗过的MiMi穿上一条丝绸提花灰紫色睡裙，因为同样恢复整洁的万灵在对比多次后认为它配那只蝴蝶戒指正好。MiMi在试衣期间找回笑容，又提出想听万灵弹琴。

万灵略一思索，选择了一首舒缓的舞曲，这是Ravel年少时写的，与他后来大部分成熟的作品不同，简单但含蓄优美。之后她还给女孩介绍它的相关笑话，“A young pianist once played it for Ravel super slowly. Ravel was like, ‘Listen, kid, next time, remember: I wrote Pavane for a Dead Princess, not Dead Pavane for a Princess. ’”

MiMi伏在沙发上大笑，又好奇道，“所以那位死去的公主是谁？”

“Ravel said he just thought those French words sounded pretty, so, thankfully, no princess actually died. As for me, though, I like to imagine she was that Infanta of Spain. You know.”

一边听故事，已经完全复活的女孩开始在万灵的公寓走来走去，触摸沉重银器上雕镂的花藤，用脸颊蹭绣满火红郁金香的天鹅绒靠垫，并兴奋地踩着碧玉基座，凑近上面的大理石雕塑，拍打Psyche手中的蝴蝶。万灵含笑望着MiMi，直到后者走进书房去。

她迟疑片刻，做好心理准备，也走进房间，果然看到MiMi正呆呆盯着书桌上立着的相框。

“Leora，这个是……”

“This photo’s from last Christmas. My father, my sisters and me.”万灵淡淡道，“MiMi，你想起一些重要的事吗？”

"None," said the other, "Save the undone years."
