两天后，宁涉雪午休期间去帮表姐清洁公寓。

前一天风和光已初步清理掉食物和饮料，今天的目标是拆卸各处陈设。将近一点时，她起身去上瑜伽课，“那就麻烦你们两个啦，生理课见。”

宁涉雪也冲表姐挥手，转头看到万秋置若罔闻地埋头工作，忍不住进入战前的紧张。

自从赌胜，女孩就像彩票刮出巨额奖金般苦恼不已。

一方面，她认为这是命运给自己的机会，应该趁此将万秋收入麾下，那些仙侠剧里主角组团都是这样的；另一方面，她又担心对方会不会听完后直接向学宫上报自己的秘密。

不过观察一阵后，宁涉雪认为万秋岂止不会多管闲事，简直对他人全无兴趣，比如刚刚毫不理睬表姐的离开；但同时呢，她又不会推辞来帮忙，做事非常耐心细致，是很优质的帮手，就像地板上的扫地机器人一样。

所以她本打算年后将万秋拉入计划；但前晚的游戏事件后，宁涉雪因被不公对待而倍感屈辱，急于扳回一局，就在聚会结束后提前说起此事：“你还记得，之前打赌吗？我……我……我，让你干什么，都行？”

“你想好再来找我。”

“我想好了，但是，我不知道……呃……如果，这件事有点危险……”

之后风和光的出现打断了她的陈述，于是宁涉雪这时又重复一遍，“我前天说，如果，我要让你做一件很危险的事，你会去做吗。”

万秋静静将新拆出的贺卡放到一摞信件中，香水瓶摆进小推车上的美妆类收纳筐，包装扔去一旁的垃圾桶，然后伸手向下一个礼盒。

“你听到了吗？”

“把话一次全说完。”

“我就是，想问一下，如果，比如，要违反一些学宫的规定，你，还会帮我吗？会不会，举报我？”

“除非和你表姐有关。”

“呃，和表姐没有关系，其实，也没那么危险，只是一些学业上的问题……就是，类似数学或者灵理学，我看不懂的话……”

“不作弊。”

“不是作弊，就只是，讲解。” 

“去问灵网助手。”

“她们都签过安全协议，不能，不许讨论这些。”宁涉雪想到之前尝试和九枢说起此事后弹出的巨大字体的红色警告，心有余悸地咬着指甲；她那时惴惴不安多日，以为会有什么人来逮捕自己，自此再没敢和灵网助手说话。

“你把会触发九州安全协议的事拿来和同学讨论？”

“我不是，随便和同学讨论，你说，不会举报我，我才告诉你。”

万秋懒得接话。她这两个多月怀疑过那晚遇到宁涉雪是否真能对破解诅咒有帮助——毕竟之前直觉妹妹的生母会和妹妹长得很像这个结论似乎已被证明错误。但现在从女孩鬼鬼祟祟的模样看，或许确实能获得什么线索。

大约不扯上莫名妙，命运就没那么变幻莫测。

看到万秋并没有露出警惕，甚至唇角微扬，宁涉雪深吸口气，打算奋力一搏：“……接下来，我说的话，你一定一定，不能告诉任何人。”

“我不做任何保证。你直接说，要么另想个光明正大的要求。赌约不限时间。”

宁涉雪挣扎着想，其实基础理论部分虽然超出课本范围但还算光明正大，和某些同学爱好研究天文学一样，可以说是个人兴趣；等到后面……后面到时候再说好了。

“你之前了解过神魂学吗？”

万秋终于停下手里的动作，抬头望向宁涉雪，好整以暇地等待女孩继续讲下去。

见自己引起对方注目，宁涉雪有些得意，傲然道，“我，对神魂学很感兴趣。但是有一些，资料，看不懂。我想请你看一下，然后给我讲。但是，不要发消息，就是，你看我的屏幕，然后给我讲，可以吗？” 

“你不怕我举报？”

宁涉雪当然害怕这件事发生，但她目前并不害怕万秋这么说。万秋微笑时会令人恼怒，但不令人害怕。

“你在吓我，我知道你不会举报。”

“为什么你这样想？”

“我……我……我经常，觉得我们很像，我知道你，不会，把重要的事情告诉，学宫或者，别人。”

万秋叹气，宁涉雪看似多些理性，实则并没比莫名妙强多少，总是得出这种匪夷所思的判断。她不愿猜测对方眼中的自己是什么样。人总是受认知限制，她默默想，笨东西受到的限制太多，想象力因此贫乏。

“你有多少资料要看？”

这个问题在宁涉雪意料之中，她早有对策，“你没规定时间，什么时候你想耍赖，你就退出。”

“我不耍赖。”

简单的激将法竟轻松奏效，宁涉雪原本还想了另外几种说辞；她笑了，认为万秋虽然聪明，但太过骄傲又不擅长谈判，控制起来并没那么难。自己的勇敢冒险是对的。“那我们现在就看吗？”

“你先做完你该做的事。”

于是两人继续各怀心思地继续处理聚会后的公寓。宁涉雪有点忐忑，因为现在是12月初，离妈妈说的静置一年还差两个月。但“如无意外一年后再登录”意味着有意外的话提前些也可以吧？况且两个月也不是很长。

这算不算我迈向邪修的第一步？宁涉雪用力擦拭着家具上的污渍，我在利用万秋。我还在思考怎么设法胁迫她让她之后就算反悔也无法举报我。这都是邪修会做的。但Odysseus也经常需要说谎，为了达到目的，英雄们本就各种办法都要尝试。

其实她发现自己甚至有点开心。也许是终于有人可以分担一些负重；也许是因为欺骗比自己强的人会令人快乐。不，不是，我并没有那么坏……我做的一切都是为了妈妈，虽然是坏选择，但我不得不做。如果妈妈知道，一定会很感动的。即使万一妈妈不记得我，等我给她讲了，她一定会深深被震撼的。

她会哭吗？会抱我吗？会说什么呢？

不知妈妈现在在做什么。宁涉雪用衣袖揉揉眼睛，努力将注意力集中到清洁工作上。

直至公寓打扫结束，万秋都没再说话。两人起身离开时，宁涉雪终于沉不住气，“现在——”

“要去上生理课。”

“你不会是拖着然后不帮我吧？”

“周六联谊课我去找你。你想办法把资料带进去。”

“你怎么——哦，我知道了，好。”宁涉雪自己也在两个月前得到过一个特殊道具，是有限次数让钱币加速变化的。虽然特殊道具信息无法与他人交流，但大半年下来，几乎所有人都有一两样，联谊也就变得越来越轻松有趣。

女孩仔细想了想，认为万秋这个建议非常聪明：这样她就不需要担心过程被拍录下来或者有人听到，联谊课发生的事是学宫无法得知的，坤女和三青从不会管人族的事。看来与万秋合作真是一个好选择。

“还有，我想知道，你之前为什么要突然和我打赌？”

 “不违规的问题去问灵网助手。”

又是这种轻蔑的语气。宁涉雪没想到万秋在初步得知自己的秘密后依然没有任何敬畏，这与影视文学作品里的描述有些不符；但生活不是爸爸开发的游戏，一时半会她也不知向谁提交这种bug。

何况团队新成员留下这句话后就径自离开，仿佛答应帮忙只是如同替她唱歌一般的举手之劳。

这只是开始。宁涉雪想，总有一天我会证明我才是真正的主角。

Even the smallest victory is never to be taken for granted.
