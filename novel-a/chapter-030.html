“好吧，看来这个游戏对你们来说太简单。这样，我给你们推荐另一个考验你们四个人之间默契的游戏，”九枢对风和光道，“如果配合得好，一轮就能每人各拿到49枚雨滴。”

“好。”万秋率先答应。

风和光自然也同意；宁涉雪因为好奇所以也不反对；而金同尘本就是随便来玩点什么，全无异议。

“这个游戏规则很容易。你们不能以任何方式交流，也看不到其他人的回答。”随着九枢的话，四个女孩又进入独立空间内，“每一轮我会给出一个目标数字，然后你们各自有一分钟时间提交一个整数——可以重复，没关系，如果4个数加起来正好等于我给的数，这轮就过了。连续过7轮，你们就赢。”

……这个和默契没关系吧？

宁涉雪无语地看着屏幕上一个大大的2，数字下只有一个输入框和提交按钮。

她不可能知道其他3人会写什么，所以也无法配合。没想到九枢报复心这么重，女孩左思右想也找不到任何获胜方法，只好随机提交数字；九枢每轮给的数字也很随机，从正三位数到负三位数都有。

7分钟之后，这个无名且无聊的游戏结束。宁涉雪看到表姐果然一脸不服气；金同尘也微微皱眉；万秋倒照常面无表情；九枢却微笑道，“恭喜你们，全部通过。”

“这不公——等等，你说什么？”风和光茫然地看着一大堆水滴飞来自己面前，“我们赢了？这也可以赢？”

“为什么不能？规则说得很清楚。”九枢的虚拟形象渐渐淡化直至消散，“Good luck. And take care.”

万秋心照不宣，但维持沉默。

宁涉雪沉浸在不可思议中，第一反应是计算概率，可无需计算也能知道无限接近于0。不过，总不会是万秋做到的；没人能做到这样的事。难道九枢故意放水？灵网助手就是这样乐于助人？

风和光恍恍惚惚站起身，才回神似地对若有所思的金同尘道，“同尘，你这49枚都给我怎么样？”

“你拿去吧，反正我什么也没做。”金同尘又多拿出一枚一起推给风和光，“这样你就刚好够了。不过，我很想知道你们是怎么赢的，可以告诉我吗？”

“也许是我运气好而已，再加上朋友们的一点点帮助……”

然而风和光几人走到奖品兑换处时，许无忧正在把SSS奖品递给庚寅班的纪微缈。

“你们只晚了一秒钟，小凤凰。”助教遗憾地感慨风和光运气欠佳，“刚刚纪同学她们在番摊那里连赢三把翻倍赌注。我没听说过这么短时间拿下3S的，你们都破纪录了哦。你想兑换SS奖品吗？也很好看。”

纪微缈歉意地对风和光笑笑，接过许无忧递来的素纸伞。

这把伞闭合时看起来很普通，女孩将它撑开打在头顶也未感觉到独特之处，但围观的学生有不少都惊呼或感叹。

伞上一寸的雨雾被按下慢放键似地缓缓凝落，犹如一颗颗小水晶球般倒映出周遭景色，接触伞面后漾起圈圈涟漪，层叠明灭间交织成无数灿烂图案。

万秋无意关注神奇雨伞，思忖着今天的事与之前灵理课的提醒有什么区别。她很快想到一个假设，便对强作欢颜的朋友耳语两句。

“真的吗？你怎么知道——哎呀，我不该问的。好吧，既然这样，这次我们不如换两把567的SS……等等，好像不够，那就两把S？345x2是……690，这个够！剩下的雨滴送给同尘吧。”

鸡油菌于是又快活地在雨中穿梭。

“谢谢，不过我要这些雨滴也没什么用。刚刚和你们在一起玩得很开心，对我来说这就是SSS奖品。”

风和光没料到金同尘如此深谙说话的艺术，大有棋逢对手之感，“我们和你在一起也玩得很开心呀，不如我给你兑换一个77滴的C级伞吧，就当学宫第一个假日的纪念。”

许无忧表扬风和光从挫折中快速恢复的豁达心性，在听说这把伞要送给盲人同学后还特意在工笔贴箔绢伞外沿钩上一圈小风铃。

应付完金同尘，风和光又将S级伞递一把给表妹，“雪儿，谢谢你帮我攒雨滴。”

“啊，这个是给我的？”宁涉雪受宠若惊，“我以为你和万秋一人一把……”

“我怎么可能忘记给你呢？”风和光笑道，“我们一起去那边自拍怎么样？”

一旁万秋对这样的分配也毫无意见，并用剩下的十枚雨滴在朋友胸前重新钉出一株小小的蘑菇图案。

好吧，原来万秋其实人挺好的。宁涉雪快乐地摆弄属于自己的S级奖品，耐心等待表姐整理服饰。

“可是我从来……清明……要怎么才能赢呀？”

“清明运动会公布规则了吗？”宁涉雪听到旁边两人的只言片语后打开学域，“奇怪，我这里刷不出更新。”

校园日历的清明标注着无课且有一场运动会，具体规则却一直没公布。

本已习惯表妹耳聋的风和光第一次意识到学宫的助听器比尘世的好得多，连忙掩饰道，“没有没有，我们只是在说清明不知道会有什么奖品，也不知道会比什么，这个节日在尘世一般都是踏青嘛。”

“噢，我希望别太吓人，不要有，鬼魂之类。”

“那你今天还选这个恐怖游戏，刚看到卡牌时真把我吓了一跳。不过这种全区比赛肯定不会有太多恐怖元素啦，走吧，我们去拍照。你说这个伞上嵌了这么多宝石但又这么轻，不会是塑料吧，但看着又蛮精致的……”

宁涉雪的注意力就此彻底离开今天观察到的种种奇迹。当充实快乐的假日结束，再经过周二一整天课程后，女孩连万秋在各个游戏中的具体表现都已印象模糊；记忆宛如雨水一般悄无声息地在一昼夜间蒸发——总之既然最后没赢到SSS奖品，应该也没有很厉害？

周三午休时，宁涉雪与表姐的其余好朋友们在坊市的一家饮品店打发时间。金同尘恰好也在，并端着一杯杨梅冰茶询问女孩是否可以拼一张桌。宁涉雪倒是对金同尘前日的表现细节尚记得清楚，因此虽然有点不情愿分享个人空间但也没有拒绝。

何况她还是视障人士。宁涉雪想，但愿她不是因为这个才坐到这里的。不过，现在学生里只有表姐知道自己的听力问题，自己戴口罩的原因又是过敏，那也许金同尘选择此处并非有什么深意。

“我听她们说，你是小凤凰的表妹？”

宁涉雪点头，为这个身份带来的完美伪装感而满意。

“你们在尘世是一起长大的吧？真好，能一起来学宫，还恰好在一个学区。”

不，我只认识她没多久，只是表姐确实对我很亲热；我们从小不认识是因为……女孩想了想，认为解释一大堆很麻烦，她不太有信心也不太习惯说这么多话，于是含糊道，“啊，唔，是挺巧的。”

“她在尘世也这么受欢迎吗？她适应这里好像很快。”

这个问题不难。宁涉雪点头。

“感觉除了同学，助教们也都很喜欢她，之前她和家人的关系应该也很好吧，真不知道她为什么也会想来九州。”

“我表姐，当时以为是做梦，所以。”

“嗯，她好像是这么说的。”金同尘笑了笑，感慨道，“她妈妈如果知道，应该会很伤心，对她来说，好像女儿就是她的一切……”

宁涉雪对姑姑不甚了解，只能胡乱点点头。

“说起来，她爸爸妈妈是做什么的呀？”

“我姑姑在我爸爸的公司上班，我姑夫，我爸爸说他去日本的分公司很多年了，我表姐，都没见过他。”

“这样啊。”金同尘略一蹙眉，喝了几口饮料，忽然又道，“那小凤凰有什么喜欢音乐的很好的朋友吗？好像后来去了美国。”

人类之间的聊天真是奇怪，宁涉雪苦恼地想，我就算和表姐一起长大也回答不出；表姐的朋友何止上百，谁能认全？要说去美国的确实有一个，表姐总是对自己提起的Juno，但她从没提过这个人喜不喜欢音乐……喜欢音乐算是什么很明显的特点吗？

金同尘从女孩的停顿中立刻了然问题的答案——那就是没有。

“我下次，帮你问问。”宁涉雪认为Juno是否喜欢音乐只有表姐本人知道。

“没关系，只是偶然想到的，不知道也无所谓。前天和你们两个玩得很开心，就很想多了解一些你们的事。”

金同尘已不记得雨水那天的游戏细节，不过她还有其他的话题可以降低宁涉雪的戒心。她们讨论起下午社会课会学什么——庚子与庚辰每周三一起上课。

这个话题友好很多，对宁涉雪来说，人类之间的聊天又变得不那么诡异，如果金同尘临走时没有突然说道：

“你和小凤凰是这一年多才认识的，对吗？”

“……你知道，为什么还问？”

“啊，抱歉，我不太会聊天。”金同尘微笑，“希望你不要觉得这样很烦。”

Κρῆτες ἀεὶ ψεῦσται.
