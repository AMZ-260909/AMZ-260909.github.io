      <h1 class="glow-title chapter-number">023 短剑虽曾铸顽矿</h1>
      <nav class="reader-controls">

    <script type="text/plain" id="chapter-text">
周四晚上的第一节灵理课可谓是新生们讨论最多的一门课：心法课几乎等于睡眠课；生理课刚介绍完基本的人体结构；自然课在讲地球是圆的以及它的邻居也都是圆的；活动、文化、社会、数学也都未涉及一丁点魔法；但灵理课的第一节课就叫“灵是什么”。

一群选择踏道而不惜斩断尘缘的女孩们都跃跃欲试。

灵理学讲师不负众望，脚踏飞剑穿窗而来——难怪这间教室有窗——并在众人头顶盘旋几圈才落地。

学生们都为她与她的剑欢呼喝彩，讲师也很善解人意地一挥手，又从窗外引来数十把破空时还有一道道幽蓝电弧残影的短剑，浮在空中演示五分钟剑阵。表演结束后，她请助教们把这些飞剑分发给每位同学。

“我，萧飒意，出生于1897年。你们手里这些飞剑与我正好一样大。”讲师笑道，“用不着小心翼翼的，尽管拿着玩吧，很结实！”

风和光好奇地把玩飞剑，说实话比想象中的轻得多，冷白色、明晃晃的，剑柄有繁复镂空的花纹，剑刃瞧着很圆钝，于是女孩用它在发梢上比划了下，果然还不如宿舍厨房的菜刀利。

“它不是武器，不会割伤人的。准确来说，它们是一套表演用具。1897年，器宗行会才组建第二年，一位卓有才华的青年修士在行会大赛上展示了这套作品，因此夺下冠军。这位修士叫道不器，目前也在学宫任职，等你们升到四年级，也许会听到她的课。

“那么这些短剑的原理是什么呢？你们把剑倒过来，注意看剑柄底部有个凹槽，里面嵌着金属片，就是它的天线，可以接收无线电信号。对，是无线电，这套短剑，还有我这把最新款的飞剑，都和魔法没有任何关系。”

风和光对无线电不太熟悉，只记得好像和收音机有关。

“无线电不需要人遥控吗？”有同学提问道。

“当然需要遥控，如果想让一把剑往左飞，就得从控制器发一个往左的信号，剑上的天线收到后才能驱动内部的电机改变方向。噢，那个小晏，小茅，你俩给同学们展示下遥控器。”

两位助教就各自掏出一个巴掌大的金属方盒举起来向众女孩展示，上面果然有几排拨杆和旋钮。

“哈哈，别失望嘛，同学们，明明是一样的东西，怎么你们刚刚都觉得很神奇，现在就不觉得？是因为知道了它的原理？但是，你们真的知道原理吗？有没有人能回答上来，答上来的学年总成绩额外加1分。不要看不起1分，有时候这就是C+和B-的区别，得C+就得在明年每周都额外补课……好，这位同学，你说。”

“遥控器能把动作变成电信号发出去，然后天线收到信号再变回指令。不同的频率控制不同的剑。”

“不错，但是一共56把剑，只有两个遥控器，怎么控制呢？”

万秋回忆片刻，“剑阵的动作是立体对称的，一共只有7套完全不同的动作，所以只需要7组独立信号，两个遥控器就可以控制。”

“……好，你说得对，坐下吧。”萧飒意没有预料会得到正确回答，清清嗓子道，“这个技术现在看来也许不足为奇，但在一百多年前，却是很了不起的发明。这样的进步是一代代修士们共同努力的结果，尤其是灵理学专业的修士。那么，你们知道灵理学究竟是研究什么的学科吗？”

“灵理！”这道题几乎所有同学都会。

“对，灵理。灵理的理，是原理、道理的意思；那，灵呢？”

这次没有人脱口而出，但有近三分之一的手举了起来。

“就这么几个同学完成了预习？不行，学宫的教育真是逐年松弛，我得靠我个人的努力平衡一下，作业量这方面……”

又有十几只手相继举起。

萧飒意笑了，手在空中稍稍晃动，最后指向一名角落里没有举手的女孩。“你来说说。”

风和光转头看去。原来是庚辰班的金同尘。今天从数学课起她就注意到这个女生，因为对方一直闭着眼睛；后来活动课上一起聊天才知道是盲人。

“那你平时怎么读写啊？”原与辉当时心直口快地问。

“嗯……和你们不大一样。要不，你把终端调成视障模式试试？”

后来她们一起玩了会儿球，女孩身手矫健灵活，并看不出什么缺陷。

现在金同尘自然不知道老师点名的是自己，但耳机里的灵网助手实时提醒她回答问题。

“灵嘛……”金同尘不紧不慢地站起身才开始思考，“我没预习，不过我觉得，灵大概就像光一样。我看不到光，但我能感觉到它。”

“啊，你看不到，我还以为你在打瞌睡，抱歉啊，这位同学，你坐下吧。不过以后还是要积极完成作业，如果有什么不便之处可以给我发邮件，或者联系你们助教一起跟我约个时间好好沟通，我可以调整作业的内容和形式。但是，如果你没和我说，我不会对你网开一面的。其他同学也一样，不要到学年末再来找我。你们去论坛向往届的学姐们打听打听，哈哈，应该有不少人对我的课印象深刻吧。”

萧飒意依然笑容满面，学生们都很难再笑出来。

“言归正传，灵呢，的确和风和光和电都差不多，看不到但……你们高兴什么？有什么有趣的，来，说说。”

风和光脸色微红，主动举手笑道，“我叫风和光，她们拿我名字开玩笑。”

“哦，和光，好名字。难怪你人缘不错。你预习了吗？你讲讲灵是什么？”

风和光绝对是个听话的学生，而且为了维持入学以来的优等生人设，她已把朋友写的灵理学前两章笔记背熟。

“灵是源自高维空间的物质，在高维空间中以一种……一种离散的粒子形式存在，但当灵粒与我们这里的物质或……呃，场发生作用时，就会以波动的形式表现出来，我们称之为灵波。”

她说得不算流利，但磕绊处都会巧妙地假装在思考。为表自己不是死记硬背，她又加一句，“所以，灵确实和光差不多，光也有粒子态和波动态。”

“好，你继续回答，灵窍是什么？为什么有灵窍才能修炼？”

风和光开始担心这人继续问个不停，又有点怀疑自己是不是已经答错了什么；但她依然努力摈除杂念，回忆笔记上的总结：

“灵窍不是每个人都有的，是我们神魂与高维灵场连通的一种……拓扑结构。就比如神魂是一张纸，灵窍就像纸上的一处凹陷，所以和高维世界可以发生作用，没有灵窍就不能跨维，也就不能修炼。”

“所以有神魂才有灵窍，对吗？你是这个意思吗？”

……这个笔记上没说耶。

风和光不想功亏一篑，因此强自笑道，“对，有神魂才有灵窍，才可以修炼。”

“那我再问你，你知道灵网器灵吧……哈哈，风同学，别紧张啊，答不上来也不会怎么样，我只说答对有加分，答错是不扣分的。”

“噢，我也不是因为成绩才紧张啦，就是没在课堂上回答过这么多问题，感觉有点不好意思。”风和光借着假装害羞拨拉头发的间隙朝朋友飞去一瞥。虽然万秋不可能帮到她，但她还是忍不住要看一眼。

万秋也在看她。当然，现在所有同学几乎都在看她。不过万秋在那一瞬间几不可察地微微摇头，做了个口型。

其他人估计不会注意到，顶多会以为是在给她加油。但风和光知道不是。

萧飒意已负手走到她面前，“灵网器灵也能从高维接收灵粒，也能解析灵波，那你觉得她们有神魂吗？可以修炼吗？”

“没有，她们不能修炼。”风和光干脆道。

“答得这么快，很有信心啊，那，为什么？”

是啊，为什么？风和光也在搜肠刮肚地想那两个字的提示究竟是什么意思。第一个字是bei，第二个字不确定。背？背什么呢？不是，再仔细想想……

她挂着笑容慢慢道，“灵网的三位助手呢，确实可以接收和解析灵波，也可以和我们交流，并且能通过仙器做出很多神奇的事。但是，它和修士还是有很大区别的。这个区别就是……对，她们这些事情都是被动完成的。是开源仙尊规定了她们的天职。但是我们修炼是要自己主动吸收灵粒，施法也是我们想要施法。”

萧飒意听到最后，出乎意料地认真看了风和光一眼，赞许地点点头，挥手示意她坐下。

“不错，很有悟性。风同学，继续保持这个学习的劲头，你以后必会有所作为啊。”

女孩激动得满脸通红。同学们或钦佩或惊讶的眼神聚在她身上，她只觉得飘飘欲仙；即使飞升的滋味也未必比现在好吧？

“我们继续回到刚刚说的灵的特性……”

风和光实在得意，按捺不住又转回头——万秋这次在专心听讲，一边飞快地敲笔记，窗外的夕阳映得女孩像一团金煌煌的光。

和光，真是一个再好不过的名字。

The best and most beautiful things in the world cannot be seen nor even touched.
