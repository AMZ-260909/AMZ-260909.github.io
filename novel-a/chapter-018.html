心法课教室大约70平，环形白墙，无窗也无家具，且没有天花板，一抬头就能看到月亮；地面整块覆着柔软的温感记忆棉垫，几个早到的女孩正在软垫上追跑嬉闹。风和光与季如意、原与辉和其他几个新交的朋友说笑着走进教室，与早来的几位同学开始small talk。

庚午与庚子的新生们陆陆续续走进教室。来九州的一周内，双方比较活跃的一批人已相互熟悉，但依然有不少人第一次看到其他班级的同学。早自习并没什么硬性任务，晏守中和郑自馨各自点齐人后就安排学生们在地上坐成两个半圆，中间留出讲师的位置。之后她们又简洁地自我介绍，然后共同讲解心法课的教学流程。

风和光做出认真听讲的姿态，一边巡觑对面庚子众人，无需费力就锁定宁涉雪。

宁涉雪也正朝她看来。

风和光热情地笑，宁涉雪则垂下头。

雪儿在九州也还这么自闭。风和光想，与莫名妙的兴风作浪可谓天差地别，要不是看过那张照片，任谁也猜不出这两人是双胞姐妹。这么说来，她应该和雪儿都是12月生的，比我小才对，那只该死的疯猫竟然一直逼我叫她姐姐。

她不想把今天的好心情浪费在回忆莫名妙上，便去听助教讲心法课的测评考核方式：

“心法课没有笔试或者操作考试，但你们的修炼等级会被终端监测记录，并备份给我们。在第一学年，我们会保证每位学生都达到炼气一层大圆满。这个目标并不难，学宫有记录以来，一百多年中只有不到五个人没有完成，且都是有特殊的身体情况。如果你们中有人明显进度落后，我们会安排一对一的指导补习。大家有任何困难也可以随时向我们两个或者讲师报告。另外，我要提醒大家，修炼起步的快慢与最后能达到的境界并不相关。炼气阶段最重要的是培养良好的修炼习惯，不要争进度。”

“这一点我再补充几句。”郑自馨接过话，“很多同学在这门课上会和别的同学比较，这是我们不提倡的行为。虽然适当的竞争有利于进步，但过度的比较心理很不利于修行。还有，根据我的经验，有的同学会在课后私自练习吐纳来抢进度，这很危险！如果课后想修炼，一定要预约教练，不要在无人监护的情况下自己吐纳。一旦出了什么事，虽然我们看到警报会第一时间赶过去，但身体上的后果只有你们自己承担，孰轻孰重，你们都好好想清楚！要记得我说过的：做好的选择。”

“郑老师说得很对。”晏守中赞同地拍了两下手，“大家要记住，学宫永远把你们的安全和健康排在第一位。修炼等级不是什么了不起的排名，我们更期待你们享受修炼的快乐，而不是享受比别人强的快乐……”

风和光并不完全相信这些，但她希望这是真的。在尘世时，她所有科目都只中上；但助教说学宫没有考试成绩排名。事实上，新生适应周让她感觉自己也许属于学宫标准下的优等生。

这个想法让她小小地得意几秒，忍不住转头看阿秋在做什么。

万秋面无表情地坐在最后一排的角落，但风和光看得出好朋友可能在思考某些与心法课无关的事。

很快，对方敏锐地朝她盯来；风和光不自觉笑了一下，连忙转回头，手指玩弄起垂在胸前的发尾。

早自习结束时助教们结束训话，各自坐到班级最后，讲师从门口走进来。

白发苍苍的老太太看起来至少一百岁，皱纹掩去容颜细节，瘦小甚至有些佝偻的身材缓缓向教室中心移动着。

风和光想，学宫应该给她配个轮椅。

“诶，你知道吗，她是故意弄成这样的。”右手边的季如意戳戳她，“我这几天总刷【上章万象】，看到往届有学姐说她一直在‘你能忍到几年级再表白’那个榜排前三，后来实在担心失去工作就都用老年形象来上课。”

“哇，真的吗，可是我们刷论坛就都会知道啊……”

“不一样吧，看从前的照片和每天亲自见到的感觉肯定不一样。”

“嘘，她在往我们这里看。”

两人一同闭紧嘴巴，正襟危坐。

“诸位小道友，老身姓云，承蒙谢宫长青眼，忝为庚金区心法讲师。须知无极原为气，一元混成体；太极本无根，相抱生两仪……”

风和光尽力忍住想打哈欠的冲动。

但随着讲师念经一般平缓的声线，她的眼皮还是很快就沉重得抬不起；不过与在尘世中打盹不同，虽然昏昏欲睡，讲课声却更加清晰响亮，每个字都愈加震耳欲聋。

“……还虚静定，深入混沌。候混沌开机，即凝神吸气以守灵台，存想息息，呼吸往来。呼则气随神出，散于先天之虚；吸则气随神归，敛于自身之府。清虚空默，忘物虚无，象里无极，任其自然……”

在讲师的声音之下还有一呼一吸的提示节拍音，风和光浑然不觉地跟着节拍呼吸。半梦半醒的状态让她无暇注意任何事，只是茫茫然坐地吐纳。

不知过去多久，她隐约听到晏守中宣布“原地调整半小时，我们再进入下半部分摄灵心法的学习。”

女孩迷迷糊糊睁开眼，一瞬间想不起身处何处。云老太太还在教室中央闭眼打坐；自己两边的季如意等人也都一副如梦初醒状；回过头，大部分同学都是同样的表情。万秋倒是清醒得多，眉心微微皱着，正在读终端屏幕上的什么书。

风和光看一眼时间，发现已经凌晨4点半——已经过去四个小时吗？

“小凤凰，你身上有没有什么奇妙感觉？”

“唔……好像没什么。就像睡了一觉。”风和光从背包里拿出一袋水果夹心软糖，分发给周围的同学。

季如意拿了块橘子味的，“我也是，我还以为会浑身冒光立地筑基什么的。”

“筑基？”原与辉也来抓糖，听到后就大声嚷嚷，“你们谁筑基了？”

“晏老师不是讲过嘛，一两年筑基还算快呢，这才第一天。”

“第一天没有什么感觉很正常。”晏守中和蔼道，“至于浑身冒光……可能不是我们这边心法会有的效果。”

“我知道！那是赛亚人的心法！”

一群人都笑起来，风和光好奇道，“晏老师，您也知道赛亚人？”

“对啊，您多大了？”

“好大的胆子，竟敢问这个。”晏守中佯装捶打季如意，“我是2000届庚午班的学生，你们自己算去！哎，虽说山中无历日，寒尽不知年，看着你们这些小家伙，我常常也觉得自己上年纪了。”

“明明还很年轻啊。”风和光自然接道。

“就是，看看云老师那才是真的上年——”原与辉没说完就被季如意死死捂住嘴，两人就此笑闹成一团；风和光又趁机与晏守中聊起尘世近两三年的新闻，听得后者眉毛直跳。

“同学们，都回位置上坐好，关掉终端屏幕，云老师要继续授课了。”郑自馨严肃道。

满地蹦蹦跳跳的小女孩们便又盘腿坐好。

“生灵者乃是从凡息中养真息，炼精化气，炼气化神；摄灵者则夺天地之造化，攫诸象之灵机，反哺于内。楚辞有云‘餐六气而饮沆瀣兮，漱正阳而含朝霞’，皆上古修士摄灵之道也。今方交卯时，阴阳相衔，尔等便随老身借此日月皇华修服芒之法。太霄紫真，明堂阴神……”

万秋闭目凝神，随着讲师的口诀渐渐入定。如方才一般，她面前又出现了“鬼魂“影影绰绰的轮廓。女孩刚开始在梦境中日复一日地面对她时很紧张，一年多后已习以为常；只是不再做梦而已，反正梦境同样是脑中无法控制的事物，和鬼魂并无太多区别。

The Night-mare LIFE-IN-DEATH was she.
