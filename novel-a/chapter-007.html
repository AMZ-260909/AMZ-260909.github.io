    <script type="text/plain" id="chapter-text">
飞机的恒温恒湿系统让一切都很舒适；睡衣是熟悉的；床品泛着浅淡的薰衣草香；温热的蜂蜜牛奶送下半片褪黑素；看护说了许多柔和的哄睡故事……但Juno还是难以入睡。

左右两排半掩的舷窗外三万英尺的高空和零下五十度的黑暗使她本能地联想到死亡，并引出最近的一系列事。漫无边际的联想持续了很久，直到苍白的太阳燃起——是飞机追上她在扈城道别的那个落日。不知缘由地，女孩开始流泪。

其实她未曾料想那封邮件会得到这种形式的回复。她那时只认为最后Gian会解决掉收养事件，这样母女三人还可以继续原本的生活——不怎么好的生活，可也有一些不怎么坏的时候。

但这些都被莫名妙毁了。

手环可能让医生注意到她的哭泣，但人们都格外专业地保持安静。Juno没有摘下眼罩，只不断用湿巾拭去溢出的泪水。情绪平复后，她起身去洗脸，然后要求换一套床品。

不久后，飞机落地补给。她那时在看书；短暂的白昼里，她读完Euripides的Ion，吃了一点东西，直到窗外再次暗去才疲倦到昏睡。

醒来时，女孩发现自己躺在宽敞的车后座上；大概是睡得太沉，被从飞机上抱下来也没有醒。

车里的冷气比莫眉的公寓还足，牛皮内饰的微涩味和香氛里的泥土气息都让她恶心。她坐起身，把毛毯裹好，感到头痛并且眩晕，耳朵也因为气压变化很不舒服。

后座的另两位乘客是助理之一和儿童看护，前者正从恒温吧台里取出一杯饮料，“我们还有十分钟的路程。这是姜汁苏打，可以让晕车的感觉好一点。”

“或者你想嚼点薄荷软糖吗？”看护递上一小盘味道清甜的糖果。

温热的饮料确实让女孩的胃部不再痉挛，她的双耳也伴随着吞咽不再疼痛。Juno看表，现在是23点。

微讯有风和光发来的生日祝福，她简单回复已抵达，一切都好。几分钟后，车辆驶入庄园，车道两旁开始有幽暗晶莹的地灯，一路引到主屋前。Juno穿好外套走出车外，听到不远处海潮绵长的起伏、四周寒风筛过树冠的簌簌，然后被出来迎接她的庄园经理Ruby和随行两人围进锻铁雕花玻璃门去。

门厅内的陈设馨雅冥谧，壁上点着几支烛形灯泡，楼梯旁悬着一幅暗金浮动的挂毯，绣满栩栩如生的宫廷人物。Ruby之前已和Juno通过几次视频电话，因而只简单问候几句行程就带女孩向二楼卧室走去。

上楼梯时，即使早就下定决心要表现得波澜不惊，Juno也忍不住多瞥一眼那金光熠烁的挂毯。花绣精致到她在匆行间依旧看得清乐手们丝绒外套上的细褶。

她们将她送去房间门口。Juno拒绝了床边故事服务。锁好门后，她先去丝绒落地长帘前审阅一番，又检查所有镜子，才彻底松弛下来。洗浴间明显翻新过，比卧室本身现代化得多；女孩强忍疲惫，仔细将自己冲洗干净，换上印着朱伊纹的内衣裤、睡衣裤、袜子、睡帽，拉开层层叠叠的雪白丝幔，沉入诡谲的梦境。

大约七小时后，Juno起床洗漱。她昨晚已看到长榻上铺着一套起居服，倒免去在衣帽间挑选的烦忧。走出卧室前，女孩回想看过的布局图里二楼晨间室的位置——没客人时通常在那里吃简餐。

然而没走几步，她听到轻快的脚步从身后某间卧室跑跳而出，转头便与那女孩打个照面。

“Morning, Audra.”Juno先开口。她知道Gian和Leora去Patagonia采风，但Georgina和Audra却是在家的。

“Oh my God! You know my name!”Audra大呼小叫道，“Geo! Georgina! Juno is here! She looks nothing like her pictures. She looks like Leora, only more—”

“Audra, don’t be rude.”另一道柔和嗓音盖过Audra兴奋的尖叫；Georgina慵倦地站在晨间室门口向两个妹妹挥手，微蓬的长发用鹅黄缎带松松束起垂在背后。“Nice to meet you, Juno.你感觉怎么样？”

“Good.”

“I had the worst jet lag when I got back from Japan. I couldn’t sleep right for days. But Japan was amazing.”Audra目光灼灼地盯着新姐姐，“You’re from Hu City, right? I’ve seen videos. It looks so cool. We’re going when all the lockdowns are over. Is it really as cool as it looks?”

说话间两人走进晨间室，Audra跳到Georgina身旁，和姐姐并排站着冲Juno友好地笑。这对异父同母的姐妹长得不大像，Georgina明显是华裔；Audra则像极了Gian，很难辨认血统。

三个女孩互相瞧了几秒，Audra受不住这沉默，大声笑起来，“Sorry, it’s just... you’re really quiet. Not like Leora. Which is probably a good thing. I don’t think I could take another Leora. Can we eat?”

十分钟后，Georgina和Audra已熟悉新姐妹的风格：话少。

不过Audra见过的人几乎都比她话少，因此并不觉得Juno格外古怪，转而开始计划后天晚上举行一个三姐妹秘密通宵派对来作为欢迎仪式。

Georgina形容这是一个恐怖的点子，“We have school the next morning, and it’s literally Juno’s first day.”

“Oh come on Geo! She'll survive one night without sleep. Won't you, Juno?”

Juno觉得不妨接下挑战；于是Audra立即表示要去找Ruby讨论派对主题和游戏，并强调两个姐姐不许偷偷打听细节。

“So Ruby knows.”Juno望着Audra兴高采烈离开有些不解。

“Ruby will know, half the house will know. Just not your dad. That's Audra's definition of secrecy.”

“But he will know.”

“Of course he will know. And he knows how to play his part. We all do. Audra likes to run the show.”

“Because she's our little sister?”

“Well, partly. Because we love her. And now you get to be part of it too.”

Juno感谢继姐的解释，虽然她并不认同其中的逻辑。不过她也不是很在乎弄明白这件事，就像不在乎刚刚Audra说“looks like Leora only more”之后的那个词是什么；在她看来，Audra或者Georgina只是像庄园布局一样需要适应并掌握的东西。

也许尽管莫寻秋已被弃用，但女孩还没发自内心地成为Juno Vane。

Juno平静地继续享受早餐，吃饱后对Georgina打个招呼后就打算离开。她这几天的日程很满：今天上午Ruby会带她游览整个庄园，认识重要的工作人员，并将生物信息录入安全系统；下午会有考官来与她进行机考ISEE；明天参加定级测试，还会有家教来评估她的体能，为她选择一到两门运动课程，大概是pickleball或者softball之类。

“Off to find Ruby? I imagine she's busy weathering our little storm now.” Georgina却也起身道，“I could give you the grand tour if you like. I'm sure Ruby wouldn't mind.”

出乎Juno意料的是，Georgina竟并不只和她在主宅里走走玩玩扮演导游；事实上她们只去一楼与主厨、内务主管简单交谈几句就换上外出衣物。出门后，Georgina跳上一辆琥珀色高尔夫球车的驾驶位，娴熟地插好钥匙，示意妹妹上车，“There’s room for drinks in the back. Want to bring something?”

“Is this legal?”

“The manual says 16 and up, but I've been driving this thing for months. Trust me, we'll be fine.”

好在Georgina没有辜负Juno的信任，小车在清冽的晨风中平稳穿行过一株株高大的糖槭和红栎、修剪整齐的黄杨绿篱、覆霜的矮玫瑰枝和褪色的紫阳花球；甚至她还有余裕向妹妹介绍，“The fountains are off and the flowers are all gone. You should see it in spring. Quite different.”

秋末冬初确实不是这里最好的季节。露台外的泳池覆着池盖，烧烤区的桌椅罩着防尘套，果园的丰收早已结束，林地中的古树木叶脱尽，如其间隐蔽着的老建筑般庄严但透出枯败气息。直到驶入湖区，Juno才眼前一亮：银蓝湖水像巨大的璀璨甲虫伏在凉亭、船屋、木椅和石雕间，四五只羽毛粼粼的水鸟们在码头悠闲散步；不远处一栋洁白古堡静坐在苍黄的草坡上，看起来颇为神秘。

“That's the antique instrument collection. One of the original buildings, dating back to 1900. Had a few makeovers since. Shall we go in?”

Juno唯一了解的乐器是之前家里客厅的三角钢琴，但仅限于听宁蓁指法滞涩地弹过几次，那架琴更多地起装饰作用；不过经过一个多小时的游览，她目前很希望去室内解冻片刻。

Georgina好像一点都不觉得冷，进入博物馆后先去咖啡角要了一杯芙蓉花茶冰沙。Juno捧着滚烫的马克杯望向大厅富丽堂皇的穹顶，“How long does it take to see everything?”

“About two days, I'd say. But no, we're not doing the whole tourist thing. I just want to show you a private gallery. It's my favorite. Then we'll head over to the stables, the putting green, loop back through the woods and we should be in time for lunch.”

这间秘密展厅在博物馆深处的一翼，门旁的黄铜牌刻着【THE GEORGINA VANE GALLERY】，下面一行小字是【In memory of Georgina Vane (1922–2011)】。

“She was your dad's great-aunt. He named me after her.”Georgina验证指纹后又输入密码，厚重的门才缓缓打开，“They say she designed this gallery herself. There's so much more than just musical instruments in here, all sorts of wonderful little oddities...”

展厅比走廊暗许多，秾丽的香气代替光线迎接访客，蜜饯、沉香、玫瑰、薰衣草、茉莉、草莓、橙花和黄玉兰相竞绽放。之后在幽微闪烁的珠光宝气中，Juno看到七个不同色彩主题的侧室，里面除玻璃琴、theremin、daxophone等乐器外果然还有各式古董。她走近略一扫视，发现其中六个侧室的展品分别来自六大洲，唯有第七个不像南极洲风格——何况南极洲也没有人类文明——而且未安装任何防护措施，比起博物馆展厅更像一间书房，正对侧室入口的甚至是一张桃花心木百宝嵌弯桌。

女孩好奇地端详桌上的几样珍玩，见最精巧显眼的是一枚方印，黄金印座四面刻有繁复的兽面、花叶与几何纹样，烟水晶雕成的印纽状如山峦，山内纵横交错着绚丽的宝石矿脉，稍微转换观赏角度便折射出新异图景。

“An old friend gave it to her. You can pick it up if you like. It has a little surprise for you.”

Juno依言拿起方印，掌中山体随着晃动发出细碎的矿石互击声，又有点像风铃或者笑声；将印翻过来则看到与churrigueresque工艺风格迥然不同的鸟虫篆字，可惜她只认识左上角是【陸】，以及右下角想必是【印】。

“It's from around 1802. Quite a masterpiece, isn't it?”

“Not bad for its age.”Juno装腔作势地点评道，“A little ornate for my taste.”

Georgina微笑，“I suspect the artist behind it might beg to differ.”

Juno对二百多年前的工匠的异议很不以为然，但仍小心翼翼将印放回原处，又转去观赏其余侧室，听继姐如数家珍地介绍那些藏品。当她们打算离开时，Georgina提示Juno可以带走一件，“I thought you might like something to remember your first day here. Pick anything you fancy.”

“Is this legal?”

“She left it to your dad's first daughter. Lucky me.”

Juno认为自己才是Gian的第一个女儿，但看来这位曾姑奶奶的遗嘱上没有写明biological daughter。既然如此，女孩就心安理得地挑选了一件任谁都能看出奢华的钻石冠冕，据说是某位公主的遗物；毕竟朋友的生日就在月末，它很适合风和光那时戴着炫耀，或者至少可以让她不要因为自己不在而难过。

Je m'apparus en toi comme une ombre lointaine!
