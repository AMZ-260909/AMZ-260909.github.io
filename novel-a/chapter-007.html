    <script type="text/plain" id="chapter-text">
宁蓁离开后，风和光知道莫寻秋已经没了玩耍的心情，便收拾起桌游用具。
      
“阿秋，你别生气啦，我妈这人其实挺重感情的，又一直偏心莫名妙，看她突然不见了难免多问两句。她平时是不这么多话的，你也知道，她一般都不会烦你。” 
      
莫寻秋嗯了一声，平静道，“莫名妙被人收养了，理由是要拍大制作。”
      
风和光手中动作微顿，随即笑道，“什么？没听说过拍电影还要收养演员的，听着不好笑吗？”
      
两个女孩对视一眼，彼此都读懂了那种微妙的意味。风和光开始格格笑个不停，害羞但又溢出快意。莫寻秋没有笑；她突然想到一件毫不相干的事——她不讨厌好朋友笑，大约因为她总是知道对方为什么笑；如果我能知道妹妹为什么笑，我还会恨她吗？
      
也许还是会。毕竟她不止一次试图杀掉我，而且每次都差点成功了。也许下次她真的会放百草枯。
      
在得知仇人的遭遇后，风和光一扫愁闷，开始转播八卦。
      
“阿秋，我好像知道我舅舅当年为什么要和我们断绝关系，原来都是因为我舅妈。昨晚，我在我外婆病房里躺着，我舅舅和我妈以为我睡着听不到，就说了好多话。我总结了一下，大概是我舅舅当年公司刚有起色时认识了我舅妈，但我舅妈不是扈城的，所以我外婆不中意，可舅妈很快怀孕了，我舅舅一定要和她结婚，就像中邪一样，最后还把我外婆和我妈赶出家门。结果后来我舅妈生我表妹时不知道出了什么意外，反正整个人愣愣的，估计和我外婆现在差不多，我妈说这都是报应。我舅舅已经和她们分居，又来找我们。真不晓得他反复变脸是有什么毛病，真怕过一阵他又把我们赶走……”

“你可以来找我。我不会被赶走。”
      
风和光莞尔，“那我妈怎么办？”
      
“她自己没有朋友吗？”
      
“我妈说打算去我舅舅公司上班嘛，应该会给自己找点退路吧。我也许明年暑假就会去看你。我打算去美国读高中。其实我初中就想去，但我妈妈一定不许。哎，离高中还有好多年，你说，我们会一直这么好吗？”
      
“会的。”
      
风和光想再得到些安慰，病房此时又有人走进来；是莫眉的亲姐姐。
      
她对莫寻秋并不如何亲密。莫眉生前已多年不和家里人联络。姨甥对答两个来回就陷入冷场，医生刚巧又来查房，风和光便提出领莫盈去找宁蓁。
      
莫寻秋面对医生的询问并没全说实话；她不太相信医生，即使对方确实救回她的生命。
      
她也暂时没有告诉风和光。倒不是因为不信任，毕竟关于生父的事她就从没瞒过朋友。但另外一些她更倾向于不说，比如未命名文件夹、差点被莫名妙杀死、或者这种古怪的后遗症。
      
忠诚是一种需要精心修剪信息来栽培的植物。
      
第二天，莫盈离开扈城；又三天后，宁臻再次踏入莫寻秋病房，同行的是七八个衣冠楚楚的陌生人，大多不是亚裔面孔。

那时两个女孩正坐在沙发上一起看Everything Everywhere All at Once，风和光见此情景迫不及待想走过去，但朋友还捏着她的手腕；不过很快，莫寻秋已松开手并站起身。
      
一番问候之后，宁臻提出去会议室进行接下来的文件讲解和签署流程；风和光不能跟过去，只能坐在病房里等待。她很久之前就羡慕阿秋的家境，又有点庆幸自己不是她。总是羡慕比庆幸多一些。时过境迁，依然如此。
      
由于莫寻秋目前没有法定监护人，程序走得比较快，但总还需要一段时间。这群人除却专门为此事而来的律师和法务外，还有两个生活助理、一位私人医生以及一名富有经验的儿童看护，这四人更专注于莫寻秋本身。她们向她展示许多Gian和Leora，以及Georgina和Soleil的照片与视频；并收集莫寻秋对房间布置、食物口味等各方面的偏好。
      
九月逐渐变成十月、十一月，莫寻秋也逐渐变成Juno Vane。
      
她期间回过一次莫眉的公寓。那时案子已经按扩大自杀结了。她需要决定那间公寓里各项物品的去向。
      
桂花甜味悉数散尽，由于被彻底搜查过，各处都凌乱、肮脏且陌生。
      
她不打算带走自己房间里的任何东西。从前她在意这个房间，因为只有它是她的。她也没去看莫眉的卧室，她对那里一向避之不及。她只打算从莫名妙的房间带走一件睡衣，那件曾是她的衣服已被宁蓁洗净烘干后叠得整整齐齐，虽然风格与周遭的衣物不同（莫名妙更喜欢花里胡哨的睡裙），但一同挂在衣柜里竟也并不违和。
      
莫名妙大概早就忘了这些。莫寻秋想，即使没忘也会矢口否认。她需要证物来提醒凶手整件事从哪里开始。
      
风和光则在莫寻秋的房间饶有兴趣地看这看那，就像她每次来这里一样，“阿秋，这些你都不带走吗？那我随便拿了哦。”
      
莫寻秋点头。她相信风和光会把承载两人记忆的东西重新变得整洁熟悉。“你不是要和我说你的事吗？”
      
“哦，是啊，这几天医院人太多，我都没法和你好好说话，虽然她们给我们很多自由空间，但是，感觉怪怪的。我感觉那个心理学家好像觉得你……是吧？你觉得她会和你爸爸说吗？虽然她说不会，但是我觉得她会。”
      
“Gian不会在乎。”莫寻秋知道，如果在乎，父亲会亲自过来。但他甚至没和她单独通话过。
      
“你有没有问Georgina和Soleil的妈妈是谁？她是怎么去世的？你爸爸真是——”一向很擅长说话的风和光也有点不知道该怎么形容。
      
“她们说她是一个华裔钢琴家，生Soleil的时候难产。”
      
“生孩子有时候会这样。”风和光好奇心被满足后就开始说自己的事，“我舅舅一直没带我去见我舅妈或者我表妹，但我问过他我表妹在哪里上学，他说在长虹学校，和我们一届。我不是认识好几个那边的朋友吗，就打听了一下；我那个表妹，宁涉雪，从一年级就戴着口罩，那时候还是2018年呢。她还戴着助听器，好像说话也有点问题。学习还行，但是人很内向。怎么样？我妈听完之后好像完全原谅我舅舅了。”

莫寻秋没有评判此事。她站在被扯开的羊绒长帘旁，默默望着窗玻璃上自己浅淡的倒影。
      
“阿秋，你在看什么？”风和光走到朋友身旁。
      
“你认为世界上有鬼魂吗？”莫寻秋不知道莫眉是否还站在窗外。
      
“说不定有吧。好像很多人会梦到死去的亲人。你梦到过莫阿姨吗？我看到网上很多人都说过这种。”
      
莫寻秋那一瞬间几乎想对风和光说出自己的秘密。
      
但她最终只是摇头，“我不相信鬼魂。”
      
The past is a very determined ghost, haunting every chance it gets.
