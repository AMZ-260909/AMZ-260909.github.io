Saturday, February 3, 2024. Sunny, 25–39°F.
今天早晨女孩们邀请班里同学一起在庄园内的恒温泳池里玩捉迷藏。泳池一侧是七扇法式拱形玻璃门，门上满是氤氲绵雾；明清清的冬阳从无数水滴落痕处倾泻入池，浮荡出千万白亮光斑。
      
这一轮是Leora抓人。她戴着全黑泳镜在水池里灵活游动；周围四散的女孩不停互相朝对方泼水，引得Leora去捉，Soleil更是时不时就贴近她挑衅地大笑一声然后飞快遁走。
      
Juno躺在池畔的藤椅上，一边吃冰镇葡萄一边与风和光语音；另一张藤椅上是上一轮捉累了的Georgina，正啜着果汁朝泳池里抛五颜六色的水弹——倒计时停止后手里的水弹越多可以加越多分。
      
“……嗯，规则就这些。”
      
“听起来很好玩啊！对了，你们今年spring break定了去哪里吗？上次没见到Leora，真可惜。”
      
“我祖母的父亲是意大利人，他和我祖母都住在Lombardy，我们可能会去拜访他们。”
      
“可惜我妈妈不许我今年去和你们玩。”风和光遗憾道，不过很快语气一转，又欢快起来，“对了，我有一个特别特别重要的事要和你说。我舅舅不是上个月终于带着我表妹来跟我还有我妈一起吃饭吗，后来我微讯和她说话她回得还挺正常的，再然后我今天去她家玩了！我还是没见着我舅妈。不过你还记得吧，我和你说过，她当年怀孕之后和我舅舅吵架然后带球跑了很久，后来被我舅舅找到已经生了我表妹然后人也不知怎么就疯了。然后，但是，我看到了我表妹小时候的照片！在她家书房里有一个相册，我估计那个书房很久都没人去过了，全是灰。那些打扫的人也真是的，每次估计只清洁一下她们平时用的那几个房间。哎，总之，你知道吗，我表妹小时候的照片——你自己看吧！我先去洗漱！”

Juno有点不解，好朋友为什么这样断定自己会对一个陌生人的童年照片有兴趣？她先把耳机收进盒子，再拿起放在一旁的手机点开微讯聊天框。
      
喧哗的光影和水波忽然远去。
      
几秒后，计时器发出尖锐响声——这局游戏结束。
      
Leora摘下泳镜，游到岸边跃出水面，轻快地笑着舒了口长气：“I’m sitting the next round out. Soleil, just you wait!”
      
“She’s already waiting for me.”Georgina含笑起身，下水前又转头问Juno要不要一起。
      
Juno越烦乱时越不希望别人发现，因此随手把手机扣在桌上，欣然加入游戏，然后不巧抽it。
      
黑暗中，她一边游动着抓捕猎物，那张照片同时浮现在眼前挥之不去。
      
照片里的宁涉雪大约只有四、五岁，还没经历过那次不幸的事故（据风和光说是5岁半时家庭影院的电池组爆炸后起火），梳双马尾，穿公主裙，对着镜头有点羞赧地微笑，背景应该是扈城迪士尼乐园。
      
但她长着莫名妙童年时的脸。
      
莫名妙5岁时早已不会因为镜头而害羞；她的照片也不会出现在宁臻妻女住所的一间蒙尘已久的书房里。
      
Juno一直怀疑莫眉当年收养女孩的动机。母亲那时必然认为此事有利可图。但为什么要把妹妹捏在手里多年都不变现？如果莫名妙没有意外走红怎么办？而且莫眉一直有点畏惧莫名妙的亲生父母找到她，说明并非完全不知道那对夫妻的信息。
      
女孩之前的结论是：莫眉一开始一定认识他们，但后来被动失去联络。
      
结合现在的事实，她认识的应该是宁臻的妻子，那女人精神失常后自然不可能再联系莫眉；再之后莫名妙的成长轨迹逐渐歪斜，莫眉就只能希望对方永远不要找到自己。
      
好在母亲已经是lucky ghost，对方即使恢复寻找能力也已太晚。
      
Juno决心先专注眼前的游戏。她抓到的一个人是Soleil。太阳恶魔终于耗尽活力而速度减缓，被Juno扳住肩膀赶上岸去。
      
Soleil大口喘着气，瘫倒在藤椅上时还不住狂笑，笑完又拿起冰椰奶猛灌。Leora已等待这一刻许久，友善地等她放下杯子后才复仇。两人在岸上打闹追逐，Soleil束手就擒时依然奋力挣扎，不意失手把搁在桌上的一杯饮料打翻。
      
“Oh crap, whose phone is this?”
      
“It’s Juno’s.”Leora也连忙抓起手机用一旁的干浴巾擦拭。手机还没自动锁屏，翻转亮屏后两人都看到了那张放大后布满屏幕的女童照片。
      
“Whoa, this looks so familiar. Is that MiMi Mariner when she was little? I follow her on TikTak too. I had no idea Juno was her fan. She’s never mentioned it...”Soleil想细看，Leora已经按锁屏键并把手机放回原位。
      
“Soleil, quit being nosy.”
      
“Being curious isn’t a crime! The screen was literally already on! And liking a famous actress is totally normal, right? I didn’t really like V3NUS, though. It was terrifying. But MiMi was so cute! I kind of want a little robot following me around all day too.”
      
“They’re already talking about a sequel. The production company reached out to me last week about possibly doing the score.”
      
“Oh, really? That producer is super famous! Did you say yes?”
      
“Not yet. It’s not really my kind of thing.”Leora顿了顿，又微笑道，“Then again, maybe. It could be interesting. Might even be fun to try something different. Anyway, enough talking. You rested up? Good. Choose your weapon!”
      
Juno上岸时看到两个妹妹正一如既往地追打嬉笑，就径自从桌上拿走自己的手机离开。
      
她心不在焉地冲澡后回到自己的房间，给朋友拨回语音去。
      
从声音听起来，Helena大概已半入睡，“阿秋，你觉得我要告诉我妈还有我舅舅吗？我觉得没必要……我舅舅，我感觉他根本就不喜欢我表妹，他自从又恋爱之后也不再去看我舅妈了……”
      
“他们知道也不会怎样。她已经被收养了。”Juno截断女孩的跑题。
      
风和光笑了，“当然，没想到啊，她真能这么红，看来她一定好努力的……我妈要是知道，哎，算了，还是只有我们两个知道就够了，我和我妈现在关系已经够差了。莫名妙肯定也不会想要我舅舅舅妈当她的爸爸妈妈，她一定会讨厌所有和我有关的人。而且如果没被抱走，她可能会被烧死，没死也要天天上学不能当明星……我也好烦上学啊，你说我妈为什么一定要我高中才……”
      
风和光的抱怨渐转为混沌的呢喃，毕竟华国此时已将近午夜。
      
Juno听着耳机里好朋友悠长的呼吸声，靠在沙发椅里回想往事。她记得很久很久以前，她们都很小很小的时候，妹妹抱着宁蓁的腿哭着说想去幼儿园；因为前一天自己给她背新学的古诗，并宣布她以后会变成一个可怜的文盲。
      
那时莫名妙还会经常大喊着“姐姐”来缠自己，很难赶走；与Helena也没有针锋相对，甚至两人会一起在自己要赢下游戏时联手耍赖，不断要求重来一局，直到她们取胜为止；自己也从没怀疑过莫名妙的身世，虽然两人从头到脚无一处相似，但那又怎么样？
      
“我们一定是异卵双胞胎。”她对妹妹严肃讲解这个当时看来无比冗长且专业的术语，“你不需要和我一模一样。”
      
她转而又去思考另外的可能：如果莫名妙没有被收养呢？自己不会联系父亲，莫眉也许不会死，母女三人会由于Helena而一起见到宁臻，对方一定会发现莫名妙的长相像当年的妻子或者毁容前的女儿……
      
女孩对这样多的巧合隐约感到古怪，但十一岁零三个月的她还不知如何着手研究命运。
      
Does the walker choose the path, or the path the walker?
