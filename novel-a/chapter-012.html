Saturday, February 3, 2024. Sunny, 25–39°F.

今天早晨Audra邀请班里同学一起在庄园内的恒温泳池里玩捉迷藏。泳池一侧是七扇法式拱形玻璃门，门上满是氤氲绵雾；明清清的冬阳从无数水滴落痕处倾泻入池，浮荡出千万白亮光斑。

这一轮是Leora抓人。她戴着全黑泳镜在水池里灵活游动；周围四散的女孩不停互相朝对方泼水，引得Leora去捉，Audra更是时不时就贴近她挑衅地大笑一声然后飞快遁走。

上一轮捉累了的Georgina正站在池边朝水里抛五颜六色的潜水宝石——倒计时停止后手里宝石越多可以加越多分。Juno则躺在池畔的藤椅上，一边吃冰镇葡萄一边与Helena语音；经过后者的持续努力，她今晚第一次获准在表妹处留宿，于是当晚与朋友来来回回几次通话到深夜还意犹未尽。

“……嗯，规则就这些。”

“听起来很好玩啊！对了，你们今年spring break定了去哪里吗？我打算试试和雪儿一起去旅游，如果我妈同意的话。我舅舅一定同意的。要是能和你们碰面就好了。”

“我祖母是意大利人，我们会去Tuscany拜访她和她父亲。”

“诶那还是有可能的，欧洲不容易被怀疑。”风和光欢快起来，“对了，我还有一个特别特别重要的事要和你说。刚刚我挂电话之后和我表妹在她家逛了逛，我们在一楼的一个书房里看到很多相册，我估计那个书房很久都没人去过了，全是灰，那些打扫的人也真是的，每次只清洁二楼我表妹常用的几个房间……总之，你知道吗，我看到我表妹小时候的照片啦，我还拍了一张给你看！嘿嘿，我先去洗漱，你自己看吧——”

Juno不太明白好朋友如何断定自己会对陌生人的童年照片有兴趣，但摘下耳机后还是拿起放在一旁的手机点开微讯聊天框。

喧哗的光影和水波忽然远去。

几秒后，计时器发出尖锐响声——这局游戏结束。

Leora摘下泳镜，游到岸边跃出水面，轻快地笑着舒了口长气：“I’m sitting the next round out. Audra, just you wait!”

“She’s already waiting for me.”Georgina含笑起身，下水前又转头问Juno要不要一起。

Juno越烦乱时越不希望别人发现，因此随手把手机扣在桌上，欣然加入游戏，然后不巧抽到it。

黑暗中，她一边游动着抓捕猎物，那张照片同时浮现在眼前挥之不去。

照片背景应该是扈城迪士尼乐园，里面的宁涉雪显然还没被烧伤（据风和光说是5岁过年时偷偷在家玩仙女棒时遭遇意外爆炸），露着漂亮的脸羞赧地对着镜头微笑——但那是莫名妙童年时的脸。

Juno一直确信母亲收养妹妹时必然认为有利可图，而且并非完全不知道妹妹亲生父母的信息，但为什么捏在手里多年都不变现则是个谜。她猜想过母亲和那对夫妻有私怨，但莫眉似乎并不很担心对方因为莫名妙爆红而找上门，甚至复杂神情中还包括某种期待；所以女孩更倾向于母亲在拿到莫名妙后被动失去了与对方的联络。

结合现在的事实，她认识的大概是宁臻的妻子，此人在生产不久后就精神失常，自然不可能再联系任何人。

可宁臻又没有精神失常，就算没注意到MiMiMeow，总该到处找找另一个女儿吧？

Juno暂时想不通。不过母亲如今已是无需承担任何责任的lucky ghost，妹妹在美国也有一套合法身份，所以她决心还是先专注眼前的游戏。

第一个被抓到的是终于耗尽电力而速度减缓的雷暴恶魔；Audra大口喘着气，跳上岸后瘫倒在藤椅上还不住狂笑，笑完又拿起冰椰奶猛灌。

Leora已等待这一刻许久，友善地等她放下杯子后才复仇。两人在岸上打闹追逐，Audra束手就擒时依然奋力挣扎，不意失手把搁在桌上的一杯饮料打翻。

“Oh crap, whose phone is this?”

“It’s Juno’s.”Leora也连忙抓起手机用一旁的干浴巾擦拭。手机还没自动锁屏，翻转亮屏后两人都看到了那张放大后布满屏幕的宁涉雪童年照。

“Whoa, this looks so familiar. Is that MiMi Mariner when she was little? I follow her on TikTak too. I had no idea Juno was her fan. She’s never mentioned it...”Audra想细看，Leora已经按锁屏键并把手机放回原位。

“Aud, quit being nosy.”

“Being curious isn’t a crime! The screen was literally already on! And liking a famous actress is totally normal. I also like V3NUS and MiMi is so cute! I kind of want a little robot following me around all day too.”

“They’re already talking about a sequel. The production company reached out to me last week about possibly doing the score.”

“Oh, really? That producer is super famous! Did you say yes?”

“Not yet. It’s not really my kind of thing.”Leora顿了顿，又微笑道，“Then again, maybe. It could be interesting. Might even be fun to try something different. Anyway, enough talking. You rested up? Good. Choose your weapon!”

Juno上岸时看到两个妹妹正一如既往地追打嬉笑，就径自从桌上拿走自己的手机离开。

她心不在焉地冲澡后回到自己的房间，给朋友拨回语音去。

从声音听起来，Helena大概已半入睡，“阿秋，你觉得我要告诉我妈还有我舅舅吗？我妈要是知道……哎，算了，还是只有我们两个知道就够了，我和我妈现在关系已经够差了，我不想再和她提疯猫。不过莫名妙肯定也不会想要我舅舅舅妈当她的爸爸妈妈，人家是国际大明星呢，如果没被莫阿姨抱走，她可能会被烧死，或者至少要天天上学……我也好烦上学啊，你说什么时候我们才能……”

风和光的抱怨逐渐在跑题中转为混沌的呢喃，毕竟华国此时已将近午夜。

Juno听着耳机里Helena悠长的呼吸声，不由得想到很久很久以前，她们都很小很小的时候，妹妹抱着宁蓁的腿哭着说想去幼儿园；因为前一天自己给她背新学的古诗，并宣布她以后会变成一个可怜的文盲。

那时莫名妙还会经常大喊着“姐姐”来缠自己，很难赶走，与Helena也没有针锋相对；甚至她们会一起在自己要赢下游戏时联手耍赖，不断要求重来一局，直到她们取胜为止。自己那时从没怀疑过妹妹的身世，虽然她从头到脚与自己无一处相似，但那又怎样？

“我们一定是异卵双胞胎。”她记得自己对妹妹严肃讲解这个当时看来无比冗长的术语，“你不需要和我一模一样。”

Juno的伤感被一只翠蓝羽毛的鸟惊扰。

三足青鸟倏忽停落在面前茶几上，一霎不霎地与她对视。

可能是蓝鹂。但蓝鹂也没有三只脚的。Juno不情愿地想，也许我的脑部病变有所加重。

但加重的程度超出她的想象，因为那鸟低头啄下一根侧羽，羽毛飘在她手里时化作一张素色砑花纸信笺，暗纹颇有几分东方古典美，其上用墨字写着：

“Don’t be afraid.

My name is 三青. I come from the Nine Lands, where people can live for hundreds of years.

They learn magic, gain powers you have never seen, and travel farther than you can imagine.

But if you choose that life, you can never come back.

The people who love you will forget your face.

The people who hate you will forget your name.

All trace of you will be gone.

like one grain of sand taken from a desert.

You can choose to stay and forget we ever met.

Your life will go on as before.

But I will not come again.

Now you may ask three questions.

Then give me your answer.”

这些字Juno可以同时读到英文、华文和她熟悉的所有语言的版本。一种十分奇妙的体验。她想，如果她没有疯，那魔法真的很酷。至于其中的内容——Juno认为这所学校至少比霍格沃兹讲道理，不入学也不会变成Obscurial。

“为什么修士需要去九州，是因为我目前所在的现实不存在仙术之类的超自然现象吗？”

Juno原以为青鸟会再叼一根羽毛下来，但它却开口说话，声音慈祥得给孩子讲故事的老妇人。

“存在，当然存在。九州没有开辟之前，修士们一直在尘世修道，现在尘世也依然有人修炼。只是在这里修炼速度慢，心法也落后，耗费一世至多修到金丹；但在九州，十年后从学宫毕业时每年都有几个学生已经结丹。何况，你若不记得这场梦，选择修炼的可能性微乎其微。”

“为什么踏道后不能再回来？”

“为了保护尘世。尘世是所有新修士的摇篮。凡人们对修士来说实在脆弱。从前发生过一些悲剧，所以后来规定修士必须斩断尘缘，违背这条共识的后果很严重。”

那么并不是不可返回，是不许返回。这对Juno来说是最重要的。

“如果一个人忘了我……”女孩郑重地思忖片刻，“那我之前给她的东西还会存在吗？我教她的题她还会做吗？”

“她的所有知识和技能都会保留，物品也依然存在，只是会记成从另外的人那里得到的。人类的记忆本就松散，魔法很容易就能弥合这样的伤口。”

Juno无意与对方辩论。她一边给出自己的决定，一边想，无论开辟它的人本意是否如此，但九州听起来就像一个大号的Vane Family：修士们享受着尘世无法利用的资源，过着凡人难以企及的生活，入场券则是与生俱来的某种东西。

就像她会选择放弃莫寻秋而成为Juno Vane，她也会理所当然地放弃Juno Vane并步入更适合的人生。这次看起来更轻松，Helena如果不记得我也就不会难过，等解决掉我手头的麻烦后再回来找她也很方便。

随着Juno表示愿意离开，信笺又变回鸟羽。

“你有二十分钟来选择行李，用羽毛点过的物品会被直接送到宿舍。如果没有被送去，那就试试点些别的。这里是幻境，你可以去任何你曾去过的地方，但那些地方只会有你一个人。去吧，孩子，最后看看你的家。”

三青说完就凭空消失。

Does the walker choose the path, or the path the walker?
