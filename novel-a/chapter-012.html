    <script type="text/plain" id="chapter-text">
Juno的沉思被一只翠蓝羽毛的鸟惊扰。三足青鸟倏忽停落在面前茶几上，一霎不霎地与她对视。

可能是蓝鹂。但蓝鹂也没有三只脚的。Juno不情愿地想，也许我的幻觉问题有所加重。

但加重的程度超出她的想象，因为那鸟低头啄下一根侧羽，羽毛飘在她手里时化作一张素色砑花纸信笺，暗纹颇有几分东方古典美，其上用墨字写着：

“Don’t be afraid.

My name is 三青. I come from the Nine Lands, where people can live for hundreds of years.

They learn magic, gain powers you have never seen, and travel farther than you can imagine.

But if you choose that life, you can never come back.

The people who love you will forget your face.

The people who hate you will forget your name.

All trace of you will be gone.

like one grain of sand taken from a desert.

You can choose to stay and forget we ever met.

Your life will go on as before.

But I will not come again.

Now you may ask three questions.

Then give me your answer.”

这些字Juno可以同时读到英文、华文和拉丁文等她熟悉的所有语言的版本。一种十分奇妙的体验。她想，如果她没有疯，那魔法真的很酷。至于其中的内容——Juno认为这所学校至少比霍格沃兹讲道理，不入学也不会变成Obscurial。

“为什么修士需要去九州，是因为我目前所在的现实不存在仙术之类的超自然现象吗？”

Juno原以为青鸟会再叼一根羽毛下来，但它却开口说话，声音慈祥得给孩子讲故事的老妇人。

“存在，当然存在。九州没有开辟之前，修士们一直在尘世修道，现在尘世也依然有人修炼。只是在这里修炼速度慢，心法也落后，耗费一世至多修到金丹；但在九州，十年后从学宫毕业时每年都有几个学生已是金丹。何况，你若不记得这场梦，选择修炼的可能性微乎其微。”

“为什么踏道后就不能再回来？”

“为了保护尘世。尘世是所有新修士的摇篮。凡人们对修士来说实在脆弱，如果有邪修返回后作恶，后果难以预料。从前不是没有发生过这样的事……所以后来干脆规定修士必须斩断尘缘。”

那么并不是不可返回，是不许返回。这对Juno来说是最重要的。

“如果一个人忘了我，那我之前教她的题她还会做吗？”

“她的所有知识和技能都会保留，只是会记成是自己学会或者从别人那里学到的；人类的记忆本就松散。”

Juno无意与对方辩论。她一边给出自己的决定，一边想，无论开辟它的人本意是否如此，但九州听起来就像一个大号的Vane Family：

修士们享受着尘世无法利用的资源，过着凡人难以企及的生活，入场券则是与生俱来的某种东西。

就像她会选择放弃莫寻秋而成为Juno Vane。她也会理所当然地放弃Juno Vane并步入更适合的人生。

随着她表示愿意离开，信笺又变回鸟羽。

“你有二十分钟来选择行李，用羽毛点过的物品会被直接送到宿舍。如果没有被送去，那就试试点些别的。这里是幻境，只有你一个人，孩子，去吧，最后看看你的家。”

三青说完就凭空消失。

之后风和光兴高采烈地用鸟羽在房间一阵猛点，回味着刚刚的三个问题答案。

——“就像你从未出现过一样，时间会自动弥合这种轻微的伤口，你在九州无法得知任何人的未来。”

——“可以带动植物，但不能带其他人类去。”

——“我只能告诉你她是否有灵窍，但我不能透露她的决定。她有灵窍。”

既然有灵窍，Juno一定是会去的。没有人比风和光更了解自己最好的朋友。

所以她们很快就可以见面，不需要乞求妈妈的恩准，不需要计算舅舅的花费。风和光衷心为此感觉无上自由和快乐。

二十分钟不算久，但女孩手速更快，甚至在最后两分钟还来得及去舅妈和表妹的公寓看看。

幻境中自然无需花费时间通勤，可惜也因此无从目睹舅妈的真容。但她把可能装有秘密的东西统统一顿点——奇怪，那些东西并没有消失。为什么？她拿舅舅公寓的东西就没问题。

风和光没有浪费时间思考，转而去其他她熟知的地方抓住最后一点时间搬运。

然后鸟羽忽然从手里飞脱，在女孩眼前一拂而过。

风和光发现自己站在一棵橡树下。

树下是草坪，周围站着的约有二三十个和她年纪相仿的女孩，其中一人正好站在她身侧不远处。

“Helena.”

“阿秋！我就知道你会来……”

她走了两步发现自己赤着脚，还穿着傻傻的嫩绿珊瑚绒大眼仔睡衣——光顾着点行李，也没换件衣服。不过大部分女孩都一副从床上被唤醒的样子，想必作为招收华裔修士的魔法学校，三青是在华国零点出现的。

“你怎么知道？”

“我问三青了嘛。”风和光没有问好朋友是否问起过自己，而是细看起环境。现在天光尚曚昧，云层渐染出晶蓝的曙色，约一亩见方的草坪四周环满木柱花架，架上攀藤附蔓，生着银粉、艳紫、玉白的香葛；没什么夸张的魔法痕迹。尘世的许多角落建出这样一处后园都不费什么功夫。

女孩们开始交头接耳，不少人问起对方家乡来历，或者猜测一会儿会不会有人从橡树里跳出来，要么乘着飞剑落下等。

“只有28个人诶。每年的新生这么少呀。”风和光感慨。

“这只是一个班级，九州每届新生都有一千六百多人。”

两个女孩下意识地向身旁响起的嗓音望去。不止是她们，所有眼睛都望向这个突然出现在树下的成年人，原本几名走向草地边缘的女孩也纷纷聚拢过来。

女人看起来二十出头，相貌和善，穿驼色针织开衫内搭白衬衣，左胸处配着一枚金属名牌：

【许无忧｜2024届庚午班助教】

“我是许无忧，你们可以叫我许老师。这里是九州十年制学宫，我是庚午班级的生活助教，会在这十年里陪伴大家。还有另一名学术助教晏老师，目前还在休假中，过几天会和你们见面。每届新生会分到十个校区，每个校区六个班级，各个班级的课程进度、资源都完全一样。你们第一周不上课，主要任务就是办理入校手续。手续的第一项是登记名字，登记后的同学来我这里领新生物资。”

许无忧的话语也自带多种语言的回声，说完后她向一旁微让，身侧便浮现一面空白全息屏。

新生们都被这一大段话灌得有些迟疑，Juno轻推朋友一把，风和光顺着力道走出几步，就反应过来朗声提议道，“那我们排成一行登记吧！这样也方便领东西。许老师，登记顺序没关系的，对吗？”

许无忧微笑颔首。风和光更有了信心。Juno带头走出几步站在风和光面前，于是立刻有三三两两的人跟到她身后。风和光又走到没去排队的女孩们面前柔声重说了一遍自己的建议。

很快大部分新生都排进队伍；风和光没理会最后游离的几人，径直走回最前面，鼓起勇气用手指尝试着轻击那片屏幕，指尖下出现一个小墨点。随后她便胸有成竹地在左上角写出自己的名字。

许无忧伸手从自己的挎包里掏出一只巴掌大的灰布袋递给风和光，女孩道谢后接过，并未急着打开看，只继续身姿端正地站在助教旁，冲下一个新生微笑。

In this world there are only two tragedies. One is not getting what one wants, and the other is getting it.
