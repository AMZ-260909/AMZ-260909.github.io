    <script type="text/plain" id="chapter-text">
新历2025年1月30日是周四，学年考试周的倒数第二天。相比下午的灵理和明天的数学，语言对万灵来说还算轻松的科目。

走进教室，鹿慕溪已提前到了，如她向来的习惯那样。这位老人对待教学很严肃；在课堂之外则很友好，比如之前为丁丑班在中秋晚会的音乐剧上伴奏——Maisie除做讲师外同时也是一位自由演奏家，非常看重万灵的音乐才华，为她介绍许多社交资源。

“祝你考试顺利。今晚我们的聊天很愉快，但我明天不会因此对你降低要求。”昨晚Maisie临别前微笑道，“几小时后见。”

语言课并不考谁掌握的语言门数或者单词量更多，毕竟九州的翻译器已历史悠久；而是更重视发音、词法、语法、句法和如何研究语言本身。尤其第一学年，发音是重中之重。对于万灵来说，自从有记忆起她就开始学习听音、辨音、记音；八个声调的区别不会比半音之间的差距更大，音节的长短不会比音符的时值更难辨认，一边听一边寻找规律更是她习以为常之事。

考试分三段，笔试包含四篇阅读，分别是古华语、拉丁语、古希伯来语和苏美尔语。古华语要求把给定的一段话分别翻译成现代华语和英语；拉丁语要将乱序词汇还原成语法正确、有意义的段落；古希伯来语要从一组词中辨认出共享的三辅音词根，并据此推断一个陌生词的含义；苏美尔语则要求把几个长单词切分出词根和各个形态语素。

这四门除却古希伯来语之外，都是万灵来九州后才接触的语言（Gian已受洗多年，因此Vane家姐妹四人都学过古希伯来语圣经），不过像其他科目一样，考试题比起课堂作业的平均水平简单许多。

几乎所有女孩们在规定时间内成功答完题目，进入听力测试。

“停之停之！这不是联谊课！”从琮看到Maisie一本正经地打开终端屏幕、但屏幕上竟然是一只鸟时，就突然产生不妙预感。

“鹿奶精神状态一向不详。”云共影叹了口气。

“接下来你们听这位修士的一段音频，转写出每个音素和声调的附加符号。”

鸟修士自然不说人话……但其实也不算超纲，九州音标系统本就可以标记一切声音。

最后是口试，每位学生又进入单独隔间，要求听一句陌生语言录音，只许播一遍，然后尽可能准确复述，并辨认出这门语言属于什么类型且给出依据。二十分钟后，隔间撤去，许多同学沧桑得像是过完了半生。

“我听到一个老太太在大声咳痰。我就一直等她说话。但，咳完就完了。我也完了。”

“你那是小舌颤音吧？我这个全是辅音，合理怀疑对方是伏地魔。”

“我的那个发辅音的时候像在打嗝。其实我不知道是不是她真的在打嗝。”

“我知道我拿到的是kuş dili，可是我吹不来口哨。”

“我觉得我的还行，如果是倒放的话。但好像不是。你们的音频有倒放的吗？会不会是音源有问题，我可以找鹿奶argue吗？”

“是VSO吧？”

“你禁止说话，万灵，你快跟鸟修士回西四州去。”

“谁比我惨，我那个人好多词都说两遍，我以为她是结巴，所以复述时每个只说了一遍，现在想起来她只在说名词时结巴。”

“我听到一堆碎玻璃声，不知道怎么重复，就表演了一段beatbox，说不定Maisie会给我一点创意分。”

“会不会反而扣掉态度分？”

“那我就去她办公室门口再表演个脖子与天花板拔河。”

“好主意，拔河之后的嗓子更有助于复述我的音频。”

“哎，赶紧考完吧，对了，后天开始放三天假，你们打算干什么？”

万灵对三天假期早已规划妥当。她打算把手头的新曲写完，并且要参加Maisie介绍的一些音乐从业者举办的线上workshop——虽然学宫禁止亲自与校外人士见面，但只要有一位教职工全程陪同，她就可以参与视频会议。当然她还要和尹荣泉、从琮等朋友们小聚两次；她享受和这些女孩们的社交，虽然已经一年，她仍然每次都能学到新东西。

于是三天就这样在充实与闲暇的交替间过去。

立春傍晚，丁区跨年宴上，宫长第一次露面，简短地说了些勉励之词。这位现任宫长叫谢长生，看上去是一位很普通的中年人，但修为已至渡劫后阶，听说飞升几乎板上钉钉。

万灵没注意这位前辈大能的致辞，一直在往丁未班看。也许是因为步入青春期，MiMi的双颊稍微消瘦些许，漂亮的眼睛定定望着宫长，一看就是在走神。

自从那次女孩从她面前跑掉，万灵就没再主动过。读懂MiMi的行为比和鸟修士对话容易许多：她就是无法接受我，在她那里，我无法作为单独的个体存在。

但前天与Maisie在工作坊结束后的交谈又让她有了些新想法。工作坊的最后一项活动内容是随机分组后为搭档写音乐肖像，万灵认为对方对她的描绘不是很准确。不过她没有当场指出，只是在视频会议结束后对Maisie说起这种感受。

“I feel like they’re kinda confusing me with Violet. Probably ’cause the stuff I submitted when I signed up was songs from灵丹妙药。”

“They’ve only known you for a few hours, after all. And honestly, audiences often blur the line between us and the characters we portray, or assume our work reflects who we are as people. But those things don’t always line up, do they?”

万灵被触动心事，便顺口问道，“So, Maisie, if someone likes my work, do you think they’d wanna get to know me? Or get to know the person I might make them... you know.”

“Yeah, I get it. Every musician goes through this. People only see the parts of our work they connect with, but when they actually meet us, they have to see us as whole people. And that can be a lot to take in.”

“Maybe I should just stay away from her. I don’t wanna hurt her, so I can’t get too close. But...”

Maisie心领神会了女孩难以启齿的部分，“Keeping people at a distance is the easy way out. But if you want someone to know the real you, you have to let them get closer, stick around long enough, and show them who you really are.”

“What if she doesn’t feel the same way about me?”

“You’ve always had sharp instincts, Leora. You’ve already felt there’s something there with her. That’s why you wanna get closer, isn’t it? You’re not someone who’d choose a person who doesn’t feel the same way about you.”

因此，在宴会结束，烟花满天时，万灵自然而然地走到正和所有人一般凝望着绚烂天幕的MiMi身旁。

“新年快乐，MiMi。”

女孩没有回头，也没有说话；不过也没有哭泣或者跑开。

万灵站了一会儿，看那些变幻的焰彩在MiMi眼里流转闪烁。她想过继续说点什么；她有很多话想说。但最后她选择安静地等待MiMi的回复。我得停留得够久，她想，空白本身也是某种语言。

长久的静默之后，MiMi像是自言自语一样嘟哝了一句Leora，又隔了几分钟后低声道，“你来和我说话是因为你讨厌我吗？”

“Don’t just assume what I’d think of you. But MiMi, I mean, you wouldn’t assume that for no reason, right?”

“我不能告诉你理由，但是我希望这一切都不是真的……我不知道我在希望什么……有时候我不知道我的很多事或者我在想什么。”

“Sometimes, I guess.我也是。事实上，我在尘世一直不知道自己喜不喜欢音乐。你能想象吗？”

MiMi被这句话吸引了注意力，终于忍不住转动眼珠。

“我没有告诉过所有人，我来九州的原因是我想离开音乐。I didn’t want one random morning, when I was 4 and climbed onto a piano bench, to end up defining the rest of my life. I mean, if my dad had been an antique jewelry collector, I might’ve become some kind of ridiculously talented bead artist instead.”

看到女孩露出听得入神的笑容，万灵感慨活人的建议还是比助手有用。“Once I got to NLA, I could’ve just stopped making music altogether. No one here knows me, and no one knows my music—”

“I know, I know a lot.”

“Well, I really appreciate it.你不是什么都不知道，MiMi，而且我不会讨厌喜欢我的音乐的人。”万灵停顿片刻后继续温和道，“But somehow, I chose music again. I actually enjoy it. I wanna be a musician. That’s who I’ve decided to be, and it’s got nothing to do with the kid I was back then. MiMi, you can still like me and my music, you know. I know there have been things between us that made you hesitate, and I understand that. But if you still want me as a friend, you can let all that go, just as I have.”

“可是我和你不一样，我不能不在乎她们，而且我看到你……有时候我会很难受。”

“Really? But we’re having fun talking right now.而且，我们现在也是一样的，一起聊天，一起看烟花。这是今年我们做的第一件事，我们都很开心。我们可以继续这么做，不是吗？”

“我……我不知道……”

“你可以选择相信我。我知道你总是不知道，总是害怕，总是放弃复杂的事。I’m not saying there’s anything wrong with that but I don’t want you to do that with me. Got it?”

MiMi还是不太明白；但她本就不习惯先想明白一切再做事。于是她笑了笑，然后越笑越开心，最后完全兴奋起来，“我真的可以什么都不在乎，想怎么做就怎么做吗？”

“Yeah why not?”万灵欣慰于女孩终于明白自己的意思，便将早就准备好的一段话说出来，“MiMi，我们可以尝试很多相处的方法，让你只感觉开心、不感觉害怕，比如我只弹琴，不和你说话。或者我可以戴上面具，就像从前在尘世时开音乐会那样。我把我所有的面具都带来了，你想看吗？”

这个诱饵起效了。

“我想看，要是可以不上课的话，我现在就想去。”

“Nope, we’ve got class now. We gotta hurry.你去年的各项考试感觉怎么样？”

“唔……反正助教说我已经不会被开除了。”

“我很高兴听到这个消息。助教和老师们也都会为此很高兴的。”

“谁在乎她们高不高兴啊？”MiMi丢下这句话就蹦蹦跳跳地跑掉，背影神采飞扬，和十几分钟前一点都不同。

万灵心满意足地走去教室，半路收到女孩发来的【新年快乐】和一大堆表情包。MiMi大概没有机会发给其他人，她想，这听起来真不错。回味着刚刚愉快的对话，万灵又想起去年今天在坊市和MiMi的第一次见面。那条手帕依旧在她的抽屉里，但乐句被编成了新曲子，她今晚一定要弹给女孩听。

今年的第一天显然比去年第一天的预兆更好；她们会像那些音符一样变成更新并且更好的东西。

The noblest art is that of making others happy.
