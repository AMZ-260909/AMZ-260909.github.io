    <script type="text/plain" id="chapter-text">
宁涉雪在妈妈醒来后的一年多里虔诚地期待妈妈再醒来一次，因为她后来思考妈妈给自己布置的计划时发现很多难题。

可惜奇迹从不复现。

于是女孩满怀焦虑地看着2024年立春前夕越来越近；妈妈说这一天她会去魔法学校。零点时，三青终于来了，而她太过紧张，没有问任何问题就说自己要去。

九州和她想象得完全不同。

虽然妈妈并没有仔细描述，但宁涉雪后来阅读许多仙侠故事，所以她是期待掌门师尊脚踏飞剑而来的新生之一；可事实上助教普普通通、同学们普普通通，以至于她仍是班里最特殊的那个。过敏事件则提醒她在魔法世界也依旧倒霉。最糟的是现在郑自馨的一席话，完全击碎女孩的踌躇满志。

妈妈是重返尘世的修士，我之后也要这么做，所以我们都是死刑犯。

这个结论很坏。死亡是浪漫史诗，死刑就有些阴森可怖，而死刑犯更可怜，一点都不好听。

在英雄们的故事里，拯救妈妈并为此违反规则甚至牺牲自己并不罕见，宁涉雪原本很顺利地接受这些代价；但现在正式踏上旅途时，她发现牢记在心的伟大计划变得异常沉重。

我必须做出决定。我必须走完我的路。

女孩在心里一遍遍默念着，心脏开始重新跳动。如果我什么都不做，那我遭受的一切就都白白浪费了，连我自己的名字都配不上。没有一位主角是因为害怕就停止前进的，也没有一位主角最后没有胜利。

我要选择我的身份。我要完成我的计划。

她做好决定时，助教也结束了训话，最后说之后的两天没有集体活动安排，记得12日0点准时去心法课教室，有任何问题都可以来找老师们云云。

宁涉雪没有细听这些叮嘱；反正她是不会去找她们的。除自己之外，九州没有可以相信的人。

解散之后，她快步回到宿舍。

前几天由于没有紧迫感，宁涉雪在集体活动后一直在学宫里四处闲逛。火灾后，她除了家、学校、医院外几乎不去任何地方，因此在空旷无人的草原跑跳翻滚对她来说很新奇；坊市也是一个美妙的地方，随意吃喝、拿取任何东西，无拘无束。她本来已开始有点喜欢九州。

现在她的新计划是尽快按妈妈说的读完新生手册。宁涉雪甚至有点惭愧自己为什么如此贪玩。从前她总是在假期刚开始就把作业写完。所以，她本该第一天就开始读它的。

关于学宫的事其实两位助教已经介绍得很清楚，因此女孩翻页很快，直到讲到灵网助手的那章才被吸引，放慢速度仔细阅读：

“九州有各种非人种族存在，器灵是其中之一。器灵诞生于修士飞升后留下的仙器（飞升者相关信息见第九章；现存仙器简介见附录Ⅳ），依附仙器而存在，唯一职责是维护仙器运转以履行飞升者的意愿。灵网器灵的天职是帮助任何需要帮助的人。但学宫已与三位助手均签订反作弊协议……”

协议原文很长，每位助手的协议细则甚至还略不同，大意就是学生可以像其他修士一样使用灵网，但灵网助手不会以任何形式代替学生完成作业或在考试之类的情况里提供辅助。除却学宫指南规定的作弊行为，一些授课老师可能会有额外要求，学生有义务仔细阅读课程教学大纲，如有违反依然视为作弊。

更重要的是后面的提醒：“灵网等仙器并非人族私产，器灵和修士的合作建立在双方友好自愿的基础上，因此学宫或任何组织无法擅自调取修士使用仙器的记录。具体到灵网，学宫仅在怀疑学生有使用灵网作弊的行为时，有权获得与此行为直接相关的信息。”

这些话给了宁涉雪一些信心，属于妈妈预判的第一步的最好结果。她当即从新生手册页面切换去灵网浏览器，应付完引导设置后点搜索框右边的助手模式，在弹出的对话框里输入【如果我搜索和我们课程无关的学术资料内容，会被判定为作弊吗？如果学宫怀疑呢？】

【Chelsea，你好，我是灵网助手九枢。

不会。

只有你获得的内容直接对应某一项正在进行的作业、测验或考试时，才构成作弊。

另外，学宫不能随意调取你的搜索记录或和助手的对话：它需要先有一位老师对某份具体作业或考试结果产生作弊怀疑，然后才能请求我们提供相关片段。】

宁涉雪不再迟疑，退出助手模式，将背得烂熟的网址输入浏览器。

网页跳转到一个俗套的个人摄影记录博客，最后一篇更新的时间是三十多年前；女孩仔细跳转到第70页，找到标题里带“阳”的日志，点进去后数到第21张图片，复制那张图片的链接名字中的一串字母，输入到日志搜索框并点击搜索。

弹出的结果是空白。至此开始等待。十分钟后，女孩在没有任何变化的页面上第二次点击搜索框，输入长长的密码，再次点击按钮，这回终于跳到真正的档案库。

宁涉雪看了两秒就依照妈妈的嘱咐关闭页面，无事发生一般返回新生手册继续阅读——妈妈说，首次成功登录后立刻退出，如无意外一年都不要再次登录；因此，她接下来可以做一年真正的新生。

她盯着手册，机械地翻页，根本没看进任何内容。几分钟后，女孩干脆关掉终端屏幕，摘下眼镜躺到地毯上，顺便把手心的汗水在衣服上使劲搓了搓。

妈妈说的都是真的。我不是在做梦。一切都是真的。

成功的口感如此辣而甜润，像她总是忍不住想再多喝一口的墨西哥式热巧克力。

我竟然做到了。不敢相信刚刚的那个人是我。也许每个主角都是这样，本来很普通，在被赋予拯救者的身份后就拥有成为拯救者的魔法力量。

回味许久，宁涉雪坐起身，有点茫然地环顾四周。

一个普通的新生现在具体应该做什么？她没有得到过详细的指示。

魔法力量飞快消退，她有点疲惫，并且脑子开始迟钝。

也许我应该像前几天一样出去随便走走。她认为这个主意很合理，于是戴好眼镜和口罩走出门去。但不知为什么，每个穿行在宿舍区的同学似乎都朝她看来——又似乎没有。她确定有几个女生冲她笑了笑。难道她们知道自己刚才在做什么吗？

宁涉雪紧张地抱起双臂，手指隔着袖子抓挠皮肤，快步走出宿舍区。她不想使用传送阵，因为老师们这几天都会在中心花园等待答疑，她害怕遇到老师。女孩胡乱朝某个方向走去，果然走出数米外就变回独自一人；但还是疑神疑鬼地转了好几次头。

你在害怕什么？宁涉雪困惑地想，你为什么要害怕？我已经读过规则部分，你没有违反任何学宫规定。接下来的一年我也不需要再冒险。你明明是安全的。

此时终端震动。

女孩被吓得几乎原地起飞，紧张地点出屏幕后看到通讯app弹出一条好友申请：

【“风和光｜2024届庚午班学生”申请添加您为好友】

【附加信息：雪儿，我听你们班同学说起你诶，真的是你吗？什么时候出来一起聚聚？】

Tis the wind and nothing more!
