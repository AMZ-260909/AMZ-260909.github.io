      <nav class="reader-controls">

    <script type="text/plain" id="chapter-text">
与其他五十九个班级一样，丁丑班宿舍东南院的四栋房屋每间面积约千余平方英尺，勉强还算宽敞。

万灵（曾用名Leora Vane）几乎不会讲华语，不过名牌的实时翻译功能让她轻松理解助教的所有指示。解散后，她走进宿舍，服下辟谷丹、换上校服、绑定终端，然后花三个多小时操纵控制面板将房屋的外观、内部粗略安排一番。

此时是清晨9点，时间尚充裕，女孩打算再找找是否有更多个性化商品以深入布置公寓细节。助教建议她去校区最外缘一周的坊市采买，并教她使用导航app。

宿舍到坊市步行时间大约5小时，导航推荐她使用传送阵。最近的传送阵就在中央花园——橡树并不是真树，只要轻敲两下树干，视线高度处就会亮起一圈显示着微缩版学区地图的屏幕。确认目的地后，树下亮起一束光，语音与画面同时提示乘客站在光圈位置；然后短暂地视线模糊，女孩已出现在另一棵橡树下。

脚下依然是草地，不远处则是一间间高低错落的亭阁，每间都稍隔开几英尺，形态各异。

万灵不到12年的人生里从未亲自买过任何东西，因此颇有些雀跃。

迎面第一家商铺显然是卖织物的，亭顶下垂吊一条条布料小样，每根布条下方都有一块编号牌。亭前悬浮着自助购物面板，输入小样编号后即可看各类成品；也可先筛选品类（如家居、衣物、装饰等）再查看符合的小样列表。面板的说明页有店主的简介，是一位布料艺术家，获过不少奖项，但成衣等商品设计来自多个合作商。

女孩打算再往前走走。也许是刚入学没多久的缘故，一百多个学生里选择来坊市的实在少，逛过去十一二家，竟一个人都没遇到。

商品种类繁多，衣食住行无一不涉及，但并没有任何明显带有魔法痕迹的东西，至少电器都还需要电线。万灵在其中一间亭子里挑了一组灯具，它们看起来就像几匹可以任意定型的苎麻素纱，无论作为吊灯还是落地灯都很合适。另一间亭铺中，她欣喜地买到一只古董铸铁浴缸，昏红烤漆外壁包着内里象牙白珐琅瓷，雕花缸脚镂刻玫瑰藤绕着狰狞兽脸，四爪攥住的铁珠形状都稍不同。

两件商品都直接配送去宿舍内。女孩渐入佳境，感觉和在尘世挑选物件也没太多不同。

不久后，她又相中一方水红丝棉手帕，这次她选择即时获取。丝帕角落绣着一小串五线谱，手指抚摸才读得出旋律。她尝试在心里把这段曲调补全，一时不禁有些入神，直到对面商铺内晃出一道急急蹿来的人影才不得已转脸看去。

是个身材瘦小的漂亮女孩。她竟然认识对方！是MiMi Mariner，好巧。看来她也认出了我。虽然我的粉丝不到她的十分之一，但也许制作团队和她商量过电影续集的配乐选择……

她含笑站定，习惯性地等对方先开口打招呼，同时努力辨认女孩名牌上的华语名字。

翻译系统对这三个方块迷宫只给出一串不明含义的字母，总之首字母缩写也是MM。

万灵因此忽然产生疑问：我的名牌上也是新取的华语名，MiMi又从没见过我的长相，怎么会确认我是Leora Vane？

紧接着令她加倍不解的事发生。

MiMi猛地扬手，饮料猝不及防地从万灵面前泼来；后者愕然侧身尝试躲开，但少许夹着冰粒的果汁还是淋溅进发间，蜿蜒着从她的额角与鬓丝滴淌。

肇事者得手后露出张牙舞爪的笑，“姐，你怎么还活着呀？真的好难杀啊。”

万灵一贯从容，也不由得怔然片刻才接受发生了什么。

很快她反应过来，MiMi一定认错了人。

女孩用刚买的手帕仔细抹去汁水，但湿冷粘腻的狼狈感却是擦不去的。从没人敢对她做这样的事，哪怕顽皮如Soleil也不会如此粗野。她皱起眉，但又因家教与习惯很快舒展出一丝若有似无的笑意。

“I’m afraid you’ve mistaken me for someone else. Still, I’m touched to think that our first meeting should have given you such pleasure.”

莫名妙认为莫寻秋无论是人是鬼都不会这么无动于衷，便迷惑地把目光从对方的脸上转去名牌，发现此人并非姐姐。

细看长相好像不大一样。一时说不上是哪里不同。但无所谓，世界上总有些长得像的人。莫名妙自己也经常被说像其他某个明星。

“Oh, whatever. 虽然你不小心把我的限量版芝士葡萄冰沙撞洒了，但我可以再去拿一杯。No big deal.”莫名妙将空塑料杯丢在地上，夸张地冲万灵露出刻薄的嘲笑表情，然后转身离开。

万灵无暇计较这句荒唐的解释，因为她必须优先恢复身体的清洁。

尽可能神态自若地从最近的坊市出口传送回宿舍后，女孩在花洒下用并不喜欢的沐浴用品把身体彻底洗净，才躺进浴缸，闭起眼睛浸入温热的水中。

那样近的距离，MiMi竟然能把自己认成另一个人；万灵思考后认为MiMi很可能认识Juno。

当然，她不会是Juno的亲妹妹，不过“姐姐”在华语里好像可以指代任何年长女性，就像bro并非仅指亲兄弟一样。MiMi的父亲John Mariner是华裔，或许与自己的生母认识，因此MiMi曾和Juno有过接触——甚至说不定一直保持联络。昨天Juno手机上不是还显示出MiMi的童年照吗？

万灵对Juno Vane在华国的过往一无所知，无从验证推想是否正确。虽然来九州前这对双胞胎已相处一年多，但Juno性格冷淡，对Leora尤甚；而Leora并不热衷讨好不喜欢自己的人，且初见那夜的两封诡异信件也一直使她对Juno心存隔阂。

她依旧怀疑对方是否谋杀了她们的……但又觉得这个揣测有些耸人听闻。不过，她还是尽量回避关于生母的话题。

其实在Juno来前，Leora也不谈母亲。就像没有亲自逛街购物过一般，她没有叫过任何人妈妈。最接近这个词的是Jean Ming，可惜她去世时万灵只出生一个多月，因而全无印象；不过，她见过Jean的半身雕像和许多照片，父亲也讲述过当年的故事。对Gian来说，女人是神秘的东方缪斯、出色的钢琴演奏家和歌手、完美无暇的爱侣。他甚至对没有血缘关系的Georgina也疼爱备至，因她是Jean的孩子。

自己的生母却没有名字、没有面容、没有故事，万灵也没问过父亲任何细节。

她知道答案可能折损她的自尊。

女孩将飘远的思绪聚拢回MiMi。在三青来到前，她其实已经打算同意为续作电影配乐。虽然剧情并不出彩，但主演对她来说很有吸引力；不仅是因为漂亮，万灵同样好奇女孩如何在稚拙的脸上同时交织出漠然、娇媚、残酷、热烈……她一直对独特又复杂的美丽事物情有独钟。

原来是隔着镜头才适宜观赏的美。真实的MiMi身上集合了谎言、暴力、粗俗、Juno的过往、母亲的现状等所有她不喜欢的一切。

出浴后，万灵换上便服去请教老师如何处理被有色饮品弄脏的衣物；在长辈们的悉心指点下，她很快掌握清洁机器的使用：先把东西放进去，然后合上盖子，再调整几个简单的设置就可以让机器运行；短暂几秒后，她获得一套崭新如前的校服。

但丝帕的清洗效果却不如人意；于是她再次前往花园。

“丝绸纤维的表面结构和棉纤维不同，洗这样的纺织艺术品需要考虑溶剂配比，还要设计更有针对性的清洁程序；宿舍里默认配置的清洁机器做不到这样的事。”宿管之一耐心讲解道，“万同学，你可以再去坊市找找功能更多的清洁机器，但这条帕子恐怕洗不回去了。”

如果父亲在这里大概又要说一些关于jazz的话。That’s the thing about life. Things don’t always wait until we’re ready for them. They happen suddenly, and only then do we learn what we need to know and come away with experiences that are uniquely our own....

“万同学，这块小手绢你打算怎么处理？”助教温柔地问道，“我可以尝试联系这位艺术家看看是否有相似款式。”

说实话，这块曾经美丽的手帕看起来很糟：水红丝绵光泽全无，发皱而且干涩，布满深浅不一的外圈昏黄、内里脏紫的污渍，原本记录着乐谱的法式结粒绣更是被洗出细微毛绒感，软塌塌地糊在帕面上。

万灵审视它片刻后微笑，“Perhaps I can make something new of it. That’s the thing about art.”

The love that reassembles the fragments is stronger than that love which took its symmetry for granted when it was whole.
