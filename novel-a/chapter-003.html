    <script type="text/plain" id="chapter-text">
宁臻默默把被遗忘的屋门关好，跟在母女两人身后下楼，打量妹妹揽着的小女孩。女孩一手按紧小臂的伤口，一边转头好奇地盯着他。她很像妹妹小时候：白净和婉的长相，温顺可爱的气质……但如果是妹妹，此时此刻会哭泣不休——事实上也正是如此。      

泪流满面的宁蓁最后还是坐进宁臻的车；但这不代表任何事，她竭力告诉自己，并庆幸女儿的存在可以显得自己的落魄并非枉费。      

“小凤凰，你大名叫什么？”宁臻决定从乖巧微笑地与自己对视的外甥女入手。

“我叫风和光，风和日丽的和，风光无限的光。我现在读四年级，后年上初中。”      

“嗯，四年级，那你打算去哪所初中啊？”      

“我最好的朋友肯定能去毓华中学，我也想去。不过什么初中都一样啦，我只想赶紧长大工作，让妈妈不要再那么辛苦。”      

“这样哦……”      

宁蓁木然听着，想起当初莫眉说要送孩子们读小学，自己觍颜请她帮忙的事。她无力责怪女儿，只能装聋作哑，拖延自己屈服的时间。      

到医院后，医生为风和光清创，说不需要缝针。宁蓁的表情总算松弛些许。于是三人离开诊室后，宁臻试探地问道，“小凤凰，你外婆身体怎样？”      

“外婆……她……”风和光不复方才的伶牙俐齿，有点拿不准地望向妈妈。      

“她外婆在里屋躺着。当年脑溢血，后面没再醒过。”      

“对不起，蓁蓁，当年……”      

从这句话开始，一切顺理成章。所有人都知道会发生什么，那么事情就会发生。      

风和光不想参与兄妹的火葬场桥段；大人们总有许多社交游戏。她不喜欢妈妈，妈妈一生都随波逐流；她更看不起宁臻，认为此人除钱外一无是处。她目前只关心为什么莫寻秋还是没有回自己五小时前发的消息。      

她再次检查网络。然后检查自己的措辞。只是问阿秋明天是否来自己家吃饭。去年她就来了。应该没什么问题。即使不来，莫寻秋也会拒绝得干净利落。今天在学校也一切正常。      

是因为那两个来接她的女人吗？但这种情况以前发生过很多次，莫眉时不时叫助理来接莫寻秋直接去餐厅，而她换助理又很频繁。妈妈说离开莫家时见到她们三人一起往回走，那外出吃饭是对得上时间差的。难道，她真的要出道？绝不会，她看不起那些事，莫阿姨也一直督促她好好学习……      

正在此时，手机微震，滑过短短的【不去。】      

【好吧，阿秋，我知道了。那我明天可以去找你吗，我要告诉你，我这里发生了一些】风和光打字到一半又删掉，只回复【好哦，那周二学校见】和两张常用的晚安表情。      

她知道朋友不会再回复，就把手机藏回口袋，无精打采地加入兄妹苦情戏的尾声，尝试协助舅舅说服妈妈。

风和光对于莫寻秋的判断向来准确。莫寻秋看完晚安表情后就熄灭手机屏幕。

但直到深夜三点，女孩还静静坐在黑暗中。    

房间里本有一扇窗，但被羊绒长帘掩没；房门边缘贴着厚厚的密封胶条，隔绝门外的光线与气味。莫寻秋一向习惯把东西放在固定的位置，黑暗不会阻挡她的行动，甚至她常常因此感到完全掌握自己房间内的一切——除了穿墙而来的哭声。      

好在通常对于莫寻秋来说，妹妹的哭泣比笑声动听得多。      

她有时会一边翻看那个文件夹一边听。一个未命名文件夹，里面的视频包括被戳烂眼珠的龙睛金鱼、放在烧红铁片上的蜗牛、挣扎翻滚在杀虫剂里的白额高脚蛛，以及一些类似状态的其他动物。最早的视频是受伤昏迷的人类儿童，具体来说是莫名妙。      

和莫名妙有关的视频拍摄于2021年9月2日凌晨，但导火索是8月的最后一个周日。那天莫眉惯常不在家。莫名妙一大早就猛擂莫寻秋的房门。      

莫寻秋谨慎地没有开门，在屋里询问对方来意。      

莫名妙很早之前就开始对她直呼其名，当时却嗫嚅道，“姐，我好害怕，我床上有血。”      

莫寻秋打开门，先去观察妹妹床单上棕色发硬的部分，然后从莫眉卧室里卫生间的橱柜中找到她们需要的东西，并教莫名妙如何使用。虽然她并没有经验，但产品说明写得很详细，她们第一次就成功了。      

“姐，你不要告诉妈妈。”莫名妙坐在马桶上，环着莫寻秋的腰，又顺手用姐姐的睡衣擤鼻子。      

莫寻秋对于妹妹的恩将仇报感到恼怒。不过她不吃惊，莫名妙总能把一切弄得又脏又乱，甚至从今天开始又多了一种弄脏物品的新方式。      

“我不会告诉她。但她会知道。”莫寻秋把莫名妙带着拉丝鼻涕的头从怀里推开，并索性把已经无法再穿的睡衣脱下来给妹妹擦脸。      

“我会死吗，姐姐？”      

“会的。生物都会死。”      

莫名妙突然又笑得停不下来。      

莫寻秋讨厌妹妹的笑有许多原因，其一就是对方常常笑得莫名其妙。随即空调开始吹风，寒冷让她更加不适，她就决定回自己的房间去，洗澡、换新睡衣——睡裤、内衣裤、袜子和拖鞋也都重新换上同套的。      

妹妹没有再来敲门；到下午，莫眉回来，很快开始和莫名妙吵架。      

这对母女几乎每天都吵架。这次莫寻秋隐约听到的缘由是莫眉怀疑莫名妙从她屋里偷拿东西，而后者拒不承认。偷窃只是莫名妙斑斑劣迹中微不足道的一项，莫眉通常会大骂女孩一顿了事；莫名妙有时不会反抗，有时会反抗并挨打。      

但这些都与莫寻秋无关。      

那天的争吵较为激烈，最后以莫名妙的房门被踹开、莫眉将女孩拖出来殴打、女孩哭泣认罪为结局。      

可是几天后，也是秋季学期的第一天，莫寻秋放学回来时看到自己的房间门锁被撬开：日用品横尸遍野，纺织品碎尸万段，纸制品焚尸扬灰，抽屉们横七竖八在地上像被盗墓贼洗劫过的空棺。      

莫名妙则在客厅被一根粉色亮面牛皮革腰带抽得满地爬，金光闪烁的V字皮带扣在空中仿佛永不停歇般跳跃，带起尖锐的呼啸声和破音的惨叫。      

莫寻秋观看了一会儿行刑。不长不短的一会儿，莫名妙的哭声逐渐变小，也不怎么挣扎了。      

莫眉有点醒酒，尴尬地望大女儿一眼，“明天会有人来给你修门锁。”说完，她扔下皮带，叮叮当当地换上行头又出门去。

莫寻秋绕过客厅的狼藉去冰箱里拿宁蓁做的食物。吃完晚餐后，莫名妙依然躺在原地。      

由于妹妹的诸多前科，莫寻秋很怀疑这是陷阱，但还是凑近观察。      

她发现莫名妙好像在发烧，叫不醒也推不醒，只好回房清理出一片空地，拿几条浴巾平整对齐地垫在地上，然后使劲把妹妹拖去自己房间。房门关好后，她用沙发椅暂时代替门锁，然后像考古学家一样把陵墓尽可能恢复原貌，清点损失的物品。      

半小时后，莫名妙依然没醒，体温越来越高。      

莫寻秋把妹妹的衣服脱掉，看到万紫千红的伤痕。      

也许莫名妙真的会死。      

意识到这个结论，她决定用手机拍摄一些视频把活着的妹妹先保存起来，然后用更多的浴巾把女孩盖好，只露出口鼻，又从厨房找到一只完好的杯子倒满热水放在旁边。      

之后的几小时，莫寻秋交替做更换热水和整理房间这两件事。第二件事完成后，她坐在莫名妙旁边一边看书一边等待对方死亡。      

“I am not blind, you know. For years you’ve looked askance      

at the homes of rising Carthage, feared our ramparts.      

But where will it end? What good is all our strife?”      

当她读到这里，已经凌晨五点。遍体鳞伤的莫名妙突然复活，慢慢起身扯掉裹尸布，懵然环顾四周，最后抓起地上的玻璃杯喝掉温水。      

莫寻秋从妹妹手里抠出空杯子，重新打满温水又塞回去，“你还活着。”      

“我不知道。我以为我已经被她打死。”      

“我也以为她会打死你。”      

杯子又空了。莫寻秋又把它倒满。莫名妙再次喝完后表示不需要更多水了。      

“你还会死吗？”      

莫名妙再次无来由地笑起来，“人都会死的，你自己说的。”      

令人厌烦的笑声让莫寻秋重新回到现实，因而开始愤怒，“你为什么砸坏我的房间？”      

“那咋了？她也把我的房门弄坏了。我告诉她是你带我进她房间偷东西的，她不相信。”莫名妙也怒道，“为什么你就从来不挨打？”      

事实上莫寻秋五岁之前也挨过两次打，后来她就学会不再成为莫眉的目标。但她不想谈论成功经验，只想报复妹妹的过河拆桥。      

“她不会打我的。我和你不一样。”      

“我们一样，我们是双胞胎。”      

“不。你不是她生的。”      

“你发什么疯，我为什么不是她生的？我们是双胞胎！”      

“我上一年级的时候，她告诉我一定要好好学习，以后去美国找我爸爸，找到我爸爸之后，她就可以跟着我和爸爸在美国生活。我爸爸是美国人，而且很有钱。你和我不一样，你不需要上学，你没有爸爸，也没有妈妈，你是她用来赚钱的假女儿，所以她总是打你，她不在乎你。”      

“你骗我，你疯了，你在胡说些什么？”莫名妙对这段恶毒的话感到恐怖，如莫寻秋希冀的那样开始大叫。      

“你和我长得一点也不像。”      

“这个叫异卵双胞胎！她在骗你，你真傻！要是我们的爸爸在美国，为什么他不早就把我们都接走？”      

莫寻秋当然考虑过原因，结论是对方也许无法忍受莫眉；但此刻她选择采用莫眉所说的理由，“因为他在考验我。我看过我爸爸的照片，还有他的名字、他的房子。他有一个特别大的庄园，我以后会住在那里。不过，我去美国的时候不会带走你的，你会回垃圾堆去。”      

莫名妙不愿相信，但对峙几秒后不得不信，只能暴怒地把玻璃杯扔向对方。      

后者则早有预料地躲开，并心满意足地看妹妹嚎哭着跑出房间。

What a glittering prize, a triumph you carry home!
