    <script type="text/plain" id="chapter-text">
母女吃完晚饭后，通常宁蓁收拾碗筷，风和光去写作业。但今天注定是意外的一天，对莫寻秋如是，对风和光也如是。
      
有人敲门。
      
“你约同学来家里玩了吗？”
      
风和光摇头，“是妈妈的朋友吗？”
      
宁蓁也摇头。
      
母女都有些不安。
      
“也许是房东。”宁蓁站起身，隔着门大声道，“孙阿姨吗？有什么事？”
      
敲门声停下。屋里屋外陷入静默。
      
宁蓁强自镇定，走过去看猫眼，然后惊得连连后退。
      
“蓁蓁，是我。”
      
她本以为看错了，但这个声音佐证她没有。是宁臻。但他来做什么？快十年了，但模糊的猫眼抹去细节，使哥哥的身形面容依稀未变。
      
“妈妈，是坏人吗？要不要报警？”风和光轻手轻脚地走到宁蓁身旁，小脸紧绷，攥着一把从厨房拿来的剔骨刀。
      
“是坏人。但是……把刀放回去，乖囡，去房间里写作业吧。没事的。”
      
“蓁蓁，你先开门好不好？”
      
风和光睁大眼睛，“这是……他是我爸爸吗？”
      
“不是。你没有爸爸。小凤凰，去写作业吧，他，这个人以前是你舅舅。妈妈会处理好的，你回去，去吧。”
      
她语无伦次地将女儿往卧室推，脑海里已经乱成一团。
      
门外是中学时偷偷帮她把暑假作业补完的人，是大学时每次拿到奖学金都给她转过去的人，是还没毕业就忙着创业并说以后会代替父亲撑起这个家的人；但也是他一次次地和母亲争吵、因为自己说他色迷心窍就摔门而去，然后任凭她们在泥淖里年复一年腐烂沉没……
      
宁蓁耳膜嗡嗡作响，血涌上头蒙得眼前一阵花黑，最后是女儿的哭声让她回过神来。
      
不知怎么回事，但母女拉扯间刀尖划伤了女孩的右臂，血像泪水一样涌出。宁蓁惊叫着在屋里四处走来走去寻找碘酒。不行，要赶紧去医院看看……
      
“我们去医院，快走。”她只抓起手机就打开屋门，看也没看门外的人；但那个人用力拉住她的手臂。
      
“放开！我女儿要去医院！”
      
“我司机在楼下，我们载你去我公司的医院，你现在叫车还要等，去公立医院挂号也要等。”
      
宁蓁甩开那只手。但风和光忽然停下脚步插了一句：
      
“我见过你的表情包。你是那个至臻网络科技公司的董事长。”
      
她眼含泪珠，哭腔犹存，但这句话吐字十分清楚，“为什么你是我舅舅？妈妈没有哥哥。”
      
兄妹的目光齐齐凝聚在女孩脸上，彼此没有交汇，但宁蓁再开口时气势已然低落下来，无法再假装对面是陌生人。她没想到女儿会知道宁臻。网络真是——真是比什么都可怕。在她童年时，普通小学生不可能知道游戏公司董事长的长相名字。
      
手机游戏、直播、短视频、社媒、热梗、表情包……2022年的一切真是烂透了。
      
宁臻默默把被遗忘的屋门关好，跟在母女两人身后下楼，打量妹妹揽着的小女孩。女孩一手按紧小臂的伤口，一边转头好奇地盯着他。她很像妹妹小时候：白净和婉的长相，温顺可爱的气质……但如果是妹妹，此时此刻会哭泣不休——事实上也正是如此。
      
泪流满面的宁蓁最后还是坐进宁臻的车；但这不代表任何事，她竭力告诉自己，她永远不会原谅他。
      
汽车开动后，她知道哥哥在看自己，便庆幸女儿的存在可以显得自己的落魄并非枉费。
      
“小凤凰，你大名叫什么？”
      
“我叫风和光，风和日丽的和，风光无限的光。我现在读五年级，后年上初中。”
      
“嗯，五年级，那你打算去哪所初中啊？”
      
“我最好的朋友肯定能去毓华中学，我也想去。不过什么初中都一样啦，我只想赶紧长大工作，让妈妈不要再那么辛苦。”
      
“这样啊……”
      
宁蓁木然听着，想起当初莫眉说要送孩子们读小学，自己觍颜请她帮忙的事。她无力责怪女儿，女儿乖巧聪慧得让她心碎；她无法责怪母亲，母亲已无从担负任何责备。她只能装聋作哑，拖延自己屈服的时间。
      
到医院后，医生为风和光清创，说不需要缝针。宁蓁的表情总算松弛些许。于是三人离开诊室后，宁臻试探地问道，“小凤凰，你外婆身体怎样？”
      
“外婆……她……”风和光不复方才的伶牙俐齿，有点拿不准地望向妈妈。
      
“她外婆在里屋躺着。当年脑溢血，后面没再醒过。”
      
“对不起，蓁蓁，当年……”
      
从这句话开始，一切顺理成章。所有人都知道会发生什么，那么事情就会发生。
      
风和光不想参与兄妹的火葬场桥段；大人们总有许多社交游戏。她不喜欢妈妈，妈妈像NPC般没有半点主见；她更看不起宁臻，认为此人除钱外一无是处。她目前只关心为什么莫寻秋还是没有回自己五小时前发的消息。
      
她再次检查网络。然后检查自己的措辞。只是问阿秋明天是否来自己家吃饭。去年她就来了。应该没什么问题。即使不来，莫寻秋也会拒绝得干净利落。今天在学校也一切正常。
      
是因为那两个来接她的女人吗？但这种情况以前发生过很多次，莫眉时不时叫助理来接莫寻秋直接去餐厅，而她换助理又很频繁。妈妈说离开莫家时见到她们三人一起往回走，那外出吃饭是对得上时间差的。难道，她真的要出道？绝不会，她看不起那些事，莫阿姨也一直督促她好好学习……
      
正在此时，手机微震，滑过短短的【不去。】
      
【好吧，阿秋，我知道了。那我明天可以去找你吗，我要告诉你，我这里发生了一些】风和光打字到一半又删掉，只回复【好哦，那周二学校见】和两张常用的表情。
      
她知道朋友不会再回复，就把手机藏回口袋。眼前的苦情戏也差不多到尾声，兄妹在争执如何安顿外婆；风和光无精打采地加入谈话，尝试协助舅舅说服妈妈。
      
In this world there are only two tragedies. One is not getting what one wants, and the other is getting it.
