中秋虽有晚会，但17日仍要正常上课，只第二天无需早自习，吐纳也缩减一小时。

风和光本以为这一天自己会很紧张表演的事，然而作为晚会上半场的主持人，她需要关注的流程细节很多，直到庚辰班学生上台、她换上表演服饰时才有空开始紧张。

按学宫传统，由于庚乃阳干，庚区六个班级的表演顺序是从子到戌：今年庚子的节目是观潮鼓阵舞蹈，编排得比较简单，不怎么出彩但容错率很高，个别人出了小问题也不影响整体观感；庚寅演嫦娥盗药小品，其中几个主角都很爱临场加戏，风和光反复叮嘱她们不要演得兴起超时，幸好正式演出正压着超时十分钟的红线结束；庚辰的是舞火龙，不是关键位置的话难度也还好。

接下来便是庚午班的昆腔舞台剧。

风和光只会出场几分钟，且是和好几个人一起，算是群演。经过擅长钢琴的好朋友的悉心指导，她那支【忆萝月】目前还过得去，虽然只是对她自己来说。

对金同尘来说，风和光的水平离差强人意还有一截，不过风和光自八月后就谎称太忙，没有继续一对一练习；尽管对方的教学态度比董容容还温和，但风和光总觉得站在钢琴前就浑身不舒服。

“我可能对钢琴过敏。”她将这件事讲给万秋时笑道，“我好几次怀疑自己犯了荨麻疹。”

“让她换弹其它琴。”

“算了算了，本来就是麻烦别人，再提太多要求有点不好意思，而且我也快学会了。到时候我会唱小声点，我打算上台时偷偷把麦关掉，要是如意她们问起来，我就说忘了打开。”

因此她妆饰完毕后还特意试按几次头麦的开关练习手感。

此时纪微缈已在报幕：

“火龙翻舞、照彻长夜，庚辰班的气势让我们感受到了暑气未尽的热烈之秋；而现在火光落、月光明，我们将跟随庚午班同学走入千年前的尘世，点一炷香、拜一场月，从旁人无心之言中求得命运的答案。接下来请欣赏——《拜月听香》。”

第一场

〔念白〕汉末，董卓跋扈日甚一日，诛戮大臣、悉逞己意。立朝者，人人自危。

〔侍女鸣珂、佩玉左右拥簇貂蝉上〕

【秋夜月】〔貂蝉〕一轮圆月天中，雾濛濛，懒对红尘悲喜，掩仙宫。千人颂，万人恸，自从容。修就冷辉冰骨，道心空。〔掩泪介〕只恨我难做明月。

〔佩玉〕小姐连日心烦意冗，不知怎生是好？

〔鸣珂〕奴乡中有个古风，对月问卜后捧了香绕街，听得头句话便是天机，再寻个老人家圆解圆解，许能教小姐暂释愁怀。

〔貂蝉〕真个有这等事？ 

〔鸣珂〕真个的，今日恰是中秋，小姐可要试试？

【明月斜】〔三人祝拜介〕轻捻香，神仙听，忧去路风云晦明，求天叩地期相应。

【月当厅】〔貂蝉〕忍泪俯跪婵娟下，焚香祷尽，愁对青烟。锦绣谷中，纤指枉断朱弦。孤守寸心黯黯，为苍生、祸难最堪怜。勿轻我，红颜何论，社稷山川。捐躯誓欲除民患，纵身微、也思荆楚先贤。拟妙计成，甘揽重担横肩。能斩贼人殿头死，愿飞丹血落堂前。临欲去，浑难寐，展转自熬煎。〔掷杯介〕

〔鸣珂〕一仰一合，是个圣杯！神仙允了姐姐问卜。咱们快擎了这炷香，绕街听去罢。

〔三女持香下〕

第二场

〔露天酒肆里四酒客围坐一桌，三女上〕

〔鸣珂〕小姐你看，前头有几个人吃酒哩。

〔貂蝉〕有酒想来有话，到墙角后头躲一躲，听他们说些甚么。

〔众酒客倒酒、饮酒、摇头、叹气介〕

〔佩玉〕怪哉，这许多人，怎的连句闲话也无？

【秦楼月】〔貂蝉〕秋声寂，只言片语无从觅。无从觅，寻向梦中，梦也惊惕。举杯缄口压声息，启唇饮酒犹吞泣。犹吞泣，辛酸苦楚，万音皆匿。

　〔鸣珂〕小姐休慌，这叫哑巴香，不打紧，咱再往别处走一遭。

第三场

〔高台上艺人手持鼓板说唱介，围坐听众三人〕

〔佩玉〕这里有人声气，必能得了。

〔貂蝉〕捱近些，仔细听听。

〔艺人击板介〕……分财利多自与鲍叔不以我为贪知我贫也吾尝三战三走鲍叔不以我为怯知我有老母也！

〔鸣珂〕小姐，这人是个外路人，言语又快，奴只听见一句甚么老母。

〔佩玉〕奴听见他头里说是分梨，想必是孔北海从小让梨的话儿。

〔貂蝉〕我听的却是三战三走。孔北海几时上过阵来？这怎生也合不到一搭去。罢，且掷杯问问神仙。

〔两侍女纷争中貂蝉掷杯介〕

〔鸣珂〕两个仰面，是个笑杯！小姐，这太阴星君教咱再去听哩。

【月中行】〔貂蝉〕南腔北调语声喧，嘈切辨听难。似言边戍战风澜，又似让梨欢。繁繁古话纷纷乱，神仙笑、一对杯翻。世癫我辈亦痴癫，月下往来还。

第四场

〔木栅里两名斗鸡徒各抱假鸡模型呼喝对斗上，五个赌徒推搡介〕

〔赌徒甲〕哈哈！俺的把你的杀了！

〔赌徒乙〕啧啧，真个晦气！走罢，走罢！

〔貂蝉〕你们可听真了？

〔佩玉〕但这杀不杀的言语好生利害，不知要怎么解。

【西楼月】〔貂蝉〕风声肃肃更声促，步动香尘紧逐。〔三女急行介〕意慌心怯掷双杯，〔貂蝉掷杯介〕但见并头平地伏。

〔佩玉〕哎呀！是哭杯！ 

〔鸣珂〕小姐莫怕，真个那话头也不好听，神仙说不作数哩。咱再走走，另听些吉利的补一补。

【月当窗】〔貂蝉〕秋凄露泫。杀声惊宵半。耳畔金戈纷乱，身犹动、神已散。心叹。誓不变。同焚亦无怨。惟恐夜长香短，志未展、魂先断。

第五场

〔莲塘里众童坐小舟上〕

【忆萝月】〔合〕金风吹后，朱落青蓬瘦，争采香枝扬素手，绿刺暗伤红袖。水碧夜冷秋幽，紫菱白藕满舟，玉鬓粉衣先走，兰谣俪曲空留。〔船尾季如意折莲介〕

原与辉：“嘿，摘错了！”

躲在入口处看表演的旁白话一出口，突然反应过来自己一直没关麦，连忙闭嘴退回幕后装死。

台前演员被这变故弄得更是都有些慌张，季如意忙伸长手臂去抓本该摘的那朵并蒂莲，然而道具船已绕向幕后，绷直手臂只揪下一朵，嘴里那句“花开并蒂、好事成双”一时说不出口。

风和光暗道糟糕，急忙打开麦胡乱编了句“好一双并蒂莲，可惜一朵被摘了，另一朵也就要谢了。”

众童乘舟离去，尚弦月硬着头皮继续用原台词往下演：

“这遭听得真切，不知是个好话头不是？”

望少微和陶然乐面面相觑，唯唯诺诺地附和。三人本有一支喜气洋洋的【月中仙】该合唱，迟疑间不约而同地略过此节，匆匆假装步回园中。

〔貂蝉掷杯介〕

〔鸣珂〕正经是个胜杯！

【忆汉月】〔貂蝉〕红蕊并开双蒂，朵朵风前欢喜。往来星月几回忙，乃得与仙交契。观杯心意定，天许我、设连环计。一朝平祸杀奸邪，翻浊世成清世。

〔佩玉〕太阴星君准了！咱们不知寻哪个圆解去？

〔鸣珂〕不如遣奴迳往西巷转角头寻胡老娘去，奴自小拜认了他做干娘，平日里极相契厚，十分管顾奴。他老人家积年在街坊上走跳，最是个晓事的，凭甚么跷蹊的话头，到他嘴里管情说得分分明明，水落石出。

三女按原本剧情撑着演完第五场便跑进幕后。

幕后季如意正揪着原与辉吵架，风和光则连忙将三人拉过去笑道，“不用急，少微，你还照原样先和万秋赶紧去演第六场，她已想好怎么改唱词圆上了，你的词只把听来的话换成我刚刚说的就行。后面第七场的唱词也已经改好了，小月亮，你看，我们这样……”

这才几分钟，就能重新填好两首合意的词？望少微难以置信，但下一场布景已毕，她只能按下疑窦绕去前台。

第六场

〔胡老娘摇蒲扇乘凉介〕

〔鸣珂〕干娘，救奴一救！

〔胡老娘〕阿呀，唬我一跳！你这小丫头，半夜来这里做甚么？ 

〔鸣珂〕奴家小姐今夜去听香，在莲池畔见有个童儿说“好一双并头莲，一朵教人折了去，那一朵也就谢了”，不知是个甚么意故，特地来寻干娘与奴圆解圆解。

【明月引】〔胡老娘〕仲秋良夜正清闲，听香言，解香言。并蒂莲开，一落一留残。先贺贵人逢瑞兆，诸事吉，且安行、心放宽。势连、义连，斩绝难。必作单、已作单。挑生衅端，两边瞒、相与周旋。首恶遭诛，余孽自灾缠。何惧虎狼情性暴，怀巧计，若临渊、挽恶澜。

〔鸣珂欢喜介〕多谢干娘费心！这几文钱与干娘买盏茶吃，奴回去了。

第七场

〔鸣珂〕小姐，俺干娘如此这般说〔双手比划介〕。

〔佩玉〕这话圆得极好！小姐莫要再焦心哩。

【人月圆】〔貂蝉〕秋风一奏愁云破，朗月吐清光。得逢妙手，双花拆散，天意深藏。我今征迈，倾身填海，苦胆甘尝。纵然九死，丹心未悔，白骨犹香。

〔念白〕此后果然离间计成，董卓横死宫前，吕布亦遭枭首。貂蝉了却心愿，从此隐姓埋名远遁红尘。正是：

何处采菱闻度曲，谁家拜月认飘香。（范成大）

功成早绾黄金印，归向东篱续旧觞。（黎民表）

谢幕后，庚午班众人都一起往观众席走去，几名主演窃窃私语。

“她们没看出来吧？”原与辉忐忑道。

“你还说，我摘花本来根本没人知道弄错了，都怪你喊那一嗓子！”

“可不是，我被吓得还少唱了一段。”尚弦月也抱怨原与辉道，“这个折掉一朵花还能用离间圆上，要不是小凤凰救场，观众都以为听香是听你那句摘错了，那真不知道怎么编！”

“我当时也懵了，笑死，吓得说出句大白话，幸好少微第六场还把我那个话润色了下，还有小月亮最后用新词唱的也好好听！”

“其实之前花开并蒂人月两圆那个结局有点俗，我还挺喜欢现在这个纵死侠骨香的意境，感觉很悲壮，不过比前面的都水一点，典故太多了。”

“是万秋几分钟现写的，能圆回来又符合格律就行了嘛，将错就错吧。” 陶然乐也是这几个月现学唱曲，并不很想献丑，所以真心实意地庆幸，“不管怎么说，总算演完啦！”

“嗯嗯，安心看后面的节目吧，”风和光摸到自己的位置坐下，“庚申这个祭月大典好有意思的。”

“原子，你应该去庚申她们班一起演哑剧。”

“咋还揪着我不放啊？是你先摘错花，那么高一朵并蒂莲，你能摘成睡莲。”

“我只是伸手早了，总不能又缩回来吧，你要是不说，我再摘一次就好好的，根本没后面那些事！”

“哎呀好啦好啦，人家都开演了，你们两个看完再吵。”

虽然告诫原与辉和季如意不要说话，风和光自己却悄悄贴到万秋耳边叽叽咕咕，“我一直提心吊胆，总怕节目出意外，谁知道怕什么来什么。要不是你帮忙，我真不知道怎么办。”

“嗯。”万秋对诅咒没惹出大麻烦而欣慰，一边用卸妆湿巾擦脸。

“哎呦你怎么就擦了呀，我还没和你照相呢！”

“前两天试妆已经照过。”

“今天是正式演出嘛，有纪念意义。”

“擦掉一半了。”

“好吧，那一会儿照你半张脸也行，反正是对称的嘛。”

万秋继续动作，“现在全擦干净了。”

“笑死我了，你怎么这么坏？算了，不想照就不照……诶，你看，哈哈哈哈，她们也都乱了，好好笑。好在她们这个剧本来就有点搞笑成分，要不是我提前看过一次排练，肯定也不知道是故意演的还是真失误，但哈哈哈哈哈主祭把酒壶把拿成壶嘴了，幸好里面没真装酒……”

风和光幸灾乐祸地捂着嘴笑个不住。

即使没有诅咒，舞台上也难免出错。万秋静静想着，但还是会有些不同。明知事情会出问题却又只能任它发生会带来一种虚无感。她填那首【月中仙】时与尚弦月很费一番功夫，但就如这大半年里的许许多多次一样，最终依然徒劳。

甚至她隐约感觉，越处心积虑，越容易功亏一篑。虽然最后的结局似乎更令人满意，但总归不是理想的模样；如果妥协地接受落差——那么大概就是诅咒想让我变成的样子：麻木接受命运的嘲弄，将所谓意外之喜的价值排在精心构造的完美之前。

“你也觉得新结局更好？”

“啊？”风和光正在给两位指导老师发感谢消息，虽然早已编辑好，但她刻意等谢幕十分钟后才发，显得更像现写的。关掉终端屏幕，女孩低声向朋友道，“不会呀，我当初投票给之前的方案就是觉得那个更好嘛，虽然新版貂蝉很潇洒，但我觉得和中秋团圆有点搭不上。不过原子也不是故意的，哎，我没事，真的，你不用担心，虽然我当时真觉得天塌了，但天塌了好像也没怎样。”

“抱歉。”

“你说什么？”

“没什么，让你看节目。”

Which way I fly is hell; myself am hell.
