    <script type="text/plain" id="chapter-text">
宁蓁蹲下身，将莫眉的绒拖鞋摆正放入鞋柜，庆幸雇主今天不在家；而孩子们这时理应都在学校。      

莫寻秋正读四年级，与风和光同班；后者能进这所私立小学要多谢莫眉帮忙。莫名妙学籍不知落在哪里，不过她炫耀说自己不怎么上课，因为总有广告要拍，有短剧要演。据风和光讲，她某次回家时见过莫名妙和几个没穿校服的小孩一起嘻嘻哈哈地在公共停车场用钥匙划车漆并猛拽车门取乐。      

然而同一时刻，宁蓁在扭音上刷到的却是截然不同的MiMiMeow：这颗冉冉升起的童星粉丝数已超百万，疫情三年中出过好几条爆款，并在TikTak同样风生水起。团队这半年来安排她用流行唱法翻唱一些音乐剧的著名选段，配上精致的仿妆，唱完后她还会讲解一番化妆技巧，虽然英语和华语都磕磕绊绊，但评论区只会觉得可爱，还有博主专门剪她的片段做reaction 和二创，打着 #骗你生女儿 #TheaterKid之类的tag。

宁蓁认为MiMiMeow更清澈真实，而莫名妙的生活就复杂得多。她前年在女孩的房间里第一次发现电子烟，后来还有零散的药片和槟榔叶包。宁蓁总是像对待其他杂物一样对待它们，告诉自己只是小孩不懂事拿着玩，并谢天谢地小凤凰从不碰这些。     

风和光与莫家唯一的联系就是莫寻秋。宁蓁本不希望女儿有这样性格古怪的朋友，但也不太好阻止，毕竟莫寻秋成绩很好，且没有证据女孩接触过任何不当物品——莫寻秋六岁起就告知宁蓁无需打扫自己的房间；她的房门从不忘记上锁。      

而莫名妙的房门早就不知在母女哪次争执中彻底踹坏，并一直坏下去，卡在半敞的状态。      

宁蓁直至七点多才重回滚滚热浪中，不巧迎面遇上莫眉母女三人。      

三人都没同她说话，宁蓁也没搭腔。两秒钟后，她与她们交错而过。

她下意识地觉得莫寻秋竟然和母亲、妹妹一起回家有点怪，但说不上来为什么。回家后看到女儿才想起，由于明天是中秋，她们的小学今天下午提前两节课放学，莫寻秋那时本应早已到家才对。      

印象里莫寻秋乍看与平时放学的模样无异，只是没有像往常那样沉缓缓、阴凉凉扫宁蓁一眼。莫寻秋总是对周围的人与事物保持过度警觉，很少如此心不在焉；但宁蓁当时未多思量这种无关紧要的细节。说实话，她巴不得那三人都没看到自己：莫眉给她难堪，莫寻秋令她恐惧，莫名妙让她羞愧。工钱不能抵消这些精神上的痛苦，至少对她来说是如此。      

到家后，风和光正在厨房麻利地拌莴笋，一边说起今天放学后有两个陌生女人来找莫寻秋。      

“妈妈，阿秋不会也要签机构出道吧？”      

“那不会的。是不是莫小姐的朋友？我刚刚看到她们三个人一起回家。”      

“哦，可能一起出去吃饭吧。”风和光笑笑，“妈妈，我今天去排队买鲜肉月饼啦，你要不要先吃一个？今年提前一天买，总算吃到了。”      

宁蓁洗手，“我们一起吃。我先去给你外婆翻身。”      

风和光见她擦手，连忙递来护手霜，又笑道，“外婆的晚餐我已经准备好哦。”      

她不这么说，宁蓁也知道；女儿的孝顺懂事像针一样扎得她每时每刻坐立难安。      

宁蓁匆匆拿着一杯稀粥躲进母亲的房间。房间里弥漫着爽身粉、消毒水和老人体味，并不浓郁，但吸足台风前闷湿沉粘的潮气后依然压得人呼吸困难。      

这是持续刺痛宁蓁的另一根针。母亲干瘪得厉害，已看不出一丝往日的精明飒爽。      

至于哥哥，宁蓁没向女儿提过他，她希望他和前夫一样不要玷污女孩的世界。但事与愿违的是，去年暑假她看到风和光在手机上安装了哥哥公司的游戏；一款热门到地铁站都有大屏广告的二次元手游。      

那是她在女儿面前最崩溃的一刻。她歇斯底里地夺过手机狠狠砸向地板，骂出一串她自己平时听到都会皱眉的字眼。      

风和光像小时候一样哭得小心翼翼，并立刻诚恳道歉，保证再也不玩任何手机游戏。      

手机虽然有保护壳，还是摔碎大半屏幕，但小凤凰从未抱怨此事。宁蓁说给她重买一个，她不要；宁蓁说妈妈错了，不该发脾气，她说她爱妈妈，妈妈没有错。      

宁蓁沉默地给母亲拍背排痰，眼眶在一下下闷闷的声响里慢慢发起热来。她已习惯一边悲伤一边照顾母亲。从房间出来后，她照例去洗手，顺便洗去泪痕。      

客厅餐桌上摆着糖醋排骨、凉拌莴笋、两碗米饭、菊花茶和一盘鲜肉月饼，配着电视里的晚间新闻。      

风和光坐在椅子上，见宁蓁过来就飞快把手机收回家居服口袋，“妈妈，来吃饭呀，我刚刚在看小金书上的教程，我们明天炖芋艿老鸭汤吃！”      

宁蓁也挤出浅笑，“好久不弄这些。明天我们一起做。今天学校里有什么新闻？”      

风和光就绘声绘色地学起班里的同学和老师，和屏幕里的记者一般声情并茂。      

可口的食物、清脆的笑声、小学生的日常……它们像牙疼时的冰块，含着很能让人好受些。      

虽然最终冰块会融化，魔法会失效，但母女的晚饭总归吃得很开心。

晚饭后通常由宁蓁收拾碗筷，风和光去写作业。但今天不同寻常地有人敲响家门。      

“你约同学来家里玩吗？”      

风和光摇头，“是妈妈的朋友吗？”      

宁蓁也摇头。      

母女都有些不安。      

“也许是房东。”宁蓁站起身，隔着门大声道，“孙阿姨吗？有什么事？”      

敲门声停下。屋里屋外陷入静默。      

宁蓁强自镇定，走过去看猫眼，然后惊得连连后退。      

“蓁蓁，是我。”      

她本以为看错了，但这个声音佐证她没有。是宁臻。但他来做什么？快十年了，但模糊的猫眼抹去细节，使哥哥的身形面容依稀未变。      

“妈妈，是坏人吗？要不要报警？”风和光轻手轻脚地走到宁蓁身旁，小脸紧绷，攥着一把从厨房拿来的剔骨刀。      

“是坏人。但是……把刀放回去，乖囡，去房间里写作业吧。没事的。”      

“蓁蓁，你先开门。”      

风和光睁大眼睛，“这是……他是我爸爸吗？”      

“不是。你没有爸爸。小凤凰，去写作业吧，他，这个人以前是你舅舅。妈妈会处理好的，你回你房间去，去吧。”      

她语无伦次地将女儿往卧室推，脑海里已经乱成一团。      

门外是中学时偷偷帮她把暑假作业补完的人，是大学时每次拿到奖学金都给她转过去的人，是还没毕业就忙着创业并说以后会代替父亲撑起这个家的人；但也是他一次次地和母亲争吵、因为自己说他色迷心窍就摔门而去，然后任凭她们在泥淖里年复一年腐烂沉没……      

宁蓁耳膜嗡嗡作响，血涌上头蒙得眼前一阵花黑，最后是女儿的哭声让她回过神来。      

不知怎么回事，但显然母女拉扯间刀尖划伤了女孩的右臂，血像泪水一样涌出。

宁蓁惊叫着在屋里四处走来走去寻找碘酒。不行，要赶紧去医院看看……      

“我们去医院，快走。”她只抓起手机就打开屋门，看也没看门外的人；但那个人用力拉住她的手臂。      

“放开！我女儿要去医院！”      

“我司机在楼下，我们载你去我公司的医院，你现在叫车还要等，去公立医院挂号也要等。”      

宁蓁甩开那只手。但风和光忽然停下脚步插了一句：      

“我见过你的表情包。你是那个至臻网络科技公司的董事长。”      

她眼含泪珠，哭腔犹存，但这句话吐字十分清楚，“为什么你是我舅舅？妈妈没有哥哥。”      

兄妹的目光齐齐凝聚在女孩脸上，彼此没有交汇，但宁蓁再开口时气势已然低落下来，无法再假装对面是陌生人。她没想到女儿会知道宁臻。网络真是——真是比什么都可怕。在她童年时，普通小学生不可能知道游戏公司董事长的长相名字。      

手机游戏、直播、短视频、社媒、热梗、表情包……2022年的一切真是烂透了。

Curtails its desires, and reveals its anxiety for two things only, bread and circuses.
