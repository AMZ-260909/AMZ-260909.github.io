第二章 于何其臻

宁蓁蹲下身，将莫眉的拖鞋摆正放入鞋柜，庆幸雇主今天不在家；而孩子们这时理应都在学校。   

也许莫名妙不在学校。她学籍不知落在哪里，曾炫耀说自己无需上课，因为总有广告要拍，有短剧要演。宁蓁偶然见过几次莫名妙和一群没穿校服的孩子嘻嘻哈哈地在公共停车场用钥匙划车漆并猛拽车门取乐，去年曾在女孩的房间里第一次发现电子烟，后来还有零散的药片和槟榔叶包。宁蓁总是像对待其他杂物一样对待它们，告诉自己只是小孩不懂事拿着玩，并谢天谢地小凤凰从不碰这些。

好在风和光与莫家仅剩的联系是莫寻秋。她们都读四年级，是同班同学，风和光能进这所私立小学仍是顺便，成绩也远不如莫寻秋，因此宁蓁不太有理由阻止两人继续做朋友，何况她无法证明莫寻秋的房间有任何不当物品——女孩自宁蓁重新上门后就宣布无需再打扫她的房间，且房门从不忘记上锁。

莫名妙的房门则早在某次母女争执中被彻底踹坏，拆掉后再没补上新的，房间永远一览无余地与客厅相连。

宁蓁从客厅开始今天的工作：洒满薯片屑和假睫毛的牛血红软皮沙发、勾缠纱裙亮片的羊羔毛扶手椅、蹭上闪粉与唇釉的刺绣天鹅绒靠枕、白键被油画棒涂鸦的三角钢琴、果汁泼染的孔雀蓝波斯地毯、沾着油腻手印的钟形水晶浮雕花瓶、被当烟灰缸的大理石香薰蜡烛杯、倒扣在竹编漆器点心盒里的精装艺术书册、与残羹一同碎在角落的粉彩骨瓷餐具……

结束全屋清洁已是五小时后，她坐在琴凳上休息，点开手机刷扭音。首页推送的第一条视频来自她关注的MiMiMeow：这颗冉冉升起的童星粉丝数已超百万，并在TikTak同样风生水起。团队这半年来安排她用流行唱法翻唱一些音乐剧的著名选段，配上精致的仿妆，唱完后她还会讲解一番化妆技巧，虽然总是因忘词而磕磕绊绊，但评论区只会觉得可爱，还有博主专门剪她的片段做reaction 和二创，打着 #骗你生女儿 #TheaterKid之类的tag。

宁蓁喜欢MiMiMeow，认为她比镜头外的莫名妙真实许多，是理想中的十岁女孩；莫名妙更像快餐短剧里夸张到挑战常识的反派角色。

为避免遭遇反派，宁蓁短歇一刻钟就起身准备两天三人份的食物，虽然莫眉和莫名妙的两份几乎次次都原样被扔进垃圾桶，但她告诉自己，做饭只是为了工钱。

直至七点，她身心俱疲地关上公寓门，不巧在电梯前迎面遇上三位雇主。      

她们都没同她说话，宁蓁也没搭腔，只下意识觉得莫寻秋竟和母亲、妹妹一起出电梯有点怪；回家后看到女儿才想起，由于明天中秋，梅岑小学今天提前两节课放学，莫寻秋那时本应早已到家。      

印象里莫寻秋乍看毫无异状，只是没像往常那样沉缓缓、阴凉凉扫宁蓁一眼，似乎有些心不在焉。但宁蓁未多思量这种无关紧要的细节。说实话，她巴不得那三人都不看自己：莫眉的嘲弄给她难堪，莫寻秋的审视令她恐惧，莫名妙的恶意让她羞愧；工钱不能抵消这些精神上的痛苦，至少对她来说是如此。      

到家后，女儿正在厨房麻利地拌莴笋，一边说起今天放学后有两个陌生女人来找莫寻秋。      

“是莫小姐的朋友或者助理来接她一起去吃晚饭？我刚刚看到她们三个人一起回家。”      

“大概是。”风和光笑笑，“妈妈，我今天去排队买鲜肉月饼啦，你要不要先吃一个？今年提前一天买，总算吃到了。”      

宁蓁洗手，“我们一起吃。我先去给你外婆翻身。”      

女孩连忙递来毛巾和护手霜，又笑道，“外婆的晚餐我已经准备好哦。”      

小凤凰的孝顺懂事像针扎得宁蓁坐立难安；她匆匆拿着营养液躲进母亲的房间，再出来时餐桌上已摆好糖醋排骨、凉拌莴笋、两碗米饭、菊花茶和一盘鲜肉月饼。

风和光坐在椅子上，见母亲过来就飞快把手机递去她面前，“妈妈，我刚刚在看小金书上的教程，我们明天炖芋艿老鸭汤吃！”     

宁蓁扫几眼菜谱，注意力不自觉被女儿手机屏幕上的碎痕分去一瞬。碎痕来自去年暑假，那天她看到风和光在手机上安装了哥哥公司的游戏——一款热门到地铁站都有大屏广告的二次元手游。当时她歇斯底里地夺过手机狠狠砸向地板，骂出一串平时听到都会皱眉的字眼，精疲力尽时才反应过来自己的荒唐。      

小凤凰小心翼翼地哭了几秒钟就立刻诚恳道歉，保证再也不玩任何游戏，也从未抱怨碎掉大半的屏幕。宁蓁说给她重买手机，她不要；宁蓁说妈妈错了，不该发脾气，她说她爱妈妈，妈妈没有错。      

针刺感逼得宁蓁挤出生硬的浅笑，“好久不弄这些，明天我们一起做。今天学校里有什么新闻？”      

风和光就绘声绘色地学起班里的同学和老师，和屏幕里的记者一般声情并茂。      

可口的食物、清脆的笑声、小学生的日常……它们像牙疼时的冰块，含着很能让人好受些。虽然最终冰块会融化，魔法会失效，但母女的晚饭总归吃得很开心。

晚饭后通常由宁蓁收拾碗筷，风和光去写作业。但今天不同寻常地有人敲响家门。      

“你约同学来家里玩吗？”      

风和光摇头，“是妈妈的朋友吗？”      

宁蓁也摇头。      

母女都有些不安。      

“也许是房东。”宁蓁站起身，隔着门大声道，“孙阿姨吗？有什么事？”      

敲门声停下。屋里屋外陷入静默。      

宁蓁强自镇定，走过去看猫眼，然后惊得连连后退。 

“妈妈，是坏人吗？要不要报警？”风和光轻手轻脚走到宁蓁身旁，小脸紧绷，攥着从厨房拿来的剔骨刀。      

“是坏人。但是……把刀放回去，乖囡，去房间里写作业吧。没事的。”      

“蓁蓁，你开门。”      

“这是……他是我爸爸吗？”      

“他，这个人以前是你舅舅。妈妈会处理好的，你回你房间去，去吧。”宁蓁语无伦次地将女儿往卧室推，脑海里已经乱成一团，最后是女孩细细的哭声让她醒神；不知怎么回事，但显然母女拉扯间刀尖划伤风和光的右臂，血比泪水涌得更多。

她惊叫着四处寻找碘酒；拿着碘酒棉签回来时，见房门已经打开，已经摘掉墨镜的哥哥正在端详女儿。她冲过去想做些什么，风和光却已开口：      

“我见过你的表情包。你是那个至臻网络科技公司的董事长宁臻。”      

女孩哭腔犹存，但吐字十分清楚，“为什么你是我舅舅？妈妈没有哥哥。”      

宁蓁没想到女儿会知道宁臻。网络真是——真是比什么都可怕。手机游戏、直播、短视频、社媒、热梗、表情包……2022年的一切都烂透了。

宁臻没想到今天就能进家门，一时也语塞。这个女孩看起来很像妹妹小时候：白净和婉的长相，温顺可爱的气质——但如果是妹妹，此时此刻会哭泣不休，事实上妹妹如今依然如此。

风和光没想到两个大人都像NPC般呆滞，只好继续递台词，“妈妈，你别哭了，对不起，我只是害怕流血，想去医院，不是故意给舅舅开门的……”

“我让司机送她去我资助的私立医院。”宁臻先反应过来，“不用等车，不用排队。”

习惯以女儿为重的宁蓁最后还是坐进哥哥的车。但这不代表任何事，她竭力告诉自己，并庆幸小凤凰的存在可以显得自己的落魄并非枉费。      

“小凤凰，你大名叫什么？”

“我叫风和光，风和日丽的和，风光无限的光。我现在读四年级，后年上初中。”      

“打算去哪所初中？”      

“我最好的朋友肯定能去毓华中学，我也想去。不过什么初中都一样啦，我只想赶紧长大工作，让妈妈不要再那么辛苦。”      

“你外婆身体怎样？”      

好容易止住眼泪的宁蓁接过话，“她外婆在里屋躺着。当年脑溢血，后面没再醒过。”      

“对不起，蓁蓁，当年……”      

从道歉开始，一切顺理成章。所有人都知道会发生什么，那么事情就会发生。      

风和光不再关注俗套的火葬场游戏，转而思考为什么莫寻秋还是没有回自己五小时前发的微讯。

她再次检查网络。然后检查自己的措辞：只是问阿秋明天是否来自己家吃饭。去年她就来了。即使今年不想来，莫寻秋也应该拒绝得干净利落。今天在学校也一切正常。是因为那两个来接她的女人吗？可这种情况以前发生过很多次，莫眉时不时会叫人来接莫寻秋直接去餐厅。妈妈说离开莫家时见到她们三人一起往回走…… 

正在此时，手机微震，【不去。】      

【好吧，阿秋，我知道了。那我明天可以去找你吗，我要告诉你，我这里发生了一些】风和光打字到一半又思考朋友的异常，最后谨慎地将整段删掉，只回复【好哦，那周二学校见】和两张常用的晚安表情。      

女孩知道对方不会再回复，就无精打采把手机藏回口袋，继续巧妙扮演自己的角色以协助舅舅说服妈妈。她认为即使宁臻除钱外一无是处，至少钱是她眼下急需的；至于其他，她不抱任何希望。

妈妈总希望人们之间除钱和表演外还有更多，所以常常不知所措。风和光想，相较我们的处境实在过于奢侈。

Curtails its desires, and reveals its anxiety for two things only, bread and circuses.
