    <script type="text/plain" id="chapter-text">
4月20日是活动课真正开始的第一天，由于立夏之前依旧可以退课或调班，许多学生都会在自己的已选课之外去旁听其他感兴趣的课程，考虑是否要更改这学年的计划。

由于1分课每周只一节，且不像2分和3分课那样除课程日外还另有两个出勤率要求在2/3以上的练习日，选择三门1分课就等于每周有四节空闲时间——风和光就是这么做的，不过没课时她打算去各个活动室转转。

“今天你去钢琴课。”万秋拒绝朋友来参观近身格斗，并高深莫测地留下一条指令。

钢琴向来是3分课中的热门，风和光在四个活动室前的长廊上犹豫片刻。

“小凤凰？”

“噢，啊，是你。”女孩转头，见是金同尘，“你是来上钢琴课吗？我正好想旁听试试，不过我不知道选哪个老师的课，当然其实对我可能都一样，我完全没什么基础。不过，我只选了3个1分，所以我打算把所有活动课都蹭一遍。”

“不如和我一起来董老师这里？董老师在学宫已经任职很久，见过各种基础的学生。或者郭边林老师，她在尘世时就开演奏会，来九州后也拿过不少大奖，应该是最有名的一位，但她的课在一三五。”

“那就董老师吧，我其实可能只来一两节，至少周四我有别的课。你只选这一门吗？”

“嗯，你选了三门什么？”

“我选的是瑜伽、美甲，还有一门设计类的。听起来有点水，笑死，不过我确实不想上太专业的活动课，光是平时的科目我已经有点应付不过来，尤其是灵理，你也知道，萧飒意真是像鬼一样缠着我，非要想把我问住，为了不给她这个机会，我每周四周五午休都得……得好好预习。”

“萧老师真的很有童心。对了，你那个朋友没有选钢琴吗？”

“哪个？哦，你是说尚弦月吧，小月亮选了昆曲，那个也是3分，就不能再选钢琴啦。不过我不知道她具体哪天上课，你想认识一下她吗？”

金同尘拿不准对方是不是在故意引开话题。“我不确定她的名字，可能记混了，我对我们班之外的人还不太熟。之前听说你有一个从尘世一起来的好朋友好像很喜欢弹琴。”

风和光笑道，“大概是有点记混啦，阿秋不会弹琴，是小月亮会弹，不过我们班还有其他两三个会弹的，我刚刚看到舒远目在隔壁活动室，还正打算过去呢。”

“一定是我记岔了她们的名字。”金同尘听到耳机里的助手提示，便按捺下疑惑，“我们先进去上课吧。”

琴房四壁和屋顶都覆着柔软波浪形吸音材料，浅栗色软木地板一侧是八架立式琴，整齐地放成两排；另一侧中央是一台华丽的三角琴，旁边还有一只小巧的旧式拨弦古钢琴。第一排立式琴已都有学生占着，于是两人就选择后排居中的两架。

“大家好，我是董容容，来九州前是江都人，生在乾弘九年。”

钢琴老师在自我介绍第一句时随手按下几组和弦，提醒闲聊的同学们课程开始。她看起来大约四十出头，但眉目间依稀有几分古典风韵。

“所以我第一次学钢琴是在一百多岁时，比你们现在起步晚得多。你们就算今天第一次才见到钢琴，也完全可以弹得很好……”

风和光历史不怎么样，算不太出董容容的年纪，不过至少有二百岁吧？那么比萧飒意的年纪还大得多。不知道我活到二百岁时会是什么样；大概还是不会弹琴，她想，真不明白音乐到底有什么意思，又不由得想到同样不喜欢音乐的Soleil，不知道她有没有来九州？大概没有。Geo就没有来——Geo的生日在1月，按九州历法算应该是2023届，但她几个月前还在尘世。如果我是Soleil，我又有什么理由抛下拥有的一切呢？

金同尘也在出神。她之前已尝试对风和光小团体里最核心的几个人旁敲侧击，在得知万秋就是与风和光同来九州的朋友后刻意留心过许久，甚至找机会询问过对方几句。但那个女生很冷淡，谈论起风和光时也没变得更热情，并很快走去一边主动结束谈话。她们的关系显然不像自己以为的那么好，而小凤凰似乎……

“同学，你坐得很标准，你有基础吗？”董容容近在咫尺的声音打断女孩的沉思。

“嗯，有一点基础，但不是很熟悉乐理。”

“没关系，我后几节课会讲一些乐理，而且乐理在考试中占比很小，毕竟成为优秀的音乐家并不一定需要懂很多理论……”董容容又去指点风和光，将女孩从手到脚都重新摆放一遍，“好了，这样就行，别太紧张。”

风和光不知道自己的手指为什么会轻微颤抖。她第一次触摸琴键，却像把手伸进猛兽布满利齿的嘴里一样惊心动魄；好在当她转过这个念头时恐惧便随之消散。

“今天你们只需要掌握姿势。”董容容回到三角钢琴前，“现在大家都戴好各自的耳机，随便弹点什么吧，有基础的同学可以弹弹熟悉的曲子，零基础的同学可以仔细听听每个键的声音有什么不同，和你们的琴熟悉一下。你们的琴都默认是静音模式，所以记得戴上琴旁的耳机，我会随机切到任何一个人那里去听。”

“怪不得我弹什么键都一个音。”风和光小声对金同尘道，“那你怎么办……”

董容容温和继续道，“不过自由摸索不是自由活动，我的课上不可以聊天，不可以做与弹琴完全无关的事。终端全程必须脱掉，找琴谱就用自己琴架上的pad。另外我看到有几位同学指甲有点长，如果不是来旁听的话记得回去修剪一下，要看不到白边才行。”

风和光有点不自在缩起手指，冲朋友做了一个开玩笑的委屈表情；她不知道九枢是如何描述的，但金同尘很快露出同情的微笑。

“练习日的话，虽然学宫的要求是2/3出勤率，但是我要求尽量全勤，请假必须上传助教的证明到学域，无故缺勤三次我就不会给这学年的活动课成绩啦。我希望坐在这个教室的同学都是愿意花时间在音乐上的人，如果只是作为爱好，我会比较推荐你们改选1分的电子琴课。”

听完训话，女孩们纷纷摘下扳指，有的拿下搁在琴盖上的零食和奶茶，有的找出指甲钳去垃圾桶旁修指甲。金同尘举手示意，询问老师可不可以用原声模式。

“我已经戴了耳机，所以不是很方便……”

“好吧，我来调一下设置。”董容容对有特殊需要的同学还是如所有老师一般通情达理，“不过扳指可能还是需要取下来，你有点基础的话应该知道为什么。”

“没关系，我的耳机不是必须接终端的。”金同尘又歉意道，“但是我可能会吵到其他同学。”

“她们只要戴好耳机就影响不大。”董容容弯腰把女孩琴键下面的拉杆推回去，“你现在弹点什么试试。风同学，你看看是否要换去远一点的位置。”

“我没关系的，我就坐这里吧。”风和光正在发愁不知如何度过这没有灵网也不能聊天的一个多小时，“正好我没基础，可以学一下她怎么弹。”

被迫接受完音乐熏陶后，女孩取下耳机时已久违地有点昏昏欲睡，直到走出活动室才重新精神起来。

“你弹得真好，就像……就像那种网上的视频。”

金同尘无奈一笑，“九枢说你一直在犯困。”

“不是吧，我看到那些享受音乐的专业人士经常都闭着眼睛。”风和光心虚地转移话题，“你弹的曲子叫什么名字？特别好听，我想回去再搜搜来听。”

“哪一首？”

“……就是这个，这样。”风和光一边回想一边模仿两只手的分分合合，“可能有点抽象，笑死，但我真的不知道怎么形容。”

“是Pavane pour une infante défunte。”

“哇，九枢这个都可以识别出来吗？”

“我这节课一直在练习这首曲子。”

风和光有些尴尬，干脆把主题切去与音乐不相关的事去。两人聊着天一起前往联谊准备区，友好道别后走入各自班级的范围。联谊课还剩四十分钟时，万秋出现在朋友和十几只兔子们面前。

兔们已习惯来人，只转转耳朵就继续争抢风和光手中的玉米须须。

“阿秋，你第一节活动课感觉怎么样？”

“和你的一样。”

“是吗，原来你是故意推荐这个的，我真无聊死了，我跟你说……”

万秋懒洋洋地倚在朋友腿上听她夹杂着笑意的抱怨。果然金同尘已经忘记那个答案，还在做注定徒劳的寻索；只有Helena不会遗忘任何关于我的事。如果诅咒的影响只是这些，那也没什么大不了的，甚至还更方便。如果我不想让一个人把某个场景记得太清楚，只要说几句预言就好。

Laetus abit gaudetque malo Berecyntius heros, pollicitique fidem tangendo singula temptat.
