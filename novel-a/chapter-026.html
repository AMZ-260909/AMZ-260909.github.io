助教严词拒绝批准逃课，众人只能坐在草地上继续七嘴八舌地讨论。万灵不知道那些被羊或鹿撞飞的同学是不是也都获得特殊道具，但规则所限，她没有提问。

那么MiMi是因为获得道具才花出去那些钱吗？会不会因为这个才不能分享方法？

大概不是。MiMi习惯的交流方式似乎只有攻击；或者类似周三社会课讨论区那篇随堂测试帖的胡言乱语：

“我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我很难受 我很难受 我很难受 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我不喜欢社会课 我后悔了 我好想回去 我不知道 我不知道 我想回去 我想回去 我不想上学 我想回去 我讨厌学校 我讨厌老师 我讨厌医务室 我讨厌医生 我讨厌写作业 我讨厌助教 我讨厌同学 我想回去 我不想上学 我什么都不知道”

不知成方圆会怎么评分。不过这不是万灵需要思考的难题。万灵在课间与同学们一起逛了逛坊市，购入一些亮晶晶的手链，认为比发卡好些，可免却被拽掉头发的不体面。

周六下午4点30，坤女没有出现，三青等人齐后安慰几句就把她们送进联谊区。

万灵回到草甸后打算这次往雪山那边走走，或许能遇到土拨鼠、黄老鼠之类。她也尝试点击刚获得的道具，可惜地图并无任何变化——大概真的只是纪念品。女孩有点失落，但想想自己并未真的帮上什么忙，奖品帮不上自己也情有可原。

草浪随风起伏，五颜六色的野花如游鱼般成群成簇欢畅摇动。万灵走了许久，发现与雪山的距离几乎没有变近。她有点疲惫，不太甘心地继续慢慢走着，忽然鞋子踢到什么软软的东西上。

动物！

女孩刹住脚，退回一步。草丛里站起一个人，有一张愤怒的漂亮的脸。

“Sorry I didn’t expect to find someone crouching here.我很抱歉，MiMi。”

“How did you know I was here?”

“I didn’t know anyone was here. I was just heading toward the mountains.”

MiMi闻言重新蹲下，不再说话。

万灵在去雪山碰运气和请教MiMi花钱诀窍之间犹豫片刻，最后决定还是去雪山。但草地里又传来一个问题：

“你刚刚叫我什么？”

“MiMi。MiMi Mariner。这个是你的尘世名字，对吗？”

“你知道我？”

“我看过那个电影。The one where—”

“Don’t. They’re terrible. All of them.”

万灵一笑，干脆也蹲下，“But you put a lot of feeling into your performance. I thought the films had a lot of heart, too. I even agreed to score V3NUS 2.”

“什么？为什么？ You write music?”

万灵斟酌着，跳过原因，直接回答最后那个问题，“Yeah. I’ve written a few pieces. Your team reached out to me even though I’ve never scored anything purely commercial before. Actually, on our first day here, I thought you’d recognized me as Leora Vane. But I’m nowhere near...”

MiMi突然睁大眼睛看向万灵并迅速站起身；后者疑心附近是不是又出现狼，也连忙站起来回头张望。好在似乎是虚惊一场。

“There are quite a few dangerous beasts around here, right? Have you seen any?”

“我没遇到过危险。”MiMi已坐回草丛中，用手里的一根树枝扒拉着什么，“只有这个。”

万灵才发现女孩是蹲在一处枯叶和细沙堆成的蚁丘旁边，无数蚂蚁正把一小块饼干屑往洞的方向推。她一时有点头皮发麻，因为之前的住处除虫一直做得很好。

“You can spend coins like that?”

“Mm-hm. If you leave the coins with the animals long enough, they’ll change. Look at my coins.”

MiMi嘴上说着，却并没动，万灵等待片刻就伸手打开女孩放在地上的钱袋，看到里面是各色鱼形饼干。

“That’s an interesting way to handle money.”她又看了看自己的钱袋；很遗憾，仍是黄澄澄的金币。

“Leora... why don’t you tell people you’re Leora Vane? Aren’t you famous?”MiMi忽然轻声说。

“Maybe not that famous. On my second day here, one of my roommates, Sonia, asked if she could come visit my room. She saw my piano, so I played a little piece I’d written years ago. She told me I played really well, then asked if the piece was called Für Elise...”

见MiMi咯咯咕咕笑个不停，万灵有些感谢这件令人不快的小事曾发生过。她从女孩的钱袋里又掏饼干出来，掰碎放在地上，“I told her it was actually called The Lost Kitten, and that I wrote it when I was 6, under the name Leora Vane. She went, ‘Wow! You wrote that!’ And then she told me the floor lamp I’d bought was really pretty too.”

“哎呦我真的，你和我以为的一点都不一样。你怎么讲话那么好笑？你不生气吗？”

“Why would I be mad that she didn’t know who I was? Für Elise is better than anything I’ve ever written. I should be grateful for the compliment.”

MiMi向后一躺，笑得在草地上滚来滚去，像吃到饼干的蚂蚁们一样开心。也许这些小昆虫咬人很痛，但另一方面也很有趣而且可爱极了……

“可是你答应给我的电影配乐，那你为什么要来九州？That’s really messed up!”

万灵对女孩突然发火感到迷惑，“I hadn’t even told the studio yet. And according to the bird, maybe once I chose to leave, that became something that was never going to happen anyway. So there’s nothing for me to be responsible for.”

MiMi没有回应。在万灵想再聊聊V3NUS缓和气氛时，草丛里传出呜呜咽咽的哭声。

尴尬的十几分钟后，女孩坐起身，脸上除愤怒外还沾满泥土与眼泪，一把从地上抓起自己的钱袋，“你干嘛拿我的东西！你自己没有吗？”

“Sorry. I thought they might like it. I’ll leave your things alone.”

“把你的钱给我看看。”莫名妙不等Leora同意，劈手夺过对方的袋子，打开后看了两眼，忽然又展颜一笑，把敞着口的钱袋展示给原主，“闻起来好香，好想尝尝味道啊。”

钱袋里装着一百块五颜六色的小熊软糖。

“So ants like gummy bears?”万灵不知道MiMi为什么又开心起来；这个女孩就像写满突兀重音、临时变拍和莫名转调的乐谱，作为演奏者很难找到节拍。好在她至少知道我的音乐，万灵思忖，音乐是永远不会出错的话题，“Maybe I should write a musical about them. They’re giving me all kinds of ideas.”

“我喜欢你写的那部。”

“Which one? The Birthday of the Infanta?”

MiMi笑着摇头，然后轻快地唱起来：

“We slept a childhood side by side

Her love set my velveteen soul free

She whispered the word that changed me

Until the day all magic died...”

原来是The Velveteen Cat。这是万灵的第一部音乐剧，改编自童话绘本，只是将主角改为小女孩和小猫玩偶。MiMi唱得并不很好，能听出是在照着原卡司的 phrasing 唱，音准控制比万灵在对方VidTube频道里听过的其他歌要差不少。

“Is this what becoming Real leads me to? 

Is this what becoming Real makes you do?

The only Real thing was that you lied，

Now there's no one left beside.”

MiMi唱到第三段时音量渐渐变小，且越唱越快，很有些自暴自弃的意思。万灵本来还在犹豫如何点评女孩的表演，但很快她意识到MiMi又一次哭起来，这次甚至是放声大哭。

茫然几秒后，万灵顿悟一件甚至更糟的事：MiMi哭泣并不是因为被我的音乐感动。

“MiMi, I don’t know if this song made you sad, but that wasn’t what I meant to do. Of course, maybe it reminded you of something else. Someone else. But right now, I’m the only one here, and I don’t know anything about those things. Do you understand what I mean?”她慢悠悠地提高声音讲话，把每一个“I“都说得稍微重一点。

MiMi的哭声在万灵即将失去耐心之前停下。她抓起自己的衣服下摆胡乱把眼泪鼻涕抹了抹，然后抬起脸，冲万灵露出笑容，“I thought you never got angry.”

“I’m not. It’s just makes me feel a little complicated.”

“You are angry.你的眼睛生气的时候就是那样的，还有……反正我知道。”

“Funny. For someone who keeps saying she doesn’t know anything, you seem to know an awful lot.”

万灵因恼怒而刻薄后就提防着MiMi扑过来攻击自己；不知道三青会不会管人类造成的死亡风险……

但MiMi没有；笑容还更明亮了些。两人对视几秒，似乎都想说些什么，然而联谊课在这时结束。

万灵回到休息区后，远远看到MiMi站在丁未班人群里朝自己笑着一眺就飞快跑掉。她心情复杂地往传送阵处走去，打算尽快回住处洗去身上的草屑和尘土。

一边泡在浴缸里，万灵又点亮终端。她的钱币余额自然还是100；榜单她已不再关心；值得注意的是道具页的地图上浮出一块金色小字：（1/3）。

女孩虽然没玩过许多游戏，这个还是能看懂的。验证猜想后，她不悦地关掉屏幕，在心里向地图抗议：我没有想去那里，我也不想知道她的事——那些在尘世时就让我厌倦的一切。

But once you are Real you can't become unreal again.
