    <script type="text/plain" id="chapter-text">
莫寻秋在黑暗中翻来覆去地思考：      

如果你恨一个人，那个人受苦就会让你快乐。但如果你永远失去这个人，你就无法再次感觉到这种快乐。所以恨意味着不希望失去对方。      

这段话一定不合逻辑，但女孩许久都没找到谬误之处。      

不过，无论对错，妹妹明天就会永远从家里离开。      

其实本该更早。      

今年三月初的一天，莫眉破天荒敲响莫寻秋的房门，说想和她聊聊。      

母亲总是烂醉时才会话很多地嘱咐莫寻秋一定要像双胞妹妹一样优秀出众那么她爸就不会再看轻她们母女或者大骂莫寻秋是不知感恩的白眼狼还不如垃圾堆捡来的孤儿云云；但那次莫眉非常清醒，慢条斯理地说有一位很有名的制片人说莫名妙很符合他手里一部正在构思的影片的某个重要角色。      

“那边说妙妙外形很好，也很有潜力，可惜没好好训练过。”莫眉先复述一遍对方助理的话，然后抛出重点，“他们想把妙妙带走培训，最好办个收养手续。”      

见大女儿毫无反应，似乎没识破自己隐瞒的部分，莫眉继续说下去，“他们给的钱不少，但是这种事我心里没底，要是她就是我生的，那无所谓，可毕竟是抱来的……”      

“你认识她亲生父母吗？”莫寻秋突然问。      

莫眉难得露出若有所思的微笑，但最终摇头，“不认识。我说过，她是垃圾堆捡来的。”      

莫寻秋认为母亲只会捡便宜，不会捡孩子，但她不想和对方揪扯。“如果她父母来找她，你怎么办？”      

女人的笑容逐渐变成某种女孩无法识别的复杂表情。

那天的谈话就此结束，之后扈城很快进入封控期，直到六月才逐渐恢复正常秩序，期间无事发生；但今天莫寻秋放学后，两个自称莫眉朋友的女人和蔼地请女孩去一边谈谈，莫寻秋没有拒绝但也没有走远，站在采样亭的长队边问她们的来意。      

她们和她拍了一张合照后有一句没一句地逗她闲聊，女孩保持沉默。没多久，莫眉匆匆抓着莫名妙过来，紧张地拽过大女儿仔细打量，然后让她带妹妹去一边站着；但事实上又一直把莫名妙抓得很紧。      

于是莫寻秋一个人走开几步戴上耳机听播客，直到母亲拉她一起回家。在路上，莫眉说明天中午就会有人来接莫名妙，手续其实之前已经办得差不多。      

回家后，莫名妙卷走一堆零食钻进房间不再出来；莫眉坐在客厅一边吃外卖一边追剧；莫寻秋吃完宁蓁做的食物回自己房间做题。      

几小时后，莫名妙开始大哭。      

妹妹的哭声结束时已是淡蓝色的黎明，莫寻秋点亮iPad屏幕，把存在草稿箱已两年的邮件点击发送。      

收件人的邮箱是从Leora Vane的个人网站上的Contact页面复制而来。她找不到父亲的联系方式，幸好父亲的这位女儿很有名：Leora是一位2012年出生的美国作曲家，5岁时创作她的第一首钢琴奏鸣曲，9岁时创作她的第一部音乐剧。      

可惜监护人认为应尽可能为年幼的女儿保留隐私，所以她从不露脸参加任何演出或活动，以至于莫寻秋看不到自己真正的双胞胎妹妹的长相。      

Dear Ms. Vane,      

My name is Juno. My mother, Mo Mei, told me that we are twin sisters. I do not know if this is true. If that is not the case, please disregard this email and I apologize for the intrusion. If it is, I want you to know that I am well and do not need any help. I am simply curious. Please give my regards to our father, Gian Vane.

点击发送后，莫寻秋站起身，发现自己在发烧，喉咙剧痛得像哭过整夜。      

她走出房间，和莫眉低声说自己的症状。莫眉还坐在客厅，一听“阳”字立马竖眉瞪眼，“乱说什么，去屋里再睡会儿！”      

“我用试纸测过，是阳性。”莫寻秋撒谎。      

莫眉虎起脸，“阿秋，不要在这时候给妈妈找麻烦，妈妈今天会很忙。现在回你的床上躺着，不许出来。”      

她的脸色和语气是莫寻秋非常熟悉的那种，通常这预示着与她争执的人马上要挨打。      

莫寻秋转身回到自己的房间，躺下后很快睡着，醒时已经是下午，又饿又渴。她打开房门想找些食物和水，发现整个客厅弥漫着一股浓稠、温甜、清馨的桂花香味。母亲依旧坐在皮沙发上，姿势一如早晨，但神情放松，显然莫名妙已被成功送走。

女人心平气和地对女孩笑了笑，“我煮了酒酿圆子，你去喝一点，嗓子就不痛了。”      

莫寻秋坐在餐桌旁时，莫眉也走进来，把剩下的一半圆子从锅里倒出来吃。母女俩相对无言。      

这还真是莫眉煮的。女孩没见过母亲下厨，但这锅东西很有莫眉的风格：圆子泡得太久，软到失去形状。汤变成米糊一样浑浊。胀烂的枸杞染得碗里到处是橘红色的血丝。醪糟可能加得太晚又太多，喝起来又酸又苦。连闻着香甜的桂花瓣也涩到舌尖麻。      

她勉强吃下小半碗，还是决定去吃冰箱里的盒饭；莫眉就把她剩下的那些也吃掉。      

之后两人依然没什么话好说，各自盯着手机。莫眉一边喝闷酒一边外放搞笑短视频；莫寻秋检查邮箱，没看到值得注意的信件。      

她又开始困，并且头痛，于是打算回房继续睡觉；不知多久后醒来，挪动身体时感觉步伐轻得像踩在空中。      

女孩环顾四周，看到自己站在熟悉的纯白羊绒落地帘旁，但有点不寻常的是站在窗外一侧。从高层公寓看下去，扈城的万家灯火、车水马龙亮煌煌得眩目；母亲也站在一边俯瞰着五光十色的夜景发呆。      

莫眉向这个方向转过脸——这可能是莫寻秋此生唯一有过的母女感应——妈妈靠近她，凶神恶煞地推搡她，拼命试图让她回房间去；她无力对抗，因而重新坠入沉重的身体，随即失去对一切的感知。      

莫寻秋重新恢复意识时，嘴唇上传来浅淡而凉润的柠檬味。她睁开眼睛，发现自己躺在病房，浑身肌肉传来深浅不一的痛楚。      

“阿秋？”风和光惊喜得差点把棉签掉进好朋友嘴里，连忙去按护士呼叫铃。      

莫寻秋注意到女孩手臂有一道长长血痂，眼神便跟随过去。      

“之前不小心划了下。”风和光解释道，脸上习惯性地露出一弯笑弧，但随即又蒙上忧心忡忡的神色，“阿秋，你总算醒了。你不知道，都快一星期了欸，现在是16号中午。医生之前说你可能会像我外婆一样……我真的好担心。”      

印象里形销骨立的人形让莫寻秋胃部有些翻搅，“我不会变成那样。这里是隔离病房？你为什么能进来？”      

风和光欲言又止地眨了几次眼，嘴巴张开又合上。      

此时护士满脸笑容地走来询问莫寻秋的感觉，莫寻秋只说有点没力气；对方热心而亲切地记下她说的每句话，表示医生正在赶来。      

“不是隔离病房……而且，这是我舅舅资助的私立医院。现在我外婆也在这里住院。”风和光已思考好如何解释，表情和语气都流畅不少，“我在这里是因为上周六是我和我妈妈送你过来抢救的。我妈妈和我舅舅有很多事要做，顾不上管我，而且你也在这里，所以我请假搬来你病房住。”      

莫寻秋不记得风和光有符合这个描述的舅舅。她极其怀疑自己是否还在原来的世界。所有事都完全失控——她最讨厌失控。      

“阿秋，还有，那个，莫阿姨的事情，我不知道该不该告诉你……”      

莫寻秋敏锐地意识到风和光要说什么，以致身体随着朋友略微颤抖的声音也颤抖一瞬，并抢先道：

“她死了。”

风和光没有否认。

随即莫寻秋意识到自己一直都是恨莫眉的。

You know something in her does it deliberately—to get beyond our reach, to be rid of us, to forget we’re alive! It’s as if, in spite of loving us, she hated us!
