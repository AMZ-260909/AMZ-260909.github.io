感恩节傍晚，Gian和Leora终于从Patagonia回家。当时三个女孩刚一起布置好晚宴餐桌，正围在餐厅的壁炉前闲聊。

Juno本坐在门厅对面的位置，然而Gian由侧门穿过一串走廊后悄无声息地绕到她身后。

“Excuse me. I didn’t mean to startle you. Juno，我是Gian。关于May的去世我很遗憾。希望在今后的生活中，你可以过得开心。”

和父亲的见面比Juno想象的要随意许多，显然是对方有意为之。

Gian Vane今年三十四岁，面目间几乎已没有华国特征，但华语讲得很流利。他随即热情地赞美Juno这半个多月在学校和生活中的表现，措辞与校长、老师、庄园员工等并没什么本质上的区别。

Juno在三言两语间领悟如何与父亲相处：把他当成Ruby之外的另一位经理。

之后她的目光移向Leora。

鼎鼎大名的Leora。

Leora站在餐厅后门前，微微偏着头静听Audra叽叽咕咕，眉梢、眼尾、唇角处处都噙着一点笑，但笑得不像Georgina那般舒雅或Audra那般烂漫，反透着些揶揄的意味；也许只是因为她长相姿态里的清傲。

Juno疑心两个妹妹在谈论自己，走过去时不自觉武装起敌意。

“Wow, there you are. Let me see. You two actually look really different standing together. Juno’s like ice, and Leo’s like snow—”

“You’re Olaf.”Leora打断道。于是她们两个大笑起来。

“Juno would never be that mean!”Audra给Leora差评后向Gian跑去索要礼物。

“She hasn’t run out of patience with you yet.”Leora回敬妹妹，然后终于把脸转向Juno。

两个女孩身高相同，骨架肌肉搭建得极其相似。但如Audra所说，细看还是有些差别；主要在于眼睛：Leora的眼睛与Juno完全不同，但Juno再熟悉不过这双眼睛。

“You have our mother’s eyes.”

“Interesting.”Leora的笑容依旧矜持，“I never met her.”

Juno心底浮起一丝讥诮，对这个妹妹迅速失去兴趣；她看起来就像我，但是更软弱。

“Juno! Leo!”Audra又跑回来，亲热地一手挽起一个姐姐往桌旁走，“What do you say we try something new tonight?”

“Making us stay up playing Among Us again?”Leora收回对Juno的注意力，“Good thing I slept twelve hours on the plane.”

“No! I saw this witch game on TikTak. It looks amazing. You have to play with me.”

“Do we have a choice?”Leora对Juno笑道，“Ever wonder why Dad made you wait till November? Halloween is storm season around here. We all know better than to stick around.”

接下来的感恩节晚宴淹没在Audra和Leora的唇枪舌剑中；Gian和Georgina显然已习以为常。

Gian对另两名女儿讲述起Chiloé的当地传说，比如鸡蛋可能孵化出名为Basilisco Chiloe的蛇身鸡头食人怪物等等。Georgina神情柔静地听着，间或点头微笑；Juno思考要不要学习姐姐这样既不热心又不失礼的神情，但最后决定按自己的方式来。

她一言不发地专注食物，吃饱后就坦言要离席。另三个女孩却也随之纷纷放下餐具，都宣称急着去玩游戏。

“Mind if I join you?”

“Dad, it’s girls night.”

“All right. Girls’ night. Fine. Have fun. No caffeine, and go to bed on time. Understood?”

秘密聚会依然在地下室专门划出来的游戏区。今天那里摆置数十面深宝石色的半透明三角形隔断板，分割出许多小更衣室，每间都有不同元素的女巫衣裙和配饰。放映机向墙壁泼洒着流转变幻的珠光霓虹，背景音乐是……

“Witch house isn’t my fav—”

“Oh, here we go.”Audra飞快截断，“Change it if you want.”

Leora决定把音乐调成Jean-Michel Jarre的Oxygène，然后也穿上派对服饰，四个小女巫就聚到房间中心的水晶吧台桌前。

“Okay, so we take turns going into the secret tent to make our potion cards. Three cards each. On one side of each card you write a secret, and on the other, a lie. Like ‘I’ve snuck into Dad’s studio’ on one side and ‘I’ve never been in Dad’s studio’ on the other. Then you seal each card in an envelope and bring all three back out. Once everyone’s done, we toss all the envelopes into a box, shake it up, and pick two each. Then we open them, make a potion based on what’s written on the cards, and come up with a story about what the potion does. At the end we destroy all the cards together.”

“Sounds fun.”Georgina照例捧场地称赞妹妹的主意，“I’ll go first. Let’s do it by age.”

Georgina走进角落的秘密帐篷后，Leora感慨道，“Geo is too perfect. I can’t wait to hear her darkest secret. Maybe she once forgot to say thank you.”

“No boring secrets okay? It’s anonymous anyway!”

“Fine by me. I have plenty that’ll keep you awake for the rest of your life.”

“Speaking of staying awake, isn’t it almost nine? Coffee time!”Audra跳下高脚椅，去snack bar找零食和饮料。

余下的双胞胎对视一眼，都有些不自在。

“So... are you into this kind of music?”Leora礼貌道。

Juno置若罔闻，慢条斯理地站起身，“Do you want anything to snack on?”

“I’m good.”

看到Leora有点生硬的表情，Juno淡淡地笑了笑。

和Audra一起端着托盘回来时，Georgina已完成配方，于是Juno放下手里的桃子青柠咖啡走进帐篷，见圆几上放着一沓空白卡纸、纯黑信封和成套的回墨字母印章。她印好自己的秘密装入信封，回到吧台时见两个妹妹正热火朝天地讨论磨砂膏和护肤霜。

Leora离开后，Audra忙不迭地问Juno，“Is she anything like you pictured?”

“I never really pictured her at all.”Juno轻描淡写，“Did you just ask her the same thing?”

“You always know everything.”Audra一边喝巧克力affogato一边大笑，“She said you didn’t seem very interested in music. And I told her ‘Not everyone’s as obsessed with music as you and Dad. Or Mom’. Oh, Geo, you really don’t drink caffeine?”

“I’m not tired.”Georgina捧着姜黄拿铁坐回Juno另一侧，“Ruby only told us your name and showed us a few pictures. I was wondering what you used to do in your free time.”

“Really? I wasn’t really listening. I figured you’d be here anyway. And literally you wouldn’t be into the same stuff we are, like gymnastics or riding. People don’t really do those things where you’re from, right?”

“Not very popular.”Juno颔首，“What did you think I’d like?”

“Manga, maybe? K-pop dance? Talk shows? But I’m probably wrong. You never talk about that kind of stuff...”

“I collect and mount insects.”

一直到Leora回来，Audra还在追问细节，Juno每多说一句话她就惊叹一声。Leora向继姐问到这两人在聊什么之后也有点意外，不过她不愿探寻Juno的过去，于是催促妹妹快点进帐篷，“And don’t waste a card on something no one cares about. Naming your breakfast omelet Eggard is not a secret.”

“Looks like you just revealed her deepest secret.”Georgina看到Audra气鼓鼓离开便打趣。

“Uh-oh. Should I start worrying she’s going to murder me?”

“What if she actually does?”

Leora没想到Juno也会开玩笑；确实Juno看起来一点都不像在开玩笑。大概这就是deadpan式喜剧。

“Then I’ll haunt her every night until she admits we finally get along. And on her birthdays, I’ll make a special appearance. Anyway, what are you guys getting her next month?”

生日礼物话题延续到Audra回归。女孩捧着一只拆成两个半圆的球形塑料盒，里面已有三枚黑信封，“Come on! Put all the recipes in here.”

十二封信装好后，女巫们相互抛掷、旋转圆球确保信封混匀，直到Audra热得摘下尖顶帽；然后她们把秘密倒出来，四人各拿两个。

Juno发现数目有误，“Who put in an extra one?”

“No way. No one even opened the box.”

但信封千真万确变成十三只。

There is 1 Impostor among us.
