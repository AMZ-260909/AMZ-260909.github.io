    <script type="text/plain" id="chapter-text">
莫寻秋虽然没有坦白，但她认为风和光或许已看出什么端倪。不过好朋友并未旁敲侧击。莫寻秋很认可这一点：风和光永远把忠诚放在好奇之上。
      
而风和光的想法则是：在莫寻秋面前，忠诚总是比其他任何手段更有效。
      
这对默契的朋友很快就要分别。
      
2022年11月4日傍晚，莫寻秋从扈东机场私人航站楼起飞，预计11月4日深夜到达Westchester。
      
虽然飞机的恒温恒湿系统让一切都很舒适、睡衣是熟悉的、床品泛着浅淡的薰衣草香、温热的蜂蜜牛奶送下半片褪黑素、看护说了许多柔和的哄睡故事……但女孩还是难以入睡。
      
左右两排半掩的舷窗外三万英尺的高空和零下五十度的黑暗使她本能地联想到死亡，并引出最近的一系列事。Juno漫无边际的联想持续了很久，直到苍白的太阳燃起——是飞机追上她在扈城道别的那个落日。不知缘由地，她开始流泪。
      
其实她未曾料想那封邮件会得到这种形式的回复。她那时只希望做点什么维持原本的生活：不怎么好的生活；可也有一些不怎么坏的时候。
      
手环可能让医生注意到了她的哭泣，但人们都格外专业地保持安静。女孩没有摘下眼罩，只不断用湿巾拭去溢出的泪水。情绪平复后，她起身去洗脸，然后要求换一套床品。
      
不久后，飞机落地补给，Juno那时在看书。短暂的白昼里，她读完Euripides的Ion，吃了一点东西，直到窗外再次暗去才疲倦到昏睡。
      
醒来时，女孩发现自己躺在宽敞的车后座上；大概是睡得太沉，被从飞机上抱下来也没有醒。
      
车里的冷气比莫眉的公寓还足，牛皮内饰的微涩味和香氛里的泥土气息都让她恶心。她头痛并且眩晕，耳朵也因为气压变化很不舒服。她坐起身，把毛毯裹好。后座的另一位乘客是那名看护，正从恒温吧台里取出一杯饮料。
      
“我们还有十分钟的路程。这是姜汁苏打，可以让晕车的感觉好一点；或者你想嚼点薄荷软糖吗？”
      
Juno接过那杯温热的饮料，喝起来一点都没有辣味，确实让她痉挛的胃部感觉好些；双耳也伴随着吞咽不再疼痛。她看表，现在是CT时间23点。
      
微讯有风和光发来的生日祝福，她简单回复说刚已抵达，一切都好。几分钟后，车辆驶入庄园，车道两旁开始有幽暗晶莹的地灯，一路引到主屋前。Juno穿好外套走出车外，听到不远处海潮绵长的起伏、四周寒风筛过树冠的簌簌，然后被庄园经理和一路陪她过来的看护迎进锻铁雕花玻璃门去。
      
门厅内的陈设馨雅冥谧，壁上点着几支烛形灯泡，楼梯旁悬着一幅暗金浮动的挂毯，绣满栩栩如生的宫廷人物。经理之前已和Juno通过几次视频电话，因而只简单问候了几句行程就带女孩向她的卧室走去。
      
上楼梯时，即使早就下定决心要表现得波澜不惊，Juno也忍不住多瞥一眼那金光熠烁的挂毯。花绣精致到她在匆行间依旧看得清乐手们丝绒外套上的细褶。
      
两人将她送去卧室，Juno拒绝掉床边故事服务。锁好门后，她先去丝绒落地长帘前审阅一番，又检查所有镜子，才彻底松弛下来。洗浴间明显翻新过，比卧室本身现代化得多。女孩强忍疲惫，仔细将自己冲洗干净，换上印着朱伊纹的内衣裤、睡衣裤、袜子、睡帽，拉开层层叠叠的雪白丝幔，才沉入喧闹的梦境。
      
大约六小时后，Juno起床洗漱。她昨晚已看到长榻上铺着一套起居服，倒免去在衣帽间挑选的烦忧。走出卧室前，她回想看过的布局图里晨间室的位置——没客人时通常在那里吃早餐。
      
然而没走几步，一个女孩正好从另一间房门里跑跳而出，猝不及防地与她打个照面。
      
“Morning.”Juno先开口。她知道Gian和Leora去Patagonia采风，但Georgina和Soleil却是在家的。她说英语时并不会比说华语更热切，但考虑到这是初见，就慷慨地多加了一个词：“Soleil.”
      
“Oh my God! You know my name!”Soleil大呼小叫道，“Geo! Georgina! She looks nothing like her pictures. She looks like Leora, only more—”
      
“Soleil, don’t be rude.”另一道嗓音盖过Soleil兴奋的尖叫；Georgina慵倦地站在晨间室门口向两个妹妹挥手，微蓬的长发用缎带松松束起垂在背后。“Nice to meet you, Juno.你感觉怎么样？”
      
“还好。”
      
“I had the worst jet lag when I came back from Japan. I couldn’t sleep properly for days. But Japan was amazing.”Soleil目光灼灼地盯着新姐姐，“我还没去过华国，我妈妈是华国人，但我只会说一点华语。We’re going after all the lockdowns are over. You’re from Hucheng, right? I’ve seen videos. I really like it there.”
      
说话间两人走进晨间室，Soleil跳到Georgina身旁，和姐姐并排站着冲Juno友好地笑。这对异父同母的姐妹长得也不大像，Georgina明显是华裔；Soleil则像极了Gian，很难辨认血统。
      
三个女孩互相瞧了几秒，Soleil受不住这沉默，大声笑起来，“Sorry, it’s just...you’re really quiet. Not like Leora. Which is probably a good thing. I don’t think I could survive another Leora. Can we eat?”
      
一顿早餐之后，Georgina和Soleil已熟悉新姐妹的风格：话少。
      
不过Soleil见过的人几乎都比她话少，很快她就不再每句话都带上Juno，转而滔滔不绝地讲接下来三天的fall break打算怎么安排；Georgina时不时回几句话，两人说说笑笑很是和谐。Juno独自享受着从自助餐台上拿来的咸焦糖南瓜司康、溏心蛋、烤笋尖和蓝莓奇亚籽杏仁奶燕麦粥，吃饱后和对面两人打个招呼后就离开。
      
她这几天的日程很满：今天上午经理会带她游览整个庄园，认识重要的工作人员，并将生物信息录入安全系统；下午会有考官来与她进行机考ISEE；明天参加定级测试，还会有家教来评估她的体能，为她选择一到两门运动课程，大概是pickleball或者softball，毕竟新学校很注重体育与合作精神。
      
另外刚刚Soleil坚持要在后天晚上进行一个三姐妹秘密通宵派对来作为欢迎仪式，Georgina形容这是一个恐怖的点子，因为她们次日一早都要去上学，尤其那是Juno的入校日。但Juno觉得不妨接受挑战。
      
之后很快就会到感恩节。Gian承诺在那天与Leora一起回来。Juno不知道刚刚Soleil说“看起来就像Leora但是更——”之后的那个词是什么，不过她也不是很在乎。她并不真心关心Soleil或者Georgina的看法；她们像庄园布局一样需要适应并掌握，仅此而已。
      
也许尽管莫寻秋已被弃用，但她还没发自内心地成为Juno Vane。
      
然而，无论如何，我已抵达母亲曾心心念念的地方。
      
Ώ τύχη, που αδιάκοπα τη μοίρα μας αλλάζεις.
