2022年9月9日，周五，多云转晴，23-29℃。

宁蓁每次进莫家先看向鞋柜。如果看到莫眉在家时惯穿的拖鞋被胡乱抛在鞋柜前的地上，她就会舒口气。

她为莫眉做家政已近十年，这个习惯开始于六年前；事实上，最开始的三年多，她们相处还算不错。

宁蓁初次登门莫家是2012年的平安夜。彼时她才22岁，扈城也尚青春靓丽；同龄人们大多在呼朋唤友地庆祝所谓末日预言的落空，灯火簇簇中处处都是笑闹。

唯独她仿佛来自一条末日已真实发生过的时间线：12月2日傍晚，母亲与丈夫簇拥着她与才出生两天多的女儿回到家中，已打点好诸事的婆婆和月嫂在楼道里就笑脸相迎嘘寒问暖；很快，哥哥也拎着营养品来探望她……

但他还带着一个陌生女人。她相貌平平、性格跋扈、自称出生于某个遥远的小村子，并宣称与哥哥明天就去领证结婚。

宁蓁不想复述末日的每个细节。总之当晚哥哥和这位准嫂子摔门而去后，宁蓁连忙喊丈夫追上去劝说，毕竟他既是哥哥的大学同学又是创业公司的合伙人。不料一小时后，丈夫拨电话给婆婆，请婆婆转告她说打算离婚，同时委婉表示是因为哥哥要与她们断绝关系，所以希望宁蓁能理解男人以事业为重的选择。讲究体面一辈子的母亲闻言抢过手机怒斥，之后在与婆婆争执中激愤而昏厥。宁蓁与月嫂手忙脚乱地叫救护车，并在两周后得知母亲大概率不会再苏醒——也不一定，也许会有奇迹。医生说，不过家属要做好长期照顾卧床患者的准备。

此前，家中积蓄几乎都已投入哥哥的初创公司；婚房随着一纸协议不再为她所有，妥协签字只换来十万现钱，如果母亲病情反复，恐怕三年就会耗尽。宁蓁在一番计算后，不得不拖着产后虚弱的身体四处求职。

靠母亲的好友帮忙，尽管只是专科毕业且没有工作经验，她还是很快拿到一份支持远程办公的清闲工作；但薪水极低。宁蓁在医院走廊疲倦地晃着女儿哄她入睡，读完周边租房群的消息又开始浏览同城招工论坛。

大部分工作都不怎么适配她的情况。宁蓁心烦意乱地一遍遍刷新，突然看到一条求购母乳的帖子：发帖人自述是单身妈妈，刚生双胞胎不久却患上乳腺炎。报酬优厚。

她很清楚最坏的情况，即使如此还是匆匆拨出帖子里的号码；好在电话对面至少是女人的声音。

女人听完宁蓁声泪俱下的讲述后似乎有一丝同情，说如果宁蓁能兼做煮饭打扫就允许她将母亲和女儿也接进佣人房住，这样可以省一笔租金。

祈祷着对方不是在诈骗，宁蓁次日抱着女儿前去莫家。来开门的人看着比她年纪还小几岁，以至于宁蓁没想到她就是发帖的母亲。但莫眉很快领她越过极大又极杂乱的客厅、来到一双嚎哭的婴儿前，“喏，我女儿，快喂吧。愣着干什么？喂不喂？喂的话我先结三个月的工钱给你，不喂快滚。”

莫眉的言行举止一贯粗鲁，但结钱爽快；喂奶后宁蓁又看了看40平米的佣人房，最终选择接下这份兼职。

之后的三年里，她兢兢业业地浇灌女婴们长成稚童，同时照顾尚未等到奇迹的母亲和虽然不属于她但任她摆布的公寓。母亲又断断续续住过几回院，使她的存款仍不乐观。前夫和哥哥都不曾发来半点问候，她刚开始因此怨恨，后来尝试主动联系；用尽一切方式未果后只好恢复怨恨。

“不打算再找一个？”

“不了，怕再找，对小凤凰不好。”宁蓁望着女儿与莫眉的两个孩子在地毯上玩耍，露出一丝苦中作乐的微笑，“我反正就这样了，希望她快快乐乐地长大吧。”

莫眉不以为然地扬唇，幸好没说什么难听话，只是换上高跟鞋扬长而去。她那时才22岁，更像未婚年轻女人而不是一位母亲，经常出门大半天甚至一两周后才在某个凌晨或下午回来，往往那时已艳容剥落、漆鬓松蓬，刺鼻的烟酒气和恐怖的呕吐声总将女孩们惊醒。

被惊醒后，莫寻秋会把头蒙起来，她从小就很少哭；相反莫名妙的嚎叫堪称惊天动地。小凤凰有时也会哭，但从来都哭得很小声且很快停止。

宁蓁因女儿自有意识起就懂得什么是寄人篱下而深感愧痛，但再找新兼职可能会更辛苦；何况在这里女儿的衣服、食物与学前教育等一应花费都能靠一句顺便省掉。

除此之外，人非草木，要离开另两个被她喂养大的孩子不太容易。莫名妙总喜欢紧紧裹在宁蓁腿上，咿咿呀呀讲刚刚张阿姨教的新字词或者索要从电视里看到的玩具；莫寻秋大部分时间会安静地看iPad，但有时宁蓁余光会接触她向自己投来的眼神，其中还是有幼童独有的、柔软又茫然的依恋。

莫寻秋的目光、莫名妙的话语和这所越来越豪奢的公寓一样都不属于宁蓁，但本应拥有它们的莫眉却不怎么把这些当回事。她对待女儿像对待所有人或者所有物品一样，高兴时搂着她们无话不说，不高兴时就大喊大叫甚至直接动手。

两个女孩对此有各自的策略：莫寻秋极力避开莫眉，不论对方心情如何；莫名妙则学会冲莫眉大吼回去——莫眉往往因此被逗乐，然后母女和好如初。

显而易见，莫名妙更对莫眉的脾气；而且她长得与莫眉、莫寻秋都不同，漂亮得一目了然。

2016年某个夏夜，莫名妙溜进妈妈的房间，误入快闪直播镜头，在背景里煞有介事地又唱又跳。那天莫眉的直播间爆火，女人首次尝到了有女儿的甜头。

莫眉是一个尝到甜头就会不停索求的人，于是莫名妙开始更多地曝光在镜头下。

刚开始莫名妙很享受这个新奇的游戏，但三个月后她开始厌倦这份工作。那天中午她突然缠住宁蓁大哭，说不想再拍照拍视频，不想直播，想和姐姐、小凤凰一起去幼儿园……

宁蓁直到雇主晚上回家时依然犹豫是否要开口；后者开门时身旁还站着一位年轻英俊的摄影师。莫寻秋早早就回自己的小房间关紧门，莫名妙则一个劲拉扯宁蓁的袖子，又开始抽抽嗒嗒地呜咽。

“莫小姐……”她趁摄影师摆弄器材时对莫眉低声说，“妙妙还小嘛，总化妆拍这些会不会对身体发育不好？”

莫眉抬眼，先是不解，旋即大笑，“宁姐，你是我保姆还是我婆婆？婆婆瘾犯了就再找个男人生个儿子去。算什么东西，敢对我说三道四？”

女人一如既往把这些难听话说得很大声。宁蓁臊得面红耳赤，丢下莫名妙逃进佣人房，次日就提出下户。

莫眉没有挽留，但也没再给宁蓁难堪，甚至多给出一封颇有厚度的下户红包。如果一切到此为止，似乎勉强可算好结局。但在宁蓁三人搬去出租屋不到一周后，莫眉又打电话要求她尽快回去，“妙妙总是哭着要找你，打也没有用，吵得很。”

她挂掉电话。

可新兼职确实寒酸劳碌许多。某天，她深夜回家后看到小凤凰正在偷偷学自己的模样给外婆按摩手臂肌肉，模样吃力得有些滑稽。

女孩见母亲回来就笑着跳到地上，“妈妈！你累不累呀？我去给你倒杯温水喝，你快坐下休息哦。”

宁蓁为此痛哭一场，与莫眉商量后定下每周一三五做上门家政。莫眉没在乎她的出尔反尔，或者说也许从没在乎过她的任何心思；而莫名妙却在乎并且因此变了：

小女孩不再跑来抱她、与她说话，还总故意在她拖过的地板上用脏兮兮的脚踩来踩去。

安分守己的家政一言不发地把脚印擦掉。

如此几周，莫名妙不再捣乱；转而大声讲述自己又上了哪个平台的开屏页，粉丝数又涨多少。有时她会在讲述中插几个粗鲁的字眼，虽然她才四岁。

但无论如何，宁蓁保持沉默；只是暗暗希望上门时不要遇上莫眉；最好，也不要遇到莫名妙。

Had somewhere to get to and sailed calmly on.
