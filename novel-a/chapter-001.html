夜色练习 · Night Notes · 夜のノート · 밤의 기록 · Notas nocturnas

窗外有一颗粉色的星，像谁不小心落在黑纸上的糖粒。桌上摆着三只杯子：第一只装着风，第二只装着星期二，第三只什么也没有，却发出轻轻的回声。“现在几点？”纸船问。“大概是蓝色以后、雨声以前。”铅笔回答。这里没有必须抵达的地方，只有一些慢慢排列的字：山、海、灯、旧车票，以及一封尚未写完的信。

停。
再走一步。
这一行仍在同一个段落里。

The small station had seven clocks, and none of them agreed. One said morning; another insisted on Thursday. Beside the window, a paper fox counted invisible trains: one, two, three... then started again. “Would you like a cup of quiet?” asked the keeper. “Only if it comes with a silver spoon.” Outside, the road folded itself into a map, while the clouds arranged their pockets by color. Nothing important happened, which made it an excellent evening for watching letters find their places on a page.

Hello, moon!
Goodbye, tiny clock.

夜の図書館では、まだ誰も読んでいない地図が静かに眠っていた。窓の向こうに小さな星が三つ、ひとつ、また三つ。「この道はどこへ続くの？」と猫が聞くと、古い椅子は「たぶん、明日の朝ごはんまで」と答えた。机の上には、青い切符、丸い石、名前のない鍵。そして、何も入っていない箱。その箱だけが、ときどき海の音を立てる。ページをめくるたびに、遠い街の灯りが少しずつ近づいてきた。

しん、と。

작은 우체국 앞에는 이름 없는 나무가 서 있었다. 바람이 불 때마다 잎사귀들은 서로 다른 시간을 이야기했다. 어떤 잎은 아침을, 어떤 잎은 아직 오지 않은 겨울을 기억했다. “이 편지는 어디로 가나요?” 아이가 물었다. 우체부는 웃으며 대답했다. “주소 대신 별 하나가 그려져 있으니, 오늘 밤에는 하늘로 가겠지.” 책상 위의 연필은 조용히 굴러갔고, 빈 봉투 속에서는 아주 작은 파도 소리가 들렸다.

잠깐만요.
여기는 같은 문단의 두 번째 줄입니다.
그리고 세 번째 줄: 하나, 둘, 셋!

En la plaza había una puerta sin pared. Cada tarde, una señora la abría para que pasara el viento. «¿Adónde vas hoy?», preguntaba. El viento nunca respondía, pero dejaba algo sobre la mesa: una hoja, una pluma, quizá el olor de una naranja. Un gato amarillo vigilaba la escena con absoluta seriedad. Para él, todo aquello era un trabajo muy importante; para la luna, era simplemente otra manera de aprender a contar hasta cinco.

¡Qué silencio!
¿Y ahora qué?

标点小径：逗号，句号。顿号、分号；冒号：问号？感叹号！省略号……破折号——以及“外层引号里的‘小小声音’”。括号（里面有风），方括号［里面有雨］，书名号《没有名字的书》，还有【一张标签】。数字排成一队：0、7、42、3.14159、2026/09/10；它们各自举着一把伞，谁也不催促谁。

下一条街比上一条街长一些，长到可以放下整整一下午的犹豫。有人在路边收集声音：钥匙落在木桌上的声音、雨点碰到空花盆的声音、翻过书页以后短暂的安静。他把它们分别装进透明口袋，标上甲、乙、丙，又忽然觉得没有必要，于是统统改成了“也许”。远处的公交车没有终点站，只有一个写着“请慢慢看”的站牌。车上的乘客带着不同颜色的梦，有人梦见漂浮的楼梯，有人梦见会唱歌的橘子，还有人只梦见一个句号。那个句号圆圆的，安稳地停在故事中间，像一颗并不急着发光的小星星。

Short line. Long shadow.

At the edge of the notebook, a blue umbrella waited for rain. "Impossible," said the ruler. "Interesting," said the eraser. The umbrella opened slowly: inside was a garden of question marks.

「こんにちは」、そして「またね」。
雨、風、光……今日はどれをポケットに入れよう？
小さな文字も、大きな余白も、ここでは同じ速さで歩いている。

멀리 있는 창문 하나가 분홍빛으로 반짝였다. 누군가는 그 빛을 신호라고 생각했고, 누군가는 그냥 예쁜 저녁이라고 생각했다. 둘 다 괜찮았다. 길모퉁이의 시계는 잠시 멈췄다가 다시 움직였다. 그 사이에 고양이는 하품을 했고, 종이배는 바다를 상상했고, 우리는 다음 줄로 내려갔다. 문장은 길어졌다가 짧아지고, 조용해졌다가 작은 느낌표 하나를 만났다!

Sí; quizá; mañana…

La última página no tenía una conclusión. Tenía una taza tibia, dos semillas y una nota: «Puedes quedarte un momento más». Afuera, las luces rosas parecían pequeñas comas sobre un cielo negro. Alguien escribió canción, después corazón, después pingüino, solo para escuchar cómo cambiaban las palabras. ¿Era una historia? ¡Tal vez! Era también una prueba de espacios, pausas y signos: (uno), [dos], {tres}; café + azúcar = una conversación que todavía no empieza.

最后一行，轻一点。
The stars remain.
星はまだそこにある。
별은 아직 그곳에 있다.
Las estrellas siguen ahí.
