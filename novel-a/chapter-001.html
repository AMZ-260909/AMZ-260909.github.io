    <script type="text/plain" id="chapter-text">
2022年9月9日，周五，多云转晴，23-29℃。

宁蓁每次进莫家先看向鞋柜；莫眉在家时惯穿一双纯黑压纹绒拖鞋，鞋侧有枚金光灿灿的徽记。看到它们被胡乱抛在鞋柜前的地上时，宁蓁就舒口气。

她在这里做家政已近十年，每周来三次的工钱可维持她与母亲、女儿三人的温饱，而另一份工相较之下就劳碌寒酸得多。

但宁蓁还是怕见莫眉。

最开始不是这样。

宁蓁第一次来莫家是2012年的平安夜。彼时扈城青春靓丽，处处灯火笑闹，但她的人生却骤然陷入深谷：母亲因哥哥要求断绝关系而悲怒昏厥；丈夫不顾刚出生不到半月的女儿，坚持离婚；一直做主妇的她乍然要担负祖孙三人的生计，不得不拖着产后虚弱的身体四处求职。

靠本科同学内推，宁蓁两周后拿到一份支持远程办公的清闲工作，但薪水极低。与此同时，她的积蓄已被母亲的住院费耗去大半。

出院时，医生先表示病人生命体征目前稳定，又委婉告诉她要做好长期照顾卧床病人的心理准备。

宁蓁将母亲安置在临时落脚的出租屋里，疲倦地推着摇篮哄女儿睡觉，读完周边租房群的消息又开始浏览同城招工论坛。

大部分工作都不怎么适配她的情况，她心烦意乱地一遍遍刷新，突然看到一条求购母乳的帖子；发帖人自述刚生双胞胎不久却患上乳腺炎。报酬优厚。

她很清楚最坏的情况，但即使如此还是匆匆拨出帖子里的号码。

好在电话对面至少是女人的声音。女人听完宁蓁声泪俱下的讲述后似乎有些同情，说如果宁蓁能兼做煮饭打扫就允许她将母亲和女儿也接进佣人房住。

祈祷着对方不是诈骗犯，宁蓁独自前去莫家。来开门的人看着像大学生，以至于宁蓁没想到她就是发帖人。但莫眉很快打着哈欠将她领到两个嚎哭的女婴床前，“这就是我女儿，你快点喂。”

莫眉的言行举止一直随意得几乎粗鲁；好的一面是结钱爽快且不挑剔。这个优点支撑宁蓁在这里工作两年，浇灌皱巴巴的女婴们一日日舒展成稚童。

两年后，母亲依旧瘫痴不醒，时好时坏的状况吞掉宁蓁攒的每一笔钱。前夫没出现过，她已想明白曾经自己引以为傲的从校服到婚纱不过是对方看上自己哥哥的初创公司。至于哥哥……宁蓁已被生活磨去所有心气，刚开始还有怨恨，后来便尝试恢复联系，可惜用尽一切方式仍无回音。

莫眉没怎么变。宁蓁与她交谈不算多，只知道她比自己小五岁，北方某县城出身，未成年就跟着亲戚来扈城打工。此人出门频繁，通常几天几夜不知所踪，某个凌晨或下午到家时往往艳容剥落、漆鬓松蓬，烟酒气或呕吐声总会惊醒睡着的女孩们。

被惊醒后，莫寻秋会把头蒙起来，她从小就很少哭；相反莫名妙的嚎叫声堪称惊天动地。宁蓁自己的女儿小凤凰也会哭，但从来都哭得很小声。

宁蓁因女儿不会说话时就懂得什么是寄人篱下而深感愧痛。

此时孩子们都已断奶，她也学会与生活中的种种不如意周旋，便思忖搬离这里。再找新兼职可能会更辛苦，但对小凤凰的成长总能少些坏处。

莫眉听取宁蓁的建议后决定另请一位专业育儿嫂来照顾莫寻秋与莫名妙，并给出一封颇有厚度的下户红包。但一周后，她又打电话来，要求宁蓁尽快回去上班。

“妙妙总是哭着要找你，打也不管用，吵得我没法睡。”

宁蓁犹豫片刻还是同意每周上门做三次家政。尽管工作是交易，但人非草木，她也并非全不挂念这两个孩子。

于是她每周一三五下午三点整来。

莫名妙会疾冲到门口紧紧裹在她腿上，咿咿呀呀讲张阿姨怎么教她们认字，又给宁蓁看她的新玩具；莫寻秋一向安静，独自看iPad上的学前教育动画，但有时宁蓁余光会接触她向自己投来的眼神，其中还是有幼童独有的、柔软又茫然的依恋。

莫寻秋的目光、莫名妙的话语……宁蓁认为这些都不该属于自己，莫眉需要去接收它们。她就此委婉提过，但女人没听出她的弦外之音；莫眉对孩子向来像对所有人一样，高兴时搂着她们无话不说，不高兴时就大喊大叫把她们驱赶到另外的房间。

两个女孩对此有各自的策略：莫寻秋极力避开莫眉，不论对方心情如何；莫名妙则学会冲莫眉大吼回去——莫眉往往因此被逗乐，然后母女和好如初。

显而易见，莫名妙更对莫眉的脾气；而且她长得与莫眉、莫寻秋都不同，漂亮得一目了然。三岁多的某个晚上，她溜进妈妈的房间，误入快闪直播镜头，在背景里煞有介事地又唱又跳。

那天莫眉的直播间爆火，女人首次尝到了有女儿的甜头。

莫眉是一个尝到甜头就会不停索求的人。于是莫名妙开始更多地曝光在镜头下。

宁蓁是半个月后从莫名妙那里知道这些的。小女孩缠住她哭得仿佛两人第一次见面时。她说不想再拍照拍视频，不想直播，想和姐姐、小凤凰一起去幼儿园……

于是那天宁蓁做完家政后迟疑着没走，磨蹭到莫眉回家；后者开门时身旁还站着一位年轻英俊的摄影师，应是刚吃过晚饭。莫寻秋早早就回自己的小房间关紧门，莫名妙则一个劲拉扯宁蓁的袖子，又开始抽抽嗒嗒地呜咽。

宁蓁无法，只能趁摄影师摆弄器材时对莫眉低声说，“莫小姐，妙妙还小嘛，总化妆拍这些会不会对身体发育不好？”

莫眉抬眼，疑惑后便嗤笑，“宁姐，你是来做卫生还是做婆婆？婆婆瘾犯了就再找个男人生个儿子去。你算什么东西，对我说三道四？”

她一如既往把这些粗鲁的话说得很大声。宁蓁臊得面红耳赤，落荒而逃。

回到家，同样只有三岁多的风和光正在偷偷学宁蓁的模样给外婆按摩手臂肌肉，模样吃力得有些滑稽。见妈妈回来，她笑着跳到地上，“妈妈！你累不累呀？我去给你倒杯温水喝，你快坐下休息哦。”

宁蓁脸上火辣辣的羞辱感未消，先因此打消辞职的心。

她需要钱。莫眉有钱。莫名妙的直播会让莫眉变得更有钱。

于是她后来安分守己地继续在莫家做上门家政，同时暗暗希望不要遇上莫眉；最好，也不要遇到莫名妙。

莫眉显然没把那天的事往心里去，也没感觉到宁蓁的变化。

但莫名妙感觉到并变了。

小女孩不再跑来抱她、与她说话，而是会故意在她拖过的地板上用脏兮兮的脚踩来踩去。

宁蓁沉默地把这些脚印擦掉。

如此几周，莫名妙不再闹；转而大声讲述自己又上了哪个平台的开屏页，粉丝数又涨多少。有时她会在讲述中插几个刺耳的字眼，虽然她才不到四岁。

但无论如何，宁蓁保持沉默。

Had somewhere to get to and sailed calmly on.
