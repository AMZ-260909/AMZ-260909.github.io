    <script type="text/plain" id="chapter-text">
摄灵吐纳的祝词在识海中唤出一轮明月，正悬在万秋与女人之间。

“所以她为什么会在我脑子里。”万秋默默想道，然而却清楚地听到自己的声音。

“……唉。”女人似是回应般叹气。

万秋心中警铃大作，但又想到云老太太据Helena说是千年来最快突破化神的天才修士，如果女鬼要做什么，这里或许已是最有利自己的地方。

“你是谁？”

“我是谁？我也不太清楚……”女人的声音婉转动听，“现在是什么时候？我们在哪里？”

“你在撒谎。诚实回答，或者我把你交给学宫。”

“可是我现在除了你的声音什么都感觉不到，什么都想不起来，我真的不知道这是怎么回事……”

“最后一次机会。”万秋冷冷道，“你听到了，云霞媚就在我的教室，我只要举一下手，她就会来处理你。”

女人沉默片刻，腔调尖刻起来，“比起我的事……看起来你今天是第一次吐纳？那你的诅咒很快就会发作……小姑娘，很快你就不会有精力关心我了……哈哈，哈哈哈，好可怜啊……”

女人凄厉的笑声让万秋回忆起自己濒死的中秋夜，一瞬间头痛又恶心。月轮被强烈的情绪冲碎；她浑身颤抖地睁开眼睛，努力调整呼吸节奏。

周围的同学都在闭目吐纳。晏守中很快走到她面前，将手掌轻轻搭到她发顶，然后……

万秋每次进入识海都会听到惨笑声，然后月亮在没凝实之前就破碎。反复三次，她嘴里开始发酸发咸，冷汗湿透校服。

“我要回宿舍。”

“万秋同学，你需要去医务室做个检查。”

“我回宿舍洗漱之后就去。”

“好的，我已经通知许老师来接你。别担心，很多人刚开始修炼都会有些不适应，每个班都有这样的情况。”

万秋与生活助教一起回到宿舍，沐浴后换上清洁过的校服，仍觉得额侧隐隐作痛。

她知道自己不得不去医务室。自然，她不打算和盘托出；她需要搞清楚诅咒的事。如果告诉学宫，也许她不会得到真相，或者可能会遭遇更多控制。

但她确实需要校医帮她解决无法吐纳的情况。

“……我总看到妈妈去世时的样子。对，她已经去世一年多。我看到她，然后月亮碎掉，每次都是这样。”

“好的，我明白了。”校医翻看着万秋的检查报告，又问几句身体不适的具体细节。

最后女孩走出医务室时拿着一瓶清心宁神液，医嘱是每次吐纳前在两侧太阳穴和人中上多涂些。

万秋提出继续上课。许无忧没有阻止，送她回到心法课教室。

教室门口还站着两个人，是一个庚子班女生和她们班的生活助教。

“……每个人灵窍都有些许不同，身体对灵波的反应也有大有小，这些你生理课以后会学的。”叶初圆柔声劝慰道，“看，庚午班也有同学不舒服。”

见有人走来，宁涉雪顾不上呼吸不畅，连忙低下头把口罩戴好。她今天没吐纳几分钟就觉得胸闷，坚持数小时后终于不得不到教室外调整呼吸。

从小到大她总是病痛不断，没想到在九州还是如此。难得这回她不是唯一一个。

宁涉雪偷觑这位症状严重到不得不去医务室的庚午班同学，心中不光彩地有些窃喜。

那个女生脚步在她身边停住，似乎也在看她。宁涉雪因刚刚的幸灾乐祸有些忐忑地抬起眼，见对方神情冷淡，一双眼黯沉沉又凉冰冰地望过来，一点都不友善。女孩被刺得垂下目光，看到此人名牌：

万秋｜2024届庚午班学生

好在万秋并未说什么，只是看她几秒就径自走进教室；宁涉雪又站着缓了几分钟，也重新回去吐纳。

此时还不到8点，天光已大亮。宁涉雪坐回自己的位置，郑自馨来帮她入定；这次出现在识海里的是一轮散发着朱紫光芒的红日。

女孩还是有些心慌气短，但她勉力坚持下来；再次睁眼时已九点整。

云霞媚颤巍巍起身，目不斜视地离开；两位助教说了些勉励的话，并提醒大家准时去上自然课。

风和光伸个懒腰从地上跳起来，和季如意等朋友说她看到有熟人在庚子班，要去打招呼，让她们先往自然教室那边走。

宁涉雪乍见表姐向自己走来，惊恐地抱紧手臂严阵以待。她课前和课间都观察过，表姐在九州与在尘世没什么不同，依旧被同学们拥簇着，忙碌又快乐……

她不久前才知道小姑和表姐的存在。小姑看上去比爸爸年纪还大，对宁涉雪颇为疏远；表姐却正相反，总是说说笑笑个不停，不仅和爸爸谈得来，还问宁涉雪不少问题——但都不是难以回答的问题——正相反，宁涉雪在事故后从未和他人这样无需费力地交流。

所以她有点害怕风和光。

表姐有一双似乎看穿她每个念头的眼睛和许多让她招架不住的话术，还有各种恰到好处的笑容。之后她一直节节败退，爸爸却乐见其成，尽力让她们多相处。

来到九州竟也躲不过。即使她装作没看到好友申请，风和光依然笑容满面地拦到面前来：

“雪儿，这么巧，你也在庚区啊，我之前还不确定是不是你呢。你来这里感觉怎么样？今天我们两个班正好全天都在一起上课耶，对了，你自然课的预习作业写了吗？”

“呃，作业，我写了。”宁涉雪惶然回答着，心想万一表姐问她为什么来九州怎么办？她最近两天编出好几个答案，但并没有自信瞒过风和光。

风和光却没提那个，“走吧，我们边走边说。诶等一下，我之前看你只加了【2024届庚区新生交流群】，要不要把这几个群也加一下？”

说着，风和光分享自己的屏幕，没管那些私聊和群聊眼花缭乱地弹跳消息，只点开【2024届庚金修士互助】和【上章小万象·2024】给宁涉雪看，一边解说着这两个群的作用。

直到一条万秋发送的消息弹出来，风和光暂停分享屏幕，飞快回复几句什么。

宁涉雪觉得万秋这个名字看起来有点眼熟。

噢，好像是刚刚庚午班那个比自己更倒霉并且表情很吓人的女生。

她决定趁表姐打字时主动出击，“表姐，你为什么来九州？”

“我吗？我当初根本没当真。我以为自己是在做梦，就答应了三青。我这几天特别后悔。我好想我妈妈，还很担心我外婆的身体，当然，我也很想你和舅舅。哎……”风和光抬起头时眼圈已经通红，“雪儿，我在这里一个家人都没有，好不容易看到你也在，我真的很激动。而且我预习作业也都有点看不懂，你知道的，我学习一直不怎么好，现在这么多新课……我也没心思学，就是总想我妈妈……”

“表姐……”

宁涉雪构思好的谎言并没用上，反而迎来一大篇诉苦；听到后面，她也有点鼻子发酸。

爸爸忘了我，会不会就对妈妈更不关心？妈妈一个人到底能等到我回去吗？

“表姐，其实，我，我也挺想家的。你预习作业有什么不会，我给你讲。”

风和光噙着眼泪抬头一笑，似是有些不好意思，“我也真是，一看到你就忍不住说这种不开心的事，我这几天其实已经不怎么哭了，只是刚来的时候好不习惯。”

“我刚来的时候，也不习惯。”

“是吧？我跟你说，我……”

表姐妹走到自然课教室时，宁涉雪已觉得自己的担心就像身后没人还频频转头那样不必要。表姐并没有问任何她需要撒谎的问题，反而让她对于如何做一名普通新生涌出灵感。

无论谁站在表姐身边，都会显得很普通。

这是宁涉雪在自然课教室被风和光热切地介绍给庚午班的几名女生时想到的。表姐的朋友们都对她很和气，很快接受她成为小团体的一份子。

也许九州并不是个只有坏选择的地方。宁涉雪隐约想道，她今天和表姐的交流就是一个好选择。

好的选择带来好的人生——助教是这么说的。好的人生，感觉确实很好。

并且，这一切都暂时与自己的目标不冲突。

那么就暂时如此。

Why fret about them if to-day be sweet!
