两个女孩相对默然中，宁蓁和医生一起走进房间。      

宁蓁在接到莫寻秋苏醒的消息前一直坐在母亲床边。虽然护理人员们把母亲照顾得极好，并不需要她的存在，但她感觉无其他处可去；对于哥哥的出现和莫眉的离开，女儿远比她适应更快，这个结论让她宽慰但孤独。      

她脑海里循环慢放9月9日最后一次看到的莫眉：女人当时穿着印满F字样的烟草棕真丝长袖衬衣，左手拎着中间横条上印有May的方形刺绣手提包，右手紧抓莫名妙肩膀，脸色僵硬，不忿中夹杂一丝怯弱，似乎劫后余生且愤愤不平。

之后第二天是中秋，她和哥哥、女儿将母亲安顿来这家医院，在餐厅吃了顿尴尬的团圆饭；傍晚小凤凰说有一本很重要的习题册被莫寻秋误装带走，必须拿回来，宁蓁便买些节礼随女儿一起去到莫家，路上也思考是否要借机辞职。她们到达后敲门许久都没人应声，女儿提出进屋，宁蓁认为闯入雇主公寓不妥，但风和光一反常态地坚决。      

最后宁蓁妥协。开门后，宁蓁从拖鞋的状态判断雇主此时在家，连忙解释道歉，俱无任何回应。两人走进客厅，见莫眉不省人事地倒在餐桌旁的一滩呕吐物中。

风和光尖叫着用椅子猛砸莫寻秋的房门。宁蓁则浑浑噩噩地报警后加入援救行动；后来几天里她机械地回答许多问题，并尽可能缩减关于三个孩子的部分，毕竟她早在6年前就选择并坚持沉默。      

沉默太久，面对莫寻秋时，宁蓁几乎忘了如何打招呼；女孩照常淡淡瞥她一眼，并无哀戚神色，也无任何问题。      

医生确认病人状态稳定。医生离开。病房剩余三人一站一坐一躺。      

“你妈妈……”女人艰涩地开口，“莫小姐她……”      

风和光柔和截断道，“妈，阿秋刚醒来，她好累的，我陪着她就好。你这几天为了莫阿姨的事忙里忙外，也去歇歇吧。如果需要找医生，我会按呼叫铃。莫阿姨的情况我和她讲。”      

于是很快病房又只剩两个女孩。风和光从一旁自己的书包里掏出朋友的Mac、iPad和电量为89%的手机，“时间紧迫，我没来得及多装你的东西。我妈不知道，别人也不知道。”      

莫寻秋才确定自己并不在另外的世界。好朋友还是时时忠于自己。      

“你舅舅是怎么回事？”她一边检查邮件一边问。      

风和光早编好应付的话，“天晓得，哎，他上周五晚上突然跑来我家找我妈，吓得我和我妈一跳。我妈从没和我提过他，不知道怎么找到我们。不过他挺有钱。我妈告诉我，她认回我舅舅是为了照顾我外婆，还有为了我读书上学。谁知道呢，这几天她总和我舅舅吵架。真是乱得一塌糊涂。你要是再不醒来，我……唉。”      

莫寻秋不置可否地听着。      

看朋友没接话，风和光又继续道，“你那天一直没回我消息，我和我妈去你们家看到莫阿姨倒在餐厅，我妈赶紧报警……现在调查结果还没出来，但可能是食物中毒。医生说你送来的时候血里好几种药物含量都超标，什么艾司唑仑、舍曲林、曲唑酮……当时……当时……”      

看朋友面色冷淡，风和光决定不再多问，转而提醒道，“我觉得明天应该会有人来问你问题。他们也问我蛮多问题，不过我基本都说不懂。学校里的人都以为咱们密接然后被隔离了。说起来，疯猫呢？我们去的时候没看到她。”      

“她早就被送走了。”莫寻秋最不愿谈妹妹的事，幸好眼下确实有更重要的事可谈。“Gian回复了我的邮件。”      

风和光一时没反应过来，随后难以置信地凑头过去看那封邮件。“哦，你是说你那个在美国的爸爸，莫阿姨和你说的那个。我们还一起搜过他。他——他知道——他知道这些事吗？你之前说，你不想提前和他联系，我记得。”      

“我不想。”莫寻秋肯定道；但是她不想自己成为下一个交易品。不过，她不会这么说。“我认为他应该知道这些事。我之后会去和他住。”      

“是啊，莫阿姨这样大的事，他应该要知道……”风和光声音飘忽，“但是，他有别的孩子，是吧？我们讨论过的那个……Leora？我后来发现她之前有一篇ig post提到过sisters，所以你爸爸至少还有另外两个女儿，可能他又结过婚，他那边的家庭好像很复杂。你觉得你去那边更好吗？其实我……你真的想去和他们住吗？”      

“嗯。”莫寻秋平静地写邮件叙述母亲的死讯，“我不在乎那些。”      

风和光识趣地起身说去看看妈妈在做什么，然后放轻脚步离开，跑进洗手间才满心难过地低低哭起来。      

比起同龄的孩子，她已经有很多高超的技巧达到目的，比如伪装失手割伤自己、藏匿朋友可能留下的证物或者恰到好处地扮演各种角色；但依然有许多时候，她真诚地感到绝望。      

十几分钟后，女孩出现在外婆的病房。她眼睛还很潮湿，但已习惯地微笑回答母亲的问题。宁蓁问了几句莫寻秋的状况，又问起莫名妙。      

“阿秋说她被送走了，早就走了。”风和光蜷到沙发上，“妈妈，莫阿姨有和你说过阿秋爸爸的事吗？”      

这个问题她问过一次，并没期待会有不同的答案，只是女孩现在很想与妈妈说点什么。她之前听莫寻秋描述大洋彼岸的Vane Family一直以为是莫眉编的故事；但既然朋友深信不疑，她就不会拆穿。

谁知偏偏是真的。      

“我没见过她们的爸爸，莫小姐也不和我说这些。”      

风和光并不在意妈妈的反应，声音越来越轻，“如果她没有爸爸就好了，我们可以收养她。我本来以为舅舅找到我们，莫阿姨又不在了，很多事会变得不一样。但其实什么都没变……我还是我，她还是她……”      

“小凤凰？”宁蓁扭头，却看到风和光闭紧眼睛似已入梦。这几天孩子担心朋友的事，吃睡都不上心，今晚总算可以好好补觉。      

帮女儿盖上毛毯，宁蓁又忍不住琢磨莫名妙的事；其实她十年前第一次上门就觉得莫家姐妹不是双胞胎。      

莫寻秋的生日是11月5日。但莫名妙平安夜时身上还黄黄的，脐带结都没掉。除此之外，莫眉真情实感地抱怨过数次女儿因早产在监护室住了一个多月；莫寻秋那时孱弱瘦小，但黄疸已褪，符合这个说法，所以莫名妙自然另有来历……

宁臻开完会来探望母亲时，见外甥女蜷在沙发上熟睡，妹妹坐在扶手上垂头沉思，很像从前母亲与妹妹在家时的样子。这对疏远十年的兄妹这几日因处理莫眉的后事而亲近许多，宁蓁见哥哥进来只低声问道，“你这么晚还不回家？”      

“我和她已经分居，现在几点回去都一样。”      

宁蓁有些意外，“当时那个孩子……”      

“是个女儿。和她住在一起。”      

“她知道你把妈接到这里来吗？”      
 “她目前的情况，知不知道这些都一样……”      

一番彻夜长谈后，宁蓁因郁结多年的心事了却而一觉沉沉睡到中午，之后便再次去探病。

精神尚可的病人正与朋友玩桌游，密密麻麻的棋子卡牌铺满小桌板，对来人视若无睹。      

风和光则扬起笑，“妈，你来看阿秋？”      

宁蓁站到女儿身后，手搭在女孩肩膀上，似乎有个支点才可放心地去看莫寻秋，“阿秋，你知道妙妙被谁收养了吗？”      

“不知道。”      

“啊，那也是的，收养手续肯定是莫小姐办理。我只是想，你会不会有见过那家人。或者听你妈妈，要不妙妙她自己提起过？”      

莫寻秋反而问道，“宁阿姨，你见过莫名妙的亲生父母吗？”      

宁蓁不防女孩揭穿莫名妙的身世，“我没见过，你们两个不是双胞胎吗？妙妙是莫小姐收养的？”      

“嗯。”      

“妙妙是什么时候搬走的呢？”      

“不清楚。”      

“妈，阿秋又不是妙妙的经纪人，你问这些做什么？人家MiMiMeow是大明星，肯定很快就会更新社媒的。”      

宁蓁也就顺着女儿递的台阶讪讪一笑离开。她手机早晨收到信息，说警方和社工下周一会来询问莫寻秋的情况；由于女孩暂无法定监护人，宁蓁作为与她关系最亲近的成年人要陪同询问流程。      

她认为人们不会问出什么新消息，最后的结论想来会是莫眉患精神疾病已久，且一贯滥用药物，中秋时打算自杀，并试图带着女儿一起。      

这个结论和宁蓁熟识的那名我行我素、张扬不羁的女人毫不相干。莫眉有段时间确实吃过精神类药物，但那是她们刚认识不久的事；自从莫名妙带来泼天流量，莫眉就开始重新热爱生活。      

不过，宁蓁转念又想起十年前三个女孩轮流在自己怀里吃奶的场景。      

如果一场谋杀案有凶手，最好的情况是凶手已经死去。所以她放弃思考，保持乐观——      

莫眉一定是自杀。      

'Tis folly to be wise.
