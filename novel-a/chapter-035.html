照片里离镜头最近的就是左下角的Leora，她坐在钢琴前侧着脸望向镜头，带着一贯矜持的微笑。再往右些是琴凳上坐着的另一个背对钢琴的女孩，笑得光芒万丈。画面中心站着一名姿态慵懒的男人，他一条手臂搭在琴盖上，手指摩挲着一方金色相框，由于相框装饰有白纱——像是新娘的头纱——因此看不大分明其中女人的面容（不过莫名妙保证那绝不是莫眉）。男人右边站着面无表情的莫寻秋，并排看过去两人容貌确实颇多相似。最右边是一个与莫寻秋身高相仿的女孩，眉目绮丽，神情柔和。

莫名妙猝不及防在此见到姐姐，为自己的谋杀没有成功而感觉……解脱。

在Leora走近前，她已明白这是什么意思。说实话，她并没有特别意外。

Leora长得比我更像姐姐得多。她说的是真的。我不是妈妈生的，也没有一个在美国的爸爸，我才是我们两人中更傻的那个。她现在还在那里生活吗？那么她已经把我完全忘记，我永远都是孤儿了。她还活着，但是我已经死了。或者反过来。这些都很复杂，莫名妙想，和莫寻秋有关的事总是这样。

“这个女的是谁？”

“That’s Jean, my father’s wife. Unfortunately, she died giving birth to my little sister, so none of us ever got to meet her.”

“那你爸爸没有把……没有把……把莫寻秋的妈妈也接到美国吗？或者，她是拍照的那个人吗？”

“我不认识莫寻秋这个名字。你的意思是Juno吗？”Leora指向照片中的孪生姐姐。

“应该是吧，我不知道她有了其他名字。她是你……是你的……”

“Juno’s my twin sister.”万灵决定迎难而上，揭开关于生母和Juno的秘密；但她还是有些紧张，尽可能多说一些话延缓真相的到来，“They say she was born a week before me. Juno stayed with our mother until the fall before last, when my father suddenly told us that she’d be coming to live with us because our mother had died of food poisoning. As for this photo...”

莫名妙没听到Leora更多的介绍。她几乎感觉天旋地转。这一切都不对。为什么会这样？

妈妈说的明明是“你姐姐病了，我给她煮些吃的”，但为什么最后死的人是妈妈？

女孩想得好像有点久，但事实上她又什么都没想。她听到Leora仿佛在叫她的名字。

“MiMi? Hey, what’s wrong? Are you feeling okay?”

“我……我……我可能不太舒服……”

莫名妙浑浑噩噩地把相框放回桌上。之后发生的事她完全忘记了。

有时她会很难回忆起刚发生的事情，通常要过几天才能反应过来。直到第二天上午的自然课，女孩才想起好像之后自己走回宿舍去了。

也可能是Leora送她回去的。她不确定，因为她应该是不想让Leora送她的；但不一定，如果没有人押送，她更可能会走到某个自己也不知道的地方睡一觉，醒来再跟着导航回去。

“I could be well moved if I were as you.

If I could pray to move, prayers would move me.

But I am constant as the Northern Star,

Of whose true fixed and resting quality.”

任天然声情并茂地朗诵这一节诗歌，“这几句诗节选自Shakespeare的Julius Caesar，但他犯了两个错误。首先，Caesar生活在公元前1世纪，那时这颗北极星离北极点还很远，与他在16世纪看到的景象是不可能相同的；其次，北极星也不是永远不移动位置的。为什么呢？因为……”

为什么呢？我犯了什么错误？

不，我没有犯错。

我没有杀人。我没有想杀妈妈（对，她死了，但人都是会死的），我没有试图杀她，我没有对她做任何事。我确实想杀姐姐，我也做了，但她明明还活着，至少三个月前还活着。总之我没有杀人。

“……对，地球没变，太阳没变，星星没变。变的是地轴指向的方向。地轴的细微转动使整片天空重新排列，这就是岁差。地轴一年大约旋转50角秒，转一整圈需要两万六千年左右，目前修士寿命最长的记录是837岁，从她出生到去世，北极星大概挪动了一个拳头的距离，她可能会察觉，但也可能不会……”

姐姐会察觉吗？

她会知道我杀了妈妈吗？虽然我没有杀任何人，但她会不会发现？她没有死，是因为她发现了吗？不，她没有发现，不然妈妈不会死。但是也许她发现了，我不知道。我什么都不知道。

“……之前我们讲过，地球是一个赤道略鼓、两极稍扁的不规则球体，不是一个完美的球。并且它在不停地高速自转。与此同时，太阳和月亮一直在用引力拽着这个鼓出来的部分。这些因素的共同作用下，地轴就开始缓慢地做圆锥形摆动。这种摆动是可以计算的，并不是乱动，只要我们掌握其中的规律，就能回看从前的星空是什么样子，也能预测以后的星空是什么样子……”

不，不，不要，不要计算我，不要回看我，不要预测我。我不想让你知道我从前的样子，我不想让你知道我做过什么。我要从这一切中离开，在你发现这些之前。但我不能，我要坐在这里，我要留在你在的地方。我已经后悔离开你了，现在我不能又被离开你。那我到底该怎么做？

“现在我们要做的，就是分成两人一组，每个组发一个这样的地球模型，你们看，这个模型的地轴延长出去指向的就是北极星的位置；模型底座的刻度呢，是黄道面的方位。你们可以自己动手转旁边的岁差旋钮，观察地轴指向的红线在底座刻度上是怎么移动的，总结它的路径形状，也要注意地轴的倾斜角度有没有发生变化。这个就是这节课的作业，学域里有更详细的要求，你们好好看，下课之前写好讨论帖。现在大家自由分组，请两位助教来帮我发一下道具。”

莫名妙不喜欢小组活动，也不喜欢写作业。同学们宁可三人挤一组，也不和她一起。她独自拿着模型，仇恨地看着旋转不休的地球，只想把它狠狠砸坏，最好砸在随便某个人头上。她需要做点什么来让自己好受一些，因为她感觉痛苦。

女孩想冲出教室，但转头发现助教正微笑地盯着她，做出加油的手势。任天然也在悄悄看她。

该死，为什么你们总要看我？我说过我会遵守纪律的。但她不确定自己是否能撑到两周后。也许应该放弃，也许被开除才好。

她煎熬地挣扎着，把手伸进背包里恶狠狠地抓挠，发出一些刺耳的声音。包本该是空的。但女孩手指却触到一张卡片。

她把它拿出来，看到纯白卡片上的烫金昆虫博物画和一些字：

蜉蝣（mayfly）

学名：Ephemera strigata

简介：蜉蝣目是现存最古老的有翅昆虫目之一，早在石炭纪（距今约三亿年）便已出现。幼虫栖息于淡水中，以水底藻类与有机碎屑为食，幼虫期可持续数月至两年不等；羽化为成虫后，寿命极短，多数种类仅存活数小时至两三日。

Fun Facts：世间独此虫具亚成虫态。初破水而出，色泽灰蒙，振翅临空犹未为真形。必再蜕一壳，方翅薄如纱、光可映影，成完全之体。

莫名妙完全被陌生卡片吸引，聚精会神地思考许久，最后通过昆虫图像辨认出这是Leora抽到的彩蛋里那只吸附钉的吊牌。她又掏了掏，发现戒指、吸附钉和另一张卡片都在。

我不可能装走这些，那么昨天Leora确实送我回到宿舍。不，我已经不得不删除她。我也许不会被开除……我真的不会被开除吗？现在需要完成什么作业？

女孩打开终端找到自然课版块，阅读需要完成的讨论帖，但里面充斥着大量她不明白的词汇，比如地轴、黄道面、角度、路径等等。

我永远都什么都不知道，我学不会任何东西。我很笨，连杀人都杀错了。我总是做错事。一切都很复杂。现在连Leora也变得复杂。如果她知道我在害怕什么……

这些关于害怕的想法让莫名妙更加害怕。她又玩了一会儿吸附钉，把它含在舌尖上摩擦上牙床。不知道为什么，她觉得它可以保护她，或者至少让她感觉自己不是独自一组。我们现在要做什么，我不知道，mayfly，你知道吗？

Do you want to call your TA? I can wait until she gets here.

莫名妙选择相信这个出现在心底的声音，并站起来走向禹惜时。

“……当然可以，你有哪个词不明白？……莫同学，你还记得我们讲过的如何使用灵网助手吗？……没问题，我再演示一遍，看，我们只要选中这个词，好的，现在轻轻点它，再点灵网助手答疑……”

“[昵称未设置]，我是灵网助手玉枢。很高兴为你解释这个术语：

地轴嘛，是地球自转的核心所在。你可以把地轴想象成一根穿透地球南北极的小棍子——虽然它实际上是看不见摸不着的，但它其实超级重要……”

Pardon me, thou bleeding piece of earth.
