    <script type="text/plain" id="chapter-text">
2024届学生踏道满300天是11月30日，恰好是风和光的十二岁生日。

和往年相同，她邀请尽可能多的朋友来一起庆祝；和往年不同的是，庆祝地点在她自己的住处。

由于平时两人都在万秋的公寓休息，尘世带来的东西也早都整理搬运过去，因此风和光一直将自己的宿舍当作party villa，几乎全区的同学都有自由出入权限，时不时有人借用这里举办聚会。

周六中午，风和光终于完成布置，走来走去微调black lights的细节，“去年我还很遗憾你不能来，没想到那天的愿望这么快就能实现。不过那个芭比舞会其实很无聊，一开始我们都挺想弄外星主题的，但是蔡芥子她妈妈非说吓人，真是奇怪，是吧，外星人有什么吓人的？又不是恐怖主题。”

“她妈妈这么说确实奇怪。”万秋正在为朋友今晚要穿的黑裙用荧光颜料画上凤凰图案，“她爸爸就长得很像外星人。”

“你怎么这么说芥子的爸爸啊！哎真后悔去年没和你讲这个，不然还可以告诉卢璐她们，笑死我了。”

另一旁的宁涉雪正在将LED发光冰块倒进各色饮料桶里，此时也笑得暂停动作。蔡芥子是表姐在尘世时最好的朋友之一，因此宁涉雪和她见过两次；这个女生喜欢故意从背后拍打吓唬她，所以虽没见过对方的父母，女孩还是很欣赏这个刻薄的笑话。

“有时候还挺想她们的，虽然来这里也交到很多新朋友，但要是能偶尔看看她们就好了。我觉得应该有那种东西吧，九州和尘世感觉没有差那么远，不像隔离很多年的样子。不过大概不能看到具体的人，或者不是所有修士都能用的……诶，画好了吗？太好了，我现在把灯关了看看效果！”

“好看，但是，为什么绿色？”

“绿色颜料最亮。”

“你们觉得彩虹色假发还是白金色假发更好？还是白金挑染彩虹色？阿秋你觉得彩虹色更好呀？哈哈哈哈哈那你自己选的不许反悔！雪儿，给你这个白金色的，你想在口罩上画点雪花图案吗？我？我的其实早就准备好了，和其他饰品都一起在第一间更衣室那里呢，是浅绿底粉花的……”

今天neon party的dress code是假发、Q版大眼太阳镜、深色服装和荧光首饰/彩绘。晚上7点时，宾客们陆陆续续入场，在迷幻旋转的彩灯渲染下仿佛一群卡通人物。

虽然请柬说不需要贺礼，但反正坊市一切免费，所以女孩们几乎都带了包装精美的礼盒。风和光笑逐颜开地接过礼物和祝福，指点客人们用发光玻璃杯盛饮料，并推荐她们去与一旁的十二层蛋糕塔拍照。

正式开场后，寿星简单致辞，然后就是唱歌许愿、分蛋糕。蛋糕并非整块，而是装在朵朵小纸杯里，女孩只需将它们一一递给宾客。

分到第六层时，不知谁撞上风和光踩着的凳子，女孩重心不稳地摇晃几秒，手臂慌乱摇摆将蛋糕支架碰倒；惊呼声中，万秋眼疾手快地扶好支架，但最上面三层的纸杯还是掉下来四五个，蜡烛也震得歪歪斜斜。

风和光那边有不少人撑扶，并没摔倒，只是两只蛋糕摔落时奶油尖顶蹭过发髻，看着有些狼狈。

“没事，不干你们的事。”她笑着挥手，“接着奏乐，接着舞！”

金同尘配合地将生日歌提前切换去曲调更为激烈的派对音乐，欢快的节奏压过尴尬，季如意和望少微好心地捡走摔坏的纸杯蛋糕，用纸巾盖住地面上的狼藉。风和光继续言笑晏晏地分蛋糕，“真吓我一跳，幸好只是蛋糕不是飞机，没有把我和架子撞倒。”

“是啊，架子如果倒掉可能会砸到很多人。”

“感觉这个架子底座太轻，早知道该粘在桌子上。”

所有人都领到蛋糕后，风和光跳下凳子，万秋将空支架挪去角落，宁涉雪被指挥着拿来湿巾为表姐擦掉假发上的奶油。稍微整理造型后，女孩依然兴高采烈地在人群中游走，在气氛合适时宣布开始玩游戏。

游戏除却经典的真心话大冒险、我能你不能这类外，还有夜光版你画我猜、名画涂鸦、配音PK等，很快客人们围着几个GM分成一个个小圈坐在一处玩得热火朝天。宁涉雪在这种嘈杂环境中听说能力大大下降，不巧原与辉拉她一起去玩Exquisite Corpse：每人盲写一句歌词，然后击鼓传球，荧光球落谁手就要即兴演唱这首七拼八凑的歌。

这个游戏显然不适合她。不过，宁涉雪不愿示弱，所以硬着头皮坐下，希望自己不要倒霉地成为演唱者。

刚开始几轮她确实幸运，每次鼓声停下时球都离她很远；但运气总有用完的时候，终于，她将球抛给下一个人，对方没接到，鼓声却停了，荧光球在地上弹跳几下，两个女孩都没去捡。

GM很快将球拾起，另一个女孩似乎抢先说不该自己唱，宁涉雪对此情景有些无措。

然而GM并没将话筒递给宁涉雪，“既然球在我手里……”

宁涉雪听不清万秋是怎么唱的，但从周围同学的反应来看至少水平在中等之上。又玩了一会儿，她慢慢反应过来并非是自己运气好，而是GM知道自己不想唱歌。

女孩感觉愤怒，决定退出游戏；恰好风和光公告蹦迪环节开始。

于是女孩们站起身，在缓缓升起的薄雾、泡泡和从天花板飘洒下的亮片与彩屑中跳舞；一直到将近11点，音乐渐渐舒缓，宾客们也开始三五成群地向主人道别。

“小凤凰，今晚的DJ是谁呀？”纪微缈临走时问，“我一直没找到她在哪，有几段sampling我想问一下出处，感觉好有意思。”

“是庚辰班的金同尘，她用终端操作，所以不太显眼，我看看她现在在哪，唔，这会真不好找——”

“没关系，我回去从群里加她吧，谢谢，我真的玩得很开心，所有活动都特别好！”

风和光站在门口听着各式各样的赞美，真希望天天都过生日。大约半小时后，不再有人往出口走，音乐也渐渐安静。女孩回味无穷地返回公寓，正好遇到往出走的金同尘。

“你调的音乐真的很棒，好几个同学都问我DJ是谁。太感谢了！”风和光原本只是因为不好意思拒绝才答应女孩的提议，没想到效果甚佳。

“我一直想做DJ，但在尘世时，家人都很反对我这个爱好，所以要感谢你给我这个机会。”

“啊？为什么啊？我特别羡慕你们乐感好的人诶，做音乐不是很厉害吗？”看到对方没有立刻接话，风和光连忙又补道，“不过反正在这里你可以喜欢做什么就做什么。”

金同尘笑笑，“谢谢，下次如果有空，可以来我宿舍听我编的曲子。”

“没问题！对了，雪儿的生日是下个月18号，不过她可能只想请几个人来聚餐，就是非常非常小型的那种……”

“她喜欢什么风格的音乐？”

风和光请金同尘稍等片刻，去屋里找表妹，见女孩正站在万秋前面说着什么；后者已摘掉太阳镜，坐在沙发上看终端，从屏幕上的公式看大约是数学或者灵理。

宁涉雪见有人走近就匆匆噤声，万秋没有抬头，依旧微微皱眉滑动屏幕。风和光将表妹拉去门口，一边转述金同尘的问题。

“音乐，我……我平时各种类型都听些。”

“其实我也是，不知道是不是遗传，我们两个都是耳朵不太敏感的那种，要不你就按自己的喜好来吧。”

“好的，下个月见。”金同尘再次祝贺风和光生日快乐并离开。

宁涉雪犹豫一秒，决定还是改日再与万秋完成对话，于是也向表姐道别；风和光送走最后这位客人，便喊朋友一起回住处。

“哇，都11点20了吗？幸好已经和晏老师请过早自习的假。”风和光伸个懒腰，才终于感觉疲惫。“让我看一下，最近三天这里都没人预约，那明天晚上再来收拾好了。你觉得今天的聚会怎么样？我本来还担心那么多人一起玩游戏会不会互相干扰，不过看起来还好……“

说话间两人走进公寓玄关，万秋关好门后抬手按灭灯光，使屋里忽然陷入漆黑。

风和光惊讶地咦了一声，转身欲问，忽然看到几点细微的闪烁彩星。

“吹口气，”万秋的声音从咫尺处响起，“就像吹蜡烛。”

女孩依言照做。于是光芒随风而盛，道道幻彩亮弧点破幽暗，轻快闪荡如万花渐绽，瞬息间满眼华影浮动飘摇，恍若一园寂静、鲜丽、永绽不落的春天。

正目眩魂摇时，万秋将她的手提起一只，把礼物的支撑台轻轻塞进掌心，“你拿着玩。”

风和光不确定自己有没有应声，也许没有；她又吹了几下，在花朵们又一次渐渐熄灭后狠心打开灯。但亮光并未惊醒这场奇迹般的梦，女孩依旧心醉神迷得无法自拔，直到梳洗完的朋友走来催促才恋恋不舍道，“先帮我放在我桌上，我上课回来再玩。”

“连句谢谢也没有？”

风和光腼腆一笑，也觉得该道谢，但望着万秋欲言又止片刻却不知说些什么好，就低头红着脸逃去洗漱；然而未曾想浴室雾蒙蒙的镜面上还用细细的荧光笔写着几行字：

If I had a flower for every time I thought of you... I could walk through my garden forever.
