    <script type="text/plain" id="chapter-text">
新生第一周从2月4日0点开始，到2月11日23点59分结束。前六天还有几个小时的集体活动安排，最后两天干脆完全是个人探索时间。

万秋对高自由度的日程适应良好；截至2月11日晚上10点多，她已经熟悉庚金校区的各片功能区，预习过所有科目第一周的内容，甚至学宫指南也早已读完。

正在她坐在客厅柔软的吊椅里与灵网器灵交谈时，风和光的声音从玄关处响起，“阿秋，我回来了。”

小凤凰这两天主动组织一个学宫指南阅读笔记小讲座，班里一多半同学都有来听，庚金校区其他5个班也来了不少人。万秋自然不会去；笔记就是她写的。

风和光换下便服后冲朋友笑了笑就走去厨房忙碌。

万秋继续阅读助手的最新回复：

“Juno，我是灵网助手金枢。关于尘世与九州是否普遍存在鬼魂现象，为你生成以下学术解答：

一、 现象定性

目前九州学界的主流共识是：生命体死亡后，其神魂确实会以无序能量场的形式短暂在死亡地点附近留存。该现象最早的观测记录可追溯至上古大能陶弘景的《真诰》残卷，但直到约70年前，太玄院（古称太玄门）学者万古春首次以定量方法测定了该能量场的衰减速率，才将其真正纳入现代灵理学的正式研究范畴。

万古春在《神魂逸散动力学定则》中提出的核心结论至今仍是神魂领域的奠基理论之一：鬼魂的存续时长与死者生前修为呈严密的非线性正相关。最新高精度仪器测算表明，即便处于此界顶端的渡劫期修士，其鬼魂在肉身失去生机后，也仅能存留约一个时辰；而未踏道的凡人魂魄通常在一刻钟内降至现有观测手段的阈值之下。

二、 意识残留度

这是目前争议极大的前沿研究方向。主流观点认为，鬼魂不具备完整意识。炼心阁教授明磊在1990年发表的《论鬼魂的信息承载上限》中指出，鬼魂能保留的信息量极为有限，其算力与结构根本无法支撑‘思考’、‘记忆’、‘交流’等高阶认知活动。

不过，医学行会首席专家桓间翠在近10年来发表的系列临床报告中声称，在特定环境下，部分高修为者的鬼魂疑似对外界刺激存在非随机响应。但因该实验环境极其苛刻，此结论尚未被其他实验室独立重复验证。

三、 可观测性

凡人受限于生理感知阈值，完全无法感知鬼魂。修士在特定状态或高阶仪器的辅助下可以感知，但观测结果极易受观测者自身情况干扰，且个体差异极大。目前学术界收集到的观测记录呈现出高度的发散性，神魂学界至今仍未能建立起统一的感官量化标准。

四、 补充说明

关于鬼魂的研究目前仍属灵理学前沿课题，部分结论可能随最新成果更新。

接下来，你需要我为你建立一个‘鬼魂’的3D衰变参数模型，还是需要我为你打包调取近五年来关于该现象的原始对照实验卷宗，以供你做进一步的独立研判？”

万秋目前无意点开答复下所附的那些来源。她想问的其实并不止于此。斟酌片刻，女孩又发过去一个问题：“那么鬼魂会附着在活人或者什么东西身上吗？”

风和光端着一个木托盘走来。

万秋关掉终端屏幕，跳下摇篮椅，坐到茶几前的小圆垫上。

托盘是一杯柠檬罗勒冰淇淋，一杯芒果百香果冰淇淋，一盘蛋白酥皮糖霜饼和杏仁瓦片拼盘，一碗新鲜各色莓果，一壶热气腾腾的伯爵茶。风和光小心地将茶水倒进茶杯，看到万秋静静地盯着面前的冰淇淋，等着自己坐好一起吃，就突然觉得开心。

“阿秋，你说我们吃这些不会影响吐纳吧？”

“不会。”

“哎呀，真的马上就要学魔法了，我其实还没准备好呢……不知道会不会很难啊，我之前成绩就不怎么样。好在有你可以帮我补补课。你那个笔记真好，我打算整理一下给晏老师看看，说不定下一届新生可以多发一本这个小册子，不然整本指南那么长，恐怕毕业我都看不完。你说学会魔法是什么感觉呢？诶，我还没问过你，你当时为什么会踏道？”

“你为什么踏道？”

“我当时问三青，你会不会来，它说你有接到信，所以我就也来了，不然我一个人在尘世怎么办呢？不过说实话我不晓得你为什么会来，就是，直觉吧，怎么说，有时候我经常感觉你……”

万秋警惕地抬起眼。

“……感觉你总是会去更好的地方，更远的地方，永远比我走得快……”

万秋解除警惕，暂时保持着冷淡表情继续吃冰淇淋，不想让朋友以为这些话打动了自己。柠檬罗勒是她喜欢的口味之一，她没对Helena提过，但对方大约已经知道。

风和光见朋友不作声，很快又道，“对了对了，差点忘记告诉你，我之前把其他班的群也都加了下，庚子班竟然有我表妹的名字！我找她们班几个人问她，都说是一个戴着口罩的女生，那看来就真的是我表妹。”

如她所料，万秋的脸上出现一些表情。风和光有点紧张。噢，朋友似乎对此表示反感。

她舒口气继续道，“我们周一到周五每天上课不是都和另外5个班轮转着两个班一起嘛，明天就是和庚子班，所以我们马上就能看到她了哦。我有申请她好友，但她一直没通过。”

万秋依然没有回答。

“你不好奇嘛？”

“没那么好奇。”

“也是啦，她们一点都不像，其实雪儿没什么特别的。”风和光咬着勺子一笑，“你不要连带着讨厌她就好，毕竟是我表妹嘛……”

两个人继续安静地吃宵夜。11点时，风和光用终端在班级群和庚金校区新生手册学习群发信息提醒大家准时去上课，附上地图坐标和周一的课程信息。陆陆续续地六个班的助教都给她这条消息点了赞。

“你要和我一起出发吗？我会早一点跟如意她们几个一起走过去。”

“你先去吧。”

于是风和光就起身将碗盘收拾好，然后换上学宫制服匆匆出门。

万秋则重新打开终端。

“Juno，我是灵网助手金枢。

在现代灵理学的严密语境下，古典概念中的‘附身’是不成立的。其实质是游离的鬼魂与活体神魂磁场之间发生的‘场干涉与纠缠现象’。

所有活体生物皆具备完整且闭环的神魂磁场。当外源鬼魂接触活体时，宿主的灵场防御机制会立即触发‘排异冲刷’。由于自然逸散的鬼魂缺乏完整的自我意识，它们在底层逻辑上无法夺取活体的控制权。因此，传统怪谈中那种抹杀宿主意识、鸠占鹊巢的‘夺舍’绝非此类鬼魂所能做到。

现有的实验数据也印证了这一点：在目前已知的数据库与浩如烟海的卷宗里，从未有过任何一例鬼魂成功主导活体意识的可靠记录。那些所谓的‘附体’案例，经实地勘验与交叉比对，最终皆被确诊为修士神识衰弱引发的感官幻觉，或是单纯的精神类病症。

若你近期在生活中感知到了类似的异常磁场扰动，或者神识感到不安，我可以立即为你对接并预约医学行会的神魂科专家进行专业的排查与诊疗。”

在拒绝医学帮助后，万秋又检查回答的每条引用来源，然后删掉对话框，准备出门上课。

之前的推测被推翻；纠缠她的或许并非鬼魂。

万秋不知这是好消息还是坏消息。

不过无论哪种，她有信心做出最好的选择。

As soon as you trust yourself, you will know how to live.
