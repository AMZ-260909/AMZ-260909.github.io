沈飞觞（饰Violet）和尤宜夏（饰嫦娥）、从琮（饰后羿）三名主演在落幕后为大家依次介绍乐队成员；大部分学生虽然为“作曲、编剧、指挥兼键盘：万灵”这一连串titles鼓掌，但主要精力放在大喊encore上。

由于这是晚会最后一个节目，演员们干脆走进观众中间唱返场曲，谈素抱着吉他为她们提供伴奏。万灵则向Maisie与Rose道谢，又和两名打击乐同学聊了几句，然后离开舞台以便教职工清理场地。

此时各班学生都穿梭着交谈、拍照，要找到MiMi很不容易。一刻钟后，万灵有点不敢相信地得出结论：MiMi已在落幕前离开广场。

因为一直背对观众席，万灵不知道MiMi是什么时候走的，总之节目开始时女孩明明还在。怀着一丝希望，万灵回到住处，但屋前并没有访客。

洗漱整顿后，她早早走去心法课教室；今天周三，丁未班和她们班一同上课。

但MiMi也不在这里。

Without you, the stars roar, the breeze warms, the girl smiles, the cloud moves.
