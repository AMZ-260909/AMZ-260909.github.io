    <script type="text/plain" id="chapter-text">
下一个新生正是Juno。

“许老师，我在尘世时法律名字不是华文——”

“姓名登记系统目前只接受华文，所以你可以重新起一个你喜欢的华语名字，需要和我讨论一下吗？”

Juno略一思索，在朋友名字下方写出“万秋”。

万秋拿到新生物资包后打开，见里面有三样东西：印有“辟谷丹”字样的药瓶，注明共60粒，每粒可代替一个月的食物、水、睡眠等基础生理需求；刻着【万秋｜2024届庚午班学生】的金属名牌；一枚哑光素银扳指。

[image:assets/illustrations/chapter-013-welcome kit.png]

女孩很快发现扳指可以自适应手指粗细，挥甩也不会脱落；指腹擦过戒面后，视线正前方会出现一方半透明全息屏，透明度、大小、位置都可触摸调整，但别人似乎都看不到。

[image:assets/illustrations/chapter-013-terminal.png]

她望向许无忧，见此人大拇指上也有同样的扳指，便推测登记信息的白屏大概是助教的终端屏幕。

全息屏默认背景是各种语言构成的“终端”一词，左边是9个预安装好的app，右边则是新生手册电子书，很快又弹出要求新生立刻绑定生物信息的窗口。

根据提示完成绑定，万秋点击足足有800页的新生手册。草草扫过冗长的目录，她认为这部手册称为学宫说明书或更恰当。

最小化手册页面后，女孩转而挨个点开终端的9个预装app，大概了解它们的功能分别是生理情况实时监测、历史记录等；学域——包括课程表和学年日历、成绩单等；3账户钱币余额（100）、交易记录等；通讯（已自动添加其余班内同学和两位助教，并有一个班级群，且另附校区各项服务呼叫、预约）；灵网浏览器；校区地图实时导航、当日天气等；笔记、备忘录、文档、表格等；相机、录像、录音、相册等；终端各项功能设置。

万秋按自己习惯拖动调整好app的排布，又点进设置一项项修改参数，差不多改好时，庚午班28名新生也一一登记完名字。于是许无忧将名单页面切换成一张格子图：

[image:assets/illustrations/chapter-013-dormitory.png]

“名字录入系统后会出现在名牌上，大家各自检查一下有没有问题。接下来我们分配宿舍；前三年新生都是四个人住一个院子，目前表上已经有的四个名字就是我、晏老师以及两位宿管老师。所有宿舍环境都一样的，大家可以先自由讨论一下想住在哪里。”

风和光随即询问两个刚刚最先排到万秋后面登记的两个女生愿不愿意一起住，两人都爽快同意，对住哪里也没什么意见，于是风和光就将四人名字一起填入北区。

“你竟然记得我叫什么。”原与辉对风和光笑道，“这是你在尘世的朋友嘛？真羡慕你们能和认识的人分在一个班。不知道其他班会不会有我之前的同学。”

“没事，我们现在也都认识啦。你们俩之前是哪里人呢？我是扈城的。”

“我是京市的。”

“我是秦城人。”另一名同院女生季如意道，“不知道宿舍条件怎么样，不过四个人一间，应该差不到哪里吧？”

“你们说魔法学校的宿舍会装空调吗？”

“说不定是用阵法或者贴符……”

万秋没有加入聊天，只翻看着学生手册打发时间。剩下的同学也都选好宿舍后，许无忧便宣布今天的集体任务到此结束：

“大家现在可以回去布置寝室。之前你们从尘世带来的行李都已经放在里面。明天我们零点准时来这里集合，到时候希从同学们都穿上校服、佩戴好名牌，把你们的扳指，也就是终端都绑定好。校服在寝室仓库里，你们到宿舍门口一看就会明白，不明白的可以回到花园这里来问我，我今天和两位宿管老师都会全天在这里答疑。最后，记得都吃一粒辟谷丹哦，不然会困的。”

女孩们走出绿地，见花架后果然是一片单层别墅，每四幢被一圈院墙围起。

“原来不是四人一间，是一人一栋。”原与辉恍然。

“这每栋有一百平吧，比我家原来也小不了多少。”季如意快乐道，“我家之前住五个人呢！现在就我一个住，早知道该多拿点行李过来。”

北区四人很快找到她们的宿舍院，走进后看到每间房屋前都立着一个操作台，面板默认显示【宿舍布局设计系统】，点进去后有点像搭建虚拟房屋类的小游戏，仓库东西分门别类，从家具到日用品一应俱全，服装类第一项就是【校服套装】。

季如意和原与辉各自兴冲冲地布置起宿舍。

风和光走到万秋身旁，听朋友讲解终端的用法后道，“所以，还可以绑一个紧急联系人？那我的终端绑一下你吧，万一有什么事你也可以用我的终端。”

万秋和朋友互绑终端后，两人的屏幕在未分享状态下也能彼此看到。风和光开始给同学的名字后面一个个加备注，譬如“有点不服但又没底气领头需尽快怀柔拿下”之类；她则点开学年项目图，发现暂时只显示前三年课程，且三年都共用一张课表：

[image:assets/illustrations/chapter-013-classes.png]

万秋好奇地先从课表点进联谊课的教学大纲，里面却只有一句“本课程旨在培养学生的综合交流能力。”活动课和心法课的教学大纲也很简单；与之相比，生理、自然、文化、社会、数学、语言的教学大纲就极仔细，不仅有大篇幅的课程介绍，第一堂课的预习建议、作业要求和评分细则也已给出。

最后女孩又有些期待地点开灵理课，发现第一学年的课程主要目标是“掌握基础力学、分析力学与电磁学”。再看第一堂课的预习材料——“质点运动的描述、位移速度、加速度的矢量表达”。

风和光此时已备注完所有同学，“阿秋，我带来的行李太多，要收拾好不知道得多久。不如这几天自由活动时我就先待在你这里，正好有什么不明白的事你还可以给我讲讲。”

“嗯，你设计吧。”

风和光原本有点担心被拒绝，但没想到阿秋对得寸进尺如此宽容。在尘世时就不是这样……不过，其实她在尘世时从没有胆量问这种问题，因为错误的代价是难以承受的。她那时只希望可以永远做Juno的朋友，甚至随着时间模糊掉童年后也许不会是最好的朋友；但如今她拥有与对方一模一样的一切。

我不需要再羡慕她。我在这里不低人一等，也不欠任何人任何东西。真奇怪，我从出生开始就好像担负着一大笔债似的，想要什么都像贪得无厌。好在债主们已经都忘了我，不会有人再提醒我要认清自己的位置。

她很清楚自己现在的位置在哪里，而且还可以全凭心意去设计它。

I am fully saved today.
