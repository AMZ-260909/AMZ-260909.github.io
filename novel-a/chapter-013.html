      <nav class="reader-controls">

    <script type="text/plain" id="chapter-text">
幻境中自然无需花费时间通勤，风和光从客房的床上跳下来，心念略转便回到家，兴高采烈地用鸟羽一阵猛点，一边回味着刚刚的三个问题的答案。

——“可以带动植物，但不能带其他人类去。”

——“我只能告诉你她是否有灵窍，但我不能透露她的决定。她有灵窍。”

——“九州只有一所学宫，但前三年会分十个校区，第四年才合区。”

既然有灵窍，Juno一定会去；没有人比风和光更了解自己的朋友。

所以我很快就可以见到她，就算不是一个校区也不可能比现在的情况更难。不需要再乞求妈妈的恩准、计算舅舅的花费、向学校请假、担心朋友觉得维持关系太麻烦就抛下自己……

二十分钟不算久，但女孩手速更快，甚至在最后五分钟还来得及重新回舅妈和表妹那里看看——虽然维护一般，但陈设毕竟奢华，不知九州用不用得到钱，有备无患总是好的。

可惜幻境没有其他人，女孩对不能解开舅妈真容之谜略感遗憾，但她把可能装有秘密的东西统统一顿点——奇怪，那些东西并没有消失；为什么？连玄关那座最值钱的紫檀嵌珐琅屏风都能搬走。

风和光没有浪费时间思考，转而尝试其他。时间截止后，鸟羽忽然从手中飞脱，在她眼前一拂而过。

脚下忽然变成草坪，身旁是一棵高树，周围还有约二三十个和她年纪相仿的女孩，其中不远处的一人正向她望来。

“Helena.”

“阿秋！我就知道你会来……”

风和光跑了两步才发现自己赤着脚。更糟糕的是还穿着傻傻的嫩绿珊瑚绒大眼仔睡衣——光顾着多拿行李，没来得及换衣服。不过大部分女孩都一副从床上被唤醒的样子，想必作为招收华裔修士的魔法学校，三青是在华国零点出现的。

“你怎么知道我会来？”衣着整齐的Juno主动走到朋友身边。

“我问三青了嘛。”风和光没有问好朋友是否问起过自己，而是细看起环境：这里与华国也许有时差，现在天光已曚昧，云层渐染出晶蓝的曙色，约一亩见方的草坪环满花架，架上攀藤附蔓，生着银粉、艳紫、玉白的香葛，看不出什么的魔法痕迹；尘世要建这样一处后园也不费什么功夫。

女孩们不少都开始相互问起对方家乡来历，或者猜测会不会有人从树里跳出来，要么乘着飞剑落下等等。

“只有28个人诶。每年的新生这么少呀。”风和光感慨。

“这只是一个班级，九州每届新生都有一千六百多人。”

两个女孩下意识地转向这道嗓音。不止是她们，所有眼睛都望向这个突然出现在树下的成年人，原本几名走向草地边缘的新生也聚拢过来。

女人大约二十五六，神情和善，穿驼色针织开衫内搭白衬衣，左胸处配着一枚金属名牌：

【许无忧｜2024届庚午班助教】

“我是许无忧，你们可以叫我许老师。在学宫的前三年，学生会分十个校区生活，每个校区六个班。这里是庚金校区，你们都是庚午班级的同学，我是这个班的生活助教，会在这十年里陪伴大家。还有另一名学术助教晏老师，目前还在休假中，过几天和你们见面。第一周不需要上课，你们的主要任务是适应学宫、办理入校手续。现在我们先来登记名字，登记好的同学来我这里领新生物资。”

许无忧的话语也自带多种语言的回声，说完后她向一旁微让，身侧便浮现一面空白全息屏。

新生们都被这一大段话灌得有些迟疑，Juno轻推朋友一把，风和光顺着力道走出几步，就反应过来朗声提议道，“那我们排成一行登记吧！这样也方便领东西。许老师，登记顺序没关系的，对吗？”

许无忧微笑颔首。风和光更有了信心。Juno带头走出几步站在风和光面前，于是立刻有三三两两的人跟到她身后。风和光又走到没去排队的女孩们面前柔声重说一遍自己的建议。

很快大部分新生都排进队伍。风和光没理会最后游离的几人，径直走回最前面，鼓起勇气用手指尝试着轻击那片屏幕，见指尖下出现一个小墨点便胸有成竹地在左上角写出自己的名字。

许无忧伸手从自己的挎包里掏出一只巴掌大的灰布袋递给风和光，女孩道谢后接过，并未急着打开看，只继续身姿端正地站在助教旁，冲下一个新生微笑。

下一个新生正是Juno，“许老师，我的法律名字不是华文——”

“姓名登记系统目前只接受华文，所以你可以重新起一个你喜欢的名字，需要和我讨论一下吗？”

Juno稍作思索，在朋友名字下方写出“万秋”。

万秋拿到新生物资包后就打开，见里面有三样东西：印有“辟谷丹”字样的药瓶，注明共60粒，每粒可代替一个月的食物、水、睡眠等基础生理需求；刻着【万秋｜2024届庚午班学生】的金属名牌；一枚哑光素银扳指。

[image:assets/illustrations/chapter-013-welcome kit.png]

女孩很快发现扳指可以自适应手指粗细，挥甩也不会脱落；指腹擦过戒面后，视线正前方会出现一方半透明全息屏，透明度、大小、位置都可触摸调整，但别人似乎都看不到。

[image:assets/illustrations/chapter-013-terminal.png]

她看到许无忧的大拇指上也有同样的扳指，便推测登记信息的白屏大概是助教的终端屏幕。

全息屏默认背景是各种语言构成的“终端”一词，左边是9个预安装好的app，右边则是新生手册电子书，很快又弹出要求新生立刻绑定生物信息的窗口。

根据提示完成绑定，万秋点击足足有800页的新生手册。草草扫过冗长的目录，她认为这部手册称为学宫说明书或更恰当。

最小化手册页面后，女孩转而挨个点开终端的9个预装app，大概了解它们的功能分别是生理情况实时监测、历史记录等；学域——包括课程表和学年日历、成绩单等；账户钱币余额（100）、交易记录等；通讯（已自动添加其余班内同学和两位助教，并有一个班级群，且另附校区各项服务呼叫、预约）；灵网浏览器；校区地图实时导航、当日天气等；笔记、备忘录、文档、表格等；相机、录像、录音、相册等；终端各项功能设置。

万秋按自己习惯拖动调整好app的排布，又点进设置一项项修改参数，差不多改好时，庚午班28名新生也一一登记完名字。于是许无忧将名单页面切换成一张格子图：

[image:assets/illustrations/chapter-013-dormitory.png]

“名字录入系统后会出现在名牌上，大家各自检查一下有没有问题。接下来我们分配宿舍；前三年新生都是四个人住一个院子，目前表上已经有的四个名字就是我、晏老师以及两位宿管老师。所有宿舍环境都一样的，大家可以先自由讨论一下分组。”

风和光随即询问两个刚刚最先排到万秋后面登记的两个女生愿不愿意一起住，两人都爽快同意，对住哪里也没什么意见，于是她很快将四人名字一起填入中央正上方的北区。

“你竟然记得我叫什么。”季如意对风和光笑道，“这是你在尘世的朋友？真羡慕你们能和认识的人分在一个班，不知道其他班会不会有我小学同学。”

“反正现在我们都认识啦，以后要做十年同学呢，对了，你们俩之前是哪里人？我是扈城的。”

“我是秦城人。”

“我是京市的。”原与辉已经开始畅想新宿舍的模样，“你们说魔法学校的宿舍会装暖气吗？不过感觉这里也不怎么冷，我还专门换了羽绒服，现在好热。”

“说不定是用阵法或者贴符吧？我还没住过校呢，不过四人一间宿舍应该差不到哪里吧？”

“你们想睡上床还是下床？不过也可能是那种四张大床的套间，就像酒店里一样……”

万秋没有加入聊天，只翻看着学生手册打发时间；选宿舍环节完成后，许无忧便宣布今天的集体任务到此结束：

“大家现在可以回去布置宿舍啦，之前你们从尘世带来的行李都已经放在里面。明天我们零点准时来这里集合，到时候希望同学们都穿好校服、佩戴好名牌、绑定好终端，我会一个一个检查。校服在寝室仓库里，你们到宿舍门口一看就会明白，不明白的可以回到花园这里来问我，我今天和两位宿管老师都会全天在这里答疑，有什么问题都可以来问。最后，记得都吃一粒辟谷丹哦，不然一会儿会困的。”

女孩们走出绿地，见花架后是一片单层别墅区，每四幢被一圈院墙围起。

“原来不是四人一间，是一人一栋。”季如意感叹，“这每栋有一百平吧，比我家原来也小不了多少。我家之前住五个人呢！”

“早知道该多拿点行李过来……”

北区四人很快找到她们的宿舍院，进去后看到每间房屋前都立着单独的操作台，面板默认显示【宿舍布局设计系统】，点进去后有点像搭建虚拟房屋类的小游戏：仓库东西分门别类，从家具到日用品一应俱全，服装类第一项就是【校服套装】；尘世的行李也都按名字放在里面。

季如意和原与辉各自兴冲冲地布置起宿舍；风和光走到万秋身旁试探道，“阿秋，我当时太兴奋了，带来好多东西，要收拾好不知道得多久，不如这几天自由活动时我就先待在你这里，正好有什么不明白的事你还可以给我讲讲。”

“嗯，你先布置这里，那边以后再说。”

风和光原本忐忑被拒绝，却没想到阿秋对得寸进尺如此宽容。在尘世时就不是这样……不过，其实她在尘世时从没有胆量问这种问题，因为错误的代价是难以承受的。

那时她只希望可以永远做Juno的朋友，甚至随着时间模糊掉童年后也许不会是最好的朋友；但如今她拥有与对方一模一样的一切。

我在这里不需要再羡慕任何人，也不欠任何人任何东西。真奇怪，我从出生开始就好像担负着一大笔债似的，想要什么都会被说贪得无厌。好在债主们已经都忘了我，不会再提醒我要认清自己的位置。

她很清楚自己现在的位置在哪里，而且还可以全凭心意去设计它。

I am fully saved today.
