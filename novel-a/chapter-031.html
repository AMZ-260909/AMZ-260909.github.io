清明运动会的规则在3月28日公布。

[image:assets/illustrations/chapter-031-ath.png]

活动课老师终于没再发排球，而是带庚辰与庚午的女孩们前往活动中心，熟悉比赛可能用到的设备。

季如意一边看风洞飞行教程视频一边向朋友们嘀咕，“怎么不一入学就教这个？我从前在尘世玩过一次，早不记得怎么飞了。”

“为了让我们两个班两个班待在一起做游戏增进感情吧，”风和光已练习各类相关项目一个多月，倒是不怎么紧张，“之前助教不是说过吗，立夏后才会开始真正的活动课。对了，我还没想好要选什么课，你们有没有什么特别想选的？说不定我们可以一起。”

“我想学攀岩，”原与辉顺手点开终端上活动中心的导航面板，从A1活动室浏览过去，“这个卡丁车也不错。”

“赛车太危险了吧，而且我听说会把脖子练得很粗。我其实一门都不想选……干嘛一定要上体育啊？”

“我记得还有艺术类和生活类的，应该是在活动中心B区和C区，反正选够3分或者4分就行，又不限种类，我犹豫要不要选烹饪，但我其实喜欢自己看着教程做，不太想上课。”

“艺术类不错诶，我可能可以选个刺绣，我和我爷爷学过一点。哎，马上要到清明，我如果还在尘世，肯定会和爸妈一起去烧纸……”

“我爸说那些都是整给活人看的，他就从不给我爷爷奶奶烧纸，让我以后也不用管他。”

“我妈和我舅舅应该也会给我外婆烧。不过我妈去年开始去教堂了。但是我舅舅应该会去的……我觉得，有的人确实会希望家人可以收到东西，有的人，像我舅舅，就是做给活人看的，我妈还说外婆是等到舅舅来照顾她所以终于放下心可以走了，好好笑。”

“我爷爷之前也说过人死如灯灭的话。但我还是希望他能看到吧。”

“他看到你还记得他教过你刺绣，一定会很高兴的，就像言老师说的，我们的祖先在文化中得到永生。”风和光揽住季如意，“你刺绣的时候想到他，他就在你心里和你在一起嘛。”

“教程看完了，我们换衣服吧？”原与辉兴奋地率先起身。

另外两个女孩也收起感伤，换上服装和头盔走进风洞。这一组进去的有14人，其中风和光自然飞得最好：她如今腹飞时已可以熟练上下左右移动，甚至还能不太灵活地仰飞，得到了几乎两个班所有同学的惊赞。

“小凤凰应该在尘世就学过这个吧，她飞得真好。”金同尘对一旁的万秋夸奖道。

万秋目不斜视，更不接话。

“我记得雨水那天我们好像一起玩过，但是不太确定，是不是我记错了？如果把你认错成她的朋友，我很抱歉，我也是听九枢描述当天的第四个玩家好像是你。”

不知是不是被盲人女孩真切的解释打动，万秋冷冷瞥来一眼。

金同尘感到棘手，但娴熟地诈道，“原来真的是你。你和她关系应该很好吧，我记得后来你还帮她和雪儿拍照。有时候真羡慕小凤凰，才来学宫不久就能有这么多好朋友。”

“嗯。”

“而且我之前听说她好像在尘世有一个一起来九州的好朋友，是你们班的吧？真的很幸运。”

“我不知道那天游戏是怎么赢的，你直接去问她。”万秋不耐烦道。

“什么游戏？”金同尘不解，“我只是随便和你聊聊。你不喜欢聊天吗？也许是我不大擅长聊天……”

万秋见对方确实不像为游戏而来，也有些意外，便主动测试道，“你那天对她在游戏时连赢两局很好奇。”

“是吗，我只记得那天很开心。原来你是怕我向你打听她的攻略，放心，我不是那么无聊的人。”金同尘笑笑，“不过我确实很好奇她的很多事，直接问她又会觉得不好意思，这样可能不太好，那还是算了——”

“你好奇她什么？”

“我对她了解不多，但是好像她什么都能做得很好，萧飒意每次上课都点名她，她总能回答对；她很会交朋友，大家都喜欢她；运动也很擅长，设计的衣服好看，而且做饭也很好吃，唱歌又好听，是吧？”

“她不唱歌。”万秋的语气有一丝怫然。

“唱过吧？”金同尘见对方上钩，暗自得意，“不是她那个很会弹琴的好朋友教她的吗？虽然她经常说自己五音不全，但我觉得她唱得还不错。”

“你最后没有找到。”

“啊？”金同尘不得不通过助手确认女孩是否还在对自己说话。

“你最后没有找到。”万秋重复道，“她现在不在九州。她也不在尘世。她不存在。”

之后预言家心平气和地走向风洞入口；风和光这一组刚结束新手教程，擦肩而过时情不自禁地冲好朋友一笑。

次日的活动课女孩们被带去体验蹦极；到周六时，最后的新手教程则在充气滑翔翼活动室进行。

季如意站在高台上向下看了一眼就倒吸冷气，“我还是回蹦极室荡秋千吧。我以为那个就够高了，但是好歹有弹力绳拉着。这有几层楼高啊？”

“最基础这个大概相当于40多层。”教练想必已经回答过无数次这个问题，“反正比赛不要求你们参加全程，去年一多半学生都没完成第二阶段，只要第一阶段敢跳下去就有成绩。第一阶段比赛还是很轻松的，你们昨天体验过了，它绳子弹性没有普通蹦极绳那么强，就算完全没训练过，大部分同学也能折到柳条。”

“行，那我就不为难自己了。”

“你不跳，那我也不跳了。”季如意附和后又嘲笑道，“但是原子你这胆儿还要和人赛车啊？”

“赛车又不需要在这么高的地方，又不是Trackmania。”原与辉不以为然，“怎么运动会搞这么难啊？”

“其实刚开始清明运动会更接近滑翔伞项目，但是连续几届学生普遍反应竞赛感太弱，这两年就改得刺激了些，说不定过几年还会再改回去。你们还有谁想试试？到前面来排队，确定不练的可以在活动中心自由活动。”

“雪儿，你想试试吗？”风和光见表妹举棋不定地左右走了两次，温柔提醒道，“这个要摘掉口罩哦。”

女孩果断放弃，“我，不了吧。你呢？”

“我其实挺喜欢这种运动的，感觉很上瘾。”风和光大言不惭道，“那你帮我拍个vlog好不好？”

宁涉雪听话地站在高台边角处等待拍摄，随即见万秋走到自己身旁，便开心道，“你也怕高？”

万秋冷哂，“不怕。”

她一定害怕。宁涉雪心想，其实如果我不需要戴口罩，我一定敢的。就算不敢，我至少敢承认。

“你还记得雨水那天的事吗？”

“雨水？”宁涉雪对于假日的最新印象来自春分，至于雨水，她想了想，警惕道，“你，问这个干什么？”

“我问，你回答。那天你看到我玩了什么游戏？”

“呃，我只知道你玩了那个抽签的，还有，一个猜谜语的，还有……”宁涉雪感觉自己的记忆力竟大大下降，努力回想后才道，“还有和我和表姐一起玩的吧，我们后来一起去换雨伞，但是庚寅班那几个人——”

“你不记得我们一起玩恐怖游戏？”

“好像吧，和我表姐，还有金同尘。”宁涉雪皱眉，“我记这个，做什么？你很在意，是因为你输给我了吗？”

见万秋但笑不语，女孩信心陡增，“我问，你回答，你是不是输给我了！”

“你问，我不答。”万秋娴熟地结束对话并打开终端转向另一侧。

宁涉雪大怒，但很快意识到表姐马上要飞，便打算先完成任务再计较此事；不过，就像她不敢承认自己怕高一样，她肯定不会承认。这个人很狡猾，但我很快就会把她的计谋都学会。

She says they fit her perfectly, but wobbles on their high heels, they're hard to balance.
